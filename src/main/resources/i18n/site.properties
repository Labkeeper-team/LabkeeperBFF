feat-latex-b1=Полновесная компиляция:
feat-latex-t1=Получайте PDF профессионального качества с помощью встроенного LaTeX-компилятора.
feat-latex-b2=60 секунд на выполнение:
feat-latex-t2=Работайте со сложными документами без ограничений — лимит времени компиляции в разы выше, чем в аналогичных сервисах.
feat-latex-b3=Умная конвертация:
feat-latex-t3=Любые вычислительные формулы автоматически преобразовываются в красивый LaTeX
feat-latex-b4=Гибридный синтаксис:
feat-latex-t4=Используйте легковесные вставки Markdown прямо в сложном LaTeX-коде для ускорения работы.
