spring.security.oauth2.client.registration.sso.provider=sso
spring.security.oauth2.client.registration.sso.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.sso.client-name=SSO

spring.security.oauth2.client.provider.sso.authorization-uri=https://sso.mipt.io/api/v1/public/oauth2/authorize
spring.security.oauth2.client.provider.sso.token-uri=https://sso.mipt.io/api/v1/public/oauth2/token
spring.security.oauth2.client.provider.sso.user-info-uri=https://sso.mipt.io/api/v1/public/oidc/userinfo
spring.security.oauth2.client.provider.sso.user-name-attribute=sub

spring.security.oauth2.client.registration.sso.client-id=typefourtest
spring.security.oauth2.client.registration.sso.client-secret=typefourtest
spring.security.oauth2.client.registration.sso.redirect-uri=http://localhost:9999/login/oauth2/code/sso

# default locale
spring.web.locale=en