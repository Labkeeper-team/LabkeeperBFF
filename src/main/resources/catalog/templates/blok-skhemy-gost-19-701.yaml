  - id: description
    title: 'Что входит в шаблон'
    html: |2-
      <p>Пример — отчёт «Разработка алгоритма поиска максимума в массиве».</p>
      <ul>
          <li><strong>Таблица символов</strong> ГОСТ 19.701-90: терминатор, процесс, решение, данные, предопределённый процесс, подготовка, граница цикла, соединитель.</li>
          <li><strong>Правила оформления</strong> схем: направление потока, стрелки, подписи «да» и «нет».</li>
          <li>Готовая <strong>блок-схема</strong> с циклом и ветвлением.</li>
          <li><strong>Листинг</strong> программы на C в рамке с номерами строк и <strong>таблица тестов</strong>.</li>
      </ul>
  - id: commands
    title: 'Как нарисовать свою схему'
    html: |2-
      <p>Каждый символ — стиль TikZ, заданный в преамбуле:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\node[terminator] (start) {Начало};
      \node[data, below=of start] (in) {Ввод $n$};
      \node[decision, below=of in] (cond) {$n > 0$};
      \draw[flow] (start) -- (in);
      \draw[flow] (in) -- (cond);</code></pre>
      </div>
      <p>Размер всех символов меняется командами <code>\fcwidth</code> и <code>\fcheight</code>.</p>
  - id: compile
    title: 'Компиляция и проверка'
    html: |2-
      <p>Нажмите кнопку компиляции в Labkeeper. Документ собирается через pdfLaTeX. Комментарии в коде листингов пишите латиницей.</p>
      <p>Список источников собран заранее (файл <code>main.bbl</code>). После изменения <code>refs.bib</code> он сам не обновится.</p>
