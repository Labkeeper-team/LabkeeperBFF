sections:
  - id: start
    title: 'Как начать работу?'
    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Замените УДК, название, авторов и аннотацию, затем пишите текст статьи по разделам.</li>
      </ol>
      <p>Перед отправкой сверьтесь с требованиями конкретного журнала: поля, размер шрифта, интервал и порядок блоков у редакций различаются.</p>
  - id: description
    title: 'Что входит в шаблон'
    html: |2-
      <p>Статья набрана на стандартном классе <code>article</code>: шрифт 12 pt, полуторный интервал, поля 2,5 и 2 см. Структура типична для журналов из перечня ВАК:</p>
      <ul>
          <li><strong>УДК</strong>, название, авторы с организациями и e-mail.</li>
          <li><strong>Аннотация и ключевые слова</strong> на русском и английском языках.</li>
          <li>Разделы <strong>«Введение»</strong>, <strong>«Материалы и методы»</strong>, <strong>«Результаты и обсуждение»</strong>, <strong>«Заключение»</strong>.</li>
          <li>Пример нумерованной формулы, таблицы и <strong>списка литературы</strong>.</li>
      </ul>
  - id: commands
    title: 'Список литературы по ГОСТ'
    html: |2-
      <p>Ссылки оформляются пакетом <code>biblatex-gost</code> по ГОСТ Р 7.0.5-2008, источники нумеруются в порядке цитирования:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\usepackage[
        backend=biber,
        style=gost-numeric,
        sorting=none,
        language=auto,
        autolang=other,
      ]{biblatex}
      \addbibresource{article.bib}
      ...
      \printbibliography[title={Список литературы}]</code></pre>
      </div>
      <p>В <code>article.bib</code> уже есть примеры книги, статьи в журнале и в сборнике, диссертации, электронного ресурса, патента, стандарта и англоязычной статьи.</p>
  - id: compile
    title: 'Компиляция и проверка'
    html: |2-
      <p>Нажмите кнопку компиляции в Labkeeper. Документ собирается через pdfLaTeX.</p>
      <p>Список литературы в проекте собран заранее (файл <code>main.bbl</code>), потому что онлайн-сборка не запускает biber. После изменения <code>article.bib</code> список сам не обновится.</p>
  - id: source
    title: 'Источник и лицензия'
    html: |2-
      <p>Стиль библиографии — пакет <a href="https://ctan.org/pkg/biblatex-gost" rel="nofollow">biblatex-gost</a> (<a href="https://github.com/odomanov/biblatex-gost/" rel="nofollow">репозиторий</a>), лицензия LPPL 1.3c. Примеры источников взяты из файла <code>biblatex-gost-examples.bib</code> документации пакета.</p>
      <p>Текст статьи составлен для Labkeeper на стандартном классе <code>article</code>.</p>
  - id: link
    title: 'Ссылка на шаблон'
    html: |2-
      <p>Структура статьи и список литературы по ГОСТ уже собраны. Остаётся заменить текст образца своим.</p>
