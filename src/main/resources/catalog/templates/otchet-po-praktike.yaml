sections:
  - id: start
    title: 'Как начать работу?'
    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Впишите место и сроки практики, руководителей, затем заполните главы и дневник.</li>
      </ol>
  - id: description
    title: 'Что входит в шаблон'
    html: |2-
      <p>Пример — производственная практика в отделе разработки программного обеспечения.</p>
      <ul>
          <li><strong>Титульный лист</strong> с местом и сроками практики, руководителями от организации и университета, полем для оценки.</li>
          <li><strong>Содержание</strong> и <strong>введение</strong> с целью и задачами практики.</li>
          <li>Глава «Характеристика организации» со <strong>схемой оргструктуры</strong> на TikZ.</li>
          <li>Глава «Выполнение индивидуального задания» с <strong>дневником практики</strong>: таблица переносится на следующую страницу и повторяет шапку.</li>
          <li><strong>Заключение</strong>, <strong>список источников</strong>, приложения для бланка задания и <strong>отзыва руководителя</strong>.</li>
      </ul>
  - id: compile
    title: 'Компиляция и список источников'
    html: |2-
      <p>Нажмите кнопку компиляции в Labkeeper. Документ собирается через pdfLaTeX.</p>
      <p>Список источников собран заранее (файл <code>main.bbl</code>), потому что онлайн-сборка не запускает biber. После изменения <code>refs.bib</code> список сам не обновится.</p>
  - id: source
    title: 'Источник и лицензия'
    html: |2-
      <p>Оформление основано на проекте <a href="https://github.com/khokm/my-latex-template" rel="nofollow">my-latex-template</a> (Maxim Khokhryakov), лицензия MIT. Текст и структура отчёта написаны для Labkeeper.</p>
  - id: link
    title: 'Ссылка на шаблон'
    html: |2-
      <p>Титульный лист, главы и дневник практики уже оформлены. Остаётся описать свою практику.</p>
