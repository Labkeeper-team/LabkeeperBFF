sections:
  - id: start
    title: 'Как начать работу?'
    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Замените название, авторов, аннотацию и CCS concepts, затем пишите текст статьи вместо пояснений образца.</li>
      </ol>
  - id: description
    title: 'Что входит в шаблон'
    html: |2-
      <p>Образец одновременно показывает возможности класса <code>acmart</code> и объясняет требования ACM:</p>
      <ul>
          <li>Авторы с отдельными аффилиациями, ORCID и общими примечаниями.</li>
          <li><strong>CCS concepts</strong> и <strong>ключевые слова</strong> для классификации статьи.</li>
          <li><strong>Тизер-рисунок</strong> под блоком авторов, рисунок с описанием <code>\Description</code> для доступности.</li>
          <li>Таблицы на <code>booktabs</code>, формулы в тексте и выносные.</li>
          <li>Благодарности в окружении <code>acks</code>, приложения и примеры всех типов библиографических записей.</li>
      </ul>
  - id: commands
    title: 'Стиль и права'
    html: |2-
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\documentclass[sigconf]{acmart}
      %% для подачи на рецензирование:
      %% \documentclass[manuscript, screen, review]{acmart}

      \setcopyright{acmlicensed}
      \copyrightyear{2018}
      \acmYear{2018}
      \acmDOI{XXXXXXX.XXXXXXX}</code></pre>
      </div>
      <p>Команды прав и сведения о конференции заменяются значениями, которые ACM присылает после заполнения формы прав.</p>
  - id: compile
    title: 'Компиляция и проверка'
    html: |2-
      <p>Нажмите кнопку компиляции в Labkeeper. Документ собирается через pdfLaTeX.</p>
      <p>Список литературы в проекте собран заранее стилем <code>ACM-Reference-Format</code> (файл <code>main.bbl</code>), потому что онлайн-сборка не запускает BibTeX. После изменения <code>sample-base.bib</code> список сам не обновится.</p>
  - id: source
    title: 'Источник и лицензия'
    html: |2-
      <p>Шаблон — образец <code>sample-sigconf.tex</code> пакета <a href="https://ctan.org/pkg/acmart" rel="nofollow">acmart</a> версии 2.12 (<a href="https://github.com/borisveytsman/acmart" rel="nofollow">репозиторий</a>). Эта версия совпадает с классом в TeX Live, на котором работает сборка Labkeeper. Подробнее о подготовке статьи — на <a href="https://authors.acm.org/proceedings/production-information/preparing-your-article-with-latex" rel="nofollow">сайте ACM</a>. Пакет распространяется по лицензии LPPL версии 1.3 или новее.</p>
  - id: link
    title: 'Ссылка на шаблон'
    html: |2-
      <p>Используйте официальный образец ACM, чтобы сосредоточиться на содержании статьи.</p>
