sections:
  - id: start
    title: 'Как начать работу?'
    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Замените задания своими, баллы и таблица оценок пересчитаются сами.</li>
      </ol>
  - id: description
    title: 'Что входит в шаблон'
    html: |2-
      <p>Пример — контрольная по алгебре для 7 класса «Линейные уравнения и функции».</p>
      <ul>
          <li><strong>Колонтитулы</strong> с классом, вариантом и номером страницы.</li>
          <li>Поля для фамилии и даты, <strong>критерии оценки</strong>.</li>
          <li><strong>Таблица оценок</strong> с обычными и бонусными баллами.</li>
          <li>Задания разных типов: выбор ответа, ответ в строке, подпункты с пропусками, рамка для графика, задача с линиями для решения, задание по рисунку, бонусное задание.</li>
      </ul>
  - id: commands
    title: 'Версия с ответами'
    html: |2-
      <p>Добавьте опцию <code>answers</code> в первую строку, и в PDF появятся ответы и решения:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\documentclass[12pt,a4paper,answers]{exam}</code></pre>
      </div>
      <p>Задание с баллами пишется так: <code>\question[2] Решите уравнение ...</code></p>
  - id: source
    title: 'Источник и лицензия'
    html: |2-
      <p>Шаблон построен на классе <a href="https://ctan.org/pkg/exam" rel="nofollow">exam</a> (Philip Hirschhorn), лицензия LPPL 1.3. Подписи класса переведены на русский язык для Labkeeper.</p>
  - id: link
    title: 'Ссылка на шаблон'
    html: |2-
      <p>Таблица оценок и типы заданий уже настроены. Остаётся вписать свои задания.</p>
      <p><a href="{{publicUrl}}/project/b5df88d4-b4b0-4213-847f-144c0286a7d5">Открыть шаблон контрольной работы в онлайн-редакторе Labkeeper.</a></p>
