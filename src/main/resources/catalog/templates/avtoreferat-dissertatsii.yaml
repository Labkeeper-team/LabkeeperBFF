sections:
  - id: start
    title: 'Как начать работу?'
    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Впишите сведения о диссертации в начале файла, затем замените текст общей характеристики и содержания работы.</li>
      </ol>
  - id: description
    title: 'Что входит в шаблон'
    html: |2-
      <p>Автореферат свёрстан в формате A5, как его печатают типографии.</p>
      <ul>
          <li><strong>Обложка</strong> «На правах рукописи» с автором, темой, специальностью и степенью.</li>
          <li><strong>Оборот обложки</strong>: научный руководитель, оппоненты, ведущая организация, сведения о защите и подпись учёного секретаря.</li>
          <li><strong>Общая характеристика работы</strong> по ГОСТ Р 7.0.11-2011: актуальность, цель, задачи, новизна, положения на защиту, апробация, публикации.</li>
          <li><strong>Содержание работы</strong> по главам, заключение и <strong>публикации автора</strong> по ГОСТ.</li>
          <li>Страница <strong>выходных сведений</strong> типографии.</li>
      </ul>
  - id: commands
    title: 'Сведения о диссертации'
    html: |2-
      <p>Все данные для обложки и оборота задаются командами в начале файла:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\newcommand{\thesisAuthor}{Иванов Иван Иванович}
      \newcommand{\thesisTitle}{Название диссертации}
      \newcommand{\thesisSpecialtyNumber}{1.2.2}
      \newcommand{\defenseCouncilNumber}{24.2.000.00}</code></pre>
      </div>
  - id: compile
    title: 'Компиляция и список публикаций'
    html: |2-
      <p>Нажмите кнопку компиляции в Labkeeper. Документ собирается через pdfLaTeX.</p>
      <p>Список публикаций собран заранее (файл <code>main.bbl</code>), потому что онлайн-сборка не запускает biber. После изменения <code>author.bib</code> список сам не обновится.</p>
  - id: source
    title: 'Источник и лицензия'
    html: |2-
      <p>Шаблон основан на <a href="https://github.com/AndreyAkinshin/Russian-Phd-LaTeX-Dissertation-Template" rel="nofollow">Russian-Phd-LaTeX-Dissertation-Template</a> (Андрей Акиншин и участники проекта), лицензия CC BY 4.0.</p>
      <p>Для онлайн-редактора многофайловый шаблон сведён в один файл, оставлен только автореферат, настройки упрощены под pdfLaTeX, примеры текста и публикаций заменены.</p>
  - id: link
    title: 'Ссылка на шаблон'
    html: |2-
      <p>Обложка, оборот и разделы автореферата уже свёрстаны. Остаётся вписать данные своей диссертации.</p>
      <p><a href="{{publicUrl}}/project/8b01d633-4b65-4907-a3e5-3974569d9c61">Открыть шаблон автореферата в онлайн-редакторе Labkeeper.</a></p>
