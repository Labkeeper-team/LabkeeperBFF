sections:
  - id: start
    title: 'Как начать работу?'
    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Впишите тему и номер работы, замените таблицу и точки графика своими измерениями.</li>
      </ol>
  - id: description
    title: 'Что входит в шаблон'
    html: |2-
      <p>Пример — «Определение ускорения свободного падения с помощью математического маятника». Подходит для физики, химии и других дисциплин.</p>
      <ul>
          <li><strong>Титульный лист</strong> с дисциплиной, номером работы и вариантом.</li>
          <li>Разделы <strong>«Цель работы»</strong>, <strong>«Оборудование»</strong>, <strong>«Теоретические сведения»</strong> с формулами и <strong>«Ход работы»</strong>.</li>
          <li><strong>Таблица измерений</strong> и <strong>график</strong> pgfplots с погрешностями и прямой.</li>
          <li>Расчёт результата и <strong>погрешности косвенного измерения</strong>, <strong>вывод</strong> и контрольные вопросы.</li>
      </ul>
  - id: compile
    title: 'Компиляция и список источников'
    html: |2-
      <p>Нажмите кнопку компиляции в Labkeeper. Документ собирается через pdfLaTeX.</p>
      <p>Список источников собран заранее (файл <code>main.bbl</code>), потому что онлайн-сборка не запускает biber. После изменения <code>refs.bib</code> список сам не обновится.</p>
  - id: source
    title: 'Источник и лицензия'
    html: |2-
      <p>Оформление основано на проекте <a href="https://github.com/khokm/my-latex-template" rel="nofollow">my-latex-template</a> (Maxim Khokhryakov), лицензия MIT. Текст отчёта написан для Labkeeper.</p>
  - id: link
    title: 'Ссылка на шаблон'
    html: |2-
      <p>Структура отчёта, таблица и график уже готовы. Остаётся вписать свои измерения.</p>
