    title: 'Как начать работу?'
    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Впишите в титульный лист и паспорт проекта свою тему, цель и задачи, затем заполните главы.</li>
      </ol>
  - id: description
    title: 'Что входит в шаблон'
    html: |2-
      <p>Пример темы — «Как сократить количество пластиковых отходов в школе». Структура соответствует требованиям к индивидуальному проекту в 9 и 10 классе:</p>
      <ul>
          <li><strong>Титульный лист</strong> школы с типом проекта, автором и руководителем.</li>
          <li><strong>Паспорт проекта</strong> таблицей: проблема, цель, задачи, гипотеза, продукт, сроки.</li>
          <li><strong>Введение</strong> с актуальностью, объектом, предметом и методами.</li>
          <li><strong>План работы</strong> схемой Mermaid.</li>
          <li>Теоретическая и практическая <strong>главы</strong> с таблицей опроса и выводами.</li>
          <li><strong>Заключение</strong>, <strong>список источников</strong> и <strong>приложения</strong>.</li>
      </ul>
  - id: compile
    title: 'Как устроен проект'
    html: |2-
      <p>Это Markdown-проект: каждый раздел — отдельный сегмент, результат показывается прямо в браузере, LaTeX знать не нужно. Схема плана работы — отдельный сегмент Mermaid.</p>
      <p>Чтобы получить PDF, нажмите «Сохранить в PDF».</p>
  - id: link
    title: 'Ссылка на шаблон'
    html: |2-
      <p>Паспорт проекта и структура глав уже готовы. Остаётся вписать свою тему.</p>
