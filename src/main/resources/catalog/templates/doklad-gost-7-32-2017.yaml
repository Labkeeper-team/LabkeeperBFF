sections:
  - id: start
    title: 'Как начать работу?'
    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Впишите в титульный лист тему и автора, замените текст разделов своим.</li>
      </ol>
      <p>Для школьного доклада замените шапку титульного листа на название школы, а «студент группы» — на класс. Подсказка есть в комментарии к титульному листу.</p>
  - id: description
    title: 'Что входит в шаблон'
    html: |2-
      <p>Доклад рассчитан на выступление на 5–7 минут, поэтому он короче реферата: введение, два раздела и заключение.</p>
      <ul>
          <li><strong>Титульный лист</strong> «ДОКЛАД» с дисциплиной, темой, автором и руководителем.</li>
          <li><strong>Содержание</strong> и <strong>введение</strong> с целью доклада.</li>
          <li>Разделы со списком и <strong>таблицей</strong> «польза — риски».</li>
          <li><strong>Заключение</strong> и <strong>список использованных источников</strong> по ГОСТ.</li>
      </ul>
  - id: compile
    title: 'Компиляция и список источников'
    html: |2-
      <p>Нажмите кнопку компиляции в Labkeeper. Документ собирается через pdfLaTeX.</p>
      <p>Список источников собран заранее (файл <code>main.bbl</code>), потому что онлайн-сборка не запускает biber. После изменения <code>bibliography.bib</code> список сам не обновится.</p>
  - id: source
    title: 'Источник и лицензия'
    html: |2-
      <p>Оформление основано на проекте <a href="https://github.com/vpunch/gost732" rel="nofollow">gost732</a> (Panchishin Ivan), лицензия MIT. Текст доклада написан для Labkeeper.</p>
  - id: link
    title: 'Ссылка на шаблон'
    html: |2-
      <p>Титульный лист и список источников уже оформлены. Остаётся заменить текст образца своим.</p>
