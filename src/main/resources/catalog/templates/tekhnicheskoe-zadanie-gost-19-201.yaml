sections:
  - id: start
    title: 'Как начать работу?'
    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Задайте название программы и обозначение документа, затем впишите требования в разделы.</li>
      </ol>
  - id: description
    title: 'Что входит в шаблон'
    html: |2-
      <p>Пример — ТЗ на «Программу учёта лабораторного оборудования».</p>
      <ul>
          <li><strong>Лист утверждения</strong> с блоками «СОГЛАСОВАНО» и «УТВЕРЖДАЮ» по ГОСТ 19.104-78.</li>
          <li><strong>Титульный лист</strong> с обозначением документа и числом листов, которое считается само.</li>
          <li><strong>Аннотация</strong> и <strong>содержание</strong>.</li>
          <li>Разделы ГОСТ 19.201-78: введение, основания и назначение разработки, требования к программе, к документации, технико-экономические показатели, стадии и этапы, порядок контроля и приёмки.</li>
      </ul>
      <p>Пункты нумеруются автоматически: 1.1, 4.2.1 и так далее.</p>
  - id: commands
    title: 'Название и обозначение документа'
    html: |2-
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\newcommand{\docnumber}{RU.12345678.00001-01 ТЗ 01-1}
      \newcommand{\progname}{Программа учёта лабораторного оборудования}</code></pre>
      </div>
      <p>Пункт раздела начинается командой <code>\parag</code>, раздел — <code>\sect</code>, подраздел — <code>\subsect</code>.</p>
  - id: source
    title: 'Источник и лицензия'
    html: |2-
      <p>Оформление основано на проекте <a href="https://github.com/vpunch/gost732" rel="nofollow">gost732</a> (Panchishin Ivan), лицензия MIT. Структура и текст ТЗ написаны для Labkeeper.</p>
  - id: link
    title: 'Ссылка на шаблон'
    html: |2-
