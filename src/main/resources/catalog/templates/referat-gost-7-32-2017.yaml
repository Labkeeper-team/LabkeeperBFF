  - id: start
    title: 'Как начать работу?'
    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Впишите в титульный лист университет, дисциплину и тему, затем замените текст разделов своим.</li>
      </ol>
  - id: description
    title: 'Что входит в шаблон'
    html: |2-
      <p>Реферат оформлен по ГОСТ 7.32-2017: поля 30/15/20/20 мм, шрифт 14 пт, полуторный интервал, абзацный отступ 1,25 см.</p>
      <ul>
          <li><strong>Титульный лист</strong> с дисциплиной, темой, исполнителем и проверяющим.</li>
          <li><strong>Содержание</strong> с отточиями и <strong>введение</strong> с целью и задачами.</li>
          <li>Разделы с примерами <strong>формулы</strong>, <strong>рисунка</strong> на TikZ, <strong>таблицы</strong> и списков.</li>
          <li><strong>Заключение</strong>, <strong>список использованных источников</strong> по ГОСТ 7.0.100-2018 и <strong>приложение</strong>.</li>
      </ul>
      <p>Разделы задаются командами <code>\sect</code> и <code>\subsect</code>, структурные элементы без номера — командой <code>\structel</code>.</p>
  - id: compile
    title: 'Компиляция и список источников'
    html: |2-
      <p>Нажмите кнопку компиляции в Labkeeper. Документ собирается через pdfLaTeX.</p>
      <p>Список источников собран заранее (файл <code>main.bbl</code>), потому что онлайн-сборка не запускает biber. После изменения <code>bibliography.bib</code> список сам не обновится.</p>
  - id: source
    title: 'Источник и лицензия'
    html: |2-
      <p>Оформление основано на проекте <a href="https://github.com/vpunch/gost732" rel="nofollow">gost732</a> (Panchishin Ivan), лицензия MIT.</p>
      <p>Для онлайн-редактора преамбула перенесена в главный файл, исправлены единицы длин в стиле, список источников собран заранее.</p>
