sections:
  - id: start
    title: 'Как начать работу?'
    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Укажите журнал в <code>\journal{}</code>, заполните название, авторов и аннотацию в окружении <code>frontmatter</code>.</li>
      </ol>
  - id: description
    title: 'Что входит в шаблон'
    html: |2-
      <ul>
          <li><strong>Frontmatter</strong>: название, авторы, аффилиации с полями организации и адреса, аннотация.</li>
          <li><strong>Графическая аннотация</strong> и <strong>highlights</strong> — краткие выводы, которые просят многие журналы Elsevier.</li>
          <li><strong>Ключевые слова</strong>, коды PACS и MSC.</li>
          <li>Примеры разделов, формул (<code>equation</code>, <code>align</code>, <code>eqnarray</code>), таблицы, рисунка, приложения и списка литературы.</li>
      </ul>
  - id: commands
    title: 'Числовые ссылки или «автор–год»'
    html: |2-
      <p>Главный файл проекта — <code>elsarticle-template-num.tex</code> с числовыми ссылками. Рядом лежит <code>elsarticle-template-harv.tex</code> со ссылками «автор–год»: чтобы использовать его, скопируйте его содержимое в <code>main.tex</code>.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\documentclass[preprint,12pt]{elsarticle}
      %% \documentclass[final,3p,times,twocolumn]{elsarticle}
      \journal{Nuclear Physics B}</code></pre>
      </div>
      <p>Опции <code>1p</code>, <code>3p</code>, <code>5p</code> и <code>twocolumn</code> дают вёрстку, близкую к журнальной.</p>
  - id: compile
    title: 'Компиляция и проверка'
    html: |2-
      <p>Нажмите кнопку компиляции в Labkeeper. Документ собирается через pdfLaTeX. Список литературы записан прямо в файле в окружении <code>thebibliography</code>, отдельный запуск BibTeX не нужен.</p>
  - id: source
    title: 'Источник и лицензия'
    html: |2-
      <p>Шаблоны <code>elsarticle-template-num.tex</code> и <code>elsarticle-template-harv.tex</code> взяты из пакета <a href="https://ctan.org/pkg/elsarticle" rel="nofollow">elsarticle</a> на CTAN без изменений. Пакет распространяется по лицензии LPPL версии 1.3 или новее.</p>
  - id: link
    title: 'Ссылка на шаблон'
    html: |2-
      <p>Используйте официальный шаблон Elsevier, чтобы сосредоточиться на содержании статьи.</p>
