sections:
  - id: start
    title: 'Как начать работу?'
    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Замените данные организации, обозначение и наименование документа, затем пишите разделы.</li>
      </ol>
  - id: description
    title: 'Что входит в шаблон'
    html: |2-
      <p>Шаблон оформляет текстовый конструкторский документ — пояснительную записку, технические условия, расчёт — по ЕСКД:</p>
      <ul>
          <li><strong>Титульный лист</strong> с наименованием организации, кодом, блоками «Согласовано» и «Утверждаю» и подписями разработчиков.</li>
          <li><strong>Рамка</strong> и <strong>основная надпись</strong> (штамп) на каждом листе с графами «Разраб.», «Пров.», «Н. контр.», «Утв.», номером листа и количеством листов.</li>
          <li>Боковые графы «Инв. № подл.», «Подп. и дата», «Взам. инв. №».</li>
          <li>Автоматическое <strong>содержание</strong> и разделы.</li>
      </ul>
  - id: commands
    title: 'Данные титульного листа и штампа'
    html: |2-
      <p>Все надписи на титульном листе и в основной надписи задаются командами класса:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\documentclass[russian,utf8]{eskdtext}
      \ESKDdepartment{Акционерное Московское общество}
      \ESKDcompany{завод имени И.~А.~Лихачева}
      \ESKDclassCode{31 1398}
      \ESKDtitle{Форсунка Ф-750}
      \ESKDdocName{Технические условия}
      \ESKDsignature{АБВГД ХХХХХХХХ}
      \ESKDauthor{Петров~И.~И.}
      \ESKDtitleApprovedBy{Руководитель ОКБА}{Гусев~И.~И.}
      \ESKDtitleAgreedBy{Директор АМО ЗИЛ}{Иванов~И.~И.}</code></pre>
      </div>
  - id: compile
    title: 'Компиляция и проверка'
    html: |2-
      <p>Нажмите кнопку компиляции в Labkeeper. Документ собирается через pdfLaTeX. Проверьте, что рамка и основная надпись есть на каждом листе, а номер листа и количество листов в штампе совпадают с документом.</p>
      <p>Пакет eskdx написан в 2010 году. Чтобы он работал с современным LaTeX, в начале <code>main.tex</code> добавлены несколько строк совместимости с пояснениями в комментариях. Не удаляйте их.</p>
  - id: source
    title: 'Источник и лицензия'
    html: |2-
      <p>Шаблон — пример <code>example.tex</code> из руководства пакета <a href="https://ctan.org/pkg/eskdx" rel="nofollow">eskdx</a> (версия 0.98) на CTAN. Файл перекодирован в UTF-8 и дополнен строками совместимости с современным LaTeX. Пакет распространяется по лицензии LPPL версии 1.3 или новее.</p>
  - id: link
    title: 'Ссылка на шаблон'
    html: |2-
      <p>Титульный лист, рамка и штамп ЕСКД уже собраны. Остаётся заменить текст образца своим.</p>
