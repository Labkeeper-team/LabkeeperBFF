sections:
  - id: 'intro'
    title: 'Почему преподаватели снижают баллы за графики'
    html: |2-
      <p>График экспериментальных измерений в физическом практикуме — это не просто иллюстрация, а
      вычислительный инструмент. По наклону прямой определяют ускорение свободного падения, постоянную
      Планка или удельную теплоемкость. Однако многие студенты теряют баллы на защите из-за типичных
      ошибок: нет единиц величин на осях, выбран неудобный масштаб, точки соединены ломаной
      «змейкой».</p>
      <p>Ниже разобраны правила, по которым строят <strong>графики для лабораторной работы</strong>, и
      то, как подписывать оси графика в отчете. Общие правила построения диаграмм в технической
      документации задают рекомендации Р 50-77-88 «Правила выполнения диаграмм»: они заменили ГОСТ
      2.319-81 с 1 января 1989 года. Как рассчитать сами погрешности, которые наносят на график,
      читайте в статье о <a href="/blog/indirect-measurement-error-calculation-lab-report">погрешности
      косвенных измерений</a>.</p>
  - id: 'rules'
    title: 'Правила оформления графика: чек-лист'
    html: |2-
      <p>Чтобы график принял даже строгий преподаватель, проверьте его по списку:</p>
      <ol>
          <li><strong>Поле графика заполнено:</strong> точки занимают не менее 70–80% площади, а не
      сжаты в углу.</li>
          <li><strong>Шаг сетки по правилу «1, 2, 5»:</strong> деления кратны $1$, $2$ или $5$
      (например, $0{,}1$, $0{,}2$, $0{,}5$, $1$, $2$, $5$, $10$). Масштаб вида $1\text{ см} =
      3{,}3$ единицы мешает читать координаты.</li>
          <li><strong>Ноль подавлен, только если это не мешает анализу:</strong> если значения лежат
      от $180$ до $220$, шкалу можно начать со $170$. Ноль не подавляют, если по графику нужно найти
      точку пересечения с осью (например, продолжить $T^2(L)$ до $L = 0$) или проверить, что прямая
      проходит через начало координат. Подавление нуля — это не разрыв шкалы: разрыв рисуют
      отдельным знаком «//» на оси.</li>
          <li><strong>Оси подписаны:</strong> обозначение величины и единица через запятую, например
      «$I$, мА».</li>
          <li><strong>Единицы — в СИ и их кратных:</strong> мА, кОм, мкс; множитель пишут при единице,
      а не при величине.</li>
          <li><strong>Точки — заметными маркерами,</strong> а не точками толщиной в пиксель.</li>
          <li><strong>У каждой точки кресты погрешностей</strong> по обеим осям, если погрешность
      больше маркера.</li>
          <li><strong>Линия — аппроксимация,</strong> а не ломаная через точки: прямая МНК или гладкая
      кривая.</li>
          <li><strong>Подпись под рисунком по центру:</strong> «Рисунок 2 – Зависимость периода
      колебаний маятника от длины нити $T(L)$», без точки в конце.</li>
          <li><strong>Легенда,</strong> если на графике больше одной линии или серии точек.</li>
          <li><strong>Векторный формат:</strong> PDF (или PNG высокого разрешения), а не размытый
      скриншот.</li>
      </ol>
  - id: 'axes'
    title: 'Подписи осей: обозначение, единица и множитель'
    html: |2-
      <p>У конца каждой оси пишут обозначение физической величины и ее единицу измерения через
      запятую:</p>
      <ul>
          <li>Рекомендуемая запись: <code>$I$, мА</code>, <code>$U$, В</code>, <code>$t$, с</code>.
      Допустима также запись через косую черту: <code>$I$/мА</code>.</li>
          <li>Запись <code>$I$ [мА]</code> встречается, но не рекомендуется. По ГОСТ 8.417 и ISO
      80000-1 квадратные скобки означают «единица величины»: $[I] = \text{мА}$. Строгие кафедры такую
      подпись снимают.</li>
          <li>Масштабный множитель пишут при единице: <code>$R$, кОм</code> или <code>$R$, $10^3$
      Ом</code>.</li>
      </ul>
      <div class="article-note">
          <strong>Частая ошибка:</strong> подпись «$R \times 10^3$, Ом» формально означает, что по оси
      отложено $R \cdot 10^3$. Тогда деление «5» соответствует $R = 5 \cdot 10^{-3}$ Ом, то есть в
      миллион раз меньше, чем имелось в виду. Множитель всегда относят к единице, а не к величине.
      </div>
      <p>Стрелки на осях. По Р 50-77-88 в диаграммах со шкалами оси стрелками не заканчивают, а
      обозначение величины с единицей пишут у конца шкалы. В научных графиках обычно рисуют замкнутую
      рамку со шкалами, как в примерах ниже. Стрелки ставят, только если их требует методичка.</p>
  - id: 'points-errorbars'
    title: 'Экспериментальные точки и кресты погрешностей'
    html: |2-
      <p>Каждую точку наносят заметным маркером с <strong>крестом погрешностей (error
      bars)</strong>:</p>
      <ul>
          <li>Горизонтальная перекладина идет от $x - \Delta x$ до $x + \Delta x$, то есть ее длина
      равна $2\Delta x$;</li>
          <li>Вертикальная перекладина идет от $y - \Delta y$ до $y + \Delta y$;</li>
          <li>Если погрешность по одной из осей меньше маркера, перекладину не рисуют и пишут об этом
      в тексте.</li>
      </ul>
      <p>Укажите, какая погрешность отложена. Если это стандартная погрешность (1σ), прямая должна
      пересекать примерно 2/3 крестов. Если это доверительная граница при $P = 0{,}95$, прямая
      проходит почти через все кресты. От этого зависит, считать ли точку выбросом.</p>
  - id: 'approximation'
    title: 'Прямая МНК вместо ломаной и погрешность наклона'
    html: |2-
      <p><strong>Главная ошибка первокурсников:</strong> соединять точки опыта последовательными
      отрезками. В физике измеряется плавная закономерность, поэтому линию строят как гладкую кривую
      или прямую методом наименьших квадратов (МНК):</p>
      <ul>
          <li>Точки располагаются равномерно по обе стороны от прямой;</li>
          <li>Прямая проходит через кресты погрешностей большинства точек (см. выше про 1σ и $P =
      0{,}95$);</li>
          <li>Грубые промахи исключают из обработки с обоснованием в тексте.</li>
      </ul>
      <h3>Формулы МНК для прямой $y = kx + b$</h3>
      <p>$$k = \frac{\sum (x_i - \bar x)(y_i - \bar y)}{\sum (x_i - \bar x)^2}, \qquad b = \bar y - k\bar
      x,$$</p>
      <p>$$S_k = \sqrt{\frac{\sum (y_i - kx_i - b)^2}{(n-2)\sum (x_i - \bar x)^2}}, \qquad S_b =
      S_k\sqrt{\frac{\sum x_i^2}{n}},$$</p>
      <p>где $n$ — число точек; $S_k$ и $S_b$ — стандартные погрешности наклона и свободного члена.</p>
      <h3>Пример: зависимость $U(I)$ для резистора</h3>
      <p>Для данных из примеров ниже ($I = 10, 20, 30, 40$ мА; $U = 1{,}2;\ 2{,}3;\ 3{,}6;\ 4{,}8$ В)
      получается $k = 0{,}121$ В/мА и $b = -0{,}05$ В. Сумма квадратов остатков равна $0{,}007$ В²,
      $\sum (x_i - \bar x)^2 = 500$ мА², поэтому $S_k \approx 0{,}0026$ В/мА и $S_b \approx 0{,}07$ В.</p>
      <ul>
          <li>Наклон: $k = (0{,}1210 \pm 0{,}0026)$ В/мА, то есть $R = (121{,}0 \pm 2{,}6)$ Ом при
      стандартной погрешности (погрешность начинается с 2, поэтому в ней две значащие цифры). Для
      доверительной границы при $P = 0{,}95$ умножьте $S_k$ на коэффициент Стьюдента $t_{0,95;\,2} =
      4{,}30$ (две степени свободы для четырех точек): $\Delta k \approx 0{,}011$ В/мА и $R = (121 \pm
      11)$ Ом.</li>
          <li>Свободный член $b = (-0{,}05 \pm 0{,}07)$ В равен нулю в пределах погрешности, значит,
      прямая проходит через начало координат и закон Ома выполняется.</li>
      </ul>
      <p>Это и есть основа вывода. Как его сформулировать, рассказано в статье о <a
      href="/blog/how-to-write-lab-report-conclusion-examples">выводе к лабораторной работе</a>.</p>
  - id: 'linearization'
    title: 'Линеаризация: что откладывать по осям'
    html: |2-
      <p>Прямую проще провести и проверить, чем кривую, поэтому нелинейную зависимость приводят к
      линейной, выбирая, что откладывать по осям:</p>
      <ul>
          <li><strong>Математический маятник:</strong> $T = 2\pi\sqrt{L/g}$. Строят $T^2(L)$: это
      прямая с наклоном $k = 4\pi^2/g$, откуда $g = 4\pi^2/k$. Здесь ноль не подавляют: прямая должна
      пройти через начало координат.</li>
          <li><strong>Разрядка конденсатора, затухание:</strong> $I = I_0 e^{-t/\tau}$. Строят $\ln
      I(t)$: наклон равен $-1/\tau$.</li>
          <li><strong>Тонкая линза:</strong> $1/a + 1/b = 1/f$. Строят $1/b$ от $1/a$: прямая с
      наклоном $-1$, отсекающая на осях отрезки $1/f$.</li>
          <li><strong>Степенной закон</strong> $y = Cx^n$: строят $\ln y$ от $\ln x$, наклон равен
      $n$.</li>
      </ul>
      <p>Вместо пересчета данных можно взять логарифмическую шкалу: в <code>pgfplots</code> это
      окружения <code>semilogyaxis</code> (логарифм по одной оси) и <code>loglogaxis</code> (по обеим).
      Погрешность после линеаризации пересчитывают: например, $\Delta(T^2) = 2T\,\Delta T$, $\Delta(\ln
      I) = \Delta I / I$.</p>
  - id: 'tools'
    title: 'Инструменты: pgfplots, Python, Excel и графики Labkeeper'
    html: |2-
      <p>Миллиметровка еще встречается на младших курсах, но современный отчет оформляют с
      компьютерной графикой. Ниже один и тот же график $U(I)$ в трех инструментах.</p>
      <h3>LaTeX и pgfplots</h3>
      <p>В преамбулу добавьте пакет и настройку: <code>compat</code> убирает предупреждение о версии,
      а <code>use comma</code> ставит десятичную запятую на шкалах.</p>
      <div class="article-code">
          <div class="article-code__header"><span
      class="article-code__lang">LaTeX преамбула</span></div>
          <pre><code>\usepackage{pgfplots}
      \pgfplotsset{compat=1.18, /pgf/number format/use comma}
      \usepackage{caption}
      \captionsetup[figure]{labelsep=endash}
      \addto\captionsrussian{\renewcommand{\figurename}{Рисунок}}</code></pre>
      </div>
      <div class="article-code">
          <div class="article-code__header"><span
      class="article-code__lang">LaTeX pgfplots пример</span></div>
          <pre><code>\begin{figure}[h]
        \centering
        \begin{tikzpicture}
          \begin{axis}[
              xlabel={$I$, мА},
              ylabel={$U$, В},
              grid=both,
              xmin=0, xmax=45, ymin=0, ymax=5.5,
              width=9cm, height=6cm,
              legend pos=north west
          ]
            \addplot+[only marks, error bars/.cd,
                x dir=both, x explicit, y dir=both, y explicit]
              coordinates {
                (10, 1.2) +- (0.5, 0.1)
                (20, 2.3) +- (0.5, 0.1)
                (30, 3.6) +- (0.5, 0.1)
                (40, 4.8) +- (0.5, 0.1)
              };
            \addplot[thick, domain=0:45] {0.121*x - 0.05};
            \legend{Опыт, МНК}
          \end{axis}
        \end{tikzpicture}
        \caption{Зависимость напряжения от силы тока $U(I)$}\label{fig:ui}
      \end{figure}</code></pre>
      </div>
      <p>Подпись по ГОСТ 7.32-2017 стоит под рисунком по центру: «Рисунок 1 – Зависимость напряжения от
      силы тока $U(I)$». Номер вида «Рисунок 1.2» с привязкой к разделу настраивается отдельно, см.
      статью о <a href="/blog/figure-double-numbering-chapters-gost">двойной нумерации рисунков</a>.
      Синтаксис pgfplots подробно (импорт CSV, стили, легенда) разобран в статье о <a
      href="/blog/latex-pgfplots-function-graphs">графиках в pgfplots</a>, а загрузка данных из таблицы
      Excel — в статье о <a href="/blog/latex-pgfplotstable-import-excel-csv-tables">pgfplotstable и
      CSV</a>.</p>
      <h3>Python и matplotlib</h3>
      <div class="article-code">
          <div class="article-code__header"><span
      class="article-code__lang">Python</span></div>
          <pre><code>import numpy as np
      import matplotlib.pyplot as plt
      from matplotlib.ticker import FuncFormatter

      I = np.array([10, 20, 30, 40])          # ток, мА
      U = np.array([1.2, 2.3, 3.6, 4.8])      # напряжение, В
      k, b = np.polyfit(I, U, 1)              # прямая МНК

      fig, ax = plt.subplots(figsize=(6, 4))
      ax.errorbar(I, U, xerr=0.5, yerr=0.1, fmt='o', capsize=3, label='Опыт')
      x = np.linspace(0, 45, 2)
      ax.plot(x, k * x + b, label='МНК')
      ax.set_xlabel('$I$, мА')
      ax.set_ylabel('$U$, В')
      comma = FuncFormatter(lambda v, _: f'{v:g}'.replace('.', ','))  # десятичная запятая
      ax.xaxis.set_major_formatter(comma)
      ax.yaxis.set_major_formatter(comma)
      ax.grid(True)
      ax.legend()
      fig.savefig('u_i.pdf', bbox_inches='tight')  # вектор, вставляется в pdfLaTeX</code></pre>
      </div>
      <p>Файл <code>u_i.pdf</code> загрузите в проект и вставьте через <code>\includegraphics</code>
      внутри окружения <code>figure</code> с подписью.</p>
      <h3>Excel и LibreOffice Calc</h3>
      <p>Постройте точечную диаграмму (не «график»: он ставит точки через равные интервалы). Кресты
      добавляются через «Элементы диаграммы → Планки погрешностей → Дополнительные параметры» с
      фиксированным значением или диапазоном ячеек. Прямую МНК дает «Линия тренда → Линейная» с
      галочкой «Показывать уравнение». Сохраните диаграмму в PDF, чтобы вставить ее в отчет в
      векторном виде.</p>
      <h3>Вычислительный сегмент Labkeeper</h3>
      <p>Данные с погрешностями задаются прямо в проекте, функция <code>least_squares</code> считает
      коэффициенты прямой МНК, а <code>plot</code> рисует точки с крестами погрешностей и линию. В
      LaTeX-проекте график встает в PDF, а коэффициент подставляется в текст через
      <code>${k}</code>:</p>
      <div class="article-code">
          <div class="article-code__header"><span
      class="article-code__lang">Вычислительный сегмент</span></div>
          <pre><code>// Ток, мА, и напряжение, В
      I = [10, 20, 30, 40] # 0.5
      U = [1.2, 2.3, 3.6, 4.8] # 0.1
      least_squares(I, U, x_name="I", y_name="U")
      k = a
      a = a # 0
      b = b # 0
      Uf = a * I + b
      plot(title="Зависимость U(I)", x_name="I, мА", y_name="U, В", x_1=I, y_1=U, name_1="опыт", x_2=I, y_2=Uf, type_2="line", name_2="МНК")</code></pre>
      </div>
      <p>Погрешности после знака <code>#</code> задают кресты по обеим осям. Коэффициент
      <code>k</code> сохраняет погрешность наклона, а у линии МНК погрешность коэффициентов обнулена
      (<code>a = a # 0</code>), чтобы прямая не выглядела ломаной из-за округления. Описание функций:
      <a href="/wiki/language/functions/plot.html">plot</a> и <a
      href="/wiki/language/functions/misc.html">least_squares</a> в вики.</p>
      <h3>Готовые лабораторные с графиками</h3>
      <p>Посмотреть оформленные графики в контексте отчета можно в витрине: <a
      href="/templates/pogreshnosti-udelnoe-soprotivlenie">«Систематические и случайные
      погрешности»</a> (вольт-амперные прямые), <a href="/templates/rezonans-napryazhenii">«Резонанс
      напряжений»</a> (резонансная кривая) и <a href="/templates/skin-effekt-polyi-tsilindr">«Скин-эффект
      в полом цилиндре»</a>.</p>
  - id: 'faq'
    title: 'Частые вопросы'
    html: |2-
      <h3>Нужно ли начинать ось с нуля?</h3>
      <p>Нет, если данные лежат в узком диапазоне далеко от нуля. Да, если по графику нужно найти
      пересечение с осью или проверить, что прямая проходит через начало координат.</p>
      <h3>Можно ли соединять точки линией?</h3>
      <p>Только если это непрерывная запись (осциллограмма) или теоретическая кривая. Экспериментальные
      точки аппроксимируют прямой МНК или гладкой кривой, а не ломаной.</p>
      <h3>Как подписать оси графика в отчете?</h3>
      <p>Обозначение величины и единица через запятую: «$U$, В», «$R$, кОм». Множитель относят к
      единице, а не к величине.</p>
      <h3>Как построить кресты погрешностей в Excel?</h3>
      <p>Выделите ряд точечной диаграммы, откройте «Планки погрешностей → Дополнительные параметры» и
      задайте значение погрешности или диапазон ячеек отдельно для вертикальных и горизонтальных
      планок.</p>
tips:
  - title: 'Никогда не соединяйте точки «змейкой»'
    html: |2-
      <p>Всегда проводите усредненную теоретическую кривую или прямую МНК. Ломаная линия допустима
      только при регистрации непрерывных осциллограмм.</p>
  - title: 'Векторный экспорт графиков'
    html: |2-
      <p>При вставке графиков из Python или Excel в LaTeX-проект сохраняйте их в векторном PDF или в
      PNG высокого разрешения, чтобы при печати линии и цифры оставались четкими. Формат SVG pdfLaTeX
      не вставляет.</p>
editorExample:
  compute: |2-
    // Ток, мА, и напряжение, В
    I = [10, 20, 30, 40] # 0.5
    U = [1.2, 2.3, 3.6, 4.8] # 0.1
    least_squares(I, U, x_name="I", y_name="U")
    k = a
    a = a # 0
    b = b # 0
    Uf = a * I + b
    plot(title="Зависимость U(I)", x_name="I, мА", y_name="U, В", x_1=I, y_1=U, name_1="опыт", x_2=I,
    y_2=Uf, type_2="line", name_2="МНК")
  latex: |2-
    \section*{Зависимость напряжения от силы тока}
    Наклон прямой по МНК: $k = ${k}$~В/мА.
