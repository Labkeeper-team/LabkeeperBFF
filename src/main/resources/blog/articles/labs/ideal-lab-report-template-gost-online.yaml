sections:
  - id: 'gost-standard'
    title: 'Требования ГОСТ 7.32-2017 к отчету по лабораторной'
    html: |2-
      <p>Отчет по лабораторной работе — учебный научно-технический документ. Отдельного стандарта для
      него нет, поэтому кафедры опираются на <strong>ГОСТ 7.32-2017</strong> «Отчет о
      научно-исследовательской работе» и ГОСТ 2.105-2019, а детали уточняют в методичке. Основные
      требования и то, как их задать в LaTeX:</p>
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead>
                  <tr>
                      <th>Параметр</th>
                      <th>Требование</th>
                      <th>Как в LaTeX</th>
                  </tr>
              </thead>
              <tbody>
                  <tr>
                      <td>Поля</td>
                      <td>левое 30 мм, правое 15 мм, верхнее и нижнее по 20 мм</td>
                      <td><code>geometry</code>, подробнее в статье о <a
      href="/blog/latex-geometry-margins-gost">полях по ГОСТ</a></td>
                  </tr>
                  <tr>
                      <td>Шрифт</td>
                      <td>не менее 12 пт (чаще всего методички требуют 14 пт), Times New Roman, черный
      цвет</td>
                      <td>класс <code>extarticle</code> с опцией <code>14pt</code>, пакет
      <code>tempora</code> (Times с кириллицей для pdfLaTeX)</td>
                  </tr>
                  <tr>
                      <td>Межстрочный интервал</td>
                      <td>полуторный</td>
                      <td><code>setspace</code> и <code>\onehalfspacing</code>, см. <a
      href="/blog/latex-line-spacing-1-5-setspace-gost">интервал 1,5 в LaTeX</a></td>
                  </tr>
                  <tr>
                      <td>Абзацный отступ</td>
                      <td>1,25 см, в том числе у первого абзаца после заголовка</td>
                      <td><code>\setlength{\parindent}{1.25cm}</code> и пакет <code>indentfirst</code>,
      см. <a href="/blog/paragraph-indent-1-25-gost">отступ 1,25 см</a></td>
                  </tr>
                  <tr>
                      <td>Выравнивание</td>
                      <td>по ширине, с переносами</td>
                      <td>по умолчанию; переносы дает <code>babel</code> с языком
      <code>russian</code></td>
                  </tr>
                  <tr>
                      <td>Нумерация страниц</td>
                      <td>арабскими цифрами внизу по центру; титульный лист считается первым, но номер на
      нем не ставят</td>
                      <td><code>titlepage</code> и <code>\setcounter{page}{2}</code>, см. <a
      href="/blog/diploma-page-numbering-second-page">нумерацию со второй страницы</a></td>
                  </tr>
                  <tr>
                      <td>Подписи</td>
                      <td>«Таблица 1 – Название» над таблицей слева, «Рисунок 1 – Название» под рисунком
      по центру</td>
                      <td>пакет <code>caption</code> с <code>labelsep=endash</code></td>
                  </tr>
              </tbody>
          </table>
      </div>
      <p>Формулы нумеруют арабскими цифрами в круглых скобках у правого края, а переменные поясняют
      после формулы со слова «где»: об этом статьи о <a
      href="/blog/formula-numbering-lab-reports-gost">нумерации формул</a> и о <a
      href="/blog/formula-variable-explanation-where-gost">расшифровке переменных</a>.</p>
  - id: 'full-structure'
    title: 'Обязательные разделы отчета'
    html: |2-
      <p>Если перед опытом требуется проверка подготовки, сверьте с преподавателем
      <a href="/blog/lab-work-admission-form-template">бланк допуска к лабораторной</a>.</p>
      <p>Отчет по лабораторной работе обычно состоит из следующих частей:</p>
      <ol>
          <li><strong><a href="/blog/lab-report-title-page-gost-template">Титульный лист</a>:</strong> министерство, вуз, кафедра, номер и тема работы,
      данные студента и преподавателя, город и год;</li>
          <li><strong>Цель работы;</strong></li>
          <li><strong>Приборы и принадлежности:</strong> с классом точности и ценой деления;</li>
          <li><strong>Расчетные формулы:</strong> основные законы и рабочие формулы с номерами;</li>
          <li><strong>Схема установки:</strong> электрическая схема или чертеж;</li>
          <li><strong>Результаты измерений:</strong> таблицы прямых измерений;</li>
          <li><strong>Обработка результатов:</strong> расчет искомых величин и погрешностей;</li>
          <li><strong>Графики:</strong> точки с крестами погрешностей и аппроксимирующей линией;</li>
          <li><strong>Выводы:</strong> результат с погрешностью и сравнение с теорией;</li>
          <li><strong>Ответы на контрольные вопросы:</strong> обязательны в большинстве технических
      вузов.</li>
      </ol>
      <h3>Титульный лист</h3>
      <p>Наименования министерства и вуза пишут полностью, без сокращений вроде «РФ». Готовые варианты
      титульника в LaTeX собраны в статье о <a href="/blog/latex-titlepage">титульном листе</a>.</p>
      <h3>Формулы</h3>
      <p>Каждую рабочую формулу нумеруют и сразу поясняют обозначения с единицами измерения. Номер
      ставит окружение <code>equation</code>, ссылку дает <code>\eqref</code>.</p>
      <h3>Погрешности</h3>
      <p>Обработку серии прямых измерений (среднее, СКО, коэффициент Стьюдента) разбирает статья о <a
      href="/blog/student-confidence-intervals-error-calculation">доверительных интервалах</a>, а
      перенос погрешностей на косвенную величину — статья о <a
      href="/blog/indirect-measurement-error-calculation-lab-report">погрешности косвенных
      измерений</a>.</p>
      <h3>Список литературы</h3>
      <p>Если в отчете есть ссылки на методичку или учебник, оформите их по ГОСТ: примеры в статье о <a
      href="/blog/lab-report-bibliography-gost-7-1">списке литературы для лабораторной</a>.</p>
  - id: 'latex-template'
    title: 'Готовый шаблон отчета по лабораторной в LaTeX'
    html: |2-
      <p>Ниже полный шаблон отчета: скопируйте код в LaTeX-сегмент проекта Labkeeper и замените данные
      своими. Свои поля и шрифт задает преамбула, поэтому стандартная преамбула Labkeeper здесь не
      используется. В шаблоне есть таблица с подписью по ГОСТ, формулы с номерами, график с крестами
      погрешностей, вывод и ответы на контрольные вопросы. График строится пакетом
      <code>pgfplots</code> прямо из чисел, поэтому отдельный файл с рисунком загружать не нужно.</p>
      <div class="article-code">
          <div class="article-code__header"><span
      class="article-code__lang">LaTeX Шаблон отчета ГОСТ</span></div>
          <pre><code>\documentclass[a4paper,14pt]{extarticle} % класс article не знает кегль 14pt
      \usepackage{cmap} % русский текст копируется из PDF без искажений
      \usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[russian]{babel}
      \usepackage{tempora}
      \usepackage[left=30mm,right=15mm,top=20mm,bottom=20mm]{geometry}
      \usepackage{setspace}
      \onehalfspacing
      \usepackage{indentfirst}
      \setlength{\parindent}{1.25cm}
      \usepackage{amsmath,amssymb}
      \usepackage{graphicx}
      \usepackage{pgfplots}
      \pgfplotsset{compat=1.18, /pgf/number format/use comma}
      \usepackage{caption}
      \captionsetup{labelsep=endash}
      \captionsetup[table]{justification=raggedright,singlelinecheck=false}
      \addto\captionsrussian{\renewcommand{\figurename}{Рисунок}}

      \begin{document}

      % Титульный лист
      \begin{titlepage}
      \centering
      {\small МИНИСТЕРСТВО НАУКИ И ВЫСШЕГО ОБРАЗОВАНИЯ РОССИЙСКОЙ ФЕДЕРАЦИИ\\
      Федеральное государственное автономное образовательное учреждение\\
      высшего образования\\
      «Полное наименование университета»\\
      (сокращенное наименование)}\\
      \vspace{2cm}
      {\bfseries Кафедра общей физики}\\
      \vspace{2cm}
      {\Large\bfseries ОТЧЕТ ПО ЛАБОРАТОРНОЙ РАБОТЕ № 3}\\
      {\large «Исследование стоячих волн на струне»}\\
      \vspace{3cm}
      \begin{flushright}
      Выполнил: студент гр. БПИ-231\\
      Иванов И. И.\\
      Проверил: доцент, к.ф.-м.н.\\
      Петров П. П.
      \end{flushright}
      \vfill
      Москва 2026
      \end{titlepage}
      \setcounter{page}{2} % titlepage сбросил счетчик страниц на 1

      \section*{Цель работы}
      Экспериментальное исследование стоячих волн на струне и определение скорости распространения поперечных волн.

      \section*{Приборы и принадлежности}
      Струна длиной $L = (0{,}800 \pm 0{,}001)$~м, грузы для натяжения, звуковой генератор Г3-112, электромагнитный датчик, линейка (цена деления 1~мм).

      \section*{Расчетные формулы}
      Скорость поперечной волны в струне
      \begin{equation}\label{eq:v}
        v = \sqrt{\frac{F}{\mu}},
      \end{equation}
      где $F$~--- сила натяжения, Н; $\mu$~--- линейная плотность струны, кг/м.

      Резонансная частота $n$-й гармоники
      \begin{equation}\label{eq:nu}
        \nu_n = \frac{n v}{2L},
      \end{equation}
      где $n$~--- номер гармоники; $L$~--- длина струны, м.

      \section*{Результаты измерений}
      Натяжение $F = 32{,}0$~Н, линейная плотность $\mu = 1{,}00$~г/м. Резонансные частоты приведены в таблице~\ref{tab:nu}.

      \begin{table}[h]
        \caption{Резонансные частоты гармоник}\label{tab:nu}
        \centering
        \begin{tabular}{|c|c|c|c|}
          \hline
          $n$ &amp; $\nu_n$, Гц &amp; $\Delta\nu_n$, Гц &amp; $v_n = 2L\nu_n/n$, м/с \\
          \hline
          1 &amp; 112 &amp; 1 &amp; 179,2 \\
          2 &amp; 225 &amp; 1 &amp; 180,0 \\
          3 &amp; 337 &amp; 2 &amp; 179,7 \\
          \hline
        \end{tabular}
      \end{table}

      \begin{figure}[h]
        \centering
        \begin{tikzpicture}
          \begin{axis}[width=10cm, height=6cm, grid=both,
              xlabel={$n$}, ylabel={$\nu$, Гц}, xmin=0, xmax=3.5, xtick={1,2,3}, ymin=0, ymax=400]
            \addplot+[only marks, error bars/.cd, y dir=both, y explicit]
              coordinates {(1,112) +- (0,1) (2,225) +- (0,1) (3,337) +- (0,2)};
            \addplot[thick, domain=0:3.5] {112.36*x};
          \end{axis}
        \end{tikzpicture}
        \caption{Зависимость резонансной частоты от номера гармоники $\nu(n)$}\label{fig:nu}
      \end{figure}

      По данным таблицы~\ref{tab:nu} и рисунка~\ref{fig:nu} наклон прямой $\nu(n)$ равен $k = 112{,}4$~Гц, откуда по формуле~\eqref{eq:nu} $v = 2Lk = (180 \pm 2)$~м/с. По формуле~\eqref{eq:v} $v = 178{,}9$~м/с.

      \section*{Выводы}
      Измерены резонансные частоты первых трех гармоник струны. Зависимость $\nu(n)$ линейна и проходит через начало координат, что подтверждает формулу~\eqref{eq:nu}. Скорость поперечной волны $v = (180 \pm 2)$~м/с согласуется с расчетным значением $178{,}9$~м/с в пределах погрешности.

      \section*{Ответы на контрольные вопросы}
      \textbf{1. Почему на струне образуется стоячая волна?}
      Волны, отраженные от закрепленных концов, складываются с падающими. Если частота кратна $v/(2L)$, на длине струны укладывается целое число полуволн.

      \textbf{2. Как изменится частота основного тона, если натяжение увеличить в 4 раза?}
      По формуле~\eqref{eq:v} скорость вырастет в 2 раза, поэтому по формуле~\eqref{eq:nu} частота тоже вырастет в 2 раза.
      \end{document}</code></pre>
      </div>
      <p>Кнопка «Просмотреть пример» открывает этот шаблон в редакторе целиком. Если нужны таблицы с
      выравниванием по десятичной запятой и запись погрешностей через <code>siunitx</code>, загляните в
      статью <a href="/blog/latex-lab-reports">LaTeX для лабораторных: таблицы, погрешности,
      формулы</a>. Фразы для последнего раздела подскажет статья о <a
      href="/blog/how-to-write-lab-report-conclusion-examples">выводе к лабораторной работе</a>.</p>
