    \begin{document}

    % Титульный лист
    \begin{titlepage}
    \centering
    {\small МИНИСТЕРСТВО НАУКИ И ВЫСШЕГО ОБРАЗОВАНИЯ РОССИЙСКОЙ ФЕДЕРАЦИИ\\
    Федеральное государственное автономное образовательное учреждение\\
    высшего образования\\
    «Полное наименование университета»\\
    (сокращенное наименование)}\\
    \vspace{2cm}
    {\bfseries Кафедра общей физики}\\
    \vspace{2cm}
    {\Large\bfseries ОТЧЕТ ПО ЛАБОРАТОРНОЙ РАБОТЕ № 3}\\
    {\large «Исследование стоячих волн на струне»}\\
    \vspace{3cm}
    \begin{flushright}
    Выполнил: студент гр. БПИ-231\\
    Иванов И. И.\\
    Проверил: доцент, к.ф.-м.н.\\
    Петров П. П.
    \end{flushright}
    \vfill
    Москва 2026
    \end{titlepage}
    \setcounter{page}{2} % titlepage сбросил счетчик страниц на 1

    \section*{Цель работы}
    Экспериментальное исследование стоячих волн на струне и определение скорости распространения поперечных волн.

    \section*{Приборы и принадлежности}
    Струна длиной $L = (0{,}800 \pm 0{,}001)$~м, грузы для натяжения, звуковой генератор Г3-112, электромагнитный датчик, линейка (цена деления 1~мм).

    \section*{Расчетные формулы}
    Скорость поперечной волны в струне
    \begin{equation}\label{eq:v}
      v = \sqrt{\frac{F}{\mu}},
    \end{equation}
    где $F$~--- сила натяжения, Н; $\mu$~--- линейная плотность струны, кг/м.

    Резонансная частота $n$-й гармоники
    \begin{equation}\label{eq:nu}
      \nu_n = \frac{n v}{2L},
    \end{equation}
    где $n$~--- номер гармоники; $L$~--- длина струны, м.

    \section*{Результаты измерений}
    Натяжение $F = 32{,}0$~Н, линейная плотность $\mu = 1{,}00$~г/м. Резонансные частоты приведены в таблице~\ref{tab:nu}.

    \begin{table}[h]
      \caption{Резонансные частоты гармоник}\label{tab:nu}
      \centering
      \begin{tabular}{|c|c|c|c|}
        \hline
        $n$ & $\nu_n$, Гц & $\Delta\nu_n$, Гц & $v_n = 2L\nu_n/n$, м/с \\
        \hline
        1 & 112 & 1 & 179,2 \\
        2 & 225 & 1 & 180,0 \\
        3 & 337 & 2 & 179,7 \\
        \hline
      \end{tabular}
    \end{table}

    \begin{figure}[h]
      \centering
      \begin{tikzpicture}
        \begin{axis}[width=10cm, height=6cm, grid=both,
            xlabel={$n$}, ylabel={$\nu$, Гц}, xmin=0, xmax=3.5, xtick={1,2,3}, ymin=0, ymax=400]
          \addplot+[only marks, error bars/.cd, y dir=both, y explicit]
            coordinates {(1,112) +- (0,1) (2,225) +- (0,1) (3,337) +- (0,2)};
          \addplot[thick, domain=0:3.5] {112.36*x};
        \end{axis}
      \end{tikzpicture}
      \caption{Зависимость резонансной частоты от номера гармоники $\nu(n)$}\label{fig:nu}
    \end{figure}

    По данным таблицы~\ref{tab:nu} и рисунка~\ref{fig:nu} наклон прямой $\nu(n)$ равен $k = 112{,}4$~Гц, откуда по формуле~\eqref{eq:nu} $v = 2Lk = (180 \pm 2)$~м/с. По формуле~\eqref{eq:v} $v = 178{,}9$~м/с.

    \section*{Выводы}
    Измерены резонансные частоты первых трех гармоник струны. Зависимость $\nu(n)$ линейна и проходит через начало координат, что подтверждает формулу~\eqref{eq:nu}. Скорость поперечной волны $v = (180 \pm 2)$~м/с согласуется с расчетным значением $178{,}9$~м/с в пределах погрешности.

    \section*{Ответы на контрольные вопросы}
    \textbf{1. Почему на струне образуется стоячая волна?}
    Волны, отраженные от закрепленных концов, складываются с падающими. Если частота кратна $v/(2L)$, на длине струны укладывается целое число полуволн.

    \textbf{2. Как изменится частота основного тона, если натяжение увеличить в 4 раза?}
    По формуле~\eqref{eq:v} скорость вырастет в 2 раза, поэтому по формуле~\eqref{eq:nu} частота тоже вырастет в 2 раза.
    \end{document}
