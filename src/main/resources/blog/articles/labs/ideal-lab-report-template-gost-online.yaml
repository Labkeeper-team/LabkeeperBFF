          <li><a href="/templates/statisticheskaya-obrabotka-izmerenii">«Статистическая обработка
      многократных измерений»</a>;</li>
          <li><a href="/templates/rezonans-napryazhenii">«Резонанс напряжений»</a>;</li>
          <li><a href="/templates/sdvig-faz-peremennyi-tok">«Сдвиг фаз в цепи переменного
      тока»</a>;</li>
          <li><a href="/templates/magnitnoe-pole-zemli">«Измерение магнитного поля Земли»</a>.</li>
      </ul>
  - id: 'markdown-workflow'
    title: 'Отчет по лабораторной в Markdown'
    html: |2-
      <p>Если кафедра не требует строгой верстки, отчет по лабораторной можно оформить онлайн в
      Markdown с формулами: превью обновляется при наборе, а PDF сохраняется через печать браузера.
      Тот же отчет, что и выше, в Markdown выглядит так:</p>
      <div class="article-code">
          <div class="article-code__header"><span
      class="article-code__lang">Markdown</span></div>
          <pre><code># Отчет по лабораторной работе № 3
      ## Исследование стоячих волн на струне

      **Цель работы:** исследовать стоячие волны на струне и определить скорость поперечных волн.

      ## Расчетные формулы

      $$
      \nu_n = \frac{n v}{2L} \tag{1}
      $$

      где $n$ — номер гармоники, $L$ — длина струны, м.

      ## Результаты измерений

      Таблица 1 – Резонансные частоты гармоник

      | $n$ | $\nu_n$, Гц | $\Delta\nu_n$, Гц |
      |:---:|:-----------:|:-----------------:|
      | 1   | 112         | 1                 |
      | 2   | 225         | 1                 |
      | 3   | 337         | 2                 |

      ![Рисунок 1 – Зависимость резонансной частоты от номера гармоники](nu_n.png)

      ## Выводы

      Скорость поперечной волны $v = (180 \pm 2)$ м/с согласуется с расчетной.</code></pre>
      </div>
      <p>Формулы в Markdown набираются тем же синтаксисом LaTeX между знаками доллара: подробности в
      статье о <a href="/blog/markdown-mathjax-katex-latex-math">формулах в Markdown</a>. Как получить
      из такого текста аккуратный PDF, рассказано в статье об <a
      href="/blog/markdown-to-pdf-export">экспорте Markdown в PDF</a>. Номера формул и подписи здесь
      пишутся вручную, а поля по ГОСТ и сноски внизу страницы Markdown не задает: для них пишите текст в
      сегментах LaTeX-проекта.</p>
  - id: 'computations'
    title: 'Вычисления с погрешностями, подстановка результатов и графики'
    html: |2-
      <p>Главное отличие Labkeeper для лабораторных — вычислительный сегмент. Прямые измерения
      записываются вместе с погрешностью через знак <code>#</code>, и при расчете косвенной величины
      погрешность считается автоматически. Результат подставляется в текст отчета конструкцией
      <code>${R}</code>, поэтому после замены данных цифры в выводе обновятся сами:</p>
      <div class="article-code">
          <div class="article-code__header"><span
      class="article-code__lang">Вычислительный сегмент</span></div>
          <pre><code>// Напряжение, В, и ток, А
      U = 5.00 # 0.05
      I = 0.100 # 0.002
      R = U / I</code></pre>
      </div>
      <div class="article-code">
          <div class="article-code__header"><span
      class="article-code__lang">LaTeX-сегмент</span></div>
          <pre><code>\subsection*{Вывод}
      Получено $R = (${R})$~Ом.</code></pre>
      </div>
      <p>Что получится. Относительные погрешности напряжения и тока равны 1% и 2%, поэтому
      $\varepsilon_R = \sqrt{0{,}01^2 + 0{,}02^2} \approx 2{,}24\%$ и $\Delta R = 50{,}0 \cdot
      0{,}0224 \approx 1{,}12$ Ом. Новый проект оставляет три значащие цифры, поэтому подстановка даст
      значение вида <code>50.0 ± 1.12</code>. По правилу округления погрешность, которая начинается с
      единицы, записывают двумя значащими цифрами: $R = (50{,}0 \pm 1{,}1)$ Ом. Редактор такую запись
      сам не формирует: режим «Первая значащая цифра погрешности» оставляет у погрешности одну цифру,
      поэтому итог с двумя значащими цифрами округлите вручную (см. <a
      href="/wiki/language/rounding.html">округление в вики</a>).</p>
      <p>В том же сегменте функция <code>plot</code> строит график с крестами погрешностей, а
      <code>least_squares</code> проводит прямую по методу наименьших квадратов — подробности в статье о
      <a href="/blog/physics-lab-measurement-graphs-formatting-gost">графиках измерений в
      лабораторной</a>. В настройках сегмента можно включить показ общей формулы погрешности и формулы с
      подставленными числами.</p>
  - id: 'check-list'
    title: 'Чек-лист перед сдачей отчета'
    html: |2-
      <ul>
          <li>У всех величин указаны единицы измерения (СИ, ГОСТ 8.417);</li>
          <li>Погрешность округлена до одной-двух значащих цифр, а результат — до того же
      разряда;</li>
          <li>Таблицы и рисунки пронумерованы и подписаны: «Таблица 1 – …» над таблицей, «Рисунок 1 – …»
      под рисунком;</li>
          <li>Формулы пронумерованы, обозначения пояснены после слова «где»;</li>
          <li>На графиках подписаны оси, нанесены кресты погрешностей, точки не соединены
      ломаной;</li>
          <li>В выводе есть конкретные числа с погрешностью и сравнение с теорией;</li>
          <li>Есть ответы на контрольные вопросы, если их требует методичка.</li>
      </ul>
  - id: 'faq'
    title: 'Частые вопросы'
    html: |2-
      <h3>Нужен ли титульный лист в лабораторной работе?</h3>
      <p>Почти всегда да: титульный лист требуют методички большинства кафедр. Исключение — журнал
      лабораторных работ, который ведется в одной тетради: там тему и номер работы пишут
      заголовком.</p>
      <h3>Какой шрифт и кегль нужен по ГОСТ 7.32?</h3>
      <p>ГОСТ 7.32-2017 требует кегль не менее 12 пт и черный цвет. Times New Roman и 14 пт — требование
      большинства методичек, поэтому шаблон выше использует именно их.</p>
      <h3>С какой страницы нумеровать отчет?</h3>
      <p>Нумерация сквозная, титульный лист считается первой страницей, но номер на нем не ставят.
      Первый видимый номер — «2» на следующей странице.</p>
      <h3>Можно ли сдавать отчет в Markdown?</h3>
      <p>Если преподаватель принимает PDF без строгих требований к полям, да. Если нужен нормоконтроль по
      ГОСТ (поля, нумерация страниц, подписи), надежнее собрать отчет в LaTeX по шаблону выше.</p>
tips:
  - title: 'Подготовьте объяснение результата'
    html: |2-
      <p>Перед сдачей проследите путь от исходных измерений до вывода. В
      <a href="/blog/lab-report-defense-preparation">памятке по защите лабораторной</a>
      разобраны короткий доклад, вопросы о методе и объяснение неопределенности.</p>
      <p>Если для выступления нужны слайды, используйте
      <a href="/blog/lab-defense-presentation-beamer-template">шаблон презентации Beamer
      к защите лабораторной</a>.</p>
  - title: 'Храните исходники в облаке'
    html: |2-
      <p>Сохраняйте отчеты в проектах Labkeeper (после входа): для следующей работы склонируйте проект
      и замените цифры в таблице измерений.</p>
  - title: 'Сдавайте отчет в PDF'
    html: |2-
      <p>Всегда сдавайте преподавателю электронный отчет в формате PDF, чтобы исключить искажение
      формул и таблиц на чужом компьютере.</p>
editorExample:
  latex: |2-
    \documentclass[a4paper,14pt]{extarticle} % класс article не знает кегль 14pt
    \usepackage{cmap} % русский текст копируется из PDF без искажений
    \usepackage[T2A]{fontenc}
    \usepackage[utf8]{inputenc}
    \usepackage[russian]{babel}
    \usepackage{tempora}
    \usepackage[left=30mm,right=15mm,top=20mm,bottom=20mm]{geometry}
    \usepackage{setspace}
    \onehalfspacing
    \usepackage{indentfirst}
    \setlength{\parindent}{1.25cm}
    \usepackage{amsmath,amssymb}
    \usepackage{graphicx}
    \usepackage{pgfplots}
    \pgfplotsset{compat=1.18, /pgf/number format/use comma}
    \usepackage{caption}
