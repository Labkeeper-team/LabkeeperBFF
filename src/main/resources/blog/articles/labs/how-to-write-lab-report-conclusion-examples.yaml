                  </tr>
                  <tr>
                      <td>«g = 9,81452398 м/с²»</td>
                      <td>Избыточные знаки после запятой, нет погрешности</td>
                      <td>Округлить результат по погрешности: $(9{,}81 \pm 0{,}04)\text{ м/с}^2$</td>
                  </tr>
                  <tr>
                      <td>«Прибор плохой, поэтому не сошлось»</td>
                      <td>Ненаучный язык</td>
                      <td>«Превышение погрешности обусловлено классом точности вольтметра 1,5 и дрейфом
      нуля»</td>
                  </tr>
                  <tr>
                      <td>«Получено $g = 9{,}7$ м/с², что подтверждает теорию»</td>
                      <td>Нет погрешности и сравнения с табличным значением</td>
                      <td>«$|g - g_{\text{табл}}| = 0{,}12 > \Delta g = 0{,}05$ м/с², расхождение
      значимо; вероятная причина — …»</td>
                  </tr>
                  <tr>
                      <td>«Мы измерили период, затем посчитали $g$, затем построили график»</td>
                      <td>Пересказ хода работы вместо результатов</td>
                      <td>Начинать с итога и цифр: «Определено $g = \dots$», а ход работы оставить
      разделу «Методика»</td>
                  </tr>
              </tbody>
          </table>
      </div>
  - id: 'faq'
    title: 'Частые вопросы'
    html: |2-
      <h3>Какой объем вывода в лабораторной работе?</h3>
      <p>Обычно 3–6 предложений, половина страницы максимум. Если в работе несколько заданий, дайте
      по одному-два предложения на каждое.</p>
      <h3>Нужно ли писать «цель работы достигнута»?</h3>
      <p>Можно, но только в конце и после результатов с цифрами. Сама по себе эта фраза выводом не
      является.</p>
      <h3>Писать вывод от первого лица или безлично?</h3>
      <p>В научном стиле принята безличная или страдательная форма: «определено», «получено»,
      «установлено». Вариант «мы измерили» встречается, но многие преподаватели его не любят.</p>
      <h3>Чем вывод отличается от заключения в курсовой?</h3>
      <p>Вывод к лабораторной подводит итог одного опыта: результат, погрешность, сравнение с теорией.
      Заключение курсовой или ВКР обобщает всю работу: решенные задачи, результаты по главам и
      рекомендации.</p>
tips:
  - title: 'Всегда сопоставляйте вывод с целью'
    html: |2-
      <p>Перечитайте формулировку цели из начала отчета («Цель: определить...»). Вывод должен
      начинаться как прямой ответ на этот пункт: «Определено, что...».</p>
  - title: 'Округление погрешности'
    html: |2-
      <p>Погрешность округляется до одной значащей цифры (или до двух, если первая цифра 1 или 2), а
      сам результат — до того же десятичного разряда. Новый проект Labkeeper по умолчанию оставляет
      три значащие цифры; режим «Первые N значащих цифр погрешности» с N = 2 в настройках проекта
      округляет погрешность до двух цифр, а значение — до того же разряда.</p>
editorExample:
  compute: |2-
    // Напряжение, В, и ток, А
    U = 4.95 # 0.05
    I = 0.097 # 0.002
    R = U / I
  latex: |2-
    \section*{Вывод}
    Измерено сопротивление проводника: $R = (${R})$~Ом. Результат согласуется с номиналом 51~Ом в
    пределах погрешности. Основной источник неопределенности --- измерение тока.
