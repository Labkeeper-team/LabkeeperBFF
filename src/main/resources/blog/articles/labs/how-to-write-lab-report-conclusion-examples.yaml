sections:
  - id: 'formula'
    title: 'Схема вывода из 4 шагов и шаблон для заполнения'
    html: |2-
      <p>Вывод — главная смысловая часть отчета по лабораторной работе, и преподаватель часто
      начинает проверку именно с него. Фраза <em>«Цель работы достигнута, законы проверены»</em>
      почти наверняка вернет отчет на доработку: в ней нет ни одного результата.</p>
      <p>Хороший вывод строится по четырем шагам:</p>
      <ol>
          <li><strong>Связка с целью:</strong> что исследовалось или измерялось («В ходе работы
      экспериментально определен коэффициент вязкости жидкости...»).</li>
          <li><strong>Численный итог с погрешностью:</strong> значение, погрешность, единица и
      доверительная вероятность («Получено $g = (9{,}83 \pm 0{,}06)\text{ м/с}^2$ при $P = 0{,}95$»).
      Как посчитать $\Delta$, рассказано в статье о <a
      href="/blog/indirect-measurement-error-calculation-lab-report">погрешности косвенных
      измерений</a>.</li>
          <li><strong>Сравнение с табличным (теоретическим) значением:</strong> результат согласуется с
      табличным, если $|x - x_{\text{табл}}| \le \Delta x$. Относительное отклонение обозначайте
      $\delta = |x - x_{\text{табл}}| / x_{\text{табл}}$, чтобы не путать его с относительной
      погрешностью $\varepsilon$.</li>
          <li><strong>Анализ источников погрешности:</strong> какая величина или прибор внесли
      основной вклад и какие факторы не учтены (трение, температура, сопротивление проводов).</li>
      </ol>
      <p>Шаблон, который можно скопировать и заполнить:</p>
      <div class="article-quote">
          <p>«В ходе работы [методом …] определено [величина]: $X = (\bar X \pm \Delta X)$ [ед.],
      $\varepsilon = \dots\%$, $P = 0{,}95$. Значение [согласуется / не согласуется] с табличным
      $X_{\text{табл}} = \dots$ [ед.] ($\delta = \dots\%$). Основной вклад в погрешность вносит
      [величина или прибор] (…% из …%). [Расхождение объясняется …]. Цель работы достигнута.»</p>
      </div>
      <p>Титульный лист и остальные разделы отчета возьмите из <a
      href="/blog/ideal-lab-report-template-gost-online">шаблона отчета по лабораторной работе по
      ГОСТ</a>.</p>
  - id: 'physics-examples'
    title: 'Примеры выводов по разным дисциплинам'
    html: |2-
      <p>Ниже семь готовых примеров, все по схеме выше. Числа в них пересчитаны, поэтому их можно
      использовать как образец формулировок.</p>
      <h3>Пример 1. Физика: ускорение свободного падения (маятник)</h3>
      <div class="article-quote">
          <p>«В ходе работы исследованы колебания математического маятника и экспериментально
      определено ускорение свободного падения. По наклону зависимости $T^2(L)$, найденному методом
      наименьших квадратов по 5 точкам, получено $g = (9{,}82 \pm 0{,}05)\text{ м/с}^2$ ($\varepsilon
      \approx 0{,}5\%$, $P = 0{,}95$). Результат согласуется с табличным значением для Москвы $g_{\text{табл}}
      = 9{,}815\text{ м/с}^2$: $|g - g_{\text{табл}}| = 0{,}005 \text{ м/с}^2 \lt \Delta g$. Основной
      вклад в погрешность вносят конечные размеры груза и неточность измерения длины нити. Случайная
      ошибка ручного пуска секундомера уменьшена измерением времени 20 колебаний, а поправка на
      конечную амплитуду (до $5^\circ$) составляет около $0{,}1\%$ и пренебрежимо мала. Цель работы
      достигнута.»</p>
      </div>
      <h3>Пример 2. Электричество: закон Ома</h3>
      <div class="article-quote">
          <p>«Измерено сопротивление проводника: по напряжению $U = (4{,}95 \pm 0{,}05)$ В и току $I =
      (97 \pm 2)$ мА получено $R = (51{,}0 \pm 1{,}2)$ Ом ($\varepsilon \approx 2{,}3\%$). Результат
      согласуется с номиналом резистора 51 Ом в пределах погрешности. Основной источник
      погрешности — измерение тока: его относительная погрешность $2{,}1\%$ против $1{,}0\%$ у
      напряжения.»</p>
      </div>
      <p>Этот пример можно <a href="/project/default?example=how-to-write-lab-report-conclusion-examples">открыть
      в редакторе</a>: вычислительный сегмент считает $R$ и его погрешность, а число в тексте вывода
      подставляется само. Замените $U$ и $I$ своими данными, и вывод обновится.</p>
      <h3>Пример 3. Механика: момент инерции маховика</h3>
      <div class="article-quote">
          <p>«Методом падающего груза определен момент инерции маховика: $J = (0{,}0250 \pm 0{,}0007)$
      кг·м² ($\varepsilon \approx 2{,}7\%$). Расчет по размерам и массе диска дает $J_{\text{теор}} =
      0{,}0256$ кг·м²; расхождение $\delta \approx 2{,}2\%$ меньше погрешности опыта, значения
      согласуются. Основной вклад в погрешность вносит измерение времени падения груза (около $2{,}5\%$
      из $2{,}7\%$); трение в подшипнике в расчете не учитывалось.»</p>
      </div>
      <h3>Пример 4. Оптика: показатель преломления стекла</h3>
      <div class="article-quote">
          <p>«По углам падения $\alpha = (40{,}0 \pm 0{,}5)^\circ$ и преломления $\beta = (25{,}0 \pm
      0{,}5)^\circ$ определен показатель преломления стеклянной пластины: $n = (1{,}52 \pm 0{,}03)$
      ($\varepsilon \approx 2\%$). Значение согласуется с табличным для стекла марки К8 $n_{\text{табл}}
      = 1{,}516$. Около трех четвертей погрешности дает измерение угла преломления: при малом $\beta$
      ошибка отсчета угла сильнее влияет на $\sin\beta$.»</p>
      </div>
      <h3>Пример 5. Химия: молярная масса эквивалента металла</h3>
      <div class="article-quote">
          <p>«Методом вытеснения водорода определена молярная масса эквивалента магния. Навеска $m =
      (0{,}0300 \pm 0{,}0001)$ г вытеснила $V_0 = (27{,}8 \pm 0{,}5)$ мл водорода (приведено к н. у.),
      откуда $M_{\text{э}} = m \cdot 11\,200 / V_0 = (12{,}1 \pm 0{,}2)$ г/моль ($\varepsilon \approx
      1{,}8\%$). Теоретическое значение $24{,}305/2 = 12{,}15$ г/моль, относительное отклонение
      $\delta \approx 0{,}5\%$ — в пределах погрешности. Основной вклад вносит измерение объема газа и
      его приведение к нормальным условиям; погрешность взвешивания мала ($0{,}3\%$).»</p>
      </div>
      <h3>Пример 6. ТОЭ: резонанс напряжений</h3>
      <div class="article-quote">
          <p>«Исследован последовательный RLC-контур ($L = 10$ мГн, $C = 0{,}25$ мкФ, $R = 20$ Ом).
      Резонансная частота $f_0 = (3{,}15 \pm 0{,}05)$ кГц совпадает с расчетной $f_0 = 1/(2\pi\sqrt{LC})
      = 3{,}18$ кГц в пределах погрешности. Добротность, найденная как отношение $U_C/U$ при резонансе,
      $Q = 9{,}4 \pm 0{,}3$ ниже расчетной $\sqrt{L/C}/R = 10{,}0$: в расчете не учтено активное
      сопротивление катушки (около 1,3 Ом), с ним расчетная добротность равна $9{,}4$. Подтверждено,
      что при резонансе напряжения на катушке и конденсаторе почти в $Q$ раз превышают входное.»</p>
      </div>
      <p>Полностью оформленную работу с этим опытом можно открыть в витрине: <a
      href="/templates/rezonans-napryazhenii">лабораторная «Резонанс напряжений»</a>.</p>
      <h3>Пример 7. Программирование: сложность алгоритмов сортировки</h3>
      <div class="article-quote">
          <p>«Реализованы и сравнены сортировка вставками и быстрая сортировка. В логарифмических
      координатах наклон зависимости времени работы от размера массива составил $1{,}98 \pm 0{,}04$
      для сортировки вставками ($n = 10^3 \dots 10^5$), что подтверждает квадратичную сложность
      $O(n^2)$, и $1{,}08 \pm 0{,}03$ для быстрой сортировки ($n = 10^4 \dots 10^6$), что соответствует
      $O(n \log n)$: для такой зависимости локальный наклон равен $1 + 1/\ln n \approx 1{,}07\dots1{,}11$.
      При $n = 10^5$ быстрая сортировка работает быстрее примерно на три порядка.»</p>
      </div>
      <p>Как оформить код этой работы в отчете, рассказано в статье о <a
      href="/blog/programming-lab-report-code-listings-gost">листингах кода по ГОСТ</a>.</p>
      <p>Больше примеров с полным отчетом — в витрине готовых лабораторных: <a
      href="/templates/statisticheskaya-obrabotka-izmerenii">«Статистическая обработка многократных
      измерений»</a>, <a href="/templates/pogreshnosti-udelnoe-soprotivlenie">«Систематические и
      случайные погрешности»</a>, <a href="/templates/radiatsionnyi-fon">«Измерение интенсивности
      радиационного фона»</a>.</p>
  - id: 'cliches'
    title: 'Банк готовых академических фраз и клише'
    html: |2-
      <p>Используйте эти формулировки для связного научного текста:</p>
      <ul>
          <li><em>О подтверждении закона:</em> «Полученная линейная зависимость $I(U)$ подтверждает
      справедливость закона Ома для исследуемого участка цепи...»</li>
          <li><em>О численных расчетах:</em> «В результате статистической обработки экспериментальных
      данных вычислено значение...»</li>
          <li><em>О сходимости результатов:</em> «Экспериментальные точки укладываются на
      теоретическую кривую в пределах погрешности измерений...»</li>
          <li><em>О причинах расхождений:</em> «Расхождение в $2{,}4\%$ обусловлено неучтенным
      сопротивлением подводящих проводов и тепловыми потерями калориметра...»</li>
          <li><em>О главном источнике погрешности:</em> «Точность результата ограничена измерением
      диаметра: его вклад составляет около 80% погрешности...»</li>
          <li><em>Об освоении методов:</em> «Освоена методика косвенных измерений с расчетом
      доверительных интервалов по распределению Стьюдента...» (как это сделать, рассказано в статье о <a
      href="/blog/student-confidence-intervals-error-calculation">доверительных интервалах и
      коэффициенте Стьюдента</a>).</li>
      </ul>
  - id: 'errors-analysis'
    title: 'Анализ погрешностей в выводе по физике'
    html: |2-
      <p>Вывод по лабораторной работе по физике обязательно сравнивает приборную и случайную
      погрешности: преподаватель проверяет, понимает ли студент их природу. Ошибка отсчета по шкале и
      класс точности прибора — систематические составляющие, а разброс повторных измерений и время
      реакции при ручном пуске секундомера — случайные.</p>
      <p>Для учебного практикума погрешность 1–5% — типичный уровень. Важнее не сама величина
      $\varepsilon$, а то, совпадает ли результат с табличным в пределах $\Delta$. Цифры в выводе
      должны точно соответствовать расчетам и данным на <a
      href="/blog/physics-lab-measurement-graphs-formatting-gost">графиках измерений в
      лабораторной</a>.</p>
  - id: 'not-matched'
    title: 'Если результат не совпал с теорией'
    html: |2-
      <p>Несовпадение с табличным значением — не повод подгонять цифры. Честный вывод с анализом
      причин оценивают выше, чем «идеальный» результат, в который преподаватель не поверит.</p>
      <ol>
          <li>Запишите расхождение числом: «$|g - g_{\text{табл}}| = 0{,}12$ м/с², что больше $\Delta g
      = 0{,}05$ м/с²; расхождение значимо».</li>
          <li>Назовите вероятную систематическую причину, которую не учитывает погрешность: трение,
      сопротивление воздуха, нагрев, сопротивление проводов, смещение нуля прибора.</li>
          <li>Оцените, может ли эта причина дать такое расхождение по знаку и порядку величины.</li>
          <li>Предложите, как ее устранить или учесть в следующем опыте.</li>
      </ol>
      <p>Если цель работы выполнена не полностью, так и напишите: «Закон проверен качественно; для
      количественной проверки нужна более точная установка».</p>
  - id: 'bad-examples'
    title: 'Топ-5 грубых ошибок в выводах студентов'
    html: |2-
      <div class="article-table-wrapper">
          <table class="article-table">
