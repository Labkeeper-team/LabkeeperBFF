sections:
  - id: 'requirements'
    title: 'С чего начать подготовку презентации'
    html: |2-
      <p>Сначала уточните, нужна ли презентация для защиты конкретной лабораторной.
      Преподаватель может принимать отчет с устными ответами без слайдов.
      Если презентация предусмотрена, узнайте формат файла, длительность выступления
      и требования к содержанию. Единого обязательного числа слайдов для всех работ нет.</p>
      <p>Презентация помогает объяснить результат, а подробный отчет сохраняет исходные
      записи, расчет и обоснования. Для подготовки самого ответа используйте
      <a href="/blog/lab-report-defense-preparation">памятку по защите лабораторной работы</a>.
      Здесь разберем отбор материала и оформление слайдов.</p>
      <div class="article-note"><strong>💡 Совет:</strong> Начните с трех предложений:
      что определяли, каким методом и что получили. Затем подберите таблицу, схему
      и формулу, которые позволяют проверить эти утверждения.</div>
  - id: 'story'
    title: 'Как выстроить слайды от цели к выводу'
    html: |2-
      <p>Составьте план по логике эксперимента. Блоки можно объединять или разделять:
      ориентируйтесь на содержание работы и время, согласованное с преподавателем.</p>
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead><tr><th>Блок</th><th>Что показать</th><th>Что объяснить устно</th></tr></thead>
              <tbody>
                  <tr><td>Цель и условия</td><td>Измеряемую величину и границы задачи.</td><td>Какой вопрос решает опыт.</td></tr>
                  <tr><td>Установка и метод</td><td>Схему подключения или описание связей, основную зависимость.</td><td>Что измеряет каждый прибор и какие допущения приняты.</td></tr>
                  <tr><td>Данные</td><td>Небольшую таблицу или график с единицами.</td><td>Откуда взяты точки и что видно в результатах.</td></tr>
                  <tr><td>Расчет и неопределенность</td><td>Один прослеживаемый расчет, исходные оценки и результат.</td><td>Какие факторы ограничивают точность.</td></tr>
                  <tr><td>Вывод</td><td>Ответ на цель и ограничения.</td><td>Что подтверждено, а что осталось непроверенным.</td></tr>
                  <tr><td>Вопросы</td><td>При необходимости — запасной слайд с расчетом или схемой.</td><td>Обоснование метода и возможных расхождений.</td></tr>
              </tbody>
          </table>
      </div>
      <p>Один слайд должен поддерживать понятный тезис. Вместо длинного пересказа теории
      покажите зависимость и условия ее применения. Исходные протоколы и большие таблицы
      оставьте в отчете или на дополнительных слайдах.</p>
  - id: 'data'
    title: 'Как показать данные и неопределенность'
    html: |2-
      <p>Укажите единицы в заголовках таблицы и на осях графика. Различайте измеренные
      точки и расчетную линию; если нанесены интервалы, поясните их смысл.
      Подробные приемы приведены в статье про
      <a href="/blog/physics-lab-measurement-graphs-formatting-gost">графики измерений</a>.</p>
      <p>В презентации ниже все данные условные: напряжения 1, 2, 3 и 5 В соответствуют
      токам 0,020, 0,041, 0,059 и 0,100 А. Для последней точки показан расчет
      $R=U/I=50$ Ом. Это пример объяснения одной оценки сопротивления,
      а не готовое доказательство линейности зависимости.</p>
      <p>Для этой точки заданы независимые стандартные неопределенности
      $u_U=0{,}05$ В и $u_I=0{,}002$ А. По формуле первого приближения получается
      $u_R\approx1{,}12$ Ом; после округления результат записывают как
      $R=(50{,}0\pm1{,}1)$ Ом. На слайде явно названы вид неопределенности и предположение
      о независимости входов. Стандартная неопределенность не означает автоматически
      интервал с вероятностью 95 %; отличие расширенной неопределенности поясняет
      <a href="https://physics.nist.gov/cuu/Uncertainty/coverage.html">руководство NIST</a>.</p>
      <p>Не подписывайте результат «закон подтвержден», если показана только одна точка.
      Для оценки линейности нужны анализ серии, учет неопределенностей и проверка модели.
      При замене данных пересчитайте формулы и обновите вывод: в примере
      учебные числа записаны вручную. Для автоматических вычислений используйте пример
      в <a href="/blog/lab-report-defense-preparation">статье о подготовке к защите</a>.</p>
  - id: 'beamer'
    title: 'Готовый пример презентации Beamer'
    html: |2-
      <p><a href="https://github.com/josephwright/beamer">Beamer</a> — класс LaTeX
      для презентаций; содержимое слайда размещают в окружении <code>frame</code>.
      Ниже — самостоятельный документ с семью слайдами 16:9.
      Все измерения и условия примера вымышлены и служат для демонстрации оформления.</p>
      <p>Скопируйте полный код в LaTeX-сегмент Labkeeper. Он содержит собственную преамбулу:
      не добавляйте перед ним <code>\documentclass{article}</code>.
      Параметр <code>14pt</code> задает базовый размер текста, а <code>T2A</code>
      и русский язык <code>babel</code> обеспечивают кириллицу в pdfLaTeX.
      Пакет <code>PTSans</code> из набора
      <a href="https://ctan.org/pkg/paratype">ParaType</a> задает масштабируемый шрифт
      с кириллицей; тема оставлена стандартной для Beamer.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX / Beamer</span></div>
          <pre><code>\documentclass[14pt,aspectratio=169]{beamer}
      \usepackage{PTSans}
      \usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[russian]{babel}
      \setbeamertemplate{navigation symbols}{}
      \setbeamertemplate{footline}[frame number]
      \setbeamerfont{frametitle}{size=\large}
      \setbeamersize{text margin left=8mm,text margin right=8mm}
      \begin{document}
      \begin{frame}{Цель и условия}
          \textbf{Определение сопротивления резистора}
          \begin{itemize}
              \item Цель: оценить сопротивление по напряжению и току.
              \item Модель: $R=U/I$ для выбранного режима измерения.
              \item Условия: установившийся ток, температура считается постоянной.
          \end{itemize}
          \alert{Учебный пример: все данные вымышлены.}
      \end{frame}

      \begin{frame}{Установка и метод}
          \begin{itemize}
              \item Амперметр включен последовательно с резистором.
              \item Вольтметр подключен параллельно резистору.
              \item Снимаются пары $U$ и $I$ при разных напряжениях.
          \end{itemize}
          В этой упрощенной модели влияние приборов на цепь считается
          пренебрежимо малым. В реальном опыте это допущение нужно обосновать.
      \end{frame}

      \begin{frame}{Учебные данные}
          \begin{center}
              \begin{tabular}{c|rrrr}
                  $U$, В &amp; 1 &amp; 2 &amp; 3 &amp; 5 \\
                  \hline
                  $I$, А &amp; 0,020 &amp; 0,041 &amp; 0,059 &amp; 0,100
              \end{tabular}
          \end{center}
          Для подробного расчета выбрана последняя точка.

          Таблица показывает исходные пары. Проверка линейности
          требует отдельного анализа всей серии.
      \end{frame}

      \begin{frame}{Расчет в выбранной точке}
          \[
              U=5\text{ В},\qquad I=0{,}100\text{ А}
          \]
          \[
              R=\frac{U}{I}=\frac{5}{0{,}100}=50\text{ Ом}
          \]
          Это оценка сопротивления в одном режиме.
          Одна точка не подтверждает линейность $I(U)$.
      \end{frame}

      \begin{frame}{Стандартная неопределенность}
          Для выбранной точки заданы независимые входы:
          \[
              u_U=0{,}05\text{ В},\qquad u_I=0{,}002\text{ А}.
          \]
          В первом приближении:
          \[
              u_R=\sqrt{\left(\frac{u_U}{I}\right)^2+
              \left(\frac{Uu_I}{I^2}\right)^2}\approx1{,}12\text{ Ом}.
          \]
          Это стандартная неопределенность, а не интервал с вероятностью 95\%.
      \end{frame}

      \begin{frame}{Вывод и ограничения}
          \begin{itemize}
              \item Результат в выбранной точке: $R=(50{,}0\pm1{,}1)$ Ом ($\pm u_R$).
              \item Условия оценки: независимые входы и принятая модель цепи.
              \item Линейность всей серии и влияние нагрева здесь не оценивались.
          \end{itemize}
      \end{frame}

      \begin{frame}{Вопросы для обсуждения}
          \begin{enumerate}
              \item Как оценено влияние приборов на измеряемую цепь?
              \item Как проверить линейность по серии точек?
              \item Какие измерения помогут оценить влияние нагрева?
          \end{enumerate}
      \end{frame}
      \end{document}</code></pre>
      </div>
      <p>Кнопка «Просмотреть пример» открывает приведенную выше полную презентацию
      из семи слайдов: с исходными данными,
      расчетом, неопределенностью и ограничениями вывода.</p>
      <p>В редакторе каждый слайд находится в отдельном LaTeX-сегменте.
      Общая преамбула и <code>\begin{document}</code> вынесены в первый служебный сегмент,
      а <code>\end{document}</code> — в последний. Между ними можно редактировать
      и переставлять семь сегментов с окружениями <code>frame</code>.</p>
      <p>Для своей защиты добавьте название работы, ФИО и группу по требованиям
      преподавателя, замените условные данные и описание установки реальными.
      Если блок не помещается, разделите его на два слайда. Не уменьшайте весь текст
      ради переноса страницы отчета в презентацию.</p>
  - id: 'rehearsal'
    title: 'Репетиция и ответы на вопросы'
    html: |2-
      <p>Откройте PDF в режиме показа и расскажите работу, переходя между слайдами.
      На таблице поясните выбор точки, на формуле — происхождение величин,
      на выводе — связь результата с целью. Измерьте длительность репетиции
      и уберите второстепенные подробности, если не укладываетесь в заданное время.</p>
      <p>Подготовьте пояснения к допущениям, единицам, оценкам неопределенности
      и возможным причинам расхождения. Если причина не проверена, назовите ее гипотезой
      и предложите способ проверки. Удобно держать дополнительные расчеты после
      основного вывода, чтобы открыть их по вопросу преподавателя.</p>
      <p>Сформулировать итог опыта поможет статья про
      <a href="/blog/how-to-write-lab-report-conclusion-examples">вывод к лабораторной работе</a>.
      Удачная презентация делает ход рассуждения понятным, а оценка зависит
      от требований занятия, содержания работы и ваших ответов.</p>
  - id: 'checklist'
    title: 'Проверка PDF перед выступлением'
    html: |2-
      <ul>
          <li>Состав слайдов и формат файла соответствуют требованиям преподавателя.</li>
          <li>Цель, единицы, обозначения и числа совпадают с итоговым отчетом.</li>
          <li>На графиках различимы оси, точки и смысл интервалов; таблицы читаются без увеличения.</li>
          <li>Формулы и текст не выходят за границы слайдов, длинные названия не обрезаны.</li>
          <li>Вид неопределенности и условия применения модели названы явно.</li>
          <li>Вывод не утверждает больше, чем позволяют данные и проведенный анализ.</li>
          <li>PDF проверен на устройстве для выступления или при сопоставимом размере показа.</li>
      </ul>
      <p>Сохраните итоговую версию PDF вместе с исходником. Если после репетиции
      изменились данные или формулы, обновите и отчет, и презентацию, затем проверьте
      их согласованность еще раз.</p>
tips:
  - title: 'Дайте слайду понятную задачу'
    html: |2-
      <p>Перед добавлением таблицы или формулы сформулируйте, какой вопрос она помогает
      объяснить. Если связь с выступлением неясна, материал лучше оставить в отчете.</p>
  - title: 'Проверяйте читаемость целого слайда'
    html: |2-
      <p>Оцените PDF в режиме показа, а не только увеличенный фрагмент в редакторе.
      Номера осей, индексы и подписи должны оставаться различимыми вместе с основным текстом.</p>
