sections:
  - id: 'task'
    title: 'Сформулируйте вопрос до запроса'
    html: |2-
      <p>В отчёте по базам данных одного листинга SQL недостаточно: читателю нужны исходные записи, результат выполнения и объяснение того, что он означает. Покажем эту связь на небольшом наборе, который можно восстановить в пустой базе SQLite.</p>
      <p>Все данные вымышленные. Требуется найти число сданных работ и средний балл по каждой группе, у которой есть работы, затем расположить группы по убыванию среднего. Это проверка выборки и агрегирования, а не оценка качества обучения. Настройку шрифтов и нумерации кода см. отдельно в статье о <a href="/blog/programming-lab-report-code-listings-gost">листингах в отчёте</a>.</p>
  - id: 'setup'
    title: 'Создайте воспроизводимые учебные данные'
    html: |2-
      <p>В новой пустой базе SQLite выполните следующий скрипт один раз. <code>groups.id</code> идентифицирует группу; <code>submissions.group_id</code> связывает работу с группой. Одна строка второй таблицы — одна работа, <code>score</code> задан в баллах и не допускает NULL.</p>
      <div class="article-code"><div class="article-code__header"><span class="article-code__lang">SQL</span></div><pre><code>CREATE TABLE groups (
        id INTEGER PRIMARY KEY, name TEXT NOT NULL
      );
      CREATE TABLE submissions (
        id INTEGER PRIMARY KEY,
        group_id INTEGER NOT NULL REFERENCES groups(id),
        score INTEGER NOT NULL
      );
      INSERT INTO groups VALUES (1, 'A'), (2, 'B'), (3, 'C');
      INSERT INTO submissions VALUES
        (1, 1, 4), (2, 1, 6), (3, 2, 8);</code></pre></div>
      <p>Группа A имеет две работы с баллами 4 и 6, B — одну с 8 баллами, C — ни одной. При повторном запуске используйте новую пустую учебную базу: скрипт не удаляет существующие таблицы. Названия A, B, C — условные обозначения, не персональные данные студентов.</p>
  - id: 'query'
    title: 'Свяжите таблицы и сгруппируйте работы'
    html: |2-
      <p>Запрос ниже вернёт по одной строке для каждой группы со сданными работами:</p>
      <div class="article-code"><div class="article-code__header"><span class="article-code__lang">SQL</span></div><pre><code>SELECT g.name AS group_name,
             COUNT(s.id) AS submission_count,
             AVG(s.score) AS mean_score
      FROM groups AS g
      JOIN submissions AS s ON s.group_id = g.id
      GROUP BY g.id, g.name
      ORDER BY mean_score DESC, g.name ASC;</code></pre></div>
      <p><code>JOIN ... ON</code> связывает записи по ключу; <code>GROUP BY</code> объединяет работы одной группы. <code>COUNT(s.id)</code> считает работы, <code>AVG(s.score)</code> вычисляет средний балл. В выборке нет неагрегированных полей вне группировки. По <a href="https://www.sqlite.org/lang_select.html">правилам SELECT в SQLite</a> порядок строк задаётся <code>ORDER BY</code>; второй ключ сохраняет определённый порядок при равных средних.</p>
      <p>Здесь <code>JOIN</code> означает внутреннее соединение: группа C без работ не попадёт в результат. Если задание требует все группы, нужен другой запрос с <code>LEFT JOIN</code>; при нём важно считать <code>s.id</code>, а не <code>COUNT(*)</code>, и отдельно трактовать отсутствующее среднее. Не подменяйте отсутствие работ нулевым средним баллом.</p>
  - id: 'result'
    title: 'Проверьте таблицу и сформулируйте вывод'
    html: |2-
      <p>Результат запроса приведён в таблице 1. Английские имена столбцов совпадают с псевдонимами в SQL, единица среднего балла указана отдельно.</p>
      <p>Таблица 1 — Сводка по сданным работам</p>
      <div class="article-table-wrapper"><table class="article-table"><thead><tr><th>group_name</th><th>submission_count</th><th>mean_score, баллы</th></tr></thead><tbody><tr><td>B</td><td>1</td><td>8.0</td></tr><tr><td>A</td><td>2</td><td>5.0</td></tr></tbody></table></div>
      <p>Проверка вручную: для A среднее равно (4 + 6) / 2 = 5, для B — 8 / 1 = 8. Сумма количеств равна трём исходным работам. Группы C нет именно из-за внутреннего соединения, а не из-за ошибки сортировки.</p>
      <p>Вывод для отчёта: «На учебной выборке средний балл сданных работ группы B равен 8, группы A — 5. В группе B учтена одна работа, в A — две; сравнение не позволяет заключить, что группа B в целом подготовлена лучше». О том, как связывать наблюдение с ограничениями выборки, см. <a href="/blog/experiment-results-analysis-lab-report">анализ результатов эксперимента</a>.</p>
      <div class="article-note"><p>«Просмотреть пример» открывает фрагмент лабораторного отчёта в LaTeX с тем же скриптом, запросом и таблицей. SQL внутри listings не исполняется. Выполните его отдельно в SQLite, затем при изменении данных вручную обновите таблицу и вывод. В PDF средние записаны с десятичной запятой: 8,0 и 5,0.</p></div>
      <p>Пример — фрагмент лабораторного отчёта без титульного листа. В LaTeX настроены A4, поля 30/15/20/20 мм, основной шрифт 14 пт, полуторный интервал, абзац 1,25 см, подпись таблицы сверху и ссылка перед ней. Это применение правил оформления отчёта к представленным объектам; требования к лабораторной сверяйте с методичкой кафедры. Для варианта Markdown начните с <a href="/blog/markdown-code-syntax-highlighting">блоков кода с подсветкой</a>. Сохраните указание СУБД, исходные данные и условия отбора: без них снимок результата нельзя воспроизвести.</p>
