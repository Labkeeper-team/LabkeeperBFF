      \lstset{language=SQL,basicstyle=\ttfamily\normalsize,columns=fullflexible,keepspaces=true,breaklines=true,showstringspaces=false}
      \begin{document}
      \textbf{SQL-запрос, результат и объяснение}

      Все данные вымышленные. Одна строка submissions --- одна сданная работа;
      score --- число баллов. Следующий скрипт выполняют один раз в новой пустой
      базе SQLite. Код в этом документе не исполняется.
      \begin{lstlisting}
      CREATE TABLE groups (
        id INTEGER PRIMARY KEY, name TEXT NOT NULL
      );
      CREATE TABLE submissions (
        id INTEGER PRIMARY KEY,
        group_id INTEGER NOT NULL REFERENCES groups(id),
        score INTEGER NOT NULL
      );
      INSERT INTO groups VALUES (1, 'A'), (2, 'B'), (3, 'C');
      INSERT INTO submissions VALUES
        (1, 1, 4), (2, 1, 6), (3, 2, 8);
      \end{lstlisting}
      Группа A имеет две работы с баллами 4 и 6, B --- одну с 8 баллами,
      C --- ни одной. Найдём число работ и средний балл для групп со сданными работами.
      \begin{lstlisting}
      SELECT g.name AS group_name,
             COUNT(s.id) AS submission_count,
             AVG(s.score) AS mean_score
      FROM groups AS g
      JOIN submissions AS s ON s.group_id = g.id
      GROUP BY g.id, g.name
      ORDER BY mean_score DESC, g.name ASC;
      \end{lstlisting}
      \clearpage
      JOIN связывает работы с группой, GROUP BY формирует одну строку на группу.
      COUNT считает работы, AVG находит среднее. ORDER BY сортирует по убыванию
      среднего, затем по имени. Результат приведён в таблице~\ref{tab:sql}.
      \par
      \begin{table}[!ht]
      \caption{Сводка по сданным работам}\label{tab:sql}
      \centering
      \renewcommand{\arraystretch}{1.25}
      \begin{tabularx}{\textwidth}{|>{\raggedright\arraybackslash}X|r|r|}
      \hline
      \multicolumn{1}{|c|}{Группа} & \multicolumn{1}{c|}{Число работ} & \multicolumn{1}{c|}{Средний балл} \\
      \hline
      B & 1 & 8{,}0 \\
      A & 2 & 5{,}0 \\
      \hline
      \end{tabularx}
      \end{table}
      \par
      Проверка: для A среднее равно $(4+6)/2=5$, для B --- $8/1=8$;
      число работ $2+1=3$. Группы C нет: внутреннее соединение оставляет
      только группы со сданными работами.

      На учебной выборке средний балл сданных работ B выше, но в B учтена
      одна работа, в A --- две. Это не доказывает превосходства группы в целом.
      После изменения данных выполните запрос отдельно в SQLite и вручную
      обновите таблицу и вывод. Это фрагмент лабораторного отчёта без титульного листа.
      \end{document}
