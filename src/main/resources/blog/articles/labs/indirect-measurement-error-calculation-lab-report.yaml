sections:
  - id: 'direct-vs-indirect'
    title: 'Прямые и косвенные измерения: в чем разница'
    html: |2-
      <p>В лабораторном практикуме большинство физических величин невозможно измерить одним прибором
      напрямую. При <strong>прямом измерении</strong> значение считывается со шкалы прибора (длина
      линейкой, время секундомером, масса весами). При <strong>косвенном измерении</strong> искомая
      величина $y$ вычисляется по известной зависимости из нескольких напрямую измеренных аргументов: $y
      = f(x_1, x_2, \dots, x_n)$.</p>
      <p>Каждый аргумент $x_i$ содержит свою погрешность $\Delta x_i$, и эти погрешности переносятся на
      результат. Эта статья — о переносе погрешностей на косвенную величину. Как найти саму $\Delta
      x_i$ по серии прямых измерений (среднее, СКО, коэффициент Стьюдента), рассказано в статье о <a
      href="/blog/student-confidence-intervals-error-calculation">доверительных интервалах и расчете
      погрешностей прямых измерений</a>. Как показать результат на графике, читайте в статье о <a
      href="/blog/physics-lab-measurement-graphs-formatting-gost">графиках измерений с крестами
      погрешностей</a>.</p>
  - id: 'math-theory'
    title: 'Формула погрешности косвенных измерений'
    html: |2-
      <p>Абсолютная погрешность косвенного измерения при независимых случайных погрешностях
      аргументов равна корню из суммы квадратов частных производных, умноженных на погрешности
      аргументов:</p>
      <p>$$\Delta y = \sqrt{\left(\frac{\partial f}{\partial x_1}\Delta x_1\right)^2 +
      \left(\frac{\partial f}{\partial x_2}\Delta x_2\right)^2 + \dots + \left(\frac{\partial
      f}{\partial x_n}\Delta x_n\right)^2}$$</p>
      <p>Код этой формулы для отчета:</p>
      <div class="article-code">
          <div class="article-code__header"><span
      class="article-code__lang">Формула погрешности, LaTeX</span></div>
          <pre><code>\Delta y = \sqrt{ \left( \frac{\partial f}{\partial x_1} \Delta x_1 \right)^2 + \left( \frac{\partial f}{\partial x_2} \Delta x_2 \right)^2 + \dots + \left( \frac{\partial f}{\partial x_n} \Delta x_n \right)^2 }</code></pre>
      </div>
      <p>Если погрешности не случайные, а предельные приборные, и методичка требует оценку «сверху»,
      используют линейную сумму модулей: $\Delta y = \sum_{i=1}^n \left| \frac{\partial f}{\partial
      x_i} \right| \Delta x_i$. Эта оценка всегда больше квадратичной, поэтому в отчете указывают,
      какой способ выбран.</p>
      <h3>Когда квадратичное сложение корректно</h3>
      <p>Складывать квадраты можно, если все $\Delta x_i$ взяты при одной доверительной вероятности
      (например, $P = 0{,}95$) или все являются стандартными неопределенностями. Приборную погрешность
      в стандартную переводят как $u = \Delta_{\text{пр}}/\sqrt{3}$. Случайную и приборную погрешности
      одной величины складывают так: $\Delta x = \sqrt{\Delta_{\text{сл}}^2 + \Delta_{\text{пр}}^2}$.
      Подробно об этом в статье о <a href="/blog/student-confidence-intervals-error-calculation">коэффициенте
      Стьюдента и доверительных интервалах</a>.</p>
      <h3>Пример на частные производные: фокусное расстояние линзы</h3>
      <p>Фокусное расстояние тонкой линзы находят по расстояниям до предмета $a$ и до изображения $b$:
      $f = \dfrac{ab}{a + b}$. Каждая переменная входит и в числитель, и в знаменатель, поэтому
      логарифмирование здесь не упрощает расчет. Частные производные:</p>
      <p>$$\frac{\partial f}{\partial a} = \frac{b^2}{(a+b)^2}, \qquad \frac{\partial f}{\partial b}
      = \frac{a^2}{(a+b)^2}.$$</p>
      <p>Пусть $a = (30{,}0 \pm 0{,}2)$ см, $b = (60{,}0 \pm 0{,}5)$ см. Тогда $f = 1800/90 = 20{,}0$ см,
      $\partial f/\partial a = 3600/8100 \approx 0{,}444$, $\partial f/\partial b = 900/8100 \approx
      0{,}111$, и</p>
      <p>$$\Delta f = \sqrt{(0{,}444 \cdot 0{,}2)^2 + (0{,}111 \cdot 0{,}5)^2} = \sqrt{0{,}0889^2 +
      0{,}0556^2} \approx 0{,}10\text{ см}.$$</p>
      <p>Результат: $f = (20{,}00 \pm 0{,}10)$ см, $\varepsilon_f \approx 0{,}5\%$. Если бы погрешности
      числителя $ab$ и знаменателя $a + b$ сложили как независимые, получилось бы около $0{,}24$ см, то
      есть в 2,3 раза больше: числитель и знаменатель зависят от одних и тех же $a$ и $b$.</p>
  - id: 'functions-table'
    title: 'Погрешности типовых функций: таблица'
    html: |2-
      <p>Для простых зависимостей формулу погрешности не нужно выводить каждый раз. Ниже формулы для
      независимых случайных погрешностей аргументов; $\varepsilon = \Delta y / |y|$ — относительная
      погрешность.</p>
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead>
                  <tr>
                      <th>Функция</th>
                      <th>Абсолютная погрешность $\Delta y$</th>
                      <th>Относительная погрешность $\varepsilon_y$</th>
                  </tr>
              </thead>
              <tbody>
                  <tr>
                      <td>$y = a \pm b$</td>
                      <td>$\sqrt{\Delta a^2 + \Delta b^2}$</td>
                      <td>$\Delta y / |a \pm b|$</td>
                  </tr>
                  <tr>
                      <td>$y = ca$, $c$ — точная константа</td>
                      <td>$|c|\,\Delta a$</td>
                      <td>$\varepsilon_a$</td>
                  </tr>
                  <tr>
                      <td>$y = ab$ или $y = a/b$</td>
                      <td>$|y|\,\varepsilon_y$</td>
                      <td>$\sqrt{\varepsilon_a^2 + \varepsilon_b^2}$</td>
                  </tr>
                  <tr>
                      <td>$y = a^n$</td>
                      <td>$|n a^{n-1}|\,\Delta a$</td>
                      <td>$|n|\,\varepsilon_a$</td>
                  </tr>
                  <tr>
                      <td>$y = \ln a$</td>
                      <td>$\Delta a / a = \varepsilon_a$</td>
                      <td>$\varepsilon_a / |\ln a|$</td>
                  </tr>
                  <tr>
                      <td>$y = e^{a}$</td>
                      <td>$e^{a}\,\Delta a$</td>
                      <td>$\Delta a$</td>
                  </tr>
                  <tr>
                      <td>$y = \sin a$</td>
                      <td>$|\cos a|\,\Delta a$ ($\Delta a$ в радианах)</td>
                      <td>$|\cot a|\,\Delta a$</td>
                  </tr>
              </tbody>
          </table>
      </div>
      <p>Для разности близких величин относительная погрешность резко растет: если $a = 10{,}0 \pm
      0{,}1$ и $b = 9{,}5 \pm 0{,}1$, то $y = 0{,}5 \pm 0{,}14$, то есть $\varepsilon_y \approx 28\%$.
      Такие формулы стоит заменять, если методика это позволяет.</p>
  - id: 'log-trick'
    title: 'Логарифмирование для формул-произведений'
    html: |2-
      <p>Если расчетная формула состоит только из произведений, дробей и степеней (например, $y =
      \frac{a^2 \cdot b}{\sqrt{c}}$), расчет через производные громоздок. Проще сначала найти
      <strong>относительную погрешность $\varepsilon_y$ через натуральный логарифм</strong>:</p>
      <ol>
          <li>Прологарифмировать выражение: $\ln y = 2\ln a + \ln b - \frac{1}{2}\ln c$;</li>
          <li>Для независимых случайных погрешностей сложить квадраты коэффициентов при логарифмах,
      умноженных на относительные погрешности: $\varepsilon_y = \sqrt{(2\varepsilon_a)^2 +
      \varepsilon_b^2 + \left(\frac{1}{2}\varepsilon_c\right)^2}$. Для предельной оценки берут модули
      коэффициентов при логарифмах и складывают линейно: $\varepsilon_y = 2\varepsilon_a +
      \varepsilon_b + \frac{1}{2}\varepsilon_c$;</li>
          <li>Найти абсолютную погрешность умножением: $\Delta y = y \cdot \varepsilon_y$.</li>
      </ol>
  - id: 'step-by-step'
    title: 'Пример расчета: плотность цилиндра'
    html: |2-
      <p>Разберем, как посчитать погрешность косвенного измерения, на примере плотности твердого
      тела:</p>
      <div class="article-quote">
          <p><strong>Пример расчета:</strong><br>
          Формула плотности цилиндра: $\rho = \frac{m}{V} = \frac{4m}{\pi d^2 h}$, где масса $m =
      (124{,}50 \pm 0{,}05)\text{ г}$, диаметр $d = (20{,}12 \pm 0{,}02)\text{ мм}$, высота $h =
      (50{,}34 \pm 0{,}05)\text{ мм}$.<br><br>
          1. Среднее значение плотности: $\rho = \frac{4 \cdot 0{,}1245}{\pi \cdot (0{,}02012)^2
      \cdot 0{,}05034} \approx 7778{,}8\text{ кг/м}^3$.<br>
          2. Относительная погрешность:<br>
          $$\varepsilon_\rho = \sqrt{\left(\frac{\Delta m}{m}\right)^2 +
      \left(2\frac{\Delta d}{d}\right)^2 + \left(\frac{\Delta h}{h}\right)^2} = \sqrt{(0{,}000402)^2 +
      (0{,}001988)^2 + (0{,}000993)^2} \approx 0{,}00226$$ ($0{,}23\%$).<br>
          3. Абсолютная погрешность: $\Delta \rho = \rho \cdot \varepsilon_\rho \approx 7778{,}8 \cdot
      0{,}00226 \approx 17{,}6\text{ кг/м}^3$.</p>
      </div>
      <p>Те же числа удобнее показать в отчете таблицей. Последний столбец — доля слагаемого в
      $\varepsilon_\rho^2$:</p>
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead>
                  <tr>
                      <th>Величина</th>
                      <th>Значение</th>
                      <th>Погрешность</th>
                      <th>Слагаемое в $\varepsilon_\rho$</th>
                      <th>Вклад</th>
                  </tr>
              </thead>
              <tbody>
                  <tr>
                      <td>$m$</td>
                      <td>124,50 г</td>
                      <td>0,05 г</td>
                      <td>$\Delta m/m = 0{,}040\%$</td>
                      <td>3%</td>
                  </tr>
                  <tr>
                      <td>$d$</td>
                      <td>20,12 мм</td>
                      <td>0,02 мм</td>
                      <td>$2\Delta d/d = 0{,}199\%$</td>
                      <td>78%</td>
                  </tr>
                  <tr>
                      <td>$h$</td>
                      <td>50,34 мм</td>
                      <td>0,05 мм</td>
                      <td>$\Delta h/h = 0{,}099\%$</td>
                      <td>19%</td>
                  </tr>
              </tbody>
          </table>
      </div>
      <p>Из таблицы видно главное для вывода: точность ограничена измерением диаметра. Слагаемое,
      которое меньше трети наибольшего, обычно можно не учитывать: вклад массы ($0{,}04\%$ против
      $0{,}20\%$) пренебрежимо мал.</p>
      <p>Для сравнения линейная (предельная) оценка на тех же данных: $\varepsilon_{\text{лин}} =
      0{,}040\% + 0{,}199\% + 0{,}099\% \approx 0{,}338\%$ и $\Delta\rho \approx 26$ кг/м³ против 18 кг/м³
      при квадратичном сложении. Поэтому методички просят выбрать один способ и указать в отчете,
      какой именно.</p>
      <p>В примере для редактора эти данные переведены в СИ и вынесены в вычислительный сегмент.
      Оператор <code>#</code> задает стандартную неопределенность исходных величин, а погрешность
      плотности вычисляется автоматически для независимых измерений. Измените исходные данные и
      запустите расчет: значения в LaTeX-документе обновятся через подстановки. Новый проект округляет
      значение и погрешность до трех значащих цифр, поэтому редактор покажет результат вида
      <code>7780 ± 17.6</code>. Режим «Первая значащая цифра погрешности» даст <code>7780 ± 20</code>,
      а режим «Первые N значащих цифр погрешности» с N = 2 — запись <code>7779 ± 18</code>, как в
      правиле ниже. Подробнее: <a href="/wiki/language/rounding.html">округление в вики</a> и <a
      href="/wiki/language/syntax.html">синтаксис вычислительного языка</a>. Итоговую запись
      переносят в раздел расчетов <a href="/blog/ideal-lab-report-template-gost-online">шаблона отчета
      по лабораторной работе</a>.</p>
  - id: 'report-formatting'
    title: 'Правила округления и запись расчета в отчете'
    html: |2-
      <p>При оформлении расчета погрешностей в отчете соблюдайте правило округления, которое методички
      приводят со ссылкой на рекомендацию МИ 1317-2004 и учебную традицию. ГОСТ 8.207-76 отменен:
      обработку прямых многократных измерений сейчас описывает ГОСТ Р 8.736-2011, и по нему погрешность
      результата выражают не более чем двумя значащими цифрами.</p>
      <ul>
          <li>Погрешность $\Delta y$ округляется до <strong>одной значащей цифры</strong> (если первая
      цифра от 3 до 9) или до <strong>двух значащих цифр</strong> (если первая цифра 1 или 2). В нашем
      примере: $\Delta \rho \approx 17{,}6 \approx 18\text{ кг/м}^3$;</li>
          <li>Сам результат округляется до того же десятичного разряда, что и погрешность: $\rho =
      (7779 \pm 18)\text{ кг/м}^3$;</li>
          <li>Обязательно приводится относительная погрешность в процентах: $\varepsilon = 0{,}23\%$;</li>
          <li>При больших и малых числах общий множитель выносят за скобки: $\rho = (7{,}779 \pm
      0{,}018) \cdot 10^3$ кг/м³.</li>
      </ul>
      <p>Многострочный расчет удобно набрать в окружении <code>align*</code> из пакета
      <code>amsmath</code>: знаки равенства выравниваются по вертикали.</p>
      <div class="article-code">
          <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
          <pre><code>\begin{align*}
      \varepsilon_\rho &amp;= \sqrt{\left(\frac{\Delta m}{m}\right)^2+\left(2\frac{\Delta d}{d}\right)^2+\left(\frac{\Delta h}{h}\right)^2}\\
      &amp;= \sqrt{(4{,}0\cdot10^{-4})^2+(2{,}0\cdot10^{-3})^2+(9{,}9\cdot10^{-4})^2}\approx 2{,}26\cdot10^{-3},\\
      \Delta\rho &amp;= \rho\,\varepsilon_\rho \approx 7779\cdot 2{,}26\cdot10^{-3}\approx 18~\text{кг/м}^3,\\
      \rho &amp;= (7779\pm18)~\text{кг/м}^3,\quad \varepsilon_\rho = 0{,}23\,\%.
      \end{align*}</code></pre>
      </div>
      <p>Запись результата через <code>\qty</code> с десятичной запятой разобрана в статье о <a
      href="/blog/latex-siunitx">пакете siunitx</a>, а общие приемы набора формул — в статье о <a
      href="/blog/latex-formulas">формулах в LaTeX</a>.</p>
      <h3>Готовые лабораторные с расчетом погрешностей</h3>
      <p>Чтобы увидеть весь расчет в контексте отчета, откройте готовую работу из витрины: <a
      href="/templates/pogreshnosti-udelnoe-soprotivlenie">«Систематические и случайные
      погрешности»</a> (удельное сопротивление нихрома) или <a
      href="/templates/statisticheskaya-obrabotka-izmerenii">«Статистическая обработка многократных
      измерений»</a>.</p>
  - id: 'faq'
    title: 'Частые вопросы'
    html: |2-
      <h3>Чем отличается погрешность прямого и косвенного измерения?</h3>
      <p>Погрешность прямого измерения находят по прибору и разбросу повторных отсчетов. Погрешность
      косвенного измерения не измеряют, а вычисляют из погрешностей аргументов по формуле переноса
      погрешностей.</p>
      <h3>Когда складывать погрешности линейно, а когда квадратично?</h3>
      <p>Квадратично — для независимых случайных погрешностей, взятых при одной доверительной
      вероятности. Линейно — когда нужна гарантированная предельная оценка, например для приборных
      погрешностей, если этого требует методичка.</p>
      <h3>Сколько значащих цифр оставлять у погрешности?</h3>
      <p>Одну, если первая цифра от 3 до 9, и две, если первая цифра 1 или 2. Результат округляют до
      того же разряда, что и погрешность.</p>
      <h3>Как учесть погрешность табличной константы ($\pi$, $g$)?</h3>
      <p>Константу берут с таким числом знаков, чтобы ее относительная погрешность была хотя бы в 10
      раз меньше погрешности результата. Тогда ее вклад пренебрежимо мал и в формулу погрешности ее не
      включают.</p>
tips:
  - title: 'Сначала вычисляйте формулу в общем виде'
    html: |2-
      <p>Преподаватели требуют сначала вывести символьную формулу погрешности через производные, и
      только затем подставлять численные значения измерений. В Labkeeper это умеет сам вычислительный
      сегмент: в его настройках включите показ общей формулы погрешности и формулы погрешности с
      подставленными числами.</p>
  - title: 'Называйте главный источник погрешности'
    html: |2-
      <p>Таблица вкладов из примера выше — готовая фраза для вывода: «Точность результата ограничена
      измерением диаметра (78% квадрата относительной погрешности)».</p>
editorExample:
  compute: |2-
    // Масса, кг; диаметр и высота, м
    m = 0.12450 # 0.00005
    d = 0.02012 # 0.00002
    h = 0.05034 # 0.00005
    rho = 4 * m / (pi * d^2 * h)
  latex: |2-
    \section*{Плотность цилиндра}
    \[\rho=\frac{4m}{\pi d^2h}\]
    $\rho = ${rho}$~кг/м\textsuperscript{3}.
