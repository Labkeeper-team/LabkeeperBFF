sections:
  - id: 'task'
    title: 'Проверяйте отчёт в три прохода'
    html:
      '<p>Аккуратный PDF может содержать неверный перевод единиц, а правильный расчёт — потеряться в таблице без обозначений. Поэтому перед сдачей проверяйте отдельно содержание, вычисления и итоговый файл.</p>

      <p>Сначала возьмите задание и методичку: они определяют состав учебного отчёта. <a href="https://mpei.ru/Science/ScienceDocuments/Documents/0_GOST_7.32-2017.pdf" target="_blank" rel="noopener noreferrer">ГОСТ 7.32-2017</a> относится к отчётам о НИР; для лабораторной применимость его правил уточняют на кафедре. Если документ ещё не собран, начните с <a href="/blog/ideal-lab-report-template-gost-online">структуры лабораторного отчёта</a>.</p>

      <p>Ниже — ручной чек-лист в Markdown. Он помогает последовательно проверить работу, но не анализирует загруженный отчёт и не обнаруживает автоматически пропущенные разделы. Каждую отметку ставит автор после проверки.</p>'
  - id: 'content'
    title: 'Первый проход: цель, данные и условия'
    html:
      '<p>Сопоставьте разделы с заданием и проследите происхождение каждого числа. В таблице должно быть понятно, что записано непосредственно по прибору, а что вычислено позже. Не выдавайте данные из примера методички за собственные измерения.</p><div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Объект проверки</th><th>Признак, что нужна правка</th></tr></thead><tbody><tr><td>Цель и метод</td><td>Из текста нельзя понять, какую величину определяли и каким способом</td></tr>

      <tr><td>Исходные записи</td><td>Есть числа без единиц, условий или источника</td></tr>

      <tr><td>Таблица</td><td>В одном столбце смешаны исходные показания и расчётные результаты</td></tr>

      <tr><td>Рисунок</td><td>Оси не подписаны или непонятно, что означает линия</td></tr>

      <tr><td>Источники</td><td>В тексте есть заимствованная формула или данные без отсылки</td></tr></tbody></table></div><p>Для измерений проверьте диапазон и характеристики приборов, условия опыта и принятые допущения. Если часть сведений отсутствует, восстановите её по исходным записям или уточните у преподавателя; не заполняйте пробелы вымышленными значениями. Организация данных разобрана в статье о <a href="/blog/lab-measurement-data-tables-errors">таблицах измерений</a>.</p>'
  - id: 'calculations'
    title: 'Второй проход: воспроизведите один результат'
    html:
      '<p>Выберите один итог и повторите путь от исходной записи до вывода. Так легче обнаружить неверную единицу, подстановку не из той строки и результат, оставшийся от предыдущей версии расчёта.</p>

      <p>Рассмотрим вымышленную проверку: путь 60 см, время 12 с. После перевода 60 см = 0,60 м отношение пути ко времени равно 0,050 м/с. Запись «60 / 12 = 5 м/с» теряет перевод сантиметров в метры. Число 0,050 здесь показывает арифметику; точность реального результата нельзя назначить без сведений об измерениях.</p>

      <ol><li>Сверьте исходные значения с журналом, а единицы приведите к согласованной системе.</li><li>Проверьте зависимость и её применимость к условиям работы.</li><li>Повторите подстановку и сравните результат с таблицей, графиком и выводом.</li><li>Уточните, дана ли граница погрешности, стандартная неопределённость или иной интервал.</li><li>Округлите окончательную запись по принятому правилу, сохранив исходные данные для проверки.</li></ol>

      <p>Не приписывайте интервалу вероятность 95% только из-за знака «±». Различия оценок и вычисления разобраны в материалах о <a href="/blog/indirect-measurement-error-calculation-lab-report">косвенных измерениях</a> и <a href="/blog/student-confidence-intervals-error-calculation">доверительных интервалах</a>.</p>'
  - id: 'pdf'
    title: 'Третий проход: откройте окончательный PDF'
    html:
      '<p>После последнего изменения пересоберите документ и обновите ссылки. Просмотрите все страницы: исходный код с правильными настройками ещё не гарантирует, что таблица поместилась, рисунок не прижат к тексту, а формула осталась рядом с пояснениями.</p>

      <ul><li><strong>Таблицы и рисунки:</strong> до объекта есть ссылка, подпись находится на нужной стороне, номер соответствует ссылке.</li><li><strong>Отступы:</strong> отдельно проверены переход от текста к верхней границе объекта и переход от подписи к следующему абзацу.</li><li><strong>Формулы:</strong> номера обновлены, символы и единицы пояснены в порядке появления.</li><li><strong>Вёрстка:</strong> нет обрезанных таблиц, наложений, потерянных строк и необъяснённых пустых страниц.</li><li><strong>Завершённость:</strong> заполнены реквизиты, удалены подсказки, знаки <code>??</code> и устаревшие числа.</li></ul>

      <p>Вывод должен назвать результат и его ограничения, а не только сообщить, что цель достигнута. Содержательные примеры есть в статье о <a href="/blog/how-to-write-lab-report-conclusion-examples">выводах лабораторной работы</a>.</p>'
  - id: 'checklist'
    title: 'Рабочий чек-лист в Markdown'
    html:
      '<p>Скопируйте список в отдельный Markdown-сегмент или откройте его кнопкой. Оставьте только применимые пункты, добавьте требования преподавателя и отмечайте выполненное заменой <code>[ ]</code> на <code>[x]</code> в исходнике.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">Markdown</span></div>

      <pre><code># Проверка лабораторного отчёта перед сдачей


      Рабочий чек-лист: отметки ставит автор после проверки.


      ## Содержание и исходные данные


      - [ ] Состав отчёта сверен с заданием и методичкой.

      - [ ] Указаны цель, метод и условия работы.

      - [ ] Все исходные данные имеют обозначения, единицы и источник.

      - [ ] Учебные данные отделены от собственных измерений.


      ## Расчёты и вывод


      - [ ] Один результат воспроизведён от исходной записи до итога.

      - [ ] Проверены перевод единиц, формулы и округление.

      - [ ] Указан смысл погрешности или неопределённости.

      - [ ] Вывод отвечает цели и не выходит за границы данных.


      ## Итоговый PDF


      - [ ] Есть ссылки перед таблицами и рисунками.

      - [ ] Подписи, номера и пояснения формул согласованы.

      - [ ] Проверены отступы до и после таблиц и рисунков.

      - [ ] Нет обрезанных объектов, пустых полей и знаков ??.

      - [ ] Открыт именно окончательный файл для отправки.</code></pre>

      </div><p>«Просмотреть пример» открывает весь этот список. Галочка фиксирует ваше действие, а не результат автоматической валидации. Подробности разметки см. в статье о <a href="/blog/markdown-task-lists">списках задач Markdown</a>. Это рабочая заметка для проверки, а не раздел, который обязательно включать в сдаваемый отчёт.</p>'
  - id: 'send'
    title: 'Перед отправкой проверьте сам файл'
    html:
      '<p>Откройте файл из той папки, из которой будете его отправлять. Сверьте название и версию с требованиями преподавателя, убедитесь в читаемости страниц и наличии приложений, если они предусмотрены заданием. Проверка старого PDF не подтверждает готовность нового.</p>

      <p>Если исправили расчёт, снимите отметки у связанных пунктов и повторите их проверку: таблица, график и вывод могли сохранить старые значения. После сдачи сохраняйте исходные записи и проект, чтобы можно было объяснить получение результата на <a href="/blog/lab-report-defense-preparation">защите лабораторной</a>.</p>'
