  - type: 'latex'
    text: |-
      \section{Анализ результатов эксперимента}
      Рассмотрим вымышленную серию повторных измерений сопротивления
      одного резистора при неизменной схеме подключения.
      Показания приведены в таблице~\ref{tab:readings};
      опорное значение для учебного сравнения $R_0=${reference}$~Ом.\par
      \begin{table}[!ht]
      \caption{Учебные показания сопротивления}\label{tab:readings}
      \centering
      \begin{tabular}{|l|c|c|c|c|c|}
      \hline
      \multicolumn{1}{|c|}{Номер измерения} & 1 & 2 & 3 & 4 & 5 \\
      \hline
      Сопротивление, Ом & ${r1} & ${r2} & ${r3} & ${r4} & ${r5} \\
      \hline
      \end{tabular}
      \end{table}

      Среднее значение рассчитываем по формуле~\eqref{eq:mean}.
      \begin{formulablock}
      \begin{equation}\label{eq:mean}
      \bar R=\frac{1}{n}\sum_{i=1}^{n}R_i=${mean}\text{ Ом},
      \end{equation}
      \indent где $\bar R$ --- среднее сопротивление, Ом;\par
      $n$ --- число измерений, равное ${n};\par
      $i$ --- номер измерения, безразмерный;\par
      $R_i$ --- показание в измерении с номером $i$, Ом.
      \end{formulablock}
      Размах показаний определяем по формуле~\eqref{eq:span}.
      \begin{formulablock}
      \begin{equation}\label{eq:span}
      W=R_{\max}-R_{\min}=${high}-${low}=${span}\text{ Ом},
      \end{equation}
      \indent где $W$ --- размах показаний, Ом;\par
      $R_{\max}$ --- наибольшее показание, Ом;\par
      $R_{\min}$ --- наименьшее показание, Ом.
      \end{formulablock}
      В учебной серии среднее составляет ${mean}~Ом, размах --- ${span}~Ом.
      Абсолютное расхождение среднего с опорным значением равно ${difference}~Ом.
      Совпадение среднего с опорным значением само по себе не доказывает
      точность измерений: характеристики прибора и неопределённость
      опорного значения в примере не заданы. Размах описывает только
      наблюдаемый разброс и не заменяет оценку неопределённости результата.
    parameters:
      visible: true
  - type: 'latex'
    text: '\end{document}'
