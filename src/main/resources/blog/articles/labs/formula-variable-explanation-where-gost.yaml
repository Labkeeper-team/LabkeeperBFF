sections:
  - id: 'rules'
    title: 'Что требуют ГОСТ 7.32 и ГОСТ 2.105'
    html: |-
      <p><strong>Коротко:</strong> после формулы ставят запятую. С&nbsp;новой строки, с&nbsp;абзаца,
      пишут «где» без двоеточия, затем каждый символ с&nbsp;новой строки в&nbsp;порядке появления
      в&nbsp;формуле: символ, тире, описание, запятая, единица измерения, точка с&nbsp;запятой. В&nbsp;конце
      последней строки ставят точку.</p>
      <p>Пояснять нужно каждое буквенное обозначение, которое не&nbsp;было пояснено раньше в&nbsp;тексте.
      Требование для отчётов о&nbsp;НИР записано в&nbsp;<a
      href="https://mpei.ru/Science/ScienceDocuments/Documents/0_GOST_7.32-2017.pdf">ГОСТ 7.32-2017</a>;
      применение к&nbsp;курсовой или ВКР уточните по&nbsp;методичке кафедры:</p>
      <blockquote>
          «Пояснение значений символов и&nbsp;числовых коэффициентов следует приводить непосредственно под
          формулой в&nbsp;той же последовательности, в&nbsp;которой они представлены в&nbsp;формуле. Значение
          каждого символа и&nbsp;числового коэффициента необходимо приводить с&nbsp;новой строки. Первую
          строку пояснения начинают со&nbsp;слова „где“ <strong>без двоеточия</strong> с&nbsp;абзаца»
          (ГОСТ 7.32-2017, п.&nbsp;6.8.2).
      </blockquote>
      <p>В&nbsp;ГОСТ 2.105 (текстовые конструкторские документы, пояснительные записки) требование почти
      такое же: пояснение начинают со&nbsp;слова «где» без двоеточия, каждый символ — с&nbsp;новой строки.
      Отличие одно: ГОСТ 7.32 прямо требует начинать «где» с&nbsp;абзацного отступа, а&nbsp;в&nbsp;примерах
      ГОСТ 2.105 «где» стоит у&nbsp;левого поля. Применимый стандарт и&nbsp;отступ для учебной работы
      уточните по&nbsp;методичке кафедры; ниже показан вариант по&nbsp;ГОСТ 7.32.</p>
  - id: 'how-to-write'
    title: 'Образец оформления'
    html: |-
      <p>Формула вместе с&nbsp;пояснением — часть одного предложения. Поэтому перед формулой двоеточие
      не&nbsp;ставят (если его не&nbsp;требует сама фраза), а&nbsp;после формулы ставят запятую:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Образец</span></div>
          <pre><code>Давление газа вычисляют по формуле

                          p = νRT / V,                            (2.1)

          где p — абсолютное давление газа, Па;
              ν — количество вещества, моль;
              R — универсальная газовая постоянная, равная 8,314 Дж/(моль·К);
              T — термодинамическая температура, К;
              V — объём сосуда, м³.</code></pre>
      </div>
      <p>Слово «где» пишут со&nbsp;строчной буквы с&nbsp;абзацного отступа, двоеточие после него
      <strong>не&nbsp;ставят</strong>. Переменные идут в&nbsp;том порядке, в&nbsp;каком они встречаются
      в&nbsp;формуле слева направо: сначала левая часть, затем числитель, затем знаменатель. Правила
      нумерации самой формулы разобраны в&nbsp;статье <a
      href="/blog/formula-numbering-lab-reports-gost">о&nbsp;нумерации формул в&nbsp;отчётах</a>.</p>
  - id: 'formatting-details'
    title: 'Знаки препинания и единицы измерения'
    html: |-
      <ul>
          <li>Между символом и&nbsp;его описанием ставят тире: <code>p — давление газа</code>.</li>
          <li>Единицу измерения отделяют запятой: <code>ν — количество вещества, моль;</code>.</li>
          <li>Строки разделяют точкой с&nbsp;запятой, после последней ставят точку. ГОСТ прямо этого
          не&nbsp;предписывает: так следует из&nbsp;примеров стандарта и&nbsp;правил русской пунктуации.</li>
          <li>Если переменная уже пояснена выше по&nbsp;тексту, повторно её в&nbsp;блок «где» не&nbsp;включают.</li>
      </ul>
      <p>Несколько частых случаев:</p>
      <ul>
          <li><strong>Безразмерная величина</strong> — единицу не&nbsp;указывают:
          <code>η — коэффициент полезного действия;</code>.</li>
          <li><strong>Числовой коэффициент</strong> поясняют так же, как символ:
          <code>0,5 — коэффициент, учитывающий…;</code>.</li>
          <li><strong>Вектор или матрица</strong> — в&nbsp;пояснении указывают, что это за объект:
          <code>F — вектор силы, Н;</code>, <code>A — матрица коэффициентов системы;</code>.</li>
          <li><strong>Переменная с&nbsp;индексом</strong> поясняется целиком:
          <code>m₁ — масса первого тела, кг;</code>, а&nbsp;следующей строкой — пояснение
          <code>m₂</code>.</li>
      </ul>
      <p>Обозначения единиц набирают прямым шрифтом. Для русских обозначений в&nbsp;тексте пишут
      «м/с», внутри формулы — <code>\text{м/с}</code> или <code>\si{\metre\per\second}</code> из&nbsp;<a
      href="/blog/latex-siunitx">пакета siunitx</a> с&nbsp;русской локализацией.</p>
  - id: 'latex-snippets'
    title: 'Шаблоны в LaTeX: таблица и список description'
    html: |-
      <p>Чтобы тире стояли в&nbsp;столбик, блок «где» удобно набрать таблицей без рамок. Ширину столбца
      с&nbsp;описанием нельзя задавать как <code>0.8\textwidth</code>: вместе с&nbsp;абзацным отступом,
      словом «где» и&nbsp;символами строка выходит за&nbsp;правое поле (Overfull <code>\hbox</code>).
      Надёжнее оформить блок окружением, которое считает ширину само:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>% преамбула
      \newenvironment{where}
        {\par где~\begin{tabular}[t]{@{}l@{~---~}p{\dimexpr\linewidth-\parindent-7em\relax}@{}}}
        {\end{tabular}\par}

      % текст
      Силу притяжения вычисляют по формуле
      \begin{equation}
          F = G \frac{m_1 m_2}{r^2},
          \label{eq:gravity}
      \end{equation}
      \begin{where}
      $F$          &amp; сила гравитационного взаимодействия, Н;\\
      $G$          &amp; гравитационная постоянная, Н$\cdot$м$^2$/кг$^2$;\\
      $m_1$        &amp; масса первого тела, кг;\\
      $m_2$        &amp; масса второго тела, кг;\\
      $r$          &amp; расстояние между центрами масс тел, м.
      \end{where}
      Подставляя значения в формулу~\eqref{eq:gravity}, получаем\ldots</code></pre>
      </div>
      <p>Окружение <code>where</code> начинает новый абзац, поэтому «где» получает абзацный отступ, как
      требует ГОСТ 7.32. Тильда между «где» и&nbsp;таблицей — неразрывный пробел. Запас <code>7em</code>
      рассчитан на&nbsp;слово «где», тире и&nbsp;символы вроде <code>$m_1$, $m_2$</code>; если символы
      шире, увеличьте его.</p>
      <div class="article-note">
          <strong>💡 Номер формулы в&nbsp;Labkeeper:</strong> с&nbsp;автоматической преамбулой номер
          получает только формула, на&nbsp;которую есть ссылка <code>\eqref</code>. Поэтому в&nbsp;шаблоне
          есть фраза «Подставляя значения в&nbsp;формулу~\eqref{eq:gravity}». Без&nbsp;ссылки формула
          выйдет без&nbsp;номера.
      </div>
      <p>Таблица не&nbsp;переносится на&nbsp;следующую страницу: длинный блок на&nbsp;10–15 переменных
      может уйти за&nbsp;нижнее поле. Для&nbsp;таких случаев подойдёт список на&nbsp;основе
      <code>description</code> из&nbsp;пакета <code>enumitem</code>. Тире в&nbsp;нём не&nbsp;выравниваются
      в&nbsp;столбик, зато список разрывается между страницами:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>% преамбула
      \usepackage{enumitem}
      \newlist{wherelist}{description}{1}
      \setlist[wherelist]{nosep, font=\normalfont, labelindent=\parindent,
        leftmargin=\parindent, labelsep=0.5em, align=left}

      % текст
      Давление газа вычисляют по формуле
      \begin{equation}
        p = \frac{\nu R T}{V},
        \label{eq:gas}
      \end{equation}
      \begin{wherelist}
        \item[где $p$~---] давление газа, Па;
        \item[$\nu$~---] количество вещества, моль;
        \item[$R$~---] универсальная газовая постоянная, Дж/(моль$\cdot$К);
        \item[$T$~---] термодинамическая температура, К;
        \item[$V$~---] объём сосуда, м$^3$.
      \end{wherelist}
      Из формулы~\eqref{eq:gas} следует\ldots</code></pre>
      </div>
      <p>Подробнее о&nbsp;настройке списков — в&nbsp;статье <a
      href="/blog/latex-nested-lists-enumerate-itemize">о&nbsp;списках в&nbsp;LaTeX по&nbsp;ГОСТ</a>.
      Готовые отчёты с&nbsp;расчётами, к&nbsp;которым можно добавить эти шаблоны, — <a
      href="/templates/pogreshnosti-udelnoe-soprotivlenie">лабораторная «Погрешности. Удельное
      сопротивление»</a> и&nbsp;<a href="/templates/statisticheskaya-obrabotka-izmerenii">«Статистическая
      обработка измерений»</a>.</p>
  - id: 'full-example'
    title: 'Полный LaTeX-пример для редактора'
    html: |-
      <p>Ниже — полный самостоятельный LaTeX-пример отдельного элемента: формула гравитации,
      пояснения каждого символа и подстановка учебных значений. Кнопка «Просмотреть пример»
      открывает именно этот документ, а короткие шаблоны выше показывают отдельные способы
      набора пояснений.</p>
      <p>Это не полный отчёт: титульный лист, содержание и список источников не включены.
      В примере заданы A4, 14 пт, поля 30/15/20/20 мм, полуторный интервал и абзац 1,25 см.
      При вставке в основной документ используйте его преамбулу и согласуйте оформление
      с методичкой кафедры; ГОСТ 7.32-2017 относится к отчётам о НИР. Значения масс и расстояния
      выбраны для иллюстрации, а не получены в реальном эксперименте.</p>
      <details class="article-note article-code-details">
          <summary><strong>Полный LaTeX-пример: формула гравитации</strong></summary>
          <div class="article-code">
              <div class="article-code__header"><span class="article-code__lang">LaTeX — самостоятельный документ</span></div>
              <pre><code>\documentclass[a4paper,14pt]{extarticle}
      \usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[russian]{babel}
      \usepackage{tempora}
      \usepackage[left=30mm,right=15mm,top=20mm,bottom=20mm]{geometry}
      \usepackage{setspace}
      \onehalfspacing
      \setlength{\parindent}{1.25cm}
      \usepackage{amsmath,needspace}
      \usepackage{titlesec}
      \titleformat{\section}{\normalfont\bfseries}{\thesection}{1em}{}
      \titlespacing{\section}{\parindent}{0pt}{\baselineskip}
      \usepackage[hidelinks]{hyperref}
      \setlength{\abovedisplayskip}{\baselineskip}
      \setlength{\belowdisplayskip}{\baselineskip}
      \begin{document}
      Силу гравитационного взаимодействия определяют по формуле~\eqref{eq:gravity}.
      \Needspace{16\baselineskip}
      \begin{equation}
      F=G\frac{m_1m_2}{r^2},\label{eq:gravity}
      \end{equation}

      где~\begin{tabular}[t]{@{}l@{ --- }p{.65\textwidth}@{}}
      $F$ &amp; сила гравитационного взаимодействия, Н;\\
      $G$ &amp; гравитационная постоянная, $G\approx6{,}674\cdot10^{-11}$~м$^3$/(кг$\cdot$с$^2$);\\
      $m_1$ &amp; масса первого тела, кг;\\
      $m_2$ &amp; масса второго тела, кг;\\
      $r$ &amp; расстояние между центрами масс тел, м.
      \end{tabular}

      В учебном примере при $m_1=m_2=1$~кг и $r=1$~м сила составляет приблизительно $6{,}674\cdot10^{-11}$~Н.
      \end{document}</code></pre>
          </div>
      </details>
      <p>Таблица <code>tabular</code> выравнивает тире и переносит длинные описания в правой
      колонке. Пустая строка после формулы начинает новый абзац; отступ задаёт
      <code>\parindent</code>. Интервалы над и под формулой заданы явно,
      а <code>\Needspace</code> резервирует место для формулы вместе с пояснениями.</p>
  - id: 'markdown'
    title: 'Пояснения к формуле в Markdown'
    html: |-
      <p>В&nbsp;Markdown-проекте формулу набирают в&nbsp;<code>$$…$$</code>, номер ставят через
      <code>\tag{1}</code>, а&nbsp;каждую строку пояснения завершают обратной косой чертой — это перенос
      строки без нового абзаца:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Markdown</span></div>
          <pre><code>Скорость вычисляют по формуле

      $$
      v = \frac{s}{t}, \tag{1}
      $$

      где $v$ — скорость, м/с;\
      $s$ — путь, м;\
      $t$ — время, с.</code></pre>
      </div>
      <p>Порядок символов и&nbsp;пунктуация те&nbsp;же, что в&nbsp;LaTeX. Абзацный отступ перед «где»
      Markdown не&nbsp;воспроизводит, поэтому для отчёта, который проверяет нормоконтроль, надёжнее
      LaTeX-шаблон выше. Как набирать формулы в&nbsp;Markdown, рассказано в&nbsp;статье <a
      href="/blog/markdown-mathjax-katex-latex-math">о&nbsp;формулах в&nbsp;Markdown</a>.</p>
  - id: 'frequent-errors'
    title: 'Частые ошибки на нормоконтроле'
    html: |-
      <ol>
          <li>Двоеточие после слова «где»: <em>«где:»</em> — грубая ошибка.</li>
          <li>«Где» с&nbsp;заглавной буквы. Пояснение продолжает предложение, поэтому «где» пишут
          со&nbsp;строчной.</li>
          <li>Нет запятой после формулы.</li>
          <li>Двоеточие перед формулой без грамматической причины: «вычисляют по&nbsp;формуле:».</li>
          <li>Переменные перечислены по&nbsp;алфавиту, а&nbsp;не&nbsp;в&nbsp;порядке появления
          в&nbsp;формуле.</li>
          <li>Все переменные в&nbsp;одну строку через запятую: <em>«где m — масса, v — скорость»</em>.
          ГОСТ требует каждый символ с&nbsp;новой строки.</li>
          <li>Пропущены единицы измерения.</li>
      </ol>
  - id: 'faq'
    title: 'Частые вопросы'
    html: |-
      <h3>Нужно ли расшифровывать π и e?</h3>
      <p>Нет. Общепринятые математические константы и&nbsp;функции (π, e, sin, ln) не&nbsp;поясняют.
      Физические постоянные, например <em>R</em> или <em>G</em>, поясняют, если они встречаются
      в&nbsp;работе впервые.</p>
      <h3>Что делать, если переменная уже пояснена?</h3>
      <p>Повторно её не&nbsp;поясняют. В&nbsp;блок «где» включают только новые символы. Если новых
      символов нет, блок «где» не&nbsp;нужен.</p>
      <h3>Ставить ли двоеточие после «где»?</h3>
      <p>Нет. И&nbsp;ГОСТ 7.32, и&nbsp;ГОСТ 2.105 прямо требуют писать «где» без двоеточия.</p>
      <h3>Нужно ли выравнивать тире в столбик?</h3>
      <p>ГОСТ этого не&nbsp;требует, но&nbsp;многие кафедры просят. Выравнивание даёт окружение
      <code>where</code> из&nbsp;раздела <a href="#latex-snippets">о&nbsp;шаблонах в&nbsp;LaTeX</a>.</p>
      <h3>Как оформить «где» в Word?</h3>
      <p>После формулы начните новый абзац со&nbsp;слова «где». Каждый следующий символ переносите
      на&nbsp;новую строку через Shift+Enter, чтобы строки остались одним абзацем, а&nbsp;тире
      выравнивайте табуляцией. Для Markdown смотрите <a href="#markdown">раздел выше</a>.</p>
tips:
  - title: 'Неразрывный пробел после «где»'
    html: |2-
      <p>Пишите <code>где~\begin{tabular}...</code>: тильда — неразрывный пробел, и строка не
      разорвется между словом «где» и таблицей пояснений.</p>
  - title: 'Единицы измерения по ГОСТ 8.417'
    html: |2-
      <p>Для набора размерностей используйте прямое начертание шрифта: <code>м/с</code> или
      <code>\text{кг}</code>, а не математический курсив <em>kg</em>.</p>
editorExample:
  - type: 'latex'
    text: |2-
      \documentclass[a4paper,14pt]{extarticle}
      \usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[russian]{babel}
      \usepackage{tempora}
      \usepackage[left=30mm,right=15mm,top=20mm,bottom=20mm]{geometry}
      \usepackage{setspace}
      \onehalfspacing
      \setlength{\parindent}{1.25cm}
      \usepackage{amsmath,needspace}
      \usepackage{titlesec}
      \titleformat{\section}{\normalfont\bfseries}{\thesection}{1em}{}
      \titlespacing{\section}{\parindent}{0pt}{\baselineskip}
      \usepackage[hidelinks]{hyperref}
      \setlength{\abovedisplayskip}{\baselineskip}
      \setlength{\belowdisplayskip}{\baselineskip}
      \begin{document}
      Силу гравитационного взаимодействия определяют по формуле~\eqref{eq:gravity}.
      \Needspace{16\baselineskip}
      \begin{equation}
      F=G\frac{m_1m_2}{r^2},\label{eq:gravity}
      \end{equation}

      где~\begin{tabular}[t]{@{}l@{ --- }p{.65\textwidth}@{}}
      $F$ & сила гравитационного взаимодействия, Н;\\
      $G$ & гравитационная постоянная, $G\approx6{,}674\cdot10^{-11}$~м$^3$/(кг$\cdot$с$^2$);\\
      $m_1$ & масса первого тела, кг;\\
      $m_2$ & масса второго тела, кг;\\
      $r$ & расстояние между центрами масс тел, м.
      \end{tabular}

      В учебном примере при $m_1=m_2=1$~кг и $r=1$~м сила составляет приблизительно $6{,}674\cdot10^{-11}$~Н.
      \end{document}
    parameters:
      visible: true
