      Три отсчета в точке --- повторы показаний, а не три независимые
      пробы водоема. Для учебной обработки найдем среднее каждой серии
      по формуле~\eqref{eq:mean}.
      \begin{formulablock}
      \begin{equation}
      \bar{T}=\frac{1}{n}\sum_{i=1}^{n}T_i,
      \label{eq:mean}
      \end{equation}
      \indent где $\bar{T}$ --- среднее серии отсчетов в одной точке, $^\circ$C;\par
      $n=3$ --- число отсчетов в серии, безразмерное;\par
      $i$ --- номер отсчета, безразмерный;\par
      $T_i$ --- температура при отсчете $i$, $^\circ$C.
      \end{formulablock}

      Получены $\bar{T}_A=\num{${mean_A}}$~$^\circ$C и
      $\bar{T}_{\text{Б}}=\num{${mean_B}}$~$^\circ$C.
      Среднее в точке Б выше на $\num{${difference}}$~$^\circ$C.
      Это описание данных указанного времени и глубины.
      Погрешность и статистическая значимость различия не оценивались.
      Из этих записей нельзя установить причину различия,
      загрязнение или соответствие нормативам.
      \end{document}
