      \\begin{equation}\\label{eq:cells}

      C=\\frac{ND}{ka^2h}=${concentration}~\\text{клеток/мкл},

      \\end{equation}

      \\indent где $C$ --- концентрация исходной суспензии, клеток/мкл;\\par

      $N$ --- суммарное число учтённых клеток;\\par

      $D$ --- безразмерная кратность разведения;\\par

