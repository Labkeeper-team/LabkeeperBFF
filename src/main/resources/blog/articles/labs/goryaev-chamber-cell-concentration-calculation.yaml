sections:
  - id: 'task'
    title: 'Сначала определите объём, в котором считаете клетки'
    html: '<p>Одинаковое число клеток даст разную концентрацию, если меняется площадь подсчитанной сетки или глубина камеры. Поэтому расчёт начинают с паспорта конкретной камеры и правила подсчёта, а не с заученного коэффициента.</p><p>Разберём вымышленную учебную суспензию дрожжей. Геометрия и принцип расчёта приведены в <a href="https://minimed.ru/product/4176/" target="_blank" rel="noopener noreferrer">характеристиках камеры производителя «МиниМед»</a> и <a href="https://e-lib.unn.ru/MegaPro/Download/MObject/2675" target="_blank" rel="noopener noreferrer">пособии ННГУ по оптической микроскопии, с. 34</a>. Пример посвящён арифметике и оформлению протокола, без клинической интерпретации.</p>'
  - id: 'geometry'
    title: 'Не перепутайте большой и малый квадрат'
    html:
      '<div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Элемент выбранной сетки</th><th>Площадь, мм²</th><th>Объём при h = 0,1 мм</th></tr></thead><tbody><tr><td>Большой квадрат 0,2 × 0,2 мм</td><td>0,04</td><td>0,004 мкл</td></tr>

      <tr><td>Малый квадрат 0,05 × 0,05 мм</td><td>0,0025</td><td>0,00025 мкл</td></tr></tbody></table></div><p>Один кубический миллиметр равен одному микролитру. Объём одного большого квадрата — 0,2 × 0,2 × 0,1 = 0,004 мм³. Подмена малого квадрата большим или наоборот даёт ошибку в 16 раз. Названия квадратов не заменяют проверки их реальных размеров по паспорту.</p><p>Заданная глубина предполагает правильную установку специального покровного стекла. Условия заполнения и допустимость подсчёта определяйте по методике; неверную глубину или неравномерное распределение клеток арифметика не исправляет.</p>'
  - id: 'protocol'
    title: 'Запишите область подсчёта и правило границ'
    html:
      '<p>В учебной записи посчитаны пять групп по пять различных больших квадратов: 18, 22, 20, 19 и 21 клетка. Всего 100 клеток на 25 больших квадратах. Это суммарное число, а не среднее по квадрату.</p><p>Чтобы не учитывать клетку дважды, заранее зафиксируйте пару включаемых и исключаемых границ и применяйте её последовательно. В нашем примере верхнюю и правую границы включают, нижнюю и левую исключают; выбранный вариант согласован с указанным пособием ННГУ. Если ваша методика задаёт другую согласованную пару, следуйте ей и запишите правило в протоколе.</p><p>Укажите образец, область сетки, числа по группам и разведение. Простое считывание изображения не является автоматическим вводом данных в этом примере.</p>

      <p>Это выбранная схема учебного подсчёта, а не предписанная паспортом группировка. В реальной работе область сетки выбирают по принятой методике.</p>'
  - id: 'calculation'
    title: 'Учтите разведение и единицы'
    html:
      '<p>Общий объём 25 квадратов равен 25 × 0,004 = 0,100 мкл. Без разведения концентрация составляет 100 / 0,100 = 1000 клеток/мкл, или 1 000 000 клеток/мл. Кратность разведения D = 1 означает, что разведения нет; D = 10 обозначало бы десятикратное разведение исходной суспензии.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">Вычислительный сегмент</span></div>

      <pre><code>n1 = 18

      n2 = 22

      n3 = 20

      n4 = 19

      n5 = 21

      count = n1 + n2 + n3 + n4 + n5

      squares = 25

      side = 0.2

      depth = 0.1

      dilution = 1

      volume = squares * side^2 * depth

      concentration = count * dilution / volume

      perMl = 1000 * concentration</code></pre>

      </div><p>Код использует суммарный подсчёт и заданную геометрию. При изменении числа групп согласуйте их сумму с числом квадратов. Глубина, площадь, число квадратов и D должны быть положительными; число учтённых клеток — неотрицательным целым.</p>'
  - id: 'latex'
    title: 'Расчёт в отчётном фрагменте'
    html:
      "<p>По кнопке открываются скрытый вычислительный сегмент и один завершённый LaTeX-документ. В PDF остаются исходные записи, геометрия, формула и результат. Определение <code>formulablock</code> и настройка чисел находятся в преамбуле:</p><div class=\"article-code\">

      <div class=\"article-code__header\"><span class=\"article-code__lang\">LaTeX</span></div>

      <pre><code>\\usepackage{amsmath,siunitx}

      \\sisetup{output-decimal-marker={,},group-digits=false}

      \\newenvironment{formulablock}{%

      \  \\par\\noindent\\begin{minipage}[b]{\\textwidth}%

      \  \\setlength{\\parindent}{1.25cm}%

      \  \\setlength{\\abovedisplayskip}{0pt}%

      \  \\setlength{\\abovedisplayshortskip}{0pt}%

      \  \\vspace*{\\baselineskip}%

      }{\\end{minipage}\\par}</code></pre>

      </div><p>Текст расчёта:</p><div class=\"article-code\">

      <div class=\"article-code__header\"><span class=\"article-code__lang\">LaTeX</span></div>

      <pre><code>Учебная суспензия дрожжей: все записи вымышлены.

      В пяти группах по пять различных больших квадратов получены числа клеток

      ${n1}; ${n2}; ${n3}; ${n4}; ${n5}.

      Итого $N=${count}$, $k=${squares}$ больших квадратов.

      Для выбранной камеры заданы сторона большого квадрата

      $a=\\num{${side}}$~мм и глубина $h=\\num{${depth}}$~мм.

      Кратность разведения: $D=${dilution}$.

      Учтённый объём равен \\num{${volume}}~мкл.

      \\begin{formulablock}

      \\begin{equation}\\label{eq:cells}

      C=\\frac{ND}{ka^2h}=${concentration}~\\text{клеток/мкл},

      \\end{equation}

      \\indent где $C$ --- концентрация исходной суспензии, клеток/мкл;\\par

      $N$ --- суммарное число учтённых клеток;\\par

      $D$ --- безразмерная кратность разведения;\\par

      $k$ --- число посчитанных больших квадратов;\\par

      $a$ --- сторона большого квадрата, мм;\\par

      $h$ --- глубина камеры, мм.

      \\end{formulablock}

      Так как 1 мл равен 1000 мкл, получаем $${perMl}$ клеток/мл.

      Это учебная оценка числа клеток по заданному объёму.

      Она не определяет жизнеспособность клеток и не является медицинским заключением.</code></pre>

      </div><p>Слово «где» и пояснения следуют формуле; их блок остаётся вместе. Подробности — в статье о <a href=\"/blog/formula-variable-explanation-where-gost\">пояснениях обозначений</a>. Страница настроена для краткого учебного фрагмента; требования отчёта сверьте с методичкой.</p>"
  - id: 'limits'
    title: 'Что результат не подтверждает'
    html: '<p>Число клеток по объёму камеры само по себе не показывает их жизнеспособность, вид или пригодность образца для конкретного исследования. Для этого нужны отдельные методы и критерии. Повторяемость и оценка неопределённости также требуют дополнительных данных.</p><ul><li>Проверьте размеры квадратов и глубину именно своей камеры.</li><li>Сверьте сумму клеток, число квадратов и кратность разведения.</li><li>Не применяйте коэффициент разведения второй раз после уже пересчитанного результата.</li><li>Сохраняйте единицу клеток/мкл или клеток/мл рядом с числом.</li></ul><p>Оформление записей разобрано в статье о <a href="/blog/lab-measurement-data-tables-errors">таблицах измерений</a>, а обоснование выводов — в <a href="/blog/experiment-results-analysis-lab-report">анализе эксперимента</a>.</p>'
