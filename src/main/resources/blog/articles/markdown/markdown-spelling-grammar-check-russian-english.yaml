sections:
  - id: 'difference'
    title: 'Орфография, грамматика и разметка — разные проверки'
    html:
      '<p>Правильно записанное слово может стоять в неправильной форме: в предложении «Полученные данные показывает различие» все слова существуют, но сказуемое не согласовано с подлежащим. Поэтому отсутствие подчёркиваний не означает, что Markdown-текст готов к отправке.</p>

      <p>В Labkeeper встроена словарная проверка орфографии русского и английского текста. Она помогает находить неизвестные словарю слова; грамматику, пунктуацию и смысл нужно проверять отдельно. Разберём короткий учебный текст с двумя опечатками и ошибкой согласования, затем откроем исправленный вариант в редакторе.</p>'
  - id: 'builtin'
    title: 'Как работает встроенная проверка RU/EN'
    html:
      '<p>Откройте Markdown-сегмент и введите обычный текст в поле исходника. Проверка работает во время редактирования; после первой загрузки словарей нужно немного подождать. Русские и английские слова проверяются по соответствующим словарям.</p>

      <p>В реализации используется <a href="https://github.com/wooorm/nspell" target="_blank" rel="noopener noreferrer">nspell</a> — проверка слов со словарями формата Hunspell. Подчёркивание означает, что слово не распознано словарём. Исправление вносите в исходный текст, затем проверяйте превью.</p>

      <div class="article-note"><strong>Термин может быть правильным.</strong> Фамилии, аббревиатуры, названия библиотек и новые термины могут отсутствовать в словаре. Сверьте написание с первоисточником: не меняйте термин только ради исчезновения подчёркивания.</div>

      <p>Markdown-сегмент проверяется как текст: не рассчитывайте на полное исключение адресов, имён переменных и содержимого блоков кода. Подозрительное слово внутри команды сначала сверяйте с кодом. Оформление таких фрагментов описано в статье о <a href="/blog/markdown-code-syntax-highlighting">блоках кода Markdown</a>.</p>'
  - id: 'example'
    title: 'Исправьте опечатки и согласование'
    html:
      '<p>Вставьте этот фрагмент в отдельный Markdown-сегмент. Ошибки оставлены намеренно; это упражнение, а не текст для отчёта.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">Markdown</span></div>

      <pre><code>## Результаты проверки


      В отчёте приведены резльтаты проверки.

      The report contains a sumary.


      Полученные данные показывает различие вариантов.

      </code></pre>

      </div><div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Фрагмент</th><th>Что исправить</th><th>Как проверять</th></tr></thead><tbody><tr><td>резльтаты</td><td>результаты</td><td>Орфография русского слова</td></tr>

      <tr><td>sumary</td><td>summary</td><td>Орфография английского слова</td></tr>

      <tr><td>данные показывает</td><td>данные показывают</td><td>Согласование: проверять предложение целиком</td></tr></tbody></table></div><p>Последняя ошибка может остаться без подчёркивания: словарь распознаёт слово «показывает». Исправленный вариант ниже совпадает с примером по кнопке.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">Markdown</span></div>

      <pre><code>## Результаты проверки


      Учебный текст: результаты вымышлены.

      В отчёте приведены результаты проверки.

      The report contains a summary.


      Полученные данные показывают различие вариантов.


      Перед отправкой проверьте термины и выводы по исходным данным.</code></pre>

      </div><p>«Просмотреть пример» открывает исправленный Markdown-сегмент. Чтобы проверить подсветку ошибок, временно замените <code>результаты</code> на <code>резльтаты</code> и <code>summary</code> на <code>sumary</code>, затем верните правильные слова. Превью помогает проверить разметку, а орфографию смотрите в поле исходника.</p>'
  - id: 'grammar'
    title: 'Как проверить грамматику и пунктуацию'
    html:
      '<ol><li>Прочитайте каждое предложение целиком. Найдите подлежащее и сказуемое: «данные показывают», «значение показывает».</li><li>Проверьте управление: «согласно методике», «в соответствии с методикой». Не заменяйте окончания механически без учёта конструкции.</li><li>Разбейте перегруженные предложения. Убедитесь, что местоимения «это», «они», «данный» имеют понятное значение.</li><li>Сверьте термины, сокращения и обозначения: один объект должен называться одинаково в тексте, таблице и подписи.</li><li>Прочитайте текст после правок ещё раз: замена слова может изменить согласование и смысл соседней фразы.</li></ol>

      <p>При использовании отдельного грамматического сервиса проверяйте его предложения по контексту. Переносите изменения в исходник небольшими фрагментами, чтобы сохранить ссылки, формулы и разделители таблиц. Проверка языка не устанавливает достоверность приведённых результатов.</p>'
  - id: 'markup'
    title: 'Сохраните Markdown при вычитке'
    html:
      '<p>Исправление языка не должно менять служебные символы. После вычитки проверьте в превью заголовки, списки, ссылки и код. У ссылки текст и адрес выполняют разные задачи: исправлять опечатку в подписи можно, а изменение URL требует отдельной проверки перехода.</p>

      <ul><li>Не заменяйте обратные кавычки типографскими: они выделяют код.</li><li>Сохраняйте решётки заголовков и пустые строки между блоками.</li><li>Проверьте баланс скобок ссылок и разделители столбцов таблицы.</li><li>Не правьте имена переменных и команд по словарной подсказке.</li></ul>

      <p>Для последовательной вычитки удобно вести <a href="/blog/markdown-task-lists">чек-лист Markdown</a>. После неё проверьте итоговый файл по инструкции об <a href="/blog/markdown-to-pdf-export">экспорте Markdown в PDF</a>: новый перенос строки или длинная ссылка могут изменить печатный результат.</p>'
  - id: 'missing'
    title: 'Если подчёркивания не появились'
    html:
      '<p>Сначала проверьте, что редактируете исходный Markdown-сегмент, а не только смотрите превью. Подождите загрузки словарей и проверьте два заведомо ошибочных слова из упражнения. При сбое загрузки обновите страницу и повторите проверку. Нераспознанный язык или недоступный словарь не должны превращаться в вывод «ошибок нет».</p>

      <p>Завершайте вычитку двумя отдельными действиями: проверкой слов и чтением предложений. Для нашего упражнения результатом будут правильные «результаты», <code>summary</code> и «данные показывают», а не просто отсутствие отметок редактора.</p>'
editorExample:
  - type: 'md'
    text: '## Результаты проверки


      Учебный текст: результаты вымышлены.

      В отчёте приведены результаты проверки.

      The report contains a summary.


      Полученные данные показывают различие вариантов.


      Перед отправкой проверьте термины и выводы по исходным данным.'
