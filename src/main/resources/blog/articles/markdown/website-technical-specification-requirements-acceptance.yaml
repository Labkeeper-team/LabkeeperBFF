sections:
  - id: 'task'
    title: 'Начните с задачи пользователей и границ этапа'
    html: '<p>Фраза «нужен удобный современный сайт» не объясняет, что разработчик должен сделать и как заказчик проверит результат. В техническом задании свяжите цель, сценарии пользователей, требования и приёмку.</p><p>Разберём вымышленный сайт мастерской: посетитель читает об услугах и оставляет заявку. Это короткий фрагмент ТЗ для одного сценария, а не универсальная договорная форма или полная спецификация большого проекта. Структуру и состав документа согласуйте с участниками проекта.</p><p>Опишите, что входит в текущий этап, кто готовит тексты и изображения, какие интеграции доступны и кто отвечает за размещение. Перечень исключённых функций помогает не смешивать этапы разработки.</p>'
  - id: 'structure'
    title: 'Соберите структуру документа'
    html:
      '<div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Раздел</th><th>Что зафиксировать</th></tr></thead><tbody><tr><td>Цель и аудитория</td><td>Какую задачу решает сайт и для кого</td></tr>

      <tr><td>Состав этапа</td><td>Страницы, сценарии и согласованные границы</td></tr>

      <tr><td>Функции</td><td>Условия, действия системы и результат</td></tr>

      <tr><td>Контент и интерфейс</td><td>Материалы, состояния элементов, управление с клавиатуры</td></tr>

      <tr><td>Интеграции</td><td>Форматы запросов, ответов и поведение при отказах</td></tr>

      <tr><td>Приёмка и передача</td><td>Проверки, среда, комплект исходников и настроек</td></tr></tbody></table></div><p>Назначайте требованиям устойчивые идентификаторы, например <code>FR-1</code>. Тогда критерий, макет и пункт протокола можно связать с одним требованием даже после перестановки разделов. Не подменяйте требование названием технологии: выбор библиотеки сам по себе не описывает поведение формы.</p>'
  - id: 'measurable'
    title: 'Замените оценочные слова проверяемым поведением'
    html: '<p>Вместо «форма работает корректно» опишите обязательные поля, ограничения, состояния отправки и ответы сервера. Для численных ограничений укажите способ измерения. Если требуется определённая скорость страницы, согласуйте устройство, сеть, сценарий и показатель; одно число без условий неоднозначно.</p><p>Для формы важны сообщения об ошибках, связь сообщения с полем и доступность управления. <a href="https://www.w3.org/WAI/tutorials/forms/validation/" target="_blank" rel="noopener noreferrer">Рекомендации W3C WAI по проверке форм</a> объясняют, как сообщать пользователю об ошибке. Клиентская проверка удобна для посетителя, но не заменяет проверку поступивших данных сервером.</p>'
  - id: 'example'
    title: 'Короткий пример требования и приёмки'
    html:
      '<p>Следующий Markdown-фрагмент содержит одно функциональное требование. Код ответа <code>201</code> здесь выбран в рамках учебного соглашения с обработчиком: он подтверждает создание заявки, а не доставку письма менеджеру.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">Markdown</span></div>

      <pre><code># Фрагмент ТЗ на сайт мастерской


      Учебный пример: условия и название проекта вымышлены.


      ## Цель и границы


      Посетитель знакомится с услугами и оставляет заявку.

      В этот этап входят страница услуг и форма обращения.

      Оплата и личный кабинет в данный этап не входят.


      ## Функциональное требование FR-1


      Форма содержит имя, email и сообщение; все поля обязательны.

      Максимум: имя 80 символов, сообщение 1000 символов.

      После отправки кнопка недоступна до получения ответа.

      Ответ 201 от согласованного серверного обработчика означает создание заявки.

      Тогда посетитель видит подтверждение с номером заявки.

      При сетевой ошибке или ответе 5xx отображается ошибка; введённые значения сохраняются.


      ## Приёмка FR-1


      1. Пустой email: отправка не выполняется, поле обозначено и есть текст ошибки.

      2. Корректные поля и ответ 201 с номером: показано подтверждение с этим номером.

      3. Ответ 503: показана ошибка, значения полей сохранены, доступна повторная отправка.

      4. До завершения запроса повторное нажатие не создаёт второй запрос.


      ## Передача результата


      Передаются исходники, описание настроек и протокол проверок FR-1.

      Доставка уведомления менеджеру и её контроль описываются отдельным требованием.</code></pre>

      </div><p>«Просмотреть пример» открывает весь этот фрагмент. Замените цель, поля и серверное соглашение под свой проект. Записанные критерии не реализуют форму автоматически: они задают ожидаемое поведение для разработки и проверки.</p>'
  - id: 'review'
    title: 'Проверьте непротиворечивость и полноту'
    html: '<ol><li>Для каждого требования найдите сценарий пользователя и критерий приёмки.</li><li>Проверьте обычный результат, неверные данные, отказ интеграции и повторное действие.</li><li>Согласуйте зависимые требования: успешный ответ сайта и доставка уведомления могут проверяться отдельно.</li><li>Укажите, где проводятся проверки, какие тестовые данные используются и кто принимает результат.</li><li>Зафиксируйте порядок согласования изменений и актуальную версию документа.</li></ol><p>Тестовые обращения направляйте в согласованную проверочную среду. Если проект собирает данные пользователей, отдельно опишите состав, доступ и срок хранения по согласованным правилам проекта.</p>'
  - id: 'editor'
    title: 'Как вести ТЗ в Markdown'
    html: '<p>В Labkeeper можно хранить текст требований и <a href="/blog/markdown-task-lists">чек-листы согласования</a> в Markdown-сегменте. Не отмечайте требование принятым только потому, что оно записано: отметка должна соответствовать результату проверки.</p><p>Перед передачей проверьте заголовки, списки, идентификаторы и экспорт по инструкции о <a href="/blog/markdown-to-pdf-export">сохранении Markdown в PDF</a>. Для редакторской помощи можно использовать <a href="/blog/ai-prompts-diploma-writing-editing-agent">запрос к агенту по предоставленным фактам</a>, сохраняя согласованные условия и проверяя каждое изменение.</p>'
