sections:
  - id: 'strikethrough'
    title: 'Зачёркнутый текст: двойная тильда ~~'
    html: |2-
      <p><strong>Коротко:</strong> зачёркнутый текст в Markdown пишут в двойных тильдах —
      <code>~~текст~~</code>. Подчёркивание делают HTML-тегом <code>&lt;ins&gt;</code> (на GitHub) или
      <code>&lt;u&gt;</code>, маркер — тегом <code>&lt;mark&gt;</code>.</p>
      <p>Зачёркивание — расширение GitHub Flavored Markdown (GFM): фрагмент с двух сторон
      оборачивают в двойные тильды.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Markdown</span></div>
          <pre><code>Срок сдачи: ~~15 мая~~ 22 мая.
      Цена лицензии: ~~5000 руб.~~ бесплатно для студентов.
      ~~**Жирный зачёркнутый**~~ и **~~тоже работает~~**.
      Пере~~на~~писать: зачёркнута часть слова.
      \~\~Тильды как есть\~\~ — без зачёркивания.</code></pre>
      </div>
      <p>По спецификации GFM такой фрагмент превращается в тег <code>&lt;del&gt;</code> (удалённый
      текст). Зачёркиванием удобно помечать и отменённые пункты в <a
      href="/blog/markdown-task-lists">списках задач в Markdown</a>.</p>
      <p><strong>Одиночная тильда.</strong> На GitHub <code>~текст~</code> тоже зачёркивает:
      спецификация GFM допускает одну или две тильды. А в Pandoc и в markdown-it с плагином
      <code>markdown-it-sub</code> одиночные тильды дают нижний индекс (H~2~O). Чтобы не путаться,
      всегда пишите две тильды; про индексы подробнее — в статье о <a
      href="/blog/markdown-superscript-subscript-indices">верхних и нижних индексах в
      Markdown</a>.</p>
      <p>В превью Markdown-проекта Labkeeper зачёркивание работает. При сборке PDF Pandoc переводит
      <code>~~текст~~</code> в команду <code>\st</code> пакета <code>soul</code>, поэтому пакет нужно
      подключить в преамбуле — так сделано в примере для редактора.</p>
  - id: 'underline'
    title: 'Как подчеркнуть текст в Markdown: <ins> и <u>'
    html: |2-
      <p>В Markdown нет символа для подчёркивания: в вебе подчёркнутый текст легко спутать со
      ссылкой. Если подчеркнуть всё же нужно (бланк, ФИО в протоколе, акцент в черновике),
      используйте HTML-теги:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Markdown</span></div>
          <pre><code>&lt;ins&gt;Подчёркнутый текст&lt;/ins&gt;   &lt;!-- рекомендует документация GitHub --&gt;
      &lt;u&gt;Подчёркнутый текст&lt;/u&gt;       &lt;!-- Obsidian, Typora, VS Code, Labkeeper --&gt;</code></pre>
      </div>
      <p>Документация GitHub («Basic writing and formatting syntax») подчёркивает текст именно тегом
      <code>&lt;ins&gt;</code>. Тега <code>&lt;u&gt;</code> нет в списке разрешённых тегов открытого
      санитайзера GitHub (html-pipeline), поэтому в README на него лучше не рассчитывать. В Obsidian,
      Typora, VS Code и превью Labkeeper работают оба тега. Какие ещё теги переживают санитизацию,
      разобрано в статье об <a href="/blog/markdown-raw-html-integration">интеграции HTML в
      Markdown</a>.</p>
      <p><strong>Частая путаница:</strong> в Telegram и Discord <code>__текст__</code> означает
      подчёркивание, а в Markdown — <strong>жирный</strong> текст. Одиночные подчёркивания
      <code>_текст_</code> дают <em>курсив</em>.</p>
      <p>При сборке PDF в Labkeeper HTML-теги из Markdown-сегментов выбрасываются: текст останется,
      но без подчёркивания. В LaTeX-сегменте подчёркивают командой <code>\uline{…}</code> из пакета
      <code>ulem</code> (она переносит строки, в отличие от <code>\underline</code>).</p>
  - id: 'highlight-marker'
    title: 'Выделение маркером: <mark> и ==текст=='
    html: |2-
      <p>Жёлтый «текстовыделитель» делают двумя способами:</p>
      <ul>
          <li><code>==важный вывод==</code> — расширение некоторых редакторов: Obsidian, Typora (после
          включения «Highlight» в настройках Markdown), Pandoc с расширением <code>+mark</code>,
          markdown-it с плагином <code>markdown-it-mark</code>;</li>
          <li><code>&lt;mark&gt;ключевой факт&lt;/mark&gt;</code> — HTML-тег, который понимают почти
          все редакторы, где разрешён HTML.</li>
      </ul>
      <p>GitHub и превью Labkeeper синтаксис <code>==текст==</code> не поддерживают и выводят его как
      есть, поэтому для переносимости используйте <code>&lt;mark&gt;</code>. Учтите, что браузер по
      умолчанию не печатает фон: чтобы выделение не пропало в PDF, включите в диалоге печати параметр
      «Фоновая графика».</p>
      <p>Похожий плагин <code>markdown-it-ins</code> добавляет подчёркивание <code>++текст++</code>,
      но это тоже не стандарт и на GitHub не работает.</p>
  - id: 'compatibility'
    title: 'Что где работает: GitHub, GitLab, Obsidian, Typora, Labkeeper'
    html: |2-
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead>
                  <tr>
                      <th>Эффект</th>
                      <th>Синтаксис</th>
                      <th>GitHub</th>
                      <th>Obsidian</th>
                      <th>Typora</th>
                      <th>Labkeeper</th>
                  </tr>
              </thead>
              <tbody>
                  <tr>
                      <td>Зачёркивание</td>
                      <td><code>~~текст~~</code></td>
                      <td>да</td>
                      <td>да</td>
                      <td>да</td>
                      <td>да</td>
                  </tr>
                  <tr>
                      <td>Подчёркивание</td>
                      <td><code>&lt;ins&gt;…&lt;/ins&gt;</code></td>
                      <td>да</td>
                      <td>да</td>
                      <td>да</td>
                      <td>да</td>
                  </tr>
                  <tr>
                      <td>Подчёркивание</td>
                      <td><code>&lt;u&gt;…&lt;/u&gt;</code></td>
                      <td>ненадёжно</td>
                      <td>да</td>
                      <td>да</td>
                      <td>да</td>
                  </tr>
                  <tr>
                      <td>Маркер</td>
                      <td><code>==текст==</code></td>
                      <td>нет</td>
                      <td>да</td>
                      <td>после включения в настройках</td>
                      <td>нет</td>
                  </tr>
                  <tr>
                      <td>Маркер</td>
                      <td><code>&lt;mark&gt;…&lt;/mark&gt;</code></td>
                      <td>тег разрешён санитайзером</td>
                      <td>да</td>
                      <td>да</td>
                      <td>да</td>
                  </tr>
              </tbody>
          </table>
      </div>
      <p>Колонка Labkeeper относится к превью Markdown-проекта. GitLab, Pandoc и движки на
      markdown-it поддерживают HTML-теги и расширения по-разному: перед публикацией проверьте
      результат в превью своей платформы. Поддержка тегов на GitHub приведена по документации
      GitHub и списку разрешённых тегов html-pipeline; внутренний фильтр GitHub может отличаться.</p>
  - id: 'color-text'
    title: 'Цветной текст и цветной маркер'
    html: |2-
      <p>Цвет в Markdown задают HTML-атрибутом <code>style</code>:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Markdown</span></div>
          <pre><code>&lt;span style="color: red"&gt;Красный текст&lt;/span&gt;
      &lt;mark style="background: lightgreen"&gt;Зелёный маркер&lt;/mark&gt;</code></pre>
      </div>
      <p>В локальных редакторах (Typora, VS Code, Obsidian) это работает, а GitHub атрибут
      <code>style</code> вырезает. На GitHub цвет можно получить через формулу:
      <code>$\color{red}{\text{красный текст}}$</code> — подробнее о формулах в статье про <a
      href="/blog/markdown-mathjax-katex-latex-math">MathJax и KaTeX в Markdown</a>. Пользуйтесь этим
      приёмом умеренно: текст внутри формулы не ищется и хуже читается скринридерами.</p>
  - id: 'academic-style'
    title: 'Правки в научных работах и рецензиях'
    html: |2-
      <p>В чистовых версиях дипломов и диссертаций зачёркивание и маркер не используют. Зато на этапе
      согласования черновика с научным руководителем они наглядно показывают правки:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Markdown</span></div>
          <pre><code>Погрешность составила ~~5 %~~ &lt;ins&gt;3,2 %&lt;/ins&gt; после повторной калибровки.
      &lt;mark&gt;Проверить вывод по разделу 2&lt;/mark&gt;</code></pre>
      </div>
      <p>Так руководитель видит, что было и что стало. Перед сдачей уберите разметку: оставьте только
      новый текст и снимите выделение.</p>
  - id: 'faq'
    title: 'Частые вопросы'
    html: |2-
      <h3>Как подчеркнуть текст на GitHub?</h3>
      <p>Тегом <code>&lt;ins&gt;текст&lt;/ins&gt;</code> — так советует документация GitHub. Тег
      <code>&lt;u&gt;</code> там работает ненадёжно, а <code>__текст__</code> даст жирный шрифт.</p>
      <h3>Почему ==текст== не работает?</h3>
      <p>Это не часть CommonMark и GFM, а расширение отдельных редакторов (Obsidian, Typora, Pandoc с
      <code>+mark</code>). На GitHub и в Labkeeper используйте
      <code>&lt;mark&gt;текст&lt;/mark&gt;</code>.</p>
      <h3>Как зачеркнуть текст в LaTeX?</h3>
      <p>Подключите <code>\usepackage[normalem]{ulem}</code> и пишите <code>\sout{текст}</code>.
      Опция <code>normalem</code> сохраняет обычный курсив для <code>\emph</code>. Подчёркивание с
      переносом строк — <code>\uline{текст}</code> из того же пакета.</p>
      <h3>Почему зачёркивание пропадает в PDF?</h3>
      <p>При печати превью из браузера оно сохраняется. При сборке PDF через LaTeX
      <code>~~текст~~</code> становится командой <code>\st</code> пакета <code>soul</code>: если пакет
      не подключён, сборка остановится с ошибкой. Добавьте <code>\usepackage{soul}</code> в
      преамбулу.</p>
tips:
  - title: 'Не путайте тильду со знаком подчёркивания'
    html: |2-
      <p>Одиночные знаки подчёркивания <code>_текст_</code> делают текст <em>курсивом</em>, двойные
      <code>__текст__</code> — <strong>жирным</strong>. Для подчёркивания используйте
      <code>&lt;ins&gt;</code> или <code>&lt;u&gt;</code>.</p>
editorExample:
  - type: 'latex'
    text: |2-
      \documentclass[a4paper,12pt]{article}
      \usepackage{cmap}
      \usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[english,russian]{babel}
      \usepackage{soul}             % для ~~зачёркивания~~ из Markdown
      \usepackage[normalem]{ulem}   % \sout и \uline в LaTeX
      \setcounter{secnumdepth}{0}
      \begin{document}
  - type: 'markdown'
    text: |2-
      ## Правки в черновике

      Срок сдачи: ~~15 мая~~ 22 мая.

      Погрешность составила ~~5 %~~ <ins>3,2 %</ins>, <u>подчёркнутый текст</u> и <mark>выделение маркером</mark>.
  - type: 'latex'
    text: |2-
      В LaTeX: \sout{старое значение} новое значение, \uline{подчёркнутый текст}.
      \end{document}
