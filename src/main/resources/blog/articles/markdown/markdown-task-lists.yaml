sections:
  - id: 'intro'
    title: 'Что такое чек-листы в Markdown'
    html: |-
      <p>Чек-лист, или список задач (task list), — расширение Markdown из&nbsp;спецификации
      <strong>GitHub Flavored Markdown (GFM)</strong>. Оно превращает пункты обычного списка в&nbsp;пункты
      с&nbsp;флажками. Такие списки популярны в&nbsp;open-source: например, в&nbsp;описаниях issues
      и&nbsp;в&nbsp;нашем <a href="/blog/github-readme-template-badges-spoilers">шаблоне README.md для
      GitHub</a>.</p>
      <p>В&nbsp;учёбе и&nbsp;исследованиях чек-лист — удобный личный план работы:</p>
      <ul>
          <li>пошаговый контроль хода эксперимента;</li>
          <li>учёт замечаний научного руководителя при подготовке диплома;</li>
          <li>перечень реактивов, приборов и&nbsp;калибровочных процедур.</li>
      </ul>
  - id: 'syntax'
    title: 'Синтаксис чек-листа: - [ ] и - [x]'
    html: |-
      <p><strong>Коротко:</strong> чтобы сделать чек-бокс в&nbsp;Markdown, начните пункт списка
      с&nbsp;<code>- [ ] </code> (пустой) или <code>- [x] </code> (отмеченный). Такой синтаксис
      понимают GitHub, GitLab, Obsidian и&nbsp;Labkeeper.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Markdown</span></div>
          <pre><code>- [ ] Невыполненная задача
      - [x] Выполненная задача</code></pre>
      </div>
      <p>Правила разметки:</p>
      <ul>
          <li>в&nbsp;начале — маркер списка (<code>-</code>, <code>*</code> или <code>+</code>) и&nbsp;пробел;</li>
          <li>затем квадратные скобки: внутри либо пробел (задача не&nbsp;выполнена), либо латинская
          <code>x</code> или <code>X</code> (выполнена);</li>
          <li>после закрывающей скобки — обязательно пробел и&nbsp;текст задачи.</li>
      </ul>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Markdown</span></div>
          <pre><code>### План подготовки измерительного стенда

      - [x] Проверить контур заземления прибора
      - [x] Откалибровать термопару при температуре 20 °C
      - [ ] Выполнить серию из 10 контрольных измерений
      - [ ] Записать результаты в электронный журнал</code></pre>
      </div>
      <p>В&nbsp;превью <strong>Labkeeper</strong> галочки отображаются, но&nbsp;кликом не&nbsp;переключаются:
      чтобы отметить пункт, замените в&nbsp;тексте <code>[ ]</code> на&nbsp;<code>[x]</code>.</p>
  - id: 'nested'
    title: 'Вложенные и нумерованные чек-листы'
    html: |-
      <p>Этапы работы удобно разбивать на&nbsp;подзадачи. Вложенный уровень создаётся отступом: под
      пунктом с&nbsp;маркером <code>-</code> достаточно 2 пробелов (часто пишут 4):</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Markdown</span></div>
          <pre><code>- [ ] Этап 1: подготовка образцов
        - [x] Взвешивание навесок на аналитических весах
        - [ ] Растворение в буферном растворе pH 7,4
      - [ ] Этап 2: спектрофотометрия
        - [ ] Прогрев спектрофотометра в течение 15 минут
        - [ ] Измерение оптической плотности контрольной кюветы</code></pre>
      </div>
      <p>Чек-лист может быть и&nbsp;нумерованным: <code>1. [ ] Задача</code>. Тогда вложенный список
      сдвигают минимум на&nbsp;3 пробела, по&nbsp;ширине маркера <code>1.</code> с&nbsp;пробелом. Отступа
      в&nbsp;2 пробела под&nbsp;нумерованным пунктом не&nbsp;хватит, и&nbsp;подзадачи окажутся
      на&nbsp;верхнем уровне. Python-Markdown (MkDocs) требует 4 пробела для любых вложенных списков.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Markdown</span></div>
          <pre><code>1. [ ] Этап 1
         - [ ] Подзадача (отступ 3 пробела)
         - [ ] Ещё одна подзадача
      2. [ ] Этап 2</code></pre>
      </div>
      <p>Как устроены обычные многоуровневые списки в&nbsp;LaTeX, рассказано в&nbsp;статье <a
      href="/blog/latex-nested-lists-enumerate-itemize">о&nbsp;списках enumerate и&nbsp;itemize</a>.</p>
  - id: 'formatting-inside'
    title: 'Код, формулы и ссылки внутри пунктов'
    html: |-
      <p>Внутри пунктов работает обычное форматирование Markdown: ссылки, полужирный шрифт, инлайн-код
      (подробнее — в&nbsp;статье о&nbsp;<a href="/blog/markdown-code-syntax-highlighting">подсветке
      кода в&nbsp;Markdown</a>) и&nbsp;формулы LaTeX (см.&nbsp;<a
      href="/blog/markdown-mathjax-katex-latex-math">формулы в&nbsp;Markdown</a>):</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Markdown</span></div>
          <pre><code>- [x] Установить библиотеку `scipy` версии не ниже **1.10**
      - [x] Проверить критерий сходимости $R^2 \ge 0{,}98$
      - [ ] Скачать методические указания по [ссылке на кафедральный портал](https://example.com/metodichka.pdf)</code></pre>
      </div>
  - id: 'platforms'
    title: 'Где работают чек-листы'
    html: |-
      <p>Синтаксис один, а&nbsp;поведение на&nbsp;разных платформах отличается:</p>
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead>
                  <tr><th>Платформа</th><th>Отображение</th><th>Клик переключает</th><th>Особенности</th></tr>
              </thead>
              <tbody>
                  <tr><td>GitHub (issues, PR, комментарии)</td><td>да</td><td>да, при праве на&nbsp;редактирование</td><td>счётчик «N of M tasks»</td></tr>
                  <tr><td>GitHub (README и&nbsp;другие файлы)</td><td>да</td><td>нет</td><td>без счётчика</td></tr>
                  <tr><td>GitLab</td><td>да</td><td>да, в&nbsp;issues и&nbsp;merge requests</td><td><code>- [~]</code> — «неприменимо», пункт зачёркивается</td></tr>
                  <tr><td>Obsidian</td><td>да</td><td>да, в&nbsp;режиме чтения и&nbsp;Live Preview</td><td>любой символ в&nbsp;скобках считается отметкой; <code>[/]</code>, <code>[-]</code> используют темы и&nbsp;плагин Tasks</td></tr>
                  <tr><td>VS Code (превью)</td><td>зависит от&nbsp;версии и&nbsp;расширений</td><td>нет</td><td></td></tr>
                  <tr><td>Notion</td><td><code>[]</code> и&nbsp;пробел создают блок To-do</td><td>да</td><td>при импорте Markdown пункты превращаются в&nbsp;To-do</td></tr>
                  <tr><td>Labkeeper</td><td>да</td><td>нет</td><td>отмечайте, меняя <code>[ ]</code> на&nbsp;<code>[x]</code></td></tr>
              </tbody>
          </table>
      </div>
      <p>Блоки <code>```[tasklist]</code>, которые GitHub одно время тестировал в&nbsp;issues, убраны,
      им на&nbsp;смену пришли sub-issues. Если в&nbsp;issue нужна иерархия задач, используйте sub-issues,
      а&nbsp;чек-лист в&nbsp;описании оставьте простым списком.</p>
  - id: 'lab-example'
    title: 'Пример чек-листа для лабораторной работы'
    html: |-
      <p>Чек-лист удобно вести как личный план лабораторной: что подготовить, измерить и&nbsp;оформить.
      В&nbsp;чистовой отчёт по&nbsp;ГОСТ чек-боксы обычно не&nbsp;включают — для отчёта есть <a
      href="/blog/ideal-lab-report-template-gost-online">готовый шаблон лабораторной</a>.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Markdown</span></div>
          <pre><code>## План лабораторной работы

      - [x] Пройти инструктаж по технике безопасности
      - [x] Выполнить теоретический расчёт погрешностей
      - [ ] Собрать схему измерений и показать преподавателю
      - [ ] Выставить напряжение источника $U = 12~\text{В}$
      - [ ] Внести показания амперметра в протокол</code></pre>
      </div>
      <p>В&nbsp;Markdown-проекте <strong>Labkeeper</strong> кнопка «Сохранить в&nbsp;PDF» открывает
      печать браузера, и&nbsp;чек-боксы попадают на&nbsp;лист такими же, как в&nbsp;превью. Подробнее —
      в&nbsp;статье <a href="/blog/markdown-to-pdf-export">о&nbsp;сохранении Markdown в&nbsp;PDF</a>.</p>
      <p>В&nbsp;LaTeX-проекте Markdown-фрагмент переводится в&nbsp;LaTeX через Pandoc. В&nbsp;нашей
      проверке (Pandoc&nbsp;3.1) чек-листы превращаются в&nbsp;обычный маркированный список, где
      <code>[ ]</code> и&nbsp;<code>[x]</code> остаются текстом. Галочек нет, зато документ собирается
      без&nbsp;дополнительных пакетов.</p>
  - id: 'pitfalls'
    title: 'Типичные ошибки'
    html: |-
      <ul>
          <li><strong>Нет пробела внутри скобок.</strong> <code>- []</code> не&nbsp;распознаётся. Внутри
          скобок должен стоять один пробельный символ (пробел или табуляция): <code>- [ ]</code>.</li>
          <li><strong>Нет пробелов вокруг скобок.</strong> <code>-[ ]</code> или <code>- [ ]Текст</code>
          ломают разметку: после маркера и&nbsp;после <code>]</code> пробел обязателен.</li>
          <li><strong>Нет маркера списка.</strong> Строка <code>[ ] задача</code> останется текстом,
          нужен <code>- [ ] задача</code>.</li>
          <li><strong>Русская «х».</strong> Отметка распознаётся только с&nbsp;латинской буквой:
          <code>- [x]</code> или <code>- [X]</code>.</li>
          <li><strong>Пустые строки между пунктами.</strong> Список становится «свободным» (loose):
          на&nbsp;GitHub между пунктами появляются большие интервалы.</li>
          <li><strong>Мало пробелов под&nbsp;нумерованным пунктом.</strong> Под&nbsp;<code>1.</code>
          вложенный список сдвигают минимум на&nbsp;3 пробела.</li>
      </ul>
  - id: 'tips'
    title: 'Практические советы'
    html: |-
      <div class="article-tips">
          <div class="article-tip">
              <div class="article-tip__number">1</div>
              <div class="article-tip__content">
                  <h3>Отменённые пункты</h3>
                  <p>Отменённый пункт не&nbsp;отмечайте как выполненный: счётчик GitHub посчитает его
                  сделанным. Оставьте флажок пустым и&nbsp;зачеркните текст:
                  <code>- [ ] ~~Предварительный прогрев реактора~~ — отменено</code>. В&nbsp;GitLab для
                  этого есть <code>- [~]</code>. Все способы зачёркивания собраны в&nbsp;статье <a
                  href="/blog/markdown-strikethrough-underline-highlight">о&nbsp;зачёркнутом
                  и&nbsp;выделенном тексте</a>.</p>
              </div>
          </div>
          <div class="article-tip">
              <div class="article-tip__number">2</div>
              <div class="article-tip__content">
                  <h3>Счётчик выполнения на&nbsp;GitHub</h3>
                  <p>Если чек-лист стоит в&nbsp;описании issue или pull request, GitHub показывает
                  индикатор готовности, например <code>4 of 6 tasks</code>. В&nbsp;файлах репозитория,
                  например в&nbsp;README.md, счётчика нет.</p>
              </div>
          </div>
      </div>
  - id: 'faq'
    title: 'Частые вопросы'
    html: |-
      <h3>Как поставить галочку в Markdown?</h3>
      <p>Замените пробел в&nbsp;скобках на&nbsp;латинскую <code>x</code>: <code>- [x] Задача</code>.
      На&nbsp;GitHub, GitLab и&nbsp;в&nbsp;Obsidian галочку можно поставить и&nbsp;кликом.</p>
      <h3>Почему чек-бокс не отображается?</h3>
      <p>Проверьте маркер списка и&nbsp;пробелы: нужен <code>- [ ] </code> с&nbsp;пробелом после
      <code>-</code>, внутри скобок и&nbsp;после <code>]</code>. Ещё одна причина — платформа без
      поддержки GFM: в&nbsp;базовом Markdown чек-листов нет.</p>
      <h3>Можно ли сделать нумерованный чек-лист?</h3>
      <p>Да: <code>1. [ ] Задача</code>. Подзадачи под&nbsp;таким пунктом сдвигайте минимум
      на&nbsp;3 пробела.</p>
      <h3>Попадут ли галочки в PDF?</h3>
      <p>Из&nbsp;Markdown-проекта Labkeeper — да, PDF сохраняется через печать браузера и&nbsp;выглядит
      как превью. Во&nbsp;фрагменте внутри LaTeX-проекта вместо флажков останется текст
      <code>[ ]</code> и&nbsp;<code>[x]</code>.</p>
      <p>Пример связи требований со списком приёмки есть в статье о <a href="/blog/website-technical-specification-requirements-acceptance">техническом задании на сайт</a>.</p>
editorExample:
  markdown: |-
    # План эксперимента

    - [x] Подготовить приборы
      - [x] Вольтметр
      - [ ] Амперметр
    - [ ] Проверить, что $R^2 \ge 0{,}98$
    - [ ] ~~Повторная калибровка~~ — отменено
    - [ ] Оформить отчет
