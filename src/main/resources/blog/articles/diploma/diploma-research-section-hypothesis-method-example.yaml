sections:
  - id: 'task'
    title: 'Чем исследовательский раздел отличается от описания разработки'
    html:
      '<p>Фраза «разработан модуль поиска» сообщает о результате программирования, но не объясняет, какой вопрос исследовали и как оценили решение. В исследовательской части нужны вопрос, обоснованный способ проверки и вывод, который следует из полученных данных.</p>

      <p>Рассмотрим короткий учебный раздел о поиске записей в каталоге. Все числа и результаты вымышлены; пример показывает устройство текста, а не проведённое исследование. Состав и название раздела согласуйте с руководителем и методичкой. Раздел 5.8 <a href="https://mpei.ru/Science/ScienceDocuments/Documents/0_GOST_7.32-2017.pdf" target="_blank" rel="noopener noreferrer">ГОСТ 7.32-2017</a> описывает основную часть отчёта о НИР: выбор направления, методы и процесс исследования, оценку результатов. Это не универсальная структура каждой ВКР.</p>

      <p>Обоснование темы и задачи работы относятся к <a href="/blog/diploma-introduction-structure-example">введению</a>; существующие решения и их ограничения — к <a href="/blog/literature-review-structure-diploma-citation">обзору литературы</a>. Здесь покажем, как перейти от них к проверке конкретного предположения.</p>'
  - id: 'hypothesis'
    title: 'Сформулируйте вопрос и критерий до проверки'
    html:
      '<p>В нашей модели исходный поиск различает прописные и строчные буквы. Вопрос исследования: повысится ли число верных ответов, если приводить запрос и названия записей к нижнему регистру? Меняем только одно правило, чтобы результат можно было связать именно с ним.</p><div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Элемент</th><th>Учебная формулировка</th></tr></thead><tbody><tr><td>Объект</td><td>Поиск записей в учебном каталоге</td></tr>

      <tr><td>Предмет</td><td>Влияние нормализации регистра на результат точного поиска</td></tr>

      <tr><td>Гипотеза</td><td>После нормализации верно обрабатываются не менее 19 из 20 заданных запросов</td></tr>

      <tr><td>Критерий успеха запроса</td><td>Весь возвращённый список совпадает с заранее заданным ожидаемым</td></tr>

      <tr><td>Условие сравнения</td><td>Один каталог, одни запросы, одинаковые правила кроме обработки регистра</td></tr></tbody></table></div><p>Порог 19 из 20 выбран для упражнения, а не установлен стандартом. В своей работе объясните его связь с задачей. Не подбирайте критерий после просмотра результатов: иначе он перестанет служить независимым условием проверки.</p>'
  - id: 'protocol'
    title: 'Опишите воспроизводимую методику'
    html:
      '<p>Другой человек должен суметь повторить действия и проверить ответы. Сохраните версию каталога, список запросов, ожидаемые ответы, версии обеих реализаций и правила сравнения. Если запрос не должен ничего находить, корректный пустой список тоже считается верным ответом.</p>

      <ol><li>До запуска подготовьте фиксированный набор из 20 запросов, включая варианты регистра, отсутствие совпадения и опечатки. Укажите, как и зачем выбраны случаи.</li><li>Задайте ожидаемый список для каждого запроса независимо от вывода программы.</li><li>Выполните исходный и изменённый поиск на одном каталоге.</li><li>Сохраните по каждому запросу ожидаемый и оба фактических ответа, а также признаки полного совпадения.</li><li>Подсчитайте верные ответы и отдельно разберите случаи, где реализации различаются.</li></ol>

      <p>Итогового числа недостаточно: сохранённый протокол показывает, какие именно случаи дали улучшение и не появились ли новые ошибки. Не добавляйте в вывод сравнение скорости, если время не измеряли. Для измеряемых величин отдельно понадобятся условия, повторения и <a href="/blog/experiment-results-analysis-lab-report">анализ результатов эксперимента</a>.</p>'
  - id: 'fragment'
    title: 'Оформите постановку и методику в LaTeX'
    html:
      '<p>Кнопка «Просмотреть пример» открывает небольшой раздел с тремя подразделами: постановка, методика, результат. Использованы общие настройки страницы, интервала и заголовков отчётного примера; при переносе в ВКР наследуйте оформление основного документа. Титул, обзор и приложения в этот фрагмент не входят.</p>

      <p>Следующий код вставляется в тело документа. Название раздела измените под свою задачу, а гипотезу согласуйте с реальным критерием.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>

      <pre><code>\section{Проверка правила поиска}\label{sec:research}

      Это учебный пример исследовательского раздела.

      Все данные вымышлены; реальные испытания не проводились.

      \subsection{Вопрос и гипотеза}

      Объект исследования --- поиск записей в учебном каталоге.

      Предмет --- влияние нормализации регистра на результат точного поиска.

      Гипотеза: нормализация позволит правильно обработать не менее

      19 из 20 заранее подготовленных запросов.</code></pre>

      </div><p>За постановкой идёт описание действий. Для реального исследования дополните его идентификаторами файлов протокола и версиями программ, чтобы читатель мог найти использованные материалы.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>

      <pre><code>\subsection{Методика}

      Каталог и 20 запросов фиксируются до проверки.

      Для каждого запроса заранее задан ожидаемый список записей,

      включая пустой список при отсутствии совпадения.

      Исходный поиск сравнивает строки с учётом регистра.

      Изменённый поиск приводит запрос и названия к нижнему регистру;

      остальные правила остаются одинаковыми.

      Успехом считается точное совпадение всего списка с ожидаемым.

      Для каждого запроса сохраняются оба ответа и отметки совпадения.</code></pre>

      </div>'
  - id: 'result'
    title: 'Свяжите вывод с критерием и ограничениями'
    html:
      '<p>В учебном протоколе исходный поиск дал 14 верных ответов из 20, изменённый — 18. Четыре запроса стали обрабатываться верно, остальные ответы не изменились. Оставшиеся два запроса содержали опечатки. Подсчёт согласован: 18 верных и 2 неверных ответа составляют весь набор из 20.</p>

      <p>Улучшение есть, но заранее заданный порог 19 не достигнут. Поэтому нельзя писать «гипотеза подтверждена» или «проблема поиска решена». Короткий вывод должен сохранить и результат, и ограничение.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>

      <pre><code>\subsection{Учебный результат и ограничения}

      В вымышленном протоколе исходный поиск дал 14 верных ответов из 20,

      а изменённый --- 18 из 20. Дополнительно обработаны верно

      четыре запроса; на остальных ответы не изменились.

      Заранее заданный порог 19 из 20 не достигнут.

      Два оставшихся запроса содержали опечатки; нормализация регистра

      их не исправляет.

      Результат относится только к этому набору и не доказывает

      качество поиска на произвольных данных.

      Следующий шаг --- отдельно проверить обработку опечаток

      на новом наборе запросов.</code></pre>

      </div><div class="article-note"><strong>Отрицательный результат тоже отвечает на вопрос.</strong> Порог не достигнут в заданных условиях. Это не доказывает бесполезность нормализации и не позволяет распространить результат на любой каталог. Укажите границы проверки и следующий шаг, а не меняйте гипотезу задним числом.</div>'
  - id: 'check'
    title: 'Что заменить в примере для своей работы'
    html:
      '<ul><li>Сформулируйте собственный вопрос и объясните его связь с ограничениями существующих решений.</li><li>Задайте критерий и условия до проверки, опишите способ получения данных.</li><li>Внесите реальные результаты и приведите ссылку на протокол или приложение с материалами.</li><li>Согласуйте числа во всех абзацах: общий объём, верные и неверные ответы должны сходиться.</li><li>Отделите наблюдаемый результат от причинного объяснения и от планов дальнейшей работы.</li></ul>

      <p>Пример содержит текст, а не автоматический эксперимент: при замене чисел пересчитайте итог и перепишите вывод самостоятельно. В <a href="/blog/diploma-conclusion-structure-example">заключении ВКР</a> затем кратко сопоставьте результат с задачей, сохранив существенные ограничения из исследовательского раздела.</p>'
