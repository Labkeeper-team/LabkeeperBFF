sections:
  - id: 'requirements'
    title: 'Выберите требования и один основной шаблон'
    html: '<p>Оформление ВКР удобнее начинать с согласованной методички, а не с отдельных исправлений перед сдачей. Сохраните актуальный документ кафедры, образец титула, состав разделов и требования к электронной версии.</p><p><a href="https://mpei.ru/Science/ScienceDocuments/Documents/0_GOST_7.32-2017.pdf" target="_blank" rel="noopener noreferrer">ГОСТ 7.32-2017</a> задаёт структуру и оформление отчёта о НИР. Для ВКР применимость и дополнительные требования определяет организация. Если нужны рамки ЕСКД, используйте соответствующий шаблон, а не смешивайте его настройки с обычной запиской.</p><p>Эта статья — карта переходов к подробным руководствам. Полный код не дублируется: выберите <a href="/blog/latex-diploma-gost">основной шаблон курсовой и диплома</a>, а затем добавляйте нужные элементы по ссылкам ниже.</p>'
  - id: 'page'
    title: 'Страница, текст и заголовки'
    html:
      '<div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Задача</th><th>Подробное руководство</th></tr></thead><tbody><tr><td>Задать формат и поля</td><td><a href="/blog/latex-geometry-margins-gost">Поля страницы в LaTeX</a></td></tr>

      <tr><td>Согласовать красную строку</td><td><a href="/blog/paragraph-indent-1-25-gost">Абзацный отступ 1,25 см</a></td></tr>

      <tr><td>Настроить интервал</td><td><a href="/blog/latex-line-spacing-1-5-setspace-gost">Полуторный интервал</a></td></tr>

      <tr><td>Проверить титул</td><td><a href="/blog/latex-titlepage">Титульный лист</a></td></tr>

      <tr><td>Применить рамки по заданию</td><td><a href="/blog/latex-eskd">Оформление ЕСКД</a></td></tr></tbody></table></div><p>Настройки должны быть общими для документа. Не создавайте заголовки вручную увеличением шрифта и не набирайте отступы пробелами. После настройки проверьте первый абзац после заголовка и длинные названия разделов в PDF.</p>'
  - id: 'navigation'
    title: 'Содержание, номера и сокращения'
    html: '<p>Используйте автоматические номера и метки, чтобы перестановка разделов не оставляла старые ссылки. Для работы с навигацией нужны три отдельных шага:</p><ol><li>Настройте <a href="/blog/automatic-table-of-contents-diploma-gost">содержание</a> по реальной структуре.</li><li>Сверьте <a href="/blog/diploma-page-numbering-second-page">нумерацию страниц</a>, включая учитываемый титул.</li><li>При необходимости добавьте <a href="/blog/latex-abbreviations-list-gost-manual">перечень сокращений и обозначений</a>.</li></ol><p>После сборки проверьте совпадение названий и страниц. Рабочая ссылка в исходнике ещё не подтверждает правильную запись в окончательном PDF.</p>'
  - id: 'objects'
    title: 'Таблицы, рисунки, формулы и источники'
    html:
      '<div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Объект</th><th>Что проверить</th><th>Руководство</th></tr></thead><tbody><tr><td>Таблица</td><td>Единицы, ссылка до объекта, подпись и перенос</td><td><a href="/blog/diploma-data-tables-formatting-gost">Таблицы данных</a></td></tr>

      <tr><td>Рисунок</td><td>Подпись снизу, читаемость и отступы</td><td><a href="/blog/software-screenshots-report-gost-caption">Рисунки и снимки экрана</a></td></tr>

      <tr><td>Формула</td><td>Номер, метка, порядок пояснений</td><td><a href="/blog/formula-variable-explanation-where-gost">Пояснения переменных</a></td></tr>

      <tr><td>Источники</td><td>Реальные реквизиты и соответствие ссылкам</td><td><a href="/blog/latex-gost-bibliography">Библиография</a></td></tr>

      <tr><td>Приложения</td><td>Порядок упоминаний и нумерация</td><td><a href="/blog/diploma-appendices-listings-diagrams-gost">Приложения ВКР</a></td></tr></tbody></table></div><p>Проверяйте не только отдельный объект, но и переходы до и после него. Формула с пояснениями должна оставаться читаемым блоком, а рисунок — иметь свободное место до схемы и после подписи. Крупную таблицу не уменьшайте целиком ради одного листа.</p>'
  - id: 'workflow'
    title: 'Рабочий маршрут в редакторе'
    html:
      '<p>Следующий Markdown-список помогает отслеживать этапы. Он не является полным шаблоном ВКР и не проверяет документ автоматически.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">Markdown</span></div>

      <pre><code># Маршрут оформления ВКР


      Рабочая заметка: состав работы задаёт методичка кафедры.


      ## До начала


      - [ ] Сохранены актуальная методичка и образец.

      - [ ] Согласованы состав работы и порядок разделов.

      - [ ] Выбран основной шаблон и проверена его сборка.


      ## По мере написания


      - [ ] Настроены страница, текст и уровни заголовков.

      - [ ] Источники добавляются вместе со ссылками на них.

      - [ ] Таблицы, рисунки и формулы имеют согласованные метки.

      - [ ] При необходимости ведётся перечень сокращений.


      ## Перед сдачей


      - [ ] Обновлены содержание, номера и перекрёстные ссылки.

      - [ ] Сверены введение, результаты и заключение.

      - [ ] Проверены приложения и полный итоговый PDF.

      - [ ] Повторно выполнена проверка после последних правок.</code></pre>

      </div><p>«Просмотреть пример» открывает этот рабочий список. Замените пункты требованиями своей кафедры и отмечайте их после реальной проверки. За полным LaTeX-документом переходите к <a href="/blog/latex-diploma-gost">основному шаблону</a>, а не переносите заметку в текст ВКР как обязательный раздел.</p>'
  - id: 'final'
    title: 'Проверьте смысл и окончательную сборку'
    html: '<p>Оформление и содержание связаны, но проверяются разными действиями. Сопоставьте цель и задачи <a href="/blog/diploma-introduction-structure-example">введения</a> с результатами и <a href="/blog/diploma-conclusion-structure-example">заключением</a>. Затем обновите содержание, номера, список источников и приложения.</p><p>Используйте <a href="/blog/diploma-formatting-common-mistakes-checklist">чек-лист типичных ошибок оформления</a> для последнего прохода. При изменении после этой проверки пересоберите документ и повторите связанные пункты. Открывать для контроля нужно именно файл, который будет передан на сдачу.</p>'
