sections:
  - id: model
    title: Чем сетевой график помогает в дипломном проекте
    html: |-
      <p>Сетевая диаграмма показывает, какие работы зависят друг от друга и что определяет срок завершения проекта. На диаграмме «работы в узлах» (AON) прямоугольник обозначает работу, стрелка — зависимость. Расстояние между узлами не показывает длительность, как на календарной шкале диаграммы Ганта.</p>
      <p>Ниже — вымышленный проект подготовки прототипа из шести работ. Используем зависимости «окончание–начало» без задержек: следующая работа начинается после завершения всех ее предшественников. Длительности заданы в рабочих днях, начало отсчета — момент 0. Выходные и ограничения ресурсов пока не моделируются.</p>
      <p>Расчет прямым и обратным проходом разобран в <a href="https://www.pmi.org/learning/library/critical-path-method-calculations-scheduling-8040">материале PMI о методе критического пути</a>. Пример ниже применяет его к небольшой сети; он не является обязательным шаблоном из PMBOK.</p>
  - id: tasks
    title: Список работ и проверка зависимостей
    html: |-
      <div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Код</th><th>Работа</th><th>Длительность, раб. дней</th><th>Предшественники</th></tr>
      </thead>
      <tbody><tr><td>A</td><td>Согласовать требования</td><td>2</td><td>Нет</td></tr>
      <tr><td>B</td><td>Подготовить прототип</td><td>4</td><td>A</td></tr>
      <tr><td>C</td><td>Подготовить данные</td><td>3</td><td>A</td></tr>
      <tr><td>D</td><td>Проверить прототип с данными</td><td>5</td><td>B, C</td></tr>
      <tr><td>E</td><td>Подготовить инструкцию</td><td>2</td><td>C</td></tr>
      <tr><td>F</td><td>Передать результат</td><td>1</td><td>D, E</td></tr>
      </tbody>
      </table>
      </div>
      <p>B и C могут выполняться параллельно. D ждет завершения обеих; F ждет D и E. Объясните каждую стрелку через необходимый результат предшественника, а не через привычный порядок пунктов в списке.</p>
      <p>До расчета проверьте отсутствие циклов и потерянных работ. Все работы примера должны вести к F. Если конечных работ несколько, удобно добавить общую завершающую веху длительностью 0. Циклическая зависимость не допускает обычного расчета критического пути.</p>
  - id: forward
    title: 'Прямой проход: раннее начало и окончание'
    html: |-
      <p>Для начальной работы $ES=0$. Для остальных берем максимум ранних окончаний всех предшественников, затем прибавляем длительность:</p>
      <p>$$ES_i= \max_{j\in Pred(i)}EF_j,\qquad EF_i=ES_i+d_i.$$</p>
      <p>A идет от 0 до 2; B — от 2 до 6; C — от 2 до 5. Для D получаем $ES_D= \max(6,5)=6$, $EF_D=11$. E идет от 5 до 7. Работа F начинается в $\max(11,7)=11$ и завершается в 12.</p>
      <p>Полученный срок — 12 рабочих дней. При отсчете от нуля не нужно прибавлять единицу к каждой зависимости. Конкретные даты рассчитываются позже с учетом рабочего календаря.</p>
  - id: backward
    title: 'Обратный проход: поздние сроки и полный резерв'
    html: |-
      <p>Для F принимаем позднее окончание равным сроку проекта: $LF_F=12$. Двигаясь назад, берем минимум поздних начал всех непосредственных последователей:</p>
      <p>$$LF_i= \min_{k\in Succ(i)}LS_k,\qquad LS_i=LF_i-d_i,\qquad R_i=LS_i-ES_i.$$</p>
      <div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Работа</th><th>ES</th><th>EF</th><th>LS</th><th>LF</th><th>Полный резерв</th></tr>
      </thead>
      <tbody><tr><td>A</td><td>0</td><td>2</td><td>0</td><td>2</td><td>0</td></tr>
      <tr><td>B</td><td>2</td><td>6</td><td>2</td><td>6</td><td>0</td></tr>
      <tr><td>C</td><td>2</td><td>5</td><td>3</td><td>6</td><td>1</td></tr>
      <tr><td>D</td><td>6</td><td>11</td><td>6</td><td>11</td><td>0</td></tr>
      <tr><td>E</td><td>5</td><td>7</td><td>9</td><td>11</td><td>4</td></tr>
      <tr><td>F</td><td>11</td><td>12</td><td>11</td><td>12</td><td>0</td></tr>
      </tbody>
      </table>
      </div>
      <p>У C два последователя: D и E. Поэтому $LF_C=\min(6,9)=6$, а не 9. Полный резерв C — один день, E — четыре. Полный резерв показывает допустимое смещение работы при сохранении срока проекта в данной модели. Свободный резерв относится к сохранению раннего начала последователей и может отличаться.</p>
      <p>Работы A, B, D, F образуют непрерывный путь с нулевыми резервами. Его длина — $2+4+5+1=12$ дней. Это критический путь: самый длинный путь в сети, задающий минимальный срок по принятым ограничениям. В других сетях критических путей может быть несколько.</p>
  - id: diagram
    title: Как показать схему и проверить изменение плана
    html: |-
      <p>LaTeX-пример ниже рисует сеть средствами <a href="https://ctan.org/pkg/pgf">PGF/TikZ</a>. Внутри узлов стоят код и длительность; критический путь выделен толщиной черных стрелок. Схема остается понятной при черно-белой печати. Расчет сроков выполняется в вычислительном сегменте, TikZ отвечает за изображение.</p>
      <p>Измените длительность C с трех до пяти дней: D начнется в 7, закончится в 12, F завершится в 13. Критическим станет A–C–D–F. При такой правке нужно обновить таблицу исходных данных, узел C и текст вывода вместе с расчетом: фиксированные подписи сами не перепишутся.</p>
      <p>Сложение резервов C и E даст неверное представление о допустимой задержке. Резервы зависят от общей сети и пересчитываются после изменения сроков. Если B и C выполняет один человек, предположение о параллельности также требует пересмотра.</p>
      <p>В <a href="/blog/diploma-assignment-form-calendar-schedule-gost">календарном плане ВКР</a> покажите даты и контрольные точки, а сеть используйте для обоснования порядка работ. Не объявляйте расчетные 12 дней гарантированным сроком без учета ресурсов и рисков.</p>
  - id: editor
    title: Редактируемый пример и проверка PDF
    html: |-
      <p>В примере уже настроены поля, интервалы и заголовки с учётом <a href="https://mpei.ru/Science/ScienceDocuments/Documents/0_GOST_7.32-2017.pdf">ГОСТ 7.32-2017</a>. Для ВКР сверьте оформление с методичкой вашей кафедры.</p>
       <p>При вставке в основной документ используйте его преамбулу, счетчики разделов и сквозную нумерацию страниц. Титульный лист, содержание, введение и приложения в этот фрагмент не входят. Каждый раздел начинается с новой страницы; подписи таблиц находятся сверху слева, ссылки на таблицы даны в тексте.</p>
      <p>Сначала добавьте вычислительный сегмент, затем LaTeX-сегмент. Расчет можно скрыть: исходные данные, формулы и результаты остаются в печатном документе. Кнопка примера открывает оба сегмента в нужном порядке.</p>
      <div class="article-code"><div class="article-code__header"><span class="article-code__lang">Вычислительный сегмент</span></div>
      <pre><code>d_A = 2
      d_B = 4
      d_C = 3
      d_D = 5
      d_E = 2
      d_F = 1
      es_A = 0
      ef_A = es_A + d_A
      es_B = ef_A
      ef_B = es_B + d_B
      es_C = ef_A
      ef_C = es_C + d_C
      es_D = max([ef_B, ef_C])
      ef_D = es_D + d_D
      es_E = ef_C
      ef_E = es_E + d_E
      es_F = max([ef_D, ef_E])
      ef_F = es_F + d_F
      lf_F = ef_F
      ls_F = lf_F - d_F
      lf_D = ls_F
      ls_D = lf_D - d_D
      lf_E = ls_F
      ls_E = lf_E - d_E
      lf_B = ls_D
      ls_B = lf_B - d_B
      lf_C = min([ls_D, ls_E])
      ls_C = lf_C - d_C
      lf_A = min([ls_B, ls_C])
      ls_A = lf_A - d_A
      r_A = ls_A - es_A
      r_B = ls_B - es_B
      r_C = ls_C - es_C
      r_D = ls_D - es_D
      r_E = ls_E - es_E
      r_F = ls_F - es_F</code></pre></div>
