  - type: computational
    text: |-
      d_A = 2
      d_B = 4
      d_C = 3
      d_D = 5
      d_E = 2
      d_F = 1
      es_A = 0
      ef_A = es_A + d_A
      es_B = ef_A
      ef_B = es_B + d_B
      es_C = ef_A
      ef_C = es_C + d_C
      es_D = max([ef_B, ef_C])
      ef_D = es_D + d_D
      es_E = ef_C
      ef_E = es_E + d_E
      es_F = max([ef_D, ef_E])
      ef_F = es_F + d_F
      lf_F = ef_F
      ls_F = lf_F - d_F
      lf_D = ls_F
      ls_D = lf_D - d_D
      lf_E = ls_F
      ls_E = lf_E - d_E
      lf_B = ls_D
      ls_B = lf_B - d_B
      lf_C = min([ls_D, ls_E])
      ls_C = lf_C - d_C
      lf_A = min([ls_B, ls_C])
      ls_A = lf_A - d_A
      r_A = ls_A - es_A
      r_B = ls_B - es_B
      r_C = ls_C - es_C
      r_D = ls_D - es_D
      r_E = ls_E - es_E
      r_F = ls_F - es_F
