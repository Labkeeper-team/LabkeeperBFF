    text: |-
      \documentclass[a4paper,14pt]{extarticle}
      \usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[russian]{babel}
      \usepackage{tempora,amsmath,setspace,indentfirst,tabularx,array,titlesec,caption,needspace}
      \usepackage[left=30mm,right=15mm,top=20mm,bottom=20mm]{geometry}
      \onehalfspacing
      \setlength{\parindent}{1.25cm}
      \titleformat{\section}{\normalfont\bfseries\hyphenpenalty=10000\relax\exhyphenpenalty=10000\relax}{\thesection}{1em}{}
      \titlespacing{\section}{\parindent}{0pt}{12pt}
      \newcommand{\reportsection}[1]{\clearpage\section{#1}}
      \DeclareCaptionLabelSeparator{gostdash}{\space---\space}
      \captionsetup{labelsep=gostdash,font={normalsize,singlespacing}}
      \captionsetup[table]{justification=raggedright,singlelinecheck=false}
      \captionsetup[figure]{justification=centering,singlelinecheck=false}
      \DeclareCaptionTextFormat{gosttitle}{\hyphenpenalty=10000\relax\exhyphenpenalty=10000\relax#1}
      \captionsetup{textformat=gosttitle}
      \AtBeginDocument{%
          \setlength{\abovedisplayskip}{\baselineskip}%
          \setlength{\belowdisplayskip}{\baselineskip}%
          \setlength{\abovedisplayshortskip}{\baselineskip}%
          \setlength{\belowdisplayshortskip}{\baselineskip}}
      \addto\captionsrussian{\renewcommand{\figurename}{Рисунок}}
      \pagestyle{plain}
      \newcolumntype{Y}{>{\raggedright\arraybackslash}X}
      \setlength{\emergencystretch}{2em}
      \usepackage{tikz}
      \usetikzlibrary{arrows.meta}
      \begin{document}
      \reportsection{Сетевая модель учебного проекта}
      Все работы и длительности условны. Использованы зависимости
      <<окончание--начало>> без задержек, единый календарь рабочих дней
      и начало отсчета $t=0$. Ресурсов достаточно для параллельных работ.
      Узлы обозначают работы, стрелки --- зависимости, а не масштаб времени.
      Исходный состав работ дан в таблице~\ref{tab:tasks}.

      \begin{table}[htbp]
      \caption{Работы учебного проекта}
      \label{tab:tasks}
      \begin{tabularx}{\textwidth}{|l|Y|c|c|}
      \hline
      \multicolumn{1}{|c|}{\shortstack[c]{Код}} & \multicolumn{1}{c|}{\shortstack[c]{Работа}} & \multicolumn{1}{c|}{\shortstack[c]{Длительность,\\раб. дней}} & \multicolumn{1}{c|}{\shortstack[c]{Предшественники}} \\
      \hline
      A & Согласовать требования & 2 & --- \\
      B & Подготовить прототип & 4 & A \\
      C & Подготовить данные & 3 & A \\
      D & Проверить прототип с данными & 5 & B, C \\
      E & Подготовить инструкцию & 2 & C \\
      F & Передать результат & 1 & D, E \\
      \hline
      \end{tabularx}
      \end{table}

      Зависимости показаны на рисунке~\ref{fig:network}.
      Утолщенные стрелки отмечают критический путь A--B--D--F.
      \begin{figure}[htbp]
      \centering
      \begin{tikzpicture}[x=1cm,y=1cm,
       task/.style={draw,rectangle,align=center,minimum width=2cm,
       minimum height=1.3cm,font=\normalsize},
       link/.style={-{Stealth[length=2mm]}},
       critical/.style={link,very thick}]
      \node[task] (A) at (0,0) {A\\2 дня};
      \node[task] (B) at (3.5,1.5) {B\\4 дня};
      \node[task] (C) at (3.5,-1.5) {C\\3 дня};
      \node[task] (D) at (7,1.5) {D\\5 дней};
      \node[task] (E) at (7,-1.5) {E\\2 дня};
      \node[task] (F) at (10.5,0) {F\\1 день};
      \draw[critical] (A) -- (B);
      \draw[link] (A) -- (C);
      \draw[critical] (B) -- (D);
      \draw[link] (C) -- (D);
      \draw[link] (C) -- (E);
      \draw[critical] (D) -- (F);
      \draw[link] (E) -- (F);
      \end{tikzpicture}
      \caption{Сетевой график учебного проекта}
      \label{fig:network}
      \end{figure}

      \reportsection{Расчет сроков и резервов}
      При прямом проходе ранние сроки определяются по формулам
      \eqref{eq:early-start} и~\eqref{eq:early-finish}.
      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:early-start}
      ES_i=\max_{j\in\operatorname{Pred}(i)}EF_j,
      \end{equation}

      где $ES_i$ --- раннее начало работы $i$, рабочие дни от начала проекта;\par
      $\operatorname{Pred}(i)$ --- множество предшественников работы $i$;\par
      $EF_j$ --- раннее окончание предшественника $j$, рабочие дни.
      \end{minipage}\par

      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:early-finish}
      EF_i=ES_i+d_i,
      \end{equation}

      где $EF_i$ --- раннее окончание работы $i$, рабочие дни;\par
      $ES_i$ --- раннее начало работы $i$, рабочие дни;\par
      $d_i$ --- длительность работы $i$, рабочие дни.
      \end{minipage}\par

      Для начальной работы принято $ES_A=0$.
      При обратном проходе поздние сроки рассчитываются по формулам
      \eqref{eq:late-finish} и~\eqref{eq:late-start}.
      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:late-finish}
      LF_i=\min_{k\in\operatorname{Succ}(i)}LS_k,
      \end{equation}

      где $LF_i$ --- позднее окончание работы $i$, рабочие дни;\par
      $\operatorname{Succ}(i)$ --- множество последователей работы $i$;\par
      $LS_k$ --- позднее начало последователя $k$, рабочие дни.
      \end{minipage}\par

      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:late-start}
      LS_i=LF_i-d_i,
      \end{equation}

      где $LS_i$ --- позднее начало работы $i$, рабочие дни;\par
      $LF_i$ --- позднее окончание работы $i$, рабочие дни;\par
      $d_i$ --- длительность работы $i$, рабочие дни.
      \end{minipage}\par

      Для конечной работы принято $LF_F=EF_F$.
      Полный резерв определяется по формуле~\eqref{eq:float}.
      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:float}
      R_i=LS_i-ES_i,
      \end{equation}

      где $R_i$ --- полный резерв работы $i$, рабочие дни;\par
      $LS_i$ --- позднее начало работы $i$, рабочие дни;\par
      $ES_i$ --- раннее начало работы $i$, рабочие дни.
      \end{minipage}\par

      Результаты приведены в таблице~\ref{tab:dates}.

      \begin{table}[htbp]
      \caption{Расчетные моменты и полные резервы, рабочие дни}
      \label{tab:dates}
      \begin{tabularx}{\textwidth}{|Y|r|r|r|r|r|}
      \hline
      \multicolumn{1}{|c|}{\shortstack[c]{Код}} & \multicolumn{1}{c|}{\shortstack[c]{$ES$}} & \multicolumn{1}{c|}{\shortstack[c]{$EF$}} & \multicolumn{1}{c|}{\shortstack[c]{$LS$}} & \multicolumn{1}{c|}{\shortstack[c]{$LF$}} & \multicolumn{1}{c|}{\shortstack[c]{$R$}} \\
      \hline
      A & ${es_A} & ${ef_A} & ${ls_A} & ${lf_A} & ${r_A} \\
      B & ${es_B} & ${ef_B} & ${ls_B} & ${lf_B} & ${r_B} \\
      C & ${es_C} & ${ef_C} & ${ls_C} & ${lf_C} & ${r_C} \\
      D & ${es_D} & ${ef_D} & ${ls_D} & ${lf_D} & ${r_D} \\
      E & ${es_E} & ${ef_E} & ${ls_E} & ${lf_E} & ${r_E} \\
      F & ${es_F} & ${ef_F} & ${ls_F} & ${lf_F} & ${r_F} \\
      \hline
      \end{tabularx}
      \end{table}

      Срок проекта --- ${ef_F} рабочих дней. Критический путь
      A--B--D--F имеет длину $2+4+5+1=12$ дней.
      Работа C имеет полный резерв ${r_C} день, E --- ${r_E} дня.
      Резервы связанных работ нельзя автоматически складывать.
      Если длительность C увеличится с трех до пяти дней, срок станет
      13 дней и критическим будет путь A--C--D--F.

      Это расчет по принятым длительностям, а не обещание даты сдачи.
      Ограничения исполнителей, выходные, задержки поставок и риски
      проверяются отдельно; при изменении исходных данных сеть пересчитывают.
      \end{document}
