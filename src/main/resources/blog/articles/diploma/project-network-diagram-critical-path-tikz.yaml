      \reportsection{Расчет сроков и резервов}
      При прямом проходе ранние сроки определяются по формулам
      \eqref{eq:early-start} и~\eqref{eq:early-finish}.
      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:early-start}
      ES_i=\max_{j\in\operatorname{Pred}(i)}EF_j,
      \end{equation}

      где $ES_i$ --- раннее начало работы $i$, рабочие дни от начала проекта;\par
      $\operatorname{Pred}(i)$ --- множество предшественников работы $i$;\par
      $EF_j$ --- раннее окончание предшественника $j$, рабочие дни.
      \end{minipage}\par

      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:early-finish}
      EF_i=ES_i+d_i,
      \end{equation}

      где $EF_i$ --- раннее окончание работы $i$, рабочие дни;\par
      $ES_i$ --- раннее начало работы $i$, рабочие дни;\par
      $d_i$ --- длительность работы $i$, рабочие дни.
      \end{minipage}\par

      Для начальной работы принято $ES_A=0$.
      При обратном проходе поздние сроки рассчитываются по формулам
      \eqref{eq:late-finish} и~\eqref{eq:late-start}.
      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:late-finish}
      LF_i=\min_{k\in\operatorname{Succ}(i)}LS_k,
      \end{equation}

      где $LF_i$ --- позднее окончание работы $i$, рабочие дни;\par
      $\operatorname{Succ}(i)$ --- множество последователей работы $i$;\par
      $LS_k$ --- позднее начало последователя $k$, рабочие дни.
      \end{minipage}\par

      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:late-start}
      LS_i=LF_i-d_i,
      \end{equation}

      где $LS_i$ --- позднее начало работы $i$, рабочие дни;\par
      $LF_i$ --- позднее окончание работы $i$, рабочие дни;\par
      $d_i$ --- длительность работы $i$, рабочие дни.
      \end{minipage}\par

      Для конечной работы принято $LF_F=EF_F$.
      Полный резерв определяется по формуле~\eqref{eq:float}.
      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:float}
      R_i=LS_i-ES_i,
      \end{equation}

      где $R_i$ --- полный резерв работы $i$, рабочие дни;\par
      $LS_i$ --- позднее начало работы $i$, рабочие дни;\par
      $ES_i$ --- раннее начало работы $i$, рабочие дни.
      \end{minipage}\par

      Результаты приведены в таблице~\ref{tab:dates}.

      \begin{table}[htbp]
      \caption{Расчетные моменты и полные резервы, рабочие дни}
      \label{tab:dates}
      \begin{tabularx}{\textwidth}{|Y|r|r|r|r|r|}
      \hline
      \multicolumn{1}{|c|}{\shortstack[c]{Код}} &amp; \multicolumn{1}{c|}{\shortstack[c]{$ES$}} &amp; \multicolumn{1}{c|}{\shortstack[c]{$EF$}} &amp; \multicolumn{1}{c|}{\shortstack[c]{$LS$}} &amp; \multicolumn{1}{c|}{\shortstack[c]{$LF$}} &amp; \multicolumn{1}{c|}{\shortstack[c]{$R$}} \\
      \hline
      A &amp; ${es_A} &amp; ${ef_A} &amp; ${ls_A} &amp; ${lf_A} &amp; ${r_A} \\
      B &amp; ${es_B} &amp; ${ef_B} &amp; ${ls_B} &amp; ${lf_B} &amp; ${r_B} \\
      C &amp; ${es_C} &amp; ${ef_C} &amp; ${ls_C} &amp; ${lf_C} &amp; ${r_C} \\
      D &amp; ${es_D} &amp; ${ef_D} &amp; ${ls_D} &amp; ${lf_D} &amp; ${r_D} \\
      E &amp; ${es_E} &amp; ${ef_E} &amp; ${ls_E} &amp; ${lf_E} &amp; ${r_E} \\
      F &amp; ${es_F} &amp; ${ef_F} &amp; ${ls_F} &amp; ${lf_F} &amp; ${r_F} \\
      \hline
      \end{tabularx}
      \end{table}

      Срок проекта --- ${ef_F} рабочих дней. Критический путь
      A--B--D--F имеет длину $2+4+5+1=12$ дней.
      Работа C имеет полный резерв ${r_C} день, E --- ${r_E} дня.
      Резервы связанных работ нельзя автоматически складывать.
      Если длительность C увеличится с трех до пяти дней, срок станет
      13 дней и критическим будет путь A--C--D--F.

      Это расчет по принятым длительностям, а не обещание даты сдачи.
      Ограничения исполнителей, выходные, задержки поставок и риски
      проверяются отдельно; при изменении исходных данных сеть пересчитывают.
      \end{document}</code></pre></div>
      <p>После сборки проверьте номера, ссылки, единицы измерения, переносы в таблицах и читаемость формул. При переносе в полный отчет обновите содержание повторной компиляцией. Числа в статье округлены для чтения; стандартные настройки редактора выводят три значащие цифры.</p>
tips:
  - title: Задайте начало отсчета
    html: <p>В примере используются моменты от нуля и длительности в рабочих днях. Не смешивайте их с порядковыми номерами календарных дат.</p>
  - title: Проверяйте общий ресурс
    html: <p>Работы могут идти параллельно по логике, но требовать одного исполнителя. После учета доступности людей срок и критическая последовательность могут измениться.</p>
