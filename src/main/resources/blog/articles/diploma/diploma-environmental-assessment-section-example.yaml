sections:
  - id: 'scope'
    title: 'Учебный раздел и официальная экологическая экспертиза'
    html: |2-
      <p>В экологическом разделе дипломного проекта нужно показать, как выбранное решение влияет
      на окружающую среду и какие меры уменьшают это воздействие. Перечень общих фраз об охране
      природы не объясняет, что изменится при эксплуатации вашего объекта. В статье разберём
      короткий пример: от границ рассматриваемого рабочего места до таблицы мер и вывода.</p>
      <p><strong>Название раздела уточните по заданию кафедры.</strong> В методичке он может называться
      «Охрана окружающей среды», «Экологическая безопасность» или «Экологическая экспертиза».
      Например, в <a href="https://gf.misis.ru/Portals/7/Documents/sveden/education/Mathod/Gornoe_delo/VKR.pdf">методических
      указаниях НИТУ МИСИС для специальности «Горное дело»</a> предусмотрен раздел «Охрана труда
      и окружающей среды». Его состав нельзя автоматически переносить на ВКР по программированию.</p>
      <p>Государственная экологическая экспертиза — отдельная процедура по Федеральному закону
      от 23.11.1995 № 174-ФЗ. Объекты экспертизы определены статьями 11 и 12; сведения о проведении
      процедуры опубликованы на <a href="https://rpn.gov.ru/activity/services/gu/28159/">сайте
      Росприроднадзора</a>. Учебная глава ВКР не заменяет эту процедуру и не является официальным
      заключением. Если работа посвящена реальному объекту, вопрос о необходимости экспертизы
      рассматривают отдельно по его характеристикам и действующим требованиям.</p>
      <div class="article-note">
          <strong>Не смешивайте задачи разделов.</strong> Освещённость рабочего стола и безопасность
          оператора относятся прежде всего к условиям труда. Для экологического раздела рассмотрите
          потребление ресурсов, образование отходов и другие воздействия на окружающую среду.
          Пример расчёта освещённости приведён в статье <a
          href="/blog/diploma-life-safety-section-calculation-example">о разделе БЖД в дипломе</a>.
      </div>
  - id: 'inputs'
    title: 'Какие исходные данные собрать'
    html: |2-
      <p>Начните с <strong>объекта, этапа и границ анализа</strong>. Для участка производства нужны
      сведения об операциях, сырье, выбросах, стоках и отходах. Для информационной системы —
      об оборудовании, режиме его работы, печати документов и замене техники. Рассматривайте
      только относящиеся к проекту процессы, но поясняйте принятые ограничения.</p>
      <ol>
          <li><strong>Опишите объект.</strong> Укажите оборудование, помещение, выполняемую операцию
          и этап: изготовление, эксплуатация или вывод из эксплуатации.</li>
          <li><strong>Запишите исходные показатели.</strong> Для расхода бумаги нужны листы за
          выбранный период; для электроэнергии — кВт·ч за тот же период и режим работы. Паспортная
          мощность в кВт сама по себе не равна потреблению энергии.</li>
          <li><strong>Укажите происхождение данных.</strong> Это могут быть показания счётчика,
          журнал печати, паспорт оборудования, ведомость материалов или расчёт с допущениями.
          Не называйте паспортное значение результатом измерения.</li>
          <li><strong>Отметьте пробелы.</strong> Если состав отхода или условия его передачи
          неизвестны, запишите, какие сведения нужно получить. Не назначайте код и класс опасности
          по одному бытовому названию.</li>
      </ol>
      <p>Для примера ниже выбрано автоматизированное рабочее место (АРМ) специалиста: компьютер,
      монитор и принтер. Рассматриваются эксплуатация и замена техники; изготовление оборудования
      и работа внешнего центра обработки данных не оцениваются. Все условия вымышлены,
      измерения не проводились. Описание функций такого объекта можно подготовить по статье
      <a href="/blog/specialist-workstation-diploma-design">о разработке АРМ специалиста</a>.</p>
      <p>Если в работе используются полевые измерения, сохраняйте условия и исходные отсчёты
      отдельно от объяснения причин. Пример такой записи разобран в статье
      <a href="/blog/ecology-lab-observation-journal-example">о журнале наблюдений по экологии</a>.</p>
  - id: 'impacts'
    title: 'Как связать воздействия, меры и проверку'
    html: |2-
      <p>Для каждого источника заполните цепочку: <strong>источник → воздействие → мера → проверка</strong>.
      Мера должна относиться к конкретному процессу. Формулировку «внедрить экологичные технологии»
      замените действием, результат которого можно проверить.</p>
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead><tr><th>Источник</th><th>Воздействие</th><th>Мера и проверка</th></tr></thead>
              <tbody>
                  <tr><td>Печать документов</td><td>Расход бумаги, бумажные отходы</td><td>Двусторонняя печать;
                  сравнение числа листов при одинаковом объёме документов</td></tr>
                  <tr><td>Работа компьютера и монитора</td><td>Потребление электроэнергии</td><td>Режим сна;
                  сравнение кВт·ч за периоды с одинаковой нагрузкой</td></tr>
                  <tr><td>Замена техники</td><td>Образование отходов оборудования</td><td>Раздельный сбор;
                  учёт состава и массы, проверка документов передачи</td></tr>
              </tbody>
          </table>
      </div>
      <p>Таблица показывает направления работы, но ещё не доказывает снижение воздействия.
      Например, уменьшение числа отпечатанных листов может быть связано с меньшим объёмом
      документов. Сначала обеспечьте сопоставимость периодов, затем оценивайте результат меры.</p>
      <p>Энергопотребление характеризует расход ресурса. Чтобы перейти от кВт·ч к оценке выбросов
      парниковых газов, понадобятся обоснованный коэффициент и границы расчёта; произвольный
      множитель даст неподтверждённый результат. Аналогично, раздельный сбор сам по себе не
      подтверждает переработку отходов: нужны сведения об их дальнейшем обращении.</p>
  - id: 'latex'
    title: 'Короткий пример раздела в LaTeX'
    html: |2-
      <p>Ниже приведён фрагмент экологического раздела с той же таблицей. При вставке в ВКР
      используйте настройки страниц и текста основного документа. Для таблицы добавьте
      в преамбулу пакеты и тип столбца:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX — преамбула</span></div>
          <pre><code>\usepackage{tabularx,array,caption}
      \newcolumntype{Y}{&gt;{\raggedright\arraybackslash}X}
      \DeclareCaptionLabelSeparator{gostdash}{\space---\space}
      \captionsetup[table]{labelsep=gostdash,justification=raggedright,
        singlelinecheck=false,font={normalsize,singlespacing}}</code></pre>
      </div>
      <p><code>tabularx</code> распределяет ширину между столбцами, а <code>Y</code> выравнивает
      содержимое ячеек влево. Заголовки столбцов в следующем блоке центрируются отдельно.
      Сначала вставьте описание границ анализа и ссылку на таблицу:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\section{Охрана окружающей среды}
      Рассматривается автоматизированное рабочее место (АРМ)
      специалиста: компьютер, монитор и принтер.
      Условия вымышлены; измерения не проводились.
      Анализ охватывает эксплуатацию и замену техники.
      Изготовление оборудования и внешний центр обработки данных
      не оцениваются. Воздействия и меры приведены
      в таблице~\ref{tab:environment}.</code></pre>
      </div>
      <p>Затем добавьте таблицу. Подпись располагается сверху слева, ссылка
      <code>\label</code> стоит после <code>\caption</code>, чтобы получить номер таблицы.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\begin{table}[htbp]
      \caption{Воздействия АРМ и меры по их снижению}
      \label{tab:environment}
      \begin{tabularx}{\textwidth}{|Y|Y|Y|}
      \hline
      {\centering Источник\par} &amp; {\centering Воздействие\par} &amp;
      {\centering Мера и проверка\par} \\
      \hline
      Печать документов &amp; Расход бумаги, бумажные отходы &amp;
      Двусторонняя печать; сравнение числа листов
      при одинаковом объёме документов \\
      \hline
      Работа компьютера и монитора &amp; Потребление электроэнергии &amp;
      Режим сна; сравнение кВт$\cdot$ч за периоды
      с одинаковой нагрузкой \\
      \hline
      Замена техники &amp; Образование отходов оборудования &amp;
      Раздельный сбор; учёт состава и массы,
      проверка документов передачи \\
      \hline
      \end{tabularx}
      \end{table}</code></pre>
      </div>
      <p>После таблицы сформулируйте результат анализа и условие, необходимое для проверки эффекта:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>Для выбранных границ анализа определены направления снижения
      расхода ресурсов и организации сбора отходов.
      Эффект мер требует проверки по данным учёта
      при сопоставимой нагрузке. Соблюдение экологических нормативов
      этим примером не подтверждается.</code></pre>
      </div>
      <p>Кнопка «Просмотреть пример» открывает эти фрагменты вместе со служебными сегментами
      начала и завершения документа. Замените объект, границы анализа и строки таблицы, затем
      нажмите «Выполнить» для сборки PDF. Перечень мер редактируется вручную; программа
      не определяет применимость экологических требований.</p>
      <p>В примере настроены страница, текст, заголовок и подпись таблицы с учётом
      <a href="https://mpei.ru/Science/ScienceDocuments/Documents/0_GOST_7.32-2017.pdf">ГОСТ 7.32-2017</a>:
      A4, поля 30/15/20/20 мм, шрифт 14 пт, полуторный интервал и отступ 1,25 см.
      Стандарт относится к отчётам о НИР; для ВКР сверьте оформление с методичкой кафедры.
      Это пример одного раздела. При переносе в диплом его номер, номера таблиц и страниц
      должны продолжать нумерацию основного документа.</p>
  - id: 'conclusion'
    title: 'Что можно утверждать в выводе'
    html: |2-
      <p><strong>Вывод должен соответствовать собранным данным.</strong> В учебном примере
      выявлены источники воздействия и предложены меры. Оснований писать «нормативы соблюдены»,
      «вред окружающей среде отсутствует» или «получено положительное заключение» нет.</p>
      <p>Если в реальной работе выполнен расчёт, укажите показатель, условия и полученное
      значение. Если проверяется норматив, назовите документ, применимый пункт и условия
      сопоставления. Один удачный показатель не подтверждает экологическую безопасность
      всего объекта.</p>
      <p>Ссылки на паспорта, журналы и нормативные документы должны вести к источникам,
      которые использованы в анализе. Описание законов в списке источников разобрано
      в статье <a href="/blog/legal-regulatory-acts-bibliography-diploma-gost">об оформлении
      нормативных актов в ВКР</a>. Вымышленные условия упражнения не требуют вымышленных
      протоколов измерений или актов передачи отходов.</p>
  - id: 'check'
    title: 'Проверка раздела перед сдачей'
    html: |2-
      <ul>
          <li>Название и состав раздела согласованы с заданием кафедры.</li>
          <li>Объект, этапы и границы анализа указаны; допущения отделены от измеренных данных.</li>
          <li>У каждой меры есть конкретное воздействие и способ проверки результата.</li>
          <li>Числа снабжены единицами, периодом и источником; неизвестные величины не заменены нулями.</li>
          <li>В PDF ссылка на таблицу обновилась, подпись находится сверху слева,
          заголовки столбцов центрированы, текст не выходит за границы ячеек.</li>
          <li>Вывод не выходит за границы анализа и не подменяет официальное заключение экспертизы.</li>
      </ul>
      <p>После замены данных прочитайте таблицу вместе с выводом: все ли заявленные результаты
      действительно следуют из приведённых сведений? Если эффект пока не измерен,
      завершите раздел способом его проверки, а не неподтверждённой оценкой.</p>
tips:
  - title: 'Не приравнивайте отсутствие данных к отсутствию воздействия'
    html: |2-
      <p>Запись «данные о составе отхода не получены» точнее, чем «отходы безопасны».
      Укажите, какой документ или исследование позволит снять неопределённость.</p>
