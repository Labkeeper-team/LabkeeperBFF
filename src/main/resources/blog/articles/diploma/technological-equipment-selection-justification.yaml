sections:
  - id: requirements
    title: Начните с операции и обязательных требований
    html: |-
      <p>Обоснование выбора оборудования отвечает на два вопроса: какие варианты выполняют задачу и почему выбран один из них. Описание известного бренда или самый низкий ценник не заменяют проверку технических требований.</p>
      <p>Запишите материал, операцию, программу выпуска, размер партии, точность, габариты детали, инфраструктуру, требования к обслуживанию и ограничения бюджета. Для каждого условия укажите источник: чертеж, технологическую карту, задание, паспорт или предложение поставщика с датой.</p>
      <p>Ниже сравниваются три вымышленных станка для одной операции. Все числа заданы для обучения. Совместимость по материалу, точности и подключению условно принята одинаковой; в реальной работе ее нужно подтвердить до расчетного сравнения.</p>
  - id: inputs
    title: Исходные данные и единые условия сравнения
    html: |-
      <div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Показатель</th><th>А</th><th>Б</th><th>В</th></tr>
      </thead>
      <tbody><tr><td>Часовая производительность, шт./ч</td><td>40</td><td>50</td><td>60</td></tr>
      <tr><td>Цена с доставкой и вводом, тыс. руб.</td><td>1000</td><td>1200</td><td>1500</td></tr>
      <tr><td>Сервис, тыс. руб./год</td><td>100</td><td>120</td><td>100</td></tr>
      <tr><td>Средняя мощность в работе, кВт</td><td>4</td><td>5</td><td>6</td></tr>
      </tbody>
      </table>
      </div>
      <p>План — 4800 годных деталей в месяц, фонд времени — 160 ч/мес., коэффициент доступного времени — 0,8, выход годных — 0,98. Дополнительный резерв мощности — 15% от плана. Это допущения примера, а не отраслевые нормы.</p>
      <p>Производительность задана на час фактической обработки до отбраковки; коэффициент 0,8 учитывает потери доступного фонда, а 0,98 — выход годных. Проверьте определения в паспорте: повторное включение уже учтенных потерь исказит результат. Цены должны иметь одинаковый состав и налоговую базу.</p>
  - id: capacity
    title: Проверка производительности и резерва
    html: |-
      <p>Доступный выпуск годных деталей в месяц:</p>
      <p>$$C=qFky.$$</p>
      <p>Для варианта Б: $50\cdot160\cdot0{,}8\cdot0{,}98=6272$ шт./мес. Аналогично: А — 5017,6; В — 7526,4 шт./мес. Дробный результат характеризует расчетную мощность, а не дробную изготовленную деталь.</p>
      <p>Порог с резервом: $C_{\min}=4800\cdot1{,}15=5520$ шт./мес. А выполняет исходный план, но не проходит условие резерва. Б и В проходят. Резерв здесь означает превышение мощности над планом на 15%, а не загрузку не более 85%: это разные ограничения.</p>
      <p>Проверка должна относиться ко всему маршруту. Если соседняя операция или контроль качества ограничивает выпуск, высокая паспортная скорость выбранного станка не увеличит производительность линии автоматически.</p>
  - id: cost
    title: Сопоставимые затраты на три года
    html: |-
      <p>Для прошедших отбор вариантов сравним цену с вводом, сервис и электроэнергию. Горизонт — три года, тариф — 8 руб./(кВт·ч). Работа идет только в объеме, нужном для плана; весь доступный фонд оплачивать как время работы двигателя не требуется.</p>
      <p>$$H=\frac{12Q}{qy},\qquad Z=I+3(S+PeH).$$</p>
      <p>$H$ — годовое время обработки, ч/год; $I$ — разовые вложения, руб.; $S$ — сервис, руб./год; $P$ — средняя мощность во время работы, кВт; $e$ — тариф. Получаем для Б $H\approx1175{,}51$ ч/год, для В — 979,59 ч/год.</p>
      <div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Результат</th><th>Б</th><th>В</th></tr>
      </thead>
      <tbody><tr><td>Электроэнергия, руб./год</td><td>47 020,41</td><td>47 020,41</td></tr>
      <tr><td>Сопоставляемые затраты за 3 года, руб.</td><td>1 701 061,22</td><td>1 941 061,22</td></tr>
      </tbody>
      </table>
      </div>
      <p>Энергозатраты совпали: более высокая мощность В компенсируется меньшим временем работы. На выбранном горизонте Б дешевле на 240 000 руб. Простои с потреблением энергии, инструмент, персонал, налоги и остаточная стоимость исключены из упражнения. Это частичное сравнение, а не полная стоимость владения. Различающиеся статьи расходов нужно добавить; состав калькуляции разобран в <a href="/blog/product-cost-calculation-example">статье о себестоимости</a>.</p>
      <p>Дисконтирование здесь не применяется. Для денежных потоков во времени используйте <a href="/blog/diploma-economic-efficiency-calculation-example">расчет экономической эффективности</a>, согласовав горизонт и ставку.</p>
  - id: decision
    title: Решение, чувствительность и подтверждающие документы
    html: |-
      <p>Корректный вывод: «При программе 4800 годных деталей в месяц и резерве 15% выбран вариант Б: расчетная мощность 6272 шт./мес., сопоставляемые затраты за три года ниже варианта В на 240 тыс. руб.». Он относится к заданным условиям и модели затрат.</p>
      <p>Проверьте сценарий роста до 6000 деталей: порог с резервом становится 6900 шт./мес. Б его уже не достигает, В достигает. Это показывает, почему запас производительности и прогноз спроса должны обсуждаться вместе.</p>
      <ul><li>Приложите паспорта и предложения с датами и комплектациями.</li>
      <li>Подтвердите достижимость качества и такта на нужном материале.</li>
      <li>Проверьте пуск, обучение, ремонт, инструмент и доступность сервиса.</li>
      <li>Покажите, при каких изменениях программы или расходов выбор меняется.</li>
      </ul>
      <p>Если вариантов много, организуйте общий анализ по правилам <a href="/blog/domestic-foreign-analogues-comparison-diploma">сравнения аналогов</a>, сохраняя обязательные условия отдельно от предпочтений.</p>
  - id: editor
    title: Редактируемый пример и проверка PDF
    html: |-
      <p>В примере уже настроены поля, интервалы и заголовки с учётом <a href="https://mpei.ru/Science/ScienceDocuments/Documents/0_GOST_7.32-2017.pdf">ГОСТ 7.32-2017</a>. Для ВКР сверьте оформление с методичкой вашей кафедры.</p>
       <p>При вставке в основной документ используйте его преамбулу, счетчики разделов и сквозную нумерацию страниц. Титульный лист, содержание, введение и приложения в этот фрагмент не входят. Каждый раздел начинается с новой страницы; подписи таблиц находятся сверху слева, ссылки на таблицы даны в тексте.</p>
      <p>Сначала добавьте вычислительный сегмент, затем LaTeX-сегмент. Расчет можно скрыть: исходные данные, формулы и результаты остаются в печатном документе. Кнопка примера открывает оба сегмента в нужном порядке.</p>
      <div class="article-code"><div class="article-code__header"><span class="article-code__lang">Вычислительный сегмент</span></div>
      <pre><code>Q = 4800
      F = 160
      k = 0.8
      yield_rate = 0.98
      reserve = 0.15
      q_A = 40
      q_B = 50
      q_C = 60
      cap_A = q_A * F * k * yield_rate
      cap_B = q_B * F * k * yield_rate
      cap_C = q_C * F * k * yield_rate
      required = Q * (1 + reserve)
      h_B = 12 * Q / (q_B * yield_rate)
      h_C = 12 * Q / (q_C * yield_rate)
      cost_B = 1200000 + 3 * (120000 + 5 * 8 * h_B)
      cost_C = 1500000 + 3 * (100000 + 6 * 8 * h_C)
      saving = cost_C - cost_B</code></pre></div>
      <div class="article-code"><div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
      <pre><code>\documentclass[a4paper,14pt]{extarticle}
      \usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[russian]{babel}
      \usepackage{tempora,amsmath,setspace,indentfirst,tabularx,array,titlesec,caption,needspace}
      \usepackage[left=30mm,right=15mm,top=20mm,bottom=20mm]{geometry}
      \onehalfspacing
      \setlength{\parindent}{1.25cm}
      \titleformat{\section}{\normalfont\bfseries\hyphenpenalty=10000\relax\exhyphenpenalty=10000\relax}{\thesection}{1em}{}
      \titlespacing{\section}{\parindent}{0pt}{12pt}
      \newcommand{\reportsection}[1]{\clearpage\section{#1}}
      \DeclareCaptionLabelSeparator{gostdash}{\space---\space}
      \captionsetup{labelsep=gostdash,font={normalsize,singlespacing}}
      \captionsetup[table]{justification=raggedright,singlelinecheck=false}
      \captionsetup[figure]{justification=centering,singlelinecheck=false}
      \DeclareCaptionTextFormat{gosttitle}{\hyphenpenalty=10000\relax\exhyphenpenalty=10000\relax#1}
      \captionsetup{textformat=gosttitle}
      \AtBeginDocument{%
          \setlength{\abovedisplayskip}{\baselineskip}%
          \setlength{\belowdisplayskip}{\baselineskip}%
          \setlength{\abovedisplayshortskip}{\baselineskip}%
          \setlength{\belowdisplayshortskip}{\baselineskip}}
      \addto\captionsrussian{\renewcommand{\figurename}{Рисунок}}
      \pagestyle{plain}
      \newcolumntype{Y}{&gt;{\raggedright\arraybackslash}X}
      \setlength{\emergencystretch}{2em}
      \begin{document}
      \reportsection{Выбор технологического оборудования}
      Все модели и данные вымышлены. Требуется выпуск $Q=4800$ годных
      деталей в месяц. Фонд $F=160$ ч/мес.; коэффициент доступного времени
      $k=0{,}8$, выход годных $y=0{,}98$. Резерв мощности $r=15\%$
      принят автором для упражнения и не является нормативом.

      Фонд $F$ задан до потерь времени; их учитывает коэффициент $k$.
      Производительность дана на час фактической работы.
      Сравниваются станки для одинаковой операции и материала.
      Точность, габариты и условия подключения условно признаны подходящими.
      Исходные данные приведены в таблице~\ref{tab:equipment}.

      \begin{table}[htbp]
      \caption{Учебные характеристики вариантов}
      \label{tab:equipment}
      \begin{tabularx}{\textwidth}{|Y|r|r|r|}
      \hline
      \multicolumn{1}{|c|}{\shortstack[c]{Показатель}} &amp; \multicolumn{1}{c|}{\shortstack[c]{А}} &amp; \multicolumn{1}{c|}{\shortstack[c]{Б}} &amp; \multicolumn{1}{c|}{\shortstack[c]{В}} \\
      \hline
      Производительность, шт./ч &amp; 40 &amp; 50 &amp; 60 \\
      Цена с вводом, тыс. руб. &amp; 1000 &amp; 1200 &amp; 1500 \\
      Сервис, тыс. руб./год &amp; 100 &amp; 120 &amp; 100 \\
      Средняя мощность в работе, кВт &amp; 4 &amp; 5 &amp; 6 \\
      \hline
      \end{tabularx}
      \end{table}

      Месячный выпуск годных деталей определяется по формуле~\eqref{eq:capacity}.
      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:capacity}
      C=qFky,
      \end{equation}

      где $C$ --- расчетный выпуск годных деталей, шт./мес.;\par
      $q$ --- производительность при фактической работе, шт./ч;\par
      $F$ --- месячный фонд до потерь времени, ч/мес.;\par
      $k$ --- коэффициент доступного времени, безразмерный;\par
      $y$ --- доля годных деталей, безразмерная.
      \end{minipage}\par

      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      Требуемая мощность с резервом рассчитывается по формуле~\eqref{eq:reserve}.\par
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:reserve}
      C_{\min}=Q(1+r),
      \end{equation}

      где $C_{\min}$ --- требуемый выпуск с резервом, шт./мес.;\par
      $Q$ --- план выпуска годных деталей, шт./мес.;\par
      $r$ --- резерв относительно плана; в примере $r=0{,}15$.


      Для А: $C_A=${cap_A}$ шт./мес.; для Б: $C_{\text{Б}}=${cap_B}$ шт./мес.;
      для В: $C_{\text{В}}=${cap_C}$ шт./мес.
      Требуется не менее ${required} шт./мес. Вариант А покрывает план,
      но не обеспечивает принятый резерв, поэтому далее сравниваются Б и В.
      \end{minipage}\par

      \reportsection{Сопоставление затрат и решение}
      Тариф принят равным 8 руб./(кВт\,ч), горизонт $T=3$ года.
      Годовое время обработки определяется по формуле~\eqref{eq:hours}.
      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:hours}
      H=\frac{12Q}{qy},
      \end{equation}

      где $H$ --- время фактической обработки за год, ч/год;\par
      $12$ --- число месяцев в году, мес./год;\par
      $Q$ --- месячный план годных деталей, шт./мес.;\par
      $q$ --- часовая производительность, шт./ч;\par
      $y$ --- доля годных деталей, безразмерная.
      \end{minipage}\par

      Сопоставляемые затраты рассчитываются по формуле~\eqref{eq:cost}.
      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:cost}
      Z=I+T(S+PeH),
      \end{equation}

      где $Z$ --- затраты за выбранный горизонт, руб.;\par
      $I$ --- цена с доставкой и вводом, руб.;\par
      $T$ --- горизонт расчета, лет;\par
      $S$ --- сервисные расходы, руб./год;\par
      $P$ --- средняя мощность в работе, кВт;\par
      $e$ --- тариф на электроэнергию, руб./(кВт\,ч);\par
      $H$ --- время фактической обработки, ч/год.
      \end{minipage}\par

      Годовое время: Б --- ${h_B} ч, В --- ${h_C} ч.
      Затраты: Б --- ${cost_B} руб., В --- ${cost_C} руб.
      Разность $Z_{\text{В}}-Z_{\text{Б}}=${saving}$ руб.

      Для учебных условий выбран вариант Б: он обеспечивает резерв
      и имеет меньшие сопоставляемые затраты на принятом горизонте.
      В расчет не включены дисконтирование, налоги, остаточная стоимость,
      энергия ожидания, оплата труда, инструмент и прочие расходы.
      Для решения о закупке их необходимо проверить и включить при различиях.

      Если месячный план вырастет до 6000 годных деталей, резерв потребует
      6900 шт./мес. Вариант Б уже не подходит; вариант В проходит
      по мощности. Следовательно, выбор зависит от сценария спроса.
      \end{document}</code></pre></div>
      <p>После сборки проверьте номера, ссылки, единицы измерения, переносы в таблицах и читаемость формул. При переносе в полный отчет обновите содержание повторной компиляцией. Числа в статье округлены для чтения; стандартные настройки редактора выводят три значащие цифры.</p>
tips:
  - title: Не учитывайте одни потери дважды
    html: <p>Если паспортная часовая производительность уже учитывает простой или брак, определите, нужны ли соответствующие коэффициенты в вашей формуле.</p>
  - title: Разделяйте отсев и ранжирование
    html: <p>Недостаточную точность или мощность нельзя компенсировать низкой ценой в суммарном балле.</p>
