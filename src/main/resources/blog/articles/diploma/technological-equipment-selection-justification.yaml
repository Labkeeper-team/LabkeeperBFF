      \reportsection{Выбор технологического оборудования}
      Все модели и данные вымышлены. Требуется выпуск $Q=4800$ годных
      деталей в месяц. Фонд $F=160$ ч/мес.; коэффициент доступного времени
      $k=0{,}8$, выход годных $y=0{,}98$. Резерв мощности $r=15\%$
      принят автором для упражнения и не является нормативом.

      Фонд $F$ задан до потерь времени; их учитывает коэффициент $k$.
      Производительность дана на час фактической работы.
      Сравниваются станки для одинаковой операции и материала.
      Точность, габариты и условия подключения условно признаны подходящими.
      Исходные данные приведены в таблице~\ref{tab:equipment}.

      \begin{table}[htbp]
      \caption{Учебные характеристики вариантов}
      \label{tab:equipment}
      \begin{tabularx}{\textwidth}{|Y|r|r|r|}
      \hline
      \multicolumn{1}{|c|}{\shortstack[c]{Показатель}} & \multicolumn{1}{c|}{\shortstack[c]{А}} & \multicolumn{1}{c|}{\shortstack[c]{Б}} & \multicolumn{1}{c|}{\shortstack[c]{В}} \\
      \hline
      Производительность, шт./ч & 40 & 50 & 60 \\
      Цена с вводом, тыс. руб. & 1000 & 1200 & 1500 \\
      Сервис, тыс. руб./год & 100 & 120 & 100 \\
      Средняя мощность в работе, кВт & 4 & 5 & 6 \\
      \hline
      \end{tabularx}
      \end{table}

      Месячный выпуск годных деталей определяется по формуле~\eqref{eq:capacity}.
      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:capacity}
      C=qFky,
      \end{equation}

      где $C$ --- расчетный выпуск годных деталей, шт./мес.;\par
      $q$ --- производительность при фактической работе, шт./ч;\par
      $F$ --- месячный фонд до потерь времени, ч/мес.;\par
      $k$ --- коэффициент доступного времени, безразмерный;\par
      $y$ --- доля годных деталей, безразмерная.
      \end{minipage}\par

      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      Требуемая мощность с резервом рассчитывается по формуле~\eqref{eq:reserve}.\par
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:reserve}
      C_{\min}=Q(1+r),
      \end{equation}

      где $C_{\min}$ --- требуемый выпуск с резервом, шт./мес.;\par
      $Q$ --- план выпуска годных деталей, шт./мес.;\par
      $r$ --- резерв относительно плана; в примере $r=0{,}15$.


      Для А: $C_A=${cap_A}$ шт./мес.; для Б: $C_{\text{Б}}=${cap_B}$ шт./мес.;
      для В: $C_{\text{В}}=${cap_C}$ шт./мес.
      Требуется не менее ${required} шт./мес. Вариант А покрывает план,
      но не обеспечивает принятый резерв, поэтому далее сравниваются Б и В.
      \end{minipage}\par

      \reportsection{Сопоставление затрат и решение}
      Тариф принят равным 8 руб./(кВт\,ч), горизонт $T=3$ года.
      Годовое время обработки определяется по формуле~\eqref{eq:hours}.
      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:hours}
      H=\frac{12Q}{qy},
      \end{equation}

      где $H$ --- время фактической обработки за год, ч/год;\par
      $12$ --- число месяцев в году, мес./год;\par
      $Q$ --- месячный план годных деталей, шт./мес.;\par
      $q$ --- часовая производительность, шт./ч;\par
      $y$ --- доля годных деталей, безразмерная.
      \end{minipage}\par

      Сопоставляемые затраты рассчитываются по формуле~\eqref{eq:cost}.
      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:cost}
      Z=I+T(S+PeH),
      \end{equation}

      где $Z$ --- затраты за выбранный горизонт, руб.;\par
      $I$ --- цена с доставкой и вводом, руб.;\par
      $T$ --- горизонт расчета, лет;\par
      $S$ --- сервисные расходы, руб./год;\par
      $P$ --- средняя мощность в работе, кВт;\par
      $e$ --- тариф на электроэнергию, руб./(кВт\,ч);\par
      $H$ --- время фактической обработки, ч/год.
      \end{minipage}\par

      Годовое время: Б --- ${h_B} ч, В --- ${h_C} ч.
      Затраты: Б --- ${cost_B} руб., В --- ${cost_C} руб.
      Разность $Z_{\text{В}}-Z_{\text{Б}}=${saving}$ руб.

      Для учебных условий выбран вариант Б: он обеспечивает резерв
      и имеет меньшие сопоставляемые затраты на принятом горизонте.
      В расчет не включены дисконтирование, налоги, остаточная стоимость,
      энергия ожидания, оплата труда, инструмент и прочие расходы.
      Для решения о закупке их необходимо проверить и включить при различиях.

      Если месячный план вырастет до 6000 годных деталей, резерв потребует
      6900 шт./мес. Вариант Б уже не подходит; вариант В проходит
      по мощности. Следовательно, выбор зависит от сценария спроса.
