sections:
  - id: 'purpose'
    title: 'Что обязательно выносится в приложения'
    html: |2-
                              <p>В основной части выпускной квалификационной работы (ВКР) должны
      содержаться только концептуальные схемы, ключевые формулы и выводы. В раздел
      <strong>Приложения</strong> помещается вспомогательный материал:</p>
                              <ul>
                                  <li>Полные листинги исходного кода программных комплексов.</li>
                                  <li>Акты внедрения результатов исследования на предприятиях.</li>
                                  <li>Объемные таблицы промежуточных статистических расчетов.</li>
                                  <li>Электрические принципиальные схемы, сборочные чертежи и <a
      href="/blog/software-screenshots-report-gost-caption">скриншоты программ по ГОСТ</a>.</li>
                                  <li>Тексты опросников, анкет и протоколов испытаний.</li>
                              </ul>
  - id: 'lettering-rules'
    title: 'Как нумеровать приложения в курсовой: запрещенные буквы алфавита'
    html: |2-
                              <p>Главная тонкость нормоконтроля в том, <strong>как нумеровать
      приложения в курсовой</strong> согласно ГОСТ 7.32-2017:</p>
                              <blockquote>
                                  «Приложения обозначают прописными буквами кириллического алфавита,
      начиная с А, за исключением букв <strong>Ё, З, Й, О, Ч, Ъ, Ы, Ь</strong>. После слова
      „ПРИЛОЖЕНИЕ“ следует буква, обозначающая его последовательность. Допускается обозначение
      приложений буквами латинского алфавита, за исключением букв I и O» (ГОСТ 7.32-2017, п. 6.17.4).
                              </blockquote>
                              <p>Это заданные стандартом исключения; обычная команда \Asbuk не обеспечивает всю эту последовательность. Если в работе одно приложение, оно все равно
      обозначается «ПРИЛОЖЕНИЕ А».</p>
  - id: 'gost-headings'
    title: 'Оформление приложений в дипломе гост: форма заголовка'
    html: |2-
                              <p>Стандартное <strong>оформление приложений в дипломе гост</strong>
      требует начинать каждое приложение с новой страницы:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Формат шапки приложения</span></div>
                                  <pre><code>ПРИЛОЖЕНИЕ А
      (обязательное / рекомендуемое / справочное)

      Исходный код микросервиса аутентификации</code></pre>
                              </div>
                              <p>В круглых скобках под словом ПРИЛОЖЕНИЕ указывается его статус
      (обычно <em>(обязательное)</em> или <em>(справочное)</em>), а ниже по центру печатается
      содержательный заголовок.</p>
  - id: 'latex-appendix'
    title: 'Настройка окружения appendix в LaTeX с русской нумерацией'
    html: |2-
      <p>В полном примере ниже <code>\appendix</code> включает режим приложений. Команда <code>\reportappendix</code> увеличивает счетчик главы, создает метку, запись содержания со статусом и отдельный центрированный заголовок. В <code>\ref</code> остается только буква, поэтому ссылка читается «в приложении А».</p>
      <p>Отображение ограничено тремя буквами А, Б, В и выдает ошибку при четвертом приложении. Для большего числа расширьте явное отображение с учетом исключений из § 6.17.4; не заменяйте его обычным <code>\Asbuk</code>. Счетчики объектов сбрасываются при начале каждой главы: пример показывает А.1 и Б.1 для формул, таблиц и рисунков.</p>
  - id: 'listings-in-appendix'
    title: 'Размещение длинных программных листингов и таблиц'
    html: |2-
                              <p>Внутри приложений код оформляется через пакет <code>listings</code>
      (правила верстки см. в статье об <a
      href="/blog/programming-lab-report-code-listings-gost">оформлении листингов в отчете</a>) с
      уменьшенным кеглем шрифта (<code>basicstyle=\ttfamily\scriptsize</code>) и плотными
      междустрочными интервалами, чтобы рационально использовать площадь страниц.</p>
  - id: 'full-example'
    title: 'Полный код учебного примера'
    html: |2-
      <p>Ниже весь код, который открывается по кнопке примера. Это самостоятельно компилируемый учебный макет оформления, а не полная ВКР или отчет о НИР: состав обязательных элементов, источники и реквизиты согласуйте с кафедрой. ГОСТ 7.32-2017 относится к отчетам о НИР; применение к ВКР проверяют по методичке.</p>
      <p>Статусы приложений в макете авторские: проверьте их по заданию. Повторно соберите документ, затем сверьте содержание, ссылки и номера объектов с PDF.</p>
      <div class="article-code"><pre><code>\documentclass[a4paper,14pt]{extreport}
      \usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[russian]{babel}
      \usepackage{tempora,amsmath,setspace,indentfirst,titlesec,tocloft}
      \usepackage[left=30mm,right=15mm,top=20mm,bottom=20mm]{geometry}
      \onehalfspacing
      \setlength{\parindent}{1.25cm}
      \setlength{\parskip}{0pt}
      \pagestyle{plain}
      \newcommand{\headingfont}{\normalfont\normalsize\bfseries
        \hyphenpenalty=10000\exhyphenpenalty=10000\relax}
      \titleformat{\chapter}[block]{\headingfont}
        {\thechapter}{0.5em}{}
      \titleformat{name=\chapter,numberless}[block]
        {\headingfont\filcenter}{}{0pt}{}
      \titleformat{\section}{\headingfont}{\thesection}{0.5em}{}
      \titlespacing{\chapter}{\parindent}{0pt}{14pt}
      \titlespacing{name=\chapter,numberless}{0pt}{0pt}{14pt}
      \titlespacing{\section}{\parindent}{12pt}{6pt}
      \setcounter{secnumdepth}{1}
      \setcounter{tocdepth}{1}
      \renewcommand{\cftchapleader}{\cftdotfill{\cftdotsep}}
      \renewcommand{\cftsecleader}{\cftdotfill{\cftdotsep}}
      \renewcommand{\cfttoctitlefont}{\hfill\headingfont}
      \renewcommand{\cftaftertoctitle}{\hfill}
      \setlength{\cftbeforetoctitleskip}{0pt}
      \addto\captionsrussian{\renewcommand{\contentsname}{СОДЕРЖАНИЕ}}
      \newcommand{\structural}[1]{\chapter*{#1}
        \addcontentsline{toc}{chapter}{#1}}
      \usepackage{caption,needspace}
      \usepackage{PTMono} % кириллический моноширинный шрифт для verbatim
      \DeclareCaptionLabelSeparator{gostdash}{\space---\space}
      \DeclareCaptionTextFormat{gosttitle}{\hyphenpenalty=10000\exhyphenpenalty=10000\relax#1}
      \captionsetup{labelsep=gostdash,font={normalsize,singlespacing},textformat=gosttitle}
      \captionsetup[table]{justification=raggedright,singlelinecheck=false}
      \captionsetup[figure]{justification=centering,singlelinecheck=false}
      \addto\captionsrussian{\renewcommand{\figurename}{Рисунок}}
      \AtBeginDocument{\setlength{\abovedisplayskip}{\baselineskip}
        \setlength{\belowdisplayskip}{\baselineskip}
        \setlength{\abovedisplayshortskip}{\baselineskip}
        \setlength{\belowdisplayshortskip}{\baselineskip}}
      % Учебное ограничение: только три приложения, А, Б, В.
      \newcommand{\appendixletter}{\ifcase\value{chapter}\or А\or Б\or В\else
        \PackageError{example}{Only three appendices supported}{Extend the explicit mapping}\fi}
      \newcommand{\startappendices}{\appendix
        \renewcommand{\thechapter}{\appendixletter}
        \renewcommand{\theequation}{\thechapter.\arabic{equation}}
        \renewcommand{\thetable}{\thechapter.\arabic{table}}
        \renewcommand{\thefigure}{\thechapter.\arabic{figure}}}
      \newcommand{\reportappendix}[3]{\clearpage
        \refstepcounter{chapter}\label{#3}
        \addcontentsline{toc}{chapter}{ПРИЛОЖЕНИЕ \thechapter\space (#1) --- #2}
        \begin{center}
          {\headingfont ПРИЛОЖЕНИЕ \thechapter\par}
          (#1)\par
          {\headingfont #2\par}
        \end{center}}
      \begin{document}
      \tableofcontents
      \chapter{Реализация}
      Учебный пример: код и расчет приведены в приложении~\ref{app:code},
      контрольный расчет --- в приложении~\ref{app:check}.
      \startappendices
      \reportappendix{справочное}{Листинг и расчет}{app:code}
      \begin{verbatim}
      # Учебный пример
      def square(x):
          return x * x
      \end{verbatim}
      Вычисление квадрата показано формулой~\eqref{eq:square},
      значения --- в таблице~\ref{tab:values}, схема --- на рисунке~\ref{fig:flow}.
      Все данные учебные.
      \Needspace{8\baselineskip}
      \begin{equation}\label{eq:square}
        y=x^2,
      \end{equation}
      где $y$ --- квадрат аргумента, безразмерная величина;\par
      \noindent $x$ --- аргумент, безразмерная величина.
      \begin{table}[htbp]
        \caption{Учебные значения}\label{tab:values}
        \centering
        \begin{tabular}{|r|r|}\hline
          \multicolumn{1}{|c|}{$x$} &amp; \multicolumn{1}{c|}{$y$} \\\hline
          2 &amp; 4 \\\hline
        \end{tabular}
      \end{table}
      \begin{figure}[htbp]
        \centering
        \fbox{\parbox{0.65\textwidth}{\centering Ввод $x$ $\longrightarrow$
          Вычисление $x^2$ $\longrightarrow$ Вывод $y$}}
        \caption{Учебная схема вычисления}\label{fig:flow}
      \end{figure}
      \reportappendix{справочное}{Контрольный расчет}{app:check}
      Второе приложение показывает сброс счетчиков. Формула~\eqref{eq:check},
      таблица~\ref{tab:check} и рисунок~\ref{fig:check} имеют номер Б.1.
      \Needspace{8\baselineskip}
      \begin{equation}\label{eq:check}
        y=x^2,
      \end{equation}
      где $y$ --- квадрат аргумента, безразмерная величина;\par
      \noindent $x$ --- аргумент, безразмерная величина.
      \begin{table}[htbp]
        \caption{Учебная проверка}\label{tab:check}
        \centering
        \begin{tabular}{|r|r|}\hline
          \multicolumn{1}{|c|}{$x$} &amp; \multicolumn{1}{c|}{$y$} \\\hline
          3 &amp; 9 \\\hline
        \end{tabular}
      \end{table}
      \begin{figure}[htbp]
        \centering\fbox{Учебная проверка: $3^2=9$}
        \caption{Схема контрольного вычисления}\label{fig:check}
      \end{figure}
      \end{document}</code></pre></div>
tips:
  - title: 'Сквозная нумерация страниц'
    html: |2-
      <p>Страницы приложений входят в общую сквозную нумерацию работы и продолжают нумерацию основного
      текста ВКР.</p>
  - title: 'Ссылки в основном тексте'
    html: |2-
      <p>Каждое приложение обязательно должно упоминаться в основном тексте диплома: <em>«Полный текст
      разработанного модуля приведен в приложении~А»</em>.</p>
