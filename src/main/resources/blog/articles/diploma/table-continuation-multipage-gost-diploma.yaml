  - id: 'common-pitfalls'
    title: 'Типичные ошибки при ручной верстке в Word'
    html: |2-
                              <p>В текстовых процессорах студенты часто создают разрыв страницы
      вручную и копируют кусок таблицы как отдельный объект. При малейшей правке текста выше по
      документу таблица съезжает, оставляя надпись «Продолжение таблицы» посередине листа. В LaTeX с
      пакетом <code>longtable</code> перенос пересчитывается при каждой сборке и не ломается от правок
      текста (ознакомьтесь с подробным руководством по <a
      href="/blog/latex-longtable-multipage">многостраничным таблицам longtable в LaTeX</a>).</p>
tips:
  - title: 'Разрыв таблицы вручную'
    html: |2-
      <p>Если нужно принудительно начать новую страницу внутри longtable перед смысловым блоком,
      используйте команду <code>\pagebreak</code> прямо перед нужной строкой.</p>
  - title: 'Шрифт внутри таблицы'
    html: |2-
      <p>Меньший кегль в таблице, чем в основном тексте, допускается: многие методички разрешают,
      например, 12 пт при основном тексте 14 пт. В LaTeX уменьшите шрифт командой <code>\small</code>
      перед таблицей.</p>
