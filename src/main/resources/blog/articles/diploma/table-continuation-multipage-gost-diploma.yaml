sections:
  - id: 'standard'
    title: 'Что требует ГОСТ 7.32-2017 к переносу таблиц'
    html: |2-
                              <p>В дипломных проектах по экономике, логистике, IT и машиностроению
      таблицы с результатами тестирования, спецификациями оборудования или сметами часто не помещаются
      на одну страницу формата А4 (подробнее см. руководство по <a
      href="/blog/latex-list-of-figures-tables">списку иллюстраций и таблиц в LaTeX</a>).</p>
                              <p>Согласно <strong>ГОСТ 7.32-2017</strong> (пункт 6.6.3), таблицу с
      большим количеством строк допускается переносить на другую страницу. Наименование таблицы пишут
      один раз слева над первой частью, а над следующими частями также слева пишут «Продолжение
      таблицы» с ее номером. Шапку на продолжении повторяют или заменяют строкой с номерами граф.</p>
  - id: 'gost-continuation'
    title: 'Продолжение таблицы на следующем листе гост: формулировка подписи'
    html: |2-
                              <p>Каноническое <strong>продолжение таблицы на следующем листе
      гост</strong> оформляется следующим образом:</p>
                              <ul>
                                  <li>На первом листе над таблицей слева пишется полное название:
      <em>Таблица 2.3 — Паспортные данные электродвигателей серии АИР</em>.</li>
                                  <li>На втором и последующих листах над таблицей слева, без абзацного
      отступа, пишется: <em>Продолжение таблицы 2.3</em>.</li>
                                  <li>На последнем листе некоторые вузы требуют писать <em>Окончание
      таблицы 2.3</em>; в ГОСТ 7.32 такой надписи нет, он везде использует «Продолжение таблицы».</li>
                              </ul>
  - id: 'header-columns'
    title: 'Перенос шапки таблицы диплом: текстовая шапка или нумерация граф?'
    html: |2-
                              <p>Грамотный <strong>перенос шапки таблицы диплом</strong> допускает два
      варианта:</p>
                              <ol>
                                  <li><strong>Полный повтор текста шапки:</strong> дублируются
      названия столбцов («Наименование», «Количество», «Цена»). Удобно для читателя, но отнимает
      полезную высоту страницы.</li>
                                  <li><strong>Нумерация граф (допускается ГОСТ 7.32 при делении
      таблицы на части):</strong> под основной шапкой на первом листе вводится дополнительная строка с
      номерами столбцов (1, 2, 3, 4). На всех последующих листах печатается <strong>только строка с
      цифрами 1, 2, 3, 4</strong>, что экономит место и выглядит максимально профессионально.</li>
                              </ol>
  - id: 'longtable-code'
    title: 'Готовый рабочий код шаблона таблицы в LaTeX'
    html: |2-
      <p>Ниже самостоятельный пример оформления отдельного элемента: A4, 14 пт, поля 30/15/20/20 мм, полуторный интервал и абзац 1,25 см. Это не полный отчет: титульный лист, содержание и список источников не включены. При вставке в основной документ сохраните его преамбулу и согласуйте оформление с методичкой кафедры; ГОСТ 7.32-2017 относится к отчетам о НИР.</p>
      <p>Окружение <code>longtable</code> само увеличивает счетчик таблиц: дополнительный <code>\refstepcounter{table}</code> перед ним не нужен. Метка стоит после <code>\caption</code> внутри окружения. Пакет <code>caption</code> задает название слева с тире; головка центрируется независимо от данных. Пятьдесят вымышленных строк обеспечивают настоящий перенос на страницах A4 с обычными полями. Код в статье совпадает с программой по кнопке.</p>
