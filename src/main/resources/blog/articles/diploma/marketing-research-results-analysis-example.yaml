sections:
  - id: 'question'
    title: 'Как связать анализ с вопросом исследования'
    html: |-
      <p>Анализ результатов маркетингового исследования начинается с задачи:
      что именно нужно выяснить и какие данные могут на нее ответить. Например,
      определить, какой из предложенных критериев выбора сервиса чаще называют
      участники опроса. Для такого вопроса достаточно распределения ответов;
      для оценки влияния цены на покупки нужны другие данные и дизайн исследования.</p>
      <p>Ниже — авторский учебный пример с вымышленными числами. В добровольном онлайн-опросе
      получено 120 пригодных для анализа ответов на вопрос: «Какой один из трех критериев
      важнее для вас при выборе сервиса: цена, скорость или поддержка?».
      Каждый участник выбирает ровно один вариант.</p>
      <p>Формулировка вопроса и набор вариантов влияют на ответ. Поэтому приведите
      их в отчете вместе с результатами; о подготовке вопросов можно прочитать в
      <a href="https://www.pewresearch.org/writing-survey-questions/">методических материалах Pew Research Center</a>.
      Наш вопрос сравнивает только три предложенных критерия и не исчерпывает все причины выбора.</p>
  - id: 'data'
    title: 'Проверка данных и база для процентов'
    html: |-
      <p>До расчета долей проверьте состав массива: правила включения анкет,
      пропуски, повторные записи и допустимые варианты ответа. Критерии обработки
      опишите заранее и сохраните исходные данные отдельно от очищенного набора.</p>
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead><tr><th>Проверка</th><th>Что зафиксировать</th></tr></thead>
              <tbody>
                  <tr><td>Состав участников</td><td>Кого приглашали, как распространялась анкета и когда собирались ответы.</td></tr>
                  <tr><td>Пропуски</td><td>Сколько участников не ответили на конкретный вопрос и входят ли они в базу процентов.</td></tr>
                  <tr><td>Один или несколько ответов</td><td>Разрешен ли множественный выбор и что считается единицей подсчета.</td></tr>
                  <tr><td>Повторные записи</td><td>По каким признакам они обнаружены и какие записи исключены.</td></tr>
                  <tr><td>Веса</td><td>Используются ли веса и как они получены; в нашем примере их нет.</td></tr>
              </tbody>
          </table>
      </div>
      <p>Здесь база $n=120$ — число допустимых ответов на один вопрос.
      Это не число отправленных приглашений и не количество посещений страницы.
      При множественном выборе сумма долей может превышать 100%:
      тогда явно укажите, считаете ли долю участников или долю всех выбранных ответов.</p>
  - id: 'calculation'
    title: 'Пример расчета долей и процентных пунктов'
    html: |-
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead><tr><th>Код</th><th>Критерий</th><th>Ответы</th><th>Доля от 120</th></tr></thead>
              <tbody>
                  <tr><td>1</td><td>Цена</td><td>54</td><td>45%</td></tr>
                  <tr><td>2</td><td>Скорость</td><td>42</td><td>35%</td></tr>
                  <tr><td>3</td><td>Поддержка</td><td>24</td><td>20%</td></tr>
                  <tr><td>—</td><td>Итого</td><td>120</td><td>100%</td></tr>
              </tbody>
          </table>
      </div>
      <p>Для категории с числом ответов $n_i$ доля равна:</p>
      <p>$$p_i=\frac{n_i}{n}\cdot100\%,\qquad
      p_{\text{цена}}=\frac{54}{120}\cdot100\%=45\%.$$</p>
      <p>Разность долей цены и скорости составляет $45-35=10$ <strong>процентных пунктов</strong>.
      Относительно доли скорости превышение равно $(45-35)/35\cdot100\%\approx28{,}57\%$.
      Это разные показатели: запись «разница 10%» без пояснения неоднозначна.</p>
      <p>При сравнении групп считайте долю внутри каждой группы по ее собственной базе.
      Большее число ответов в большой группе еще не означает более высокую долю.
      Сохраняйте числа наблюдений рядом с процентами.</p>
  - id: 'plot'
    title: 'Как показать распределение на графике'
    html: |-
      <p>Для категорий используйте столбчатую диаграмму с общей нулевой линией. В <code>plot</code> тип <code>histogram</code> с массивами координат и готовых долей строит столбцы категорий. Коды 1, 2 и 3 обозначают цену, скорость и поддержку; они не являются количественной шкалой.</p>
      <p>Сначала рассчитайте значения. Этот сегмент можно скрыть: в печатной части ниже остаются исходные количества, формулы и результаты.</p>
      <div class="article-code"><div class="article-code__header"><span class="article-code__lang">Вычислительный сегмент — расчеты</span></div><pre><code>price = 54
      speed = 42
      support = 24
      total = price + speed + support
      p1 = 100 * price / total
      p2 = 100 * speed / total
      p3 = 100 * support / total
      gap = p1 - p2
      codes = [1, 2, 3]
      shares = [p1, p2, p3]</code></pre></div>
      <p>Количество ответов должно быть неотрицательным целым, а база <code>total</code> — положительной. При нулевой базе проценты не определены. Не соединяйте категории линией тренда; округленные доли могут не дать ровно 100%.</p>
  - id: 'editor'
    title: 'Вычислительный сегмент и пример документа'
    html: |-
      <p>По кнопке открываются четыре сегмента в порядке печати: расчеты, начало документа с таблицей и формулами, график и завершение с подписью. Пример оформлен с учётом ГОСТ 7.32-2017; требования ВКР сверьте с методичкой кафедры.</p>
      <p>Это самостоятельный фрагмент основной части. Титул, содержание, библиография и приложения в него не входят. При вставке в полный отчет используйте его преамбулу, сквозную нумерацию и уникальные метки объектов.</p>
      <div class="article-code"><div class="article-code__header"><span class="article-code__lang">LaTeX — данные и расчеты</span></div><pre><code>\documentclass[a4paper,14pt]{extarticle}
      \usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[russian]{babel}
      \usepackage{tempora,amsmath,setspace,indentfirst,tabularx,array,titlesec,caption,needspace}
      \usepackage[left=30mm,right=15mm,top=20mm,bottom=20mm]{geometry}
      \onehalfspacing
      \setlength{\parindent}{1.25cm}
      \titleformat{\section}{\normalfont\bfseries\hyphenpenalty=10000\relax\exhyphenpenalty=10000\relax}{\thesection}{1em}{}
      \titlespacing{\section}{\parindent}{0pt}{12pt}
      \newcommand{\reportsection}[1]{\clearpage\section{#1}}
      \DeclareCaptionLabelSeparator{gostdash}{\space---\space}
      \captionsetup{labelsep=gostdash,font={normalsize,singlespacing}}
      \captionsetup[table]{justification=raggedright,singlelinecheck=false}
      \captionsetup[figure]{justification=centering,singlelinecheck=false}
      \DeclareCaptionTextFormat{gosttitle}{\hyphenpenalty=10000\relax\exhyphenpenalty=10000\relax#1}
      \captionsetup{textformat=gosttitle}
      \AtBeginDocument{%
          \setlength{\abovedisplayskip}{\baselineskip}%
          \setlength{\belowdisplayskip}{\baselineskip}%
          \setlength{\abovedisplayshortskip}{\baselineskip}%
          \setlength{\belowdisplayshortskip}{\baselineskip}}
      \addto\captionsrussian{\renewcommand{\figurename}{Рисунок}}
      \pagestyle{plain}
      \newcolumntype{Y}{&gt;{\raggedright\arraybackslash}X}
      \setlength{\emergencystretch}{2em}
      \usepackage{graphicx}
      \begin{document}
      \reportsection{Результаты маркетингового опроса}
      Учебные данные вымышлены. В добровольном онлайн-опросе участник
      выбирает один главный критерий сервиса: цену, скорость или поддержку.
      Весов нет; база --- допустимые ответы на этот вопрос.
      Исходные количества и доли приведены в таблице~\ref{tab:answers}.

      \begin{table}[htbp]
      \caption{Ответы участников учебного опроса}
      \label{tab:answers}
      \begin{tabularx}{\textwidth}{|Y|r|r|}
      \hline
      \multicolumn{1}{|c|}{Критерий} &amp; \multicolumn{1}{c|}{Ответы, чел.} &amp; \multicolumn{1}{c|}{Доля, \%} \\
      \hline
      Цена &amp; ${price} &amp; ${p1} \\
      Скорость &amp; ${speed} &amp; ${p2} \\
      Поддержка &amp; ${support} &amp; ${p3} \\
      Итого &amp; ${total} &amp; 100 \\
      \hline
      \end{tabularx}
      \end{table}

      Доли рассчитываются по формуле~\eqref{eq:share}.
      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:share}
      p_i=\frac{n_i}{n}\cdot100\%,
      \end{equation}

      где $p_i$ --- доля ответов категории $i$, \%;\par
      $n_i$ --- число ответов категории $i$, чел.;\par
      $n$ --- число допустимых ответов, чел.;\par
      $100\%$ --- коэффициент перевода доли в проценты.
      \end{minipage}\par

      Разность долей цены и скорости определяется по формуле~\eqref{eq:share-gap}.
      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:share-gap}
      \Delta p=p_1-p_2,
      \end{equation}

      где $\Delta p$ --- разность долей, процентные пункты;\par
      $p_1$ --- доля участников, выбравших цену, \%;\par
      $p_2$ --- доля участников, выбравших скорость, \%.
      \end{minipage}\par

      Получено: цена --- ${p1}\%, скорость --- ${p2}\%, поддержка --- ${p3}\%.
      Разность первых двух долей составляет ${gap} п.п.
      Распределение показано на рисунке~\ref{fig:criteria}.
      Коды по горизонтали: 1 --- цена, 2 --- скорость, 3 --- поддержка.
      </code></pre></div>
      <p>Следующий вычислительный сегмент оставьте видимым: он выводит график после ссылки на рисунок.</p>
      <div class="article-code"><div class="article-code__header"><span class="article-code__lang">Вычислительный сегмент — график</span></div><pre><code>plot(title="Критерии выбора", x_name="Код", y_name="Доля, %", x_1=codes, y_1=shares, type_1="histogram", name_1="Ответы")</code></pre></div>
      <p>Сразу после графика добавьте подпись и завершите документ. Подпись находится вне плавающего окружения и следует за графическим сегментом.</p>
      <div class="article-code"><div class="article-code__header"><span class="article-code__lang">LaTeX — подпись и вывод</span></div><pre><code>\par
      \nopagebreak[4]
      \begingroup
      \captionof{figure}{Критерии выбора сервиса среди участников учебного опроса}
      \label{fig:criteria}
      \endgroup

      Вывод относится к ${total} участникам опроса. Добровольный набор
      не доказывает репрезентативность для всех клиентов; предпочтение
      не равнозначно намерению купить. Наблюдаемая разность не устанавливает
      причинное влияние цены на покупку.
      \end{document}</code></pre></div>
      <p>После изменения данных проверьте таблицу, доли, подпись и порядок сегментов. По умолчанию значения выводятся с тремя значащими цифрами.</p>
  - id: 'interpretation'
    title: 'Выводы, ограничения и проверка отчета'
    html: |-
      <div class="article-quote">
          <p>«Среди 120 участников, ответивших на вопрос с единственным выбором,
          54 человека выбрали цену (45%), 42 — скорость (35%), 24 — поддержку (20%).
          Цена выбрана чаще скорости на 10 процентных пунктов.
          Опрос проводился добровольно онлайн, поэтому полученное распределение
          описывает его участников и не доказывает аналогичные доли среди всех клиентов».</p>
      </div>
      <p>Не превращайте предпочтение в намерение купить, а наблюдаемую связь —
      в причинный эффект. Оценить влияние изменения цены или интерфейса на покупки
      можно только с подходящим дизайном и данными. Описание набора участников,
      обработки и ограничений согласуется с
      <a href="https://aapor.org/standards-and-ethics/best-practices/">рекомендациями AAPOR по исследованию опросов</a>.</p>
      <ul>
          <li>В отчете указаны задача, вопрос, варианты ответа и способ набора участников.</li>
          <li>У каждой доли понятна база; пропуски и множественный выбор обработаны явно.</li>
          <li>Количество ответов согласуется с процентами и графиком.</li>
          <li>Проценты не перепутаны с процентными пунктами.</li>
          <li>Не заявлены репрезентативность, доверительная погрешность или статистическая значимость без обоснования.</li>
          <li>Предложения по дальнейшей проверке отделены от установленных результатов.</li>
      </ul>
      <p>Итоги анализа можно включить в
      <a href="/blog/diploma-conclusion-structure-example">заключение ВКР</a>.
      Экономические предположения проверяйте отдельно по
      <a href="/blog/diploma-economic-efficiency-calculation-example">примеру расчета эффективности</a>,
      не подставляя долю предпочтений вместо денежного потока.</p>
tips:
  - title: 'Сохраняйте анкету вместе с данными'
    html: |-
      <p>Приложите формулировку вопроса, порядок вариантов и правила очистки.
      Они помогают понять, что именно измеряют опубликованные проценты.</p>
  - title: 'Проверяйте числа до оформления графика'
    html: |-
      <p>Сначала сверяйте суммы и базы, затем стройте визуализацию.
      Красивый график не исправляет неверный знаменатель в расчете доли.</p>
