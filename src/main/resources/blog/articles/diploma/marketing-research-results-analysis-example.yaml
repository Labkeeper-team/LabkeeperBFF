      \reportsection{Результаты маркетингового опроса}
      Учебные данные вымышлены. В добровольном онлайн-опросе участник
      выбирает один главный критерий сервиса: цену, скорость или поддержку.
      Весов нет; база --- допустимые ответы на этот вопрос.
      Исходные количества и доли приведены в таблице~\ref{tab:answers}.

      \begin{table}[htbp]
      \caption{Ответы участников учебного опроса}
      \label{tab:answers}
      \begin{tabularx}{\textwidth}{|Y|r|r|}
      \hline
      \multicolumn{1}{|c|}{Критерий} & \multicolumn{1}{c|}{Ответы, чел.} & \multicolumn{1}{c|}{Доля, \%} \\
