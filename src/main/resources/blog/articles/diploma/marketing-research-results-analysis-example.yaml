      Цена & ${price} & ${p1} \\
      Скорость & ${speed} & ${p2} \\
      Поддержка & ${support} & ${p3} \\
      Итого & ${total} & 100 \\
      \hline
      \end{tabularx}
      \end{table}

      Доли рассчитываются по формуле~\eqref{eq:share}.
      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:share}
      p_i=\frac{n_i}{n}\cdot100\%,
      \end{equation}

      где $p_i$ --- доля ответов категории $i$, \%;\par
      $n_i$ --- число ответов категории $i$, чел.;\par
      $n$ --- число допустимых ответов, чел.;\par
      $100\%$ --- коэффициент перевода доли в проценты.
      \end{minipage}\par

      Разность долей цены и скорости определяется по формуле~\eqref{eq:share-gap}.
      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:share-gap}
      \Delta p=p_1-p_2,
      \end{equation}

      где $\Delta p$ --- разность долей, процентные пункты;\par
      $p_1$ --- доля участников, выбравших цену, \%;\par
      $p_2$ --- доля участников, выбравших скорость, \%.
      \end{minipage}\par

      Получено: цена --- ${p1}\%, скорость --- ${p2}\%, поддержка --- ${p3}\%.
      Разность первых двух долей составляет ${gap} п.п.
      Распределение показано на рисунке~\ref{fig:criteria}.
      Коды по горизонтали: 1 --- цена, 2 --- скорость, 3 --- поддержка.
    parameters:
      visible: true
