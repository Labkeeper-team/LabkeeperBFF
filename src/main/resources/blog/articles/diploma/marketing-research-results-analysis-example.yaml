sections:
  - id: 'question'
    title: 'Как связать анализ с вопросом исследования'
    html: |2-
      <p>Анализ результатов маркетингового исследования начинается с задачи:
      что именно нужно выяснить и какие данные могут на нее ответить. Например,
      определить, какой из предложенных критериев выбора сервиса чаще называют
      участники опроса. Для такого вопроса достаточно распределения ответов;
      для оценки влияния цены на покупки нужны другие данные и дизайн исследования.</p>
      <p>Ниже — авторский учебный пример с вымышленными числами. В добровольном онлайн-опросе
      получено 120 пригодных для анализа ответов на вопрос: «Какой один из трех критериев
      важнее для вас при выборе сервиса: цена, скорость или поддержка?».
      Каждый участник выбирает ровно один вариант.</p>
      <p>Формулировка вопроса и набор вариантов влияют на ответ. Поэтому приведите
      их в отчете вместе с результатами; о подготовке вопросов можно прочитать в
      <a href="https://www.pewresearch.org/writing-survey-questions/">методических материалах Pew Research Center</a>.
      Наш вопрос сравнивает только три предложенных критерия и не исчерпывает все причины выбора.</p>
  - id: 'data'
    title: 'Проверка данных и база для процентов'
    html: |2-
      <p>До расчета долей проверьте состав массива: правила включения анкет,
      пропуски, повторные записи и допустимые варианты ответа. Критерии обработки
      опишите заранее и сохраните исходные данные отдельно от очищенного набора.</p>
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead><tr><th>Проверка</th><th>Что зафиксировать</th></tr></thead>
              <tbody>
                  <tr><td>Состав участников</td><td>Кого приглашали, как распространялась анкета и когда собирались ответы.</td></tr>
                  <tr><td>Пропуски</td><td>Сколько участников не ответили на конкретный вопрос и входят ли они в базу процентов.</td></tr>
                  <tr><td>Один или несколько ответов</td><td>Разрешен ли множественный выбор и что считается единицей подсчета.</td></tr>
                  <tr><td>Повторные записи</td><td>По каким признакам они обнаружены и какие записи исключены.</td></tr>
                  <tr><td>Веса</td><td>Используются ли веса и как они получены; в нашем примере их нет.</td></tr>
              </tbody>
          </table>
      </div>
      <p>Здесь база $n=120$ — число допустимых ответов на один вопрос.
      Это не число отправленных приглашений и не количество посещений страницы.
      При множественном выборе сумма долей может превышать 100%:
      тогда явно укажите, считаете ли долю участников или долю всех выбранных ответов.</p>
  - id: 'calculation'
    title: 'Пример расчета долей и процентных пунктов'
    html: |2-
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead><tr><th>Код</th><th>Критерий</th><th>Ответы</th><th>Доля от 120</th></tr></thead>
              <tbody>
                  <tr><td>1</td><td>Цена</td><td>54</td><td>45%</td></tr>
                  <tr><td>2</td><td>Скорость</td><td>42</td><td>35%</td></tr>
                  <tr><td>3</td><td>Поддержка</td><td>24</td><td>20%</td></tr>
                  <tr><td>—</td><td>Итого</td><td>120</td><td>100%</td></tr>
              </tbody>
          </table>
      </div>
      <p>Для категории с числом ответов $n_i$ доля равна:</p>
      <p>$$p_i=\frac{n_i}{n}\cdot100\%,\qquad
      p_{\text{цена}}=\frac{54}{120}\cdot100\%=45\%.$$</p>
      <p>Разность долей цены и скорости составляет $45-35=10$ <strong>процентных пунктов</strong>.
      Относительно доли скорости превышение равно $(45-35)/35\cdot100\%\approx28{,}57\%$.
      Это разные показатели: запись «разница 10%» без пояснения неоднозначна.</p>
      <p>При сравнении групп считайте долю внутри каждой группы по ее собственной базе.
      Большее число ответов в большой группе еще не означает более высокую долю.
      Сохраняйте числа наблюдений рядом с процентами.</p>
  - id: 'plot'
    title: 'Как показать распределение на графике'
    html: |2-
      <p>Для сравнения отдельных категорий подойдет столбчатая диаграмма с общей
      нулевой линией. Укажите вопрос, единицы по вертикали и базу расчета.
      В примере Labkeeper по горизонтали используются коды 1, 2 и 3 из таблицы выше:
      эти числа обозначают категории, а не количественную шкалу.</p>
      <p>В функции <code>plot</code> столбцы задаются через
      <code>type_1="histogram"</code> и пары массивов координат и значений.
      Здесь передаются уже рассчитанные доли категорий: программа не определяет
      частоты из исходных анкет. Не соединяйте эти категории линией тренда
      и не делайте вывод о росте при переходе от кода 1 к коду 3.</p>
      <p>Разместите расчеты в вычислительном сегменте и отключите его отображение
      в документе. Переменные останутся доступны следующим сегментам.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Вычислительный сегмент — расчеты</span></div>
          <pre><code>price = 54
      speed = 42
      support = 24
      total = price + speed + support
      p1 = 100 * price / total
      p2 = 100 * speed / total
      p3 = 100 * support / total
      gap = p1 - p2
      codes = [1, 2, 3]
      shares = [p1, p2, p3]</code></pre>
      </div>
      <p>В следующем вычислительном сегменте оставьте отображение включенным,
      чтобы диаграмма попала в документ:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Вычислительный сегмент — график</span></div>
          <pre><code>plot(title="Критерии выбора", x_name="Код", y_name="Доля, %", x_1=codes, y_1=shares, type_1="histogram", name_1="Ответы")</code></pre>
      </div>
      <p>При изменении чисел доли и столбцы пересчитаются. Числа ответов должны
      быть неотрицательными целыми, а <code>total</code> — больше нуля.
      Для нулевой базы проценты не определены. Сумма округленных долей иногда
      отличается от 100% на последнем знаке — поясните округление, не меняя исходные числа.</p>
  - id: 'editor'
    title: 'Вычислительный сегмент и пример документа'
    html: |2-
      <p>Кнопка «Просмотреть пример» открывает отдельные сегменты расчетов и графика и LaTeX-сегмент
      с пояснением кодов и численными результатами. Значения подставляются через
      <code>${p1}</code>, <code>${total}</code> и другие переменные.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX-сегмент</span></div>
          <pre><code>\section*{Результаты опроса}
      Учебные данные, один ответ на вопрос; $n=${total}$.
      Коды: 1 --- цена, 2 --- скорость, 3 --- поддержка.
      Цена: ${p1}\%, скорость: ${p2}\%, поддержка: ${p3}\%.
      Разность первых двух долей: ${gap} п.п.
      Вывод относится к участникам опроса.</code></pre>
      </div>
      <p>Сегмент с расчетами скрыт из вывода, а сегмент с графиком остается видимым.
      Для другого формата отчета перенесите итоговую таблицу в документ по
      <a href="/blog/latex-diploma-gost">руководству по верстке диплома</a>.</p>
  - id: 'interpretation'
    title: 'Выводы, ограничения и проверка отчета'
    html: |2-
      <div class="article-quote">
          <p>«Среди 120 участников, ответивших на вопрос с единственным выбором,
          54 человека выбрали цену (45%), 42 — скорость (35%), 24 — поддержку (20%).
          Цена выбрана чаще скорости на 10 процентных пунктов.
          Опрос проводился добровольно онлайн, поэтому полученное распределение
          описывает его участников и не доказывает аналогичные доли среди всех клиентов».</p>
      </div>
      <p>Не превращайте предпочтение в намерение купить, а наблюдаемую связь —
      в причинный эффект. Оценить влияние изменения цены или интерфейса на покупки
      можно только с подходящим дизайном и данными. Описание набора участников,
      обработки и ограничений согласуется с
      <a href="https://aapor.org/standards-and-ethics/best-practices/">рекомендациями AAPOR по исследованию опросов</a>.</p>
      <ul>
          <li>В отчете указаны задача, вопрос, варианты ответа и способ набора участников.</li>
          <li>У каждой доли понятна база; пропуски и множественный выбор обработаны явно.</li>
          <li>Количество ответов согласуется с процентами и графиком.</li>
          <li>Проценты не перепутаны с процентными пунктами.</li>
          <li>Не заявлены репрезентативность, доверительная погрешность или статистическая значимость без обоснования.</li>
          <li>Предложения по дальнейшей проверке отделены от установленных результатов.</li>
      </ul>
      <p>Итоги анализа можно включить в
      <a href="/blog/diploma-conclusion-structure-example">заключение ВКР</a>.
      Экономические предположения проверяйте отдельно по
      <a href="/blog/diploma-economic-efficiency-calculation-example">примеру расчета эффективности</a>,
      не подставляя долю предпочтений вместо денежного потока.</p>
tips:
  - title: 'Сохраняйте анкету вместе с данными'
    html: |2-
      <p>Приложите формулировку вопроса, порядок вариантов и правила очистки.
      Они помогают понять, что именно измеряют опубликованные проценты.</p>
  - title: 'Проверяйте числа до оформления графика'
    html: |2-
      <p>Сначала сверяйте суммы и базы, затем стройте визуализацию.
      Красивый график не исправляет неверный знаменатель в расчете доли.</p>
