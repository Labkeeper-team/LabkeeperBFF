sections:
  - id: 'intro'
    title: 'ГОСТ 7.32 и требования к оформлению'
    html: |2-
                              <p>ГОСТ 7.32-2017 «Отчёт о научно-исследовательской работе» — стандарт
      отчёта о НИР.
                                  Методички вузов по оформлению дипломных и курсовых работ обычно
      опираются на него: он задаёт
                                  требования к полям, шрифтам, заголовкам, нумерации и структуре (а
      для подготовки первой
                                  страницы рекомендуем наш <a href="/blog/latex-titlepage">гайд по
      верстке титульного листа по
                                      ГОСТ</a>). Если методичка кафедры расходится со стандартом,
      следуйте методичке.</p>
                              <p>Если в дипломе предусмотрена экономическая часть, используйте
      <a href="/blog/product-cost-calculation-example">пример расчета себестоимости продукции</a>:
      в нем показаны исходные данные, формулы и подстановка результатов в LaTeX.</p>
                              <p>Материалы, собранные перед написанием ВКР, можно оформить по
      <a href="/blog/industrial-practice-report-format-template">шаблону отчета по производственной
      и преддипломной практике</a>.</p>
                              <p>Для отдельных частей ВКР используйте материалы про
      <a href="/blog/diploma-life-safety-section-calculation-example">раздел БЖД с расчетом освещения</a>
      и <a href="/blog/diploma-conclusion-structure-example">структуру заключения</a>.</p>
                              <p>Связать цель, задачи и методы поможет
      <a href="/blog/diploma-introduction-structure-example">шаблон введения ВКР</a>.
      Для прикладной части доступны примеры
      <a href="/blog/specialist-workstation-diploma-design">проектирования АРМ специалиста</a>
      и <a href="/blog/marketing-research-results-analysis-example">анализа маркетингового исследования</a>.</p>
                              <p>Ключевые требования ГОСТ 7.32:</p>
                              <div class="article-table-wrapper">
                                  <table class="article-table">
                                      <thead>
                                          <tr>
                                              <th>Параметр</th>
                                              <th>Требование ГОСТ</th>
                                          </tr>
                                      </thead>
                                      <tbody>
                                          <tr>
                                              <td>Шрифт</td>
                                              <td>Не менее 12 пт, рекомендован Times New Roman</td>
                                          </tr>
                                          <tr>
                                              <td>Межстрочный интервал</td>
                                              <td>Полуторный (1.5)</td>
                                          </tr>
                                          <tr>
                                              <td>Поля: левое</td>
                                              <td>30 мм</td>
                                          </tr>
                                          <tr>
                                              <td>Поля: правое</td>
                                              <td>15 мм</td>
                                          </tr>
                                          <tr>
                                              <td>Поля: верхнее и нижнее</td>
                                              <td>20 мм</td>
                                          </tr>
                                          <tr>
                                              <td>Абзацный отступ</td>
                                              <td>12,5 мм (~1,25 см)</td>
                                          </tr>
                                          <tr>
                                              <td>Нумерация страниц</td>
                                              <td>Арабские цифры, внизу по центру; титульный лист
      входит в нумерацию, но номер
                                                  на нём не ставится</td>
                                          </tr>
                                      </tbody>
                                  </table>
                              </div>
  - id: 'class'
    title: 'Выбор класса документа и базовая настройка'
    html: |2-
                              <p>Для оформления курсовой работы в LaTeX используйте класс
      <code>extreport</code> или
                                  <code>extarticle</code> из комплекта extsizes. Стандартные
      <code>report</code> и
                                  <code>article</code> поддерживают только 10, 11 и 12 пт: опцию
      <code>14pt</code> они молча
                                  игнорируют и набирают текст кеглем 10. Для дипломных работ с главами
      удобнее
                                  <code>extreport</code>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\documentclass[a4paper,14pt]{extreport}

      \usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[russian]{babel}

      % Поля по ГОСТ
      \usepackage[
          left=30mm,
          right=15mm,
          top=20mm,
          bottom=20mm
      ]{geometry}

      % Полуторный интервал
      \usepackage{setspace}
      \onehalfspacing

      % Абзацный отступ
      \setlength{\parindent}{1.25cm}

      % Без отступа между абзацами
      \setlength{\parskip}{0pt}</code></pre>
                              </div>
  - id: 'geometry'
    title: 'Поля страницы по ГОСТ'
    html: |2-
                              <p>Пакет <code>geometry</code> — самый удобный способ задать поля.
      Параметры для ГОСТ 7.32:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\usepackage[
          a4paper,
          left=30mm,    % поле для переплёта
          right=15mm,
          top=20mm,
          bottom=20mm,
          headheight=14pt
      ]{geometry}</code></pre>
                              </div>
                              <div class="article-note">
                                  <strong>💡 Совет:</strong> Требования конкретного вуза могут
      отличаться от ГОСТ. Уточните
                                  методичку кафедры — иногда нижнее поле задаётся 25 мм, а не 20 мм.
                              </div>
  - id: 'fonts'
    title: 'Шрифт и межстрочный интервал'
    html: |2-
                              <p>ГОСТ 7.32-2017 требует шрифт не меньше 12 пт и рекомендует Times New
      Roman. Labkeeper
                                  собирает PDF через pdfLaTeX, поэтому системные шрифты вроде Times
      New Roman ему недоступны.
                                  Близкий по рисунку шрифт с кириллицей даёт пакет
      <code>tempora</code>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX (pdfLaTeX)</span>
                                  </div>
                                  <pre><code>\usepackage[T2A]{fontenc}
      \usepackage{tempora}   % близкий аналог Times New Roman с кириллицей</code></pre>
                              </div>
                              <p>Пакета <code>pscyr</code> в TeX Live нет, а в <code>mathptmx</code>
      нет кириллицы: с ним
                                  русский текст наберётся другим шрифтом. При локальной сборке XeLaTeX
      или LuaLaTeX системный
                                  шрифт можно подключить напрямую. В Labkeeper этот вариант не
      работает: pdfLaTeX
                                  останавливает сборку с ошибкой «fontspec requires XeTeX or
      LuaTeX».</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX (XeLaTeX, только локально)</span>
                                  </div>
                                  <pre><code>\usepackage{fontspec}
      \setmainfont{Times New Roman}
      \setsansfont{Arial}
      \setmonofont{Courier New}</code></pre>
                              </div>
                              <p>Межстрочный интервал 1.5 устанавливается через пакет
      <code>setspace</code>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\usepackage{setspace}
      \onehalfspacing   % полуторный интервал

      % Не замена onehalfspacing: множитель 1.5 заметно реже.
      % Без \selectfont команда не включается сразу.
      \renewcommand{\baselinestretch}{1.5}</code></pre>
                              </div>
  - id: 'headings'
    title: 'Заголовки и разделы'
    html: |2-
                              <p>По ГОСТ 7.32-2017 (п. 6.2.3) заголовки разделов и подразделов
      печатают с абзацного отступа, с
                                  прописной буквы, полужирным шрифтом и без точки в конце. Прописными
      буквами и по центру
                                  пишут только заголовки структурных элементов: «СОДЕРЖАНИЕ»,
      «ВВЕДЕНИЕ», «ЗАКЛЮЧЕНИЕ»,
                                  «СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ», «ПРИЛОЖЕНИЕ» (п. 6.2.1). В LaTeX
      структурные элементы
                                  удобно набирать ненумерованными главами <code>\chapter*</code>, а
      разделы — обычными
                                  <code>\chapter</code>. Фрагменты ниже показывают отдельные настройки; весь код по кнопке приведен в конце статьи. Пакет <code>titlesec</code> задаёт для них
      разные стили:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\usepackage{titlesec}

      % Разделы: с абзацного отступа, с прописной буквы, полужирные
      \titleformat{\chapter}[block]
          {\normalfont\normalsize\bfseries\hyphenpenalty=10000\exhyphenpenalty=10000\relax}
          {\thechapter}
          {0.5em}
          {}

      % Структурные элементы (\chapter*): по центру, прописными
      \titleformat{name=\chapter,numberless}[block]
          {\normalfont\normalsize\bfseries\filcenter\hyphenpenalty=10000\exhyphenpenalty=10000\relax}
          {}
          {0pt}
          {\MakeUppercase}

      % Подразделы: с абзацного отступа, полужирные
      \titleformat{\section}
          {\normalfont\normalsize\bfseries\hyphenpenalty=10000\exhyphenpenalty=10000\relax}
          {\thesection}
          {0.5em}
          {}

      % Отступы вокруг заголовков
      \titlespacing{\chapter}{\parindent}{0pt}{14pt}
      \titlespacing{name=\chapter,numberless}{0pt}{0pt}{14pt}
      \titlespacing{\section}{\parindent}{12pt}{6pt}</code></pre>
                              </div>
                              <p>Ненумерованная глава сама в оглавление не попадает: после
      <code>\chapter*{Введение}</code>
                                  добавьте <code>\addcontentsline{toc}{chapter}{Введение}</code>.</p>
  - id: 'toc'
    title: 'Оглавление и нумерация страниц'
    html: |2-
                              <p>Оглавление формируется командой <code>\tableofcontents</code>. Для
      настройки нумерации снизу
                                  по центру подключите пакет <code>fancyhdr</code> (все тонкости
      колонтитулов мы разобрали в
                                  <a href="/blog/latex-fancyhdr">руководстве по пакету
      fancyhdr</a>):</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>% Нумерация снизу по центру
      \usepackage{fancyhdr}
      \pagestyle{fancy}
      \fancyhf{}
      \fancyfoot[C]{\thepage}
      \renewcommand{\headrulewidth}{0pt}

      % Глубина читается в момент \tableofcontents, поэтому счётчики стоят раньше
      \setcounter{tocdepth}{3}
      \setcounter{secnumdepth}{3}

      % Оглавление
      \tableofcontents
      \newpage</code></pre>
                              </div>
                              <p>По ГОСТ 7.32-2017 номер не ставят только на титульном листе: он
      входит в общую нумерацию,
                                  но цифру на нём не печатают. Добавьте
      <code>\thispagestyle{empty}</code> на странице
                                  титульного листа, а страницу содержания нумеруйте как обычно.
      Заголовок оглавления по ГОСТ —
                                  «СОДЕРЖАНИЕ», а babel по умолчанию пишет «Оглавление».
      Переопределите его в преамбуле:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\addto\captionsrussian{\renewcommand{\contentsname}{Содержание}}</code></pre>
                              </div>
                              <p>С настройками <code>titlesec</code> из предыдущего раздела заголовок
      оглавления выйдет по
                                  центру прописными буквами.</p>
  - id: 'appendix'
    title: 'Приложения'
    html: |2-
      <p>Приложения начинают с новой страницы, включают в содержание с обозначением, статусом и названием и упоминают в основном тексте. Нумерация страниц продолжается.</p>
      <p>ГОСТ 7.32-2017 (§ 6.17.4) исключает из кириллических обозначений Ё, З, Й, О, Ч, Ъ, Ы, Ь, из латинских — I и O. Обычная команда <code>\Asbuk</code> не учитывает все эти исключения. В полном примере ниже дана явная ограниченная последовательность А, Б, В с ошибкой при четвертом приложении. Для большего числа приложений расширьте отображение по разрешенному алфавиту.</p>
      <p>Статус «справочное» выбран автором для учебного образца: согласуйте его с заданием кафедры. В примере счетчики таблиц, рисунков и формул получают букву приложения: А.1.</p>
  - id: 'tips'
    title: 'Практические советы'
    html: |2-
                              <div class="article-tips">
                                  <div class="article-tip">
                                      <div class="article-tip__number">1</div>
                                      <div class="article-tip__content">
                                          <h3>Начните с примера из витрины</h3>
                                          <p>Откройте пример дипломной работы в витрине на главной
      странице Labkeeper (фильтр
                                              «Дипломные») и клонируйте его — или возьмите преамбулу
      из этой статьи.</p>
                                      </div>
                                  </div>
                                  <div class="article-tip">
                                      <div class="article-tip__number">2</div>
                                      <div class="article-tip__content">
                                          <h3>Разбивайте документ на файлы</h3>
                                          <p>Используйте <code>\include{chapter1}</code> для вынесения
      каждой главы в
                                              отдельный .tex-файл. Это ускоряет компиляцию и упрощает
      навигацию в большом
                                              проекте.</p>
                                      </div>
                                  </div>
                                  <div class="article-tip">
                                      <div class="article-tip__number">3</div>
                                      <div class="article-tip__content">
                                          <h3>Перекрёстные ссылки и библиография</h3>
                                          <p>Используйте <code>\label</code> и <code>\ref</code> для
      ссылок на рисунки,
                                              таблицы и формулы (правила набора математики смотрите в
      <a
                                                  href="/blog/latex-formulas">гайде по формулам в
      LaTeX</a>). Список
                                              литературы по ГОСТ оформите через окружение
      <code>thebibliography</code>: Biber в
                                              Labkeeper пока не запускается (подробно в <a
                                                  href="/blog/latex-gost-bibliography">инструкции по
      библиографии по
                                                  ГОСТ</a>).</p>
                                      </div>
                                  </div>
                                  <div class="article-tip">
                                      <div class="article-tip__number">4</div>
                                      <div class="article-tip__content">
                                          <h3>Список рисунков и таблиц</h3>
                                          <p>Добавьте <code>\listoffigures</code> и
      <code>\listoftables</code> после
                                              оглавления, если такие списки требует методичка: среди
      структурных элементов
                                              ГОСТ 7.32-2017 их нет (настройку оформления смотрите в
      <a
                                                  href="/blog/latex-list-of-figures-tables">статье о
      списках иллюстраций и
                                                  таблиц</a>).</p>
                                      </div>
                                  </div>
                              </div>
  - id: 'full-example'
    title: 'Полный код учебного примера'
    html: |2-
      <p>Ниже весь код по кнопке примера. Это учебный макет оформления, а не полная ВКР или отчет о НИР: список источников и другие обязательные элементы добавляют по заданию кафедры. Реквизиты титула и статус приложения авторские, их нужно согласовать с кафедрой. ГОСТ 7.32-2017 относится к отчетам о НИР; применение к ВКР уточняют по методичке. Повторно соберите документ и сверьте содержание, ссылки и номера объектов с PDF.</p>
      <div class="article-code"><pre><code>\documentclass[a4paper,14pt]{extreport}
      \usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[russian]{babel}
      \usepackage{tempora,amsmath,setspace,indentfirst,titlesec,tocloft}
      \usepackage[left=30mm,right=15mm,top=20mm,bottom=20mm]{geometry}
      \onehalfspacing
      \setlength{\parindent}{1.25cm}
      \setlength{\parskip}{0pt}
      \pagestyle{plain}
      \newcommand{\headingfont}{\normalfont\normalsize\bfseries
        \hyphenpenalty=10000\exhyphenpenalty=10000\relax}
      \titleformat{\chapter}[block]{\headingfont}
