sections:
  - id: 'word-problem'
    title: 'Почему в MS Word возникают «белые реки» и гигантские пробелы'
    html: |2-
                              <p>Каждый студент, набиравший дипломную записку в Microsoft Word с
      выравниванием «по ширине», сталкивался с эффектом: длинное слово или формула не помещается в
      конец строки и целиком перескакивает на следующую, а оставшиеся 3–4 слова в строке растягиваются
      с огромными пробелами.</p>
                              <p>Когда такие широкие пробелы в соседних строках выстраиваются друг под
      другом, получаются вертикальные просветы через несколько строк — в полиграфии их называют
      <strong>«белыми реками»</strong> (rivers of white). Текст выглядит рваным, неряшливым и утомляет
      глаза при чтении.</p>
  - id: 'word-fix'
    title: 'Как убрать большие пробелы в Word: 4 шага'
    html: |2-
                              <p>Большие пробелы между словами в ворде почти всегда дают одна из четырёх
      причин. Проверьте их по порядку:</p>
                              <ol>
                                <li><strong>Включите автоматические переносы.</strong> Вкладка «Макет» →
      «Расстановка переносов» → «Авто». Длинные слова начнут делиться между строками, и Word перестанет
      растягивать оставшиеся слова.</li>
                                <li><strong>Уберите разрывы строки Shift+Enter.</strong> Если строка в
      абзаце закончена через Shift+Enter, Word растягивает её на всю ширину. Включите непечатаемые символы
      (Ctrl+Shift+8): разрыв выглядит как стрелка ↵. Замените его через «Найти и заменить» (Ctrl+H): найти
      <code>^l</code>, заменить на обычный пробел или <code>^p</code>.</li>
                                <li><strong>Отключите растяжение строк с разрывом.</strong> «Файл» →
      «Параметры» → «Дополнительно» → «Параметры совместимости» → отметьте «Не расширять межзнаковые
      интервалы в строке, оканчивающейся разрывом строки».</li>
                                <li><strong>Замените табуляции и двойные пробелы.</strong> В «Найти и
      заменить» найдите <code>^t</code> и два пробела подряд, замените на один пробел.</li>
                              </ol>
                              <p>Эти шаги убирают самые грубые «дыры», но Word всё равно выравнивает
      каждую строку отдельно. Почему в LaTeX проблемы нет в принципе, разберём ниже.</p>
  - id: 'knuth-plass-algo'
    title: 'Большие пробелы при выравнивании по ширине: решение алгоритмом Кнута-Пласса'
    html: |2-
                              <p>Причина того, почему возникают <strong>большие пробелы при
      выравнивании по ширине</strong> в Word, кроется в устаревшем алгоритме: Word форматирует текст
      построчно (жадно), не зная, что произойдет строкой ниже.</p>
                              <p>Дональд Кнут создал для TeX революционный алгоритм динамического
      программирования (алгоритм Кнута-Пласса). LaTeX анализирует <strong>весь абзац целиком</strong>,
      минимизируя суммарный штраф (badness) за неравномерность пробелов. В результате ширина
      межсловных интервалов по всей полосе набора получается заметно равномернее, чем при построчном
      выравнивании.</p>
  - id: 'hyphenation-setup'
    title: 'Настройка переносов в дипломе онлайн: кириллический babel'
    html: |2-
                              <p>Чтобы работала корректная <strong>настройка переносов в дипломе
      онлайн</strong> (и при необходимости использовался выборочный <a
      href="/blog/latex-prevent-hyphenation-linebreaks">запрет переносов слов и неразрывные пробелы в
      LaTeX</a>), в преамбуле подключается модуль переносов русского языка:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[russian]{babel} % русские шаблоны переносов</code></pre>
                              </div>
                              <p>Команду <code>\sloppy</code> часто советуют против вылета слов за
      поле, но она разрешает TeX растягивать пробелы почти без ограничений — то есть возвращает те
      самые «дыры», с которыми борется эта статья. Вместо нее используйте пакет microtype и параметр
      <code>\emergencystretch</code> из совета ниже.</p>
  - id: 'microtype-magic'
    title: 'Пакет microtype: микротипографика и оптическое выравнивание полей'
    html: |2-
                              <p>Секретное оружие профессиональных верстальщиков — пакет
      <strong>microtype</strong>. Он выполняет микромасштабирование символов (на доли процента,
      незаметные глазу) и выносит мелкие знаки препинания (дефисы, точки, запятые) слегка за правое
      поле набора (hanging punctuation):</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\usepackage{microtype} % Включает оптическое выравнивание и сжатие глифов</code></pre>
                              </div>
                              <p>Подключение microtype заметно уменьшает число переносов и выравнивает
      плотность строк, хорошо сочетаясь со стандартным <a
      href="/blog/paragraph-indent-1-25-gost">абзацным отступом 1.25 см по ГОСТ</a>.</p>
  - id: 'manual-tweaks'
    title: 'Ручное устранение предупреждений Overfull / Underfull hbox'
    html: |2-
                              <p>Если в абзаце встретилось сложное химическое название или ссылка на
      URL, создающая предупреждение:</p>
                              <ul>
                                  <li>Укажите TeX разрешенные места разрыва дефисом:
      <code>де\-зокси\-рибо\-нук\-ле\-ин</code>;</li>
                                  <li>Перефразируйте предложение, поменяв местами пару слов в начале
      абзаца: алгоритм TeX мгновенно пересчитает раскладку и идеально сбалансирует строки.</li>
                              </ul>
tips:
  - title: "Команда \\emergencystretch"
    html: |2-
      <p>Добавьте <code>\setlength{\emergencystretch}{3em}</code> в преамбулу: это дает LaTeX право
      при необходимости слегка расширить пробелы в экстремально узких строках, чтобы слова не
      вылезали за поле (предупреждения Overfull hbox).</p>
  - title: 'Шрифт Times New Roman'
    html: |2-
      <p>Шрифт в духе Times New Roman с кириллицей для pdfLaTeX дает пакет
      <code>\usepackage{tempora}</code> вместе с <code>\usepackage[T2A]{fontenc}</code>; другой
      вариант — гарнитуры ParaType из пакета <code>paratype</code>. Пакета <code>pscyr</code> в TeX
      Live нет, а у <code>newtxtext</code> нет кириллицы.</p>
editorExample:
  latex: |2-
    \documentclass[a4paper,12pt]{article}
    \usepackage[T2A]{fontenc}
    \usepackage[russian]{babel}
    \usepackage{microtype}
    \begin{document}
    \noindent\begin{minipage}{.5\textwidth}
    LaTeX выравнивает абзац по ширине целиком: он подбирает переносы и места разрыва строк так,
    чтобы пробелы между словами оставались почти одинаковыми даже в узкой колонке.
    \end{minipage}
    \end{document}
