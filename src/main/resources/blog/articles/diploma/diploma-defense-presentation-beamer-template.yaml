sections:
  - id: 'task'
    title: 'Выберите содержание до оформления слайдов'
    html:
      '<p>Презентация к защите диплома должна помогать объяснить решение. Если перенести на слайды страницы ВКР, текст станет мелким, а главное затеряется среди определений и длинных таблиц.</p>

      <p>Подготовим пять коротких слайдов для вымышленного проекта поиска записей в каталоге. Они показывают задачу, собственное изменение, метод проверки, результат и ограничения. Это учебный пример подачи материала, а не установленное число слайдов или полный шаблон вашей кафедры.</p>

      <p>Регламент, титульные реквизиты и формат показа проверьте по требованиям программы; пример вузовского документа — <a href="https://books.ifmo.ru/book/2373/metodicheskie_rekomendacii_po_podgotovke_vkr_i_ee_zaschite:_uchebno-metodicheskoe_posobie..htm" target="_blank" rel="noopener noreferrer">методические рекомендации ИТМО по подготовке ВКР и её защите</a>. Подготовка речи и ответов разобрана в статье о <a href="/blog/diploma-defense-preparation-speech-questions">защите диплома</a>.</p>'
  - id: 'story'
    title: 'Свяжите каждый слайд с вопросом доклада'
    html:
      '<p>Для каждого слайда определите одну задачу и одну фразу, которую слушатель должен запомнить. В нашем случае итог — рост числа верных ответов с 14 до 18 при недостигнутом пороге 19. Слайды должны сохранить оба факта.</p><div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Слайд</th><th>Главный вопрос</th><th>Пробная длительность</th></tr></thead><tbody><tr><td>Задача и цель</td><td>Что требуется улучшить?</td><td>60 с</td></tr>

      <tr><td>Собственное решение</td><td>Что изменил автор?</td><td>70 с</td></tr>

      <tr><td>Метод проверки</td><td>Как сравнивали версии?</td><td>90 с</td></tr>

      <tr><td>Учебный результат</td><td>Что получилось?</td><td>90 с</td></tr>

      <tr><td>Вывод и следующий шаг</td><td>Каковы ограничения?</td><td>50 с</td></tr></tbody></table></div><p>Это пример плана шестиминутной репетиции: сумма составляет 360 с. Он не заменяет регламент кафедры. Измерьте собственную речь секундомером и измените объём материала. В шаблоне Beamer нет таймера; номер внизу обозначает слайд, а не прошедшее время.</p>'
  - id: 'setup'
    title: 'Настройте Beamer и порядок сегментов'
    html:
      '<p><a href="https://ctan.org/pkg/beamer" target="_blank" rel="noopener noreferrer">Beamer</a> — класс LaTeX для презентаций. В первом служебном сегменте задаются формат 16:9, кириллица, шрифт и нумерация. Это настройки слайдов; поля и полуторный интервал отчёта к ним автоматически не переносят.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>

      <pre><code>\documentclass[14pt,aspectratio=169]{beamer}

      \usepackage{PTSans}

      \usepackage[T2A]{fontenc}

      \usepackage[utf8]{inputenc}

      \usepackage[russian]{babel}

      \setbeamertemplate{navigation symbols}{}

      \setbeamertemplate{footline}[frame number]

      \setbeamerfont{frametitle}{size=\large}

      \setbeamersize{text margin left=8mm,text margin right=8mm}

      \begin{document}</code></pre>

      </div><p>Затем идут пять отдельных LaTeX-сегментов с окружениями <code>frame</code>. Последний служебный сегмент завершает документ:</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>

      <pre><code>\end{document}</code></pre>

      </div><p>Всего по кнопке открываются семь сегментов в этом порядке. Все участвуют в выводе, включая начало и завершение документа. Не удаляйте служебные сегменты при замене слайдов. Самостоятельная локальная сборка выполняется из их последовательного объединения.</p>'
  - id: 'slides'
    title: 'Пять слайдов одного учебного проекта'
    html:
      "<p>Первый слайд содержит тему, цель и поля автора. Заполните их и замените постановку задачи. Пометка о вымышленных результатах относится к нашему упражнению.</p><div class=\"article-code\">

      <div class=\"article-code__header\"><span class=\"article-code__lang\">LaTeX</span></div>

      <pre><code>\\begin{frame}{Задача и цель}

      \  \\textbf{Поиск записей в учебном каталоге}

      \  \\begin{itemize}

      \    \\item Проблема: исходный поиск различает регистр букв.

      \    \\item Цель: оценить влияние нормализации регистра на верность ответов.

      \    \\item Автор: [ФИО], группа [номер].

      \  \\end{itemize}

      \  \\alert{Учебный пример: данные и результаты вымышлены.}

      \\end{frame}</code></pre>

      </div><p>На втором слайде отделите собственное решение от исходной системы. Не перечисляйте все библиотеки проекта, если они не помогают понять выбранный подход.</p><div class=\"article-code\">

      <div class=\"article-code__header\"><span class=\"article-code__lang\">LaTeX</span></div>

      <pre><code>\\begin{frame}{Собственное решение}

      \  \\begin{itemize}

      \    \\item Запрос и названия приводятся к нижнему регистру.

      \    \\item Остальные правила поиска сохраняются.

      \    \\item Вклад: изменение сравнения строк и проверка двух версий.

      \  \\end{itemize}

      \  Обработка опечаток в это изменение не входит.

      \\end{frame}</code></pre>

      </div><p>Третий слайд объясняет метод проверки. Слушатель должен понимать, что означает «верный ответ» и какой критерий был выбран заранее.</p><div class=\"article-code\">

      <div class=\"article-code__header\"><span class=\"article-code__lang\">LaTeX</span></div>

      <pre><code>\\begin{frame}{Метод проверки}

      \  \\begin{itemize}

      \    \\item Один фиксированный каталог и 20 запросов.

      \    \\item Ожидаемые списки записей заданы до проверки.

      \    \\item Успех: полный список ответа совпадает с ожидаемым.

      \    \\item Критерий: не менее 19 верных ответов из 20.

      \  \\end{itemize}

      \  Сохраняются ответы обеих версий для каждого запроса.

      \\end{frame}</code></pre>

      </div><p>На четвёртом слайде оставьте небольшую таблицу сравнения. Результаты вымышлены и согласованы с <a href=\"/blog/diploma-research-section-hypothesis-method-example\">примером исследовательского раздела</a>. Реальную большую таблицу сократите до показателей, нужных для вывода.</p><div class=\"article-code\">

      <div class=\"article-code__header\"><span class=\"article-code__lang\">LaTeX</span></div>

      <pre><code>\\begin{frame}{Учебный результат}

      \  \\begin{center}

      \    \\begin{tabular}{l|r}

      \      Версия поиска &amp; Верные ответы из 20 \\\\

      \      \\hline

      \      Исходная &amp; 14 \\\\

      \      С нормализацией &amp; 18

      \    \\end{tabular}

      \  \\end{center}

      \  Четыре запроса стали обрабатываться верно;

      \  остальные ответы не изменились.

      \  \\alert{Порог 19 из 20 не достигнут.}

      \\end{frame}</code></pre>

      </div><p>Последний слайд связывает результат с условиями проверки и следующим шагом. Улучшение на заданном наборе не подтверждает качество поиска на любых данных.</p><div class=\"article-code\">

      <div class=\"article-code__header\"><span class=\"article-code__lang\">LaTeX</span></div>

      <pre><code>\\begin{frame}{Вывод и следующий шаг}

      \  \\begin{itemize}

      \    \\item На заданном наборе нормализация улучшила результат.

      \    \\item Два запроса с опечатками остались неверными.

      \    \\item Вывод относится только к проверенному набору.

      \    \\item Следующий шаг: отдельно проверить обработку опечаток.

      \  \\end{itemize}

      \  Нужен новый набор запросов и контроль прежних случаев.

      \\end{frame}</code></pre>

      </div>"
  - id: 'readability'
    title: 'Проверьте читаемость в режиме показа'
    html:
      '<p>Соберите PDF и откройте его целиком, без увеличения отдельных фрагментов. Проверьте длинные названия, нижние строки списков и числа в таблице. Если материал не помещается, сократите текст или разделите задачу на два слайда; не начинайте с уменьшения всего шрифта.</p>

      <ul><li>На слайде есть понятный заголовок и один основной вопрос.</li><li>Текст и таблица читаются с расстояния, сопоставимого с аудиторией.</li><li>Для схем сохранены подписи и свободное место вокруг объектов.</li><li>Нет обрезанных строк, наложений и предупреждений о переполнении.</li><li>Единицы, формулы и обозначения согласованы с ВКР.</li></ul>

      <p>В отличие от отчётного рисунка, эта небольшая таблица не воспроизводит оформление полной пояснительной записки. Для научных графиков сохраняйте оси, единицы и смысл интервалов даже при сокращении слайда; общие примеры Beamer есть в статье о <a href="/blog/lab-defense-presentation-beamer-template">презентации лабораторной работы</a>.</p>'
  - id: 'check'
    title: 'Обновите речь и проверьте окончательный файл'
    html:
      '<p>«Просмотреть пример» открывает ровно эти пять слайдов со служебными сегментами. Замените сведения о работе, перепишите вывод и соберите PDF. Числа в примере заданы текстом: при изменении результата исправьте таблицу, критерий, вывод и опорный доклад.</p>

      <p>Сверьте число страниц PDF с числом слайдов, откройте итоговый файл на устройстве для показа и проведите репетицию. Если после неё изменились данные или формулировки, пересоберите презентацию и проверьте соответствие окончательной ВКР ещё раз.</p>'
