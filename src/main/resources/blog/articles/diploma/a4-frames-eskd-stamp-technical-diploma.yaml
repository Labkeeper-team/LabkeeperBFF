sections:
  - id: 'eskd-standard'
    title: 'Какие листы пояснительной записки ВКР идут с рамкой'
    html: |-
      <p>Если методичка требует оформлять пояснительную записку (ПЗ) ВКР по правилам Единой системы
      конструкторской документации (ЕСКД) — так часто бывает в инженерных, строительных,
      энергетических и машиностроительных вузах, — листы записки получают рамку и основную надпись
      (штамп). Без такого требования записку оформляют <a href="/blog/latex-diploma-gost">по ГОСТ
      7.32 без рамок</a>.</p>
      <ul>
          <li><strong>Титульный лист и задание на ВКР</strong> — без рамки, по образцу вуза
      (см. <a href="/blog/master-thesis-title-page-gost">титульный лист ВКР</a> и <a
      href="/blog/diploma-assignment-form-calendar-schedule-gost">бланк задания</a>).</li>
          <li><strong>Первый лист записки — обычно содержание:</strong> рамка и «большой штамп» по
      форме 2 с подписями разработчика, проверяющего, нормоконтролёра и утверждающего.</li>
          <li><strong>Все последующие листы:</strong> рамка и «малый штамп» по форме 2а
      с обозначением документа и номером листа.</li>
          <li><strong>Чертежи и схемы форматов А3–А1</strong> в приложениях — это отдельные
      графические документы: у них своя рамка и основная надпись по форме 1.</li>
      </ul>
      <p>Какие стандарты действуют:</p>
      <ul>
          <li><strong>ГОСТ Р 2.104-2023 «Основные надписи»</strong> введён приказом Росстандарта
      № 1356-ст от 08.11.2023 и действует с 1&nbsp;марта 2024 года вместо ГОСТ 2.104-2006. Формы
      2 и 2а для текстовых документов в нём сохранились. Многие методички по-прежнему ссылаются на
      ГОСТ 2.104-2006, а к новому стандарту выпускались поправки, поэтому размеры граф сверяйте
      с образцом кафедры.</li>
          <li><strong>ГОСТ Р 2.105-2019</strong> — общие требования к текстовым документам: разделы,
      формулы, таблицы и иллюстрации пояснительной записки. На него ссылается большинство методичек
      по ПЗ.</li>
          <li><strong>ГОСТ 2.301</strong> — форматы листов, <strong>ГОСТ 2.303</strong> — линии.</li>
      </ul>
  - id: 'sizes'
    title: 'Размеры рамки и основных надписей'
    html: |-
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead>
                  <tr><th>Элемент</th><th>Размер</th><th>Где ставится</th></tr>
              </thead>
              <tbody>
                  <tr><td>Рамка</td><td>Поля 20&nbsp;мм слева, 5&nbsp;мм сверху, справа и снизу;
      внутри 185&nbsp;×&nbsp;287&nbsp;мм</td><td>Все листы ПЗ, кроме титула и задания</td></tr>
                  <tr><td>Форма 2</td><td>185&nbsp;×&nbsp;40&nbsp;мм</td><td>Первый лист ПЗ
      (содержание)</td></tr>
                  <tr><td>Форма 2а</td><td>185&nbsp;×&nbsp;15&nbsp;мм</td><td>Остальные листы
      ПЗ</td></tr>
                  <tr><td>Строка граф подписей</td><td>5&nbsp;мм</td><td>Формы 2 и 2а</td></tr>
                  <tr><td>Графа «Лист» в форме 2а</td><td>10&nbsp;мм шириной</td><td>Правый край
      малого штампа</td></tr>
              </tbody>
          </table>
      </div>
      <p>Левое поле 20&nbsp;мм оставлено для подшивки в переплёт. Текст записки не должен заходить
      на линии рамки и штампа, поэтому поля для текста делают чуть шире: обычно 25&nbsp;мм слева
      и 25&nbsp;мм снизу (над формой 2а).</p>
  - id: 'stamp-forms'
    title: 'Основная надпись ВКР: чем форма 2 отличается от формы 2а'
    html: |-
      <ul>
          <li><strong>Форма 2</strong> (185&nbsp;×&nbsp;40&nbsp;мм) стоит на первом листе записки.
      В ней есть графы подписей (Разраб., Пров., Н.&nbsp;контр., Утв.), наименование и обозначение
      документа, литера, номер листа, общее число листов и организация. Штамп высокий, поэтому на
      этом листе текст заканчивается на 25&nbsp;мм выше, чем на остальных.</li>
          <li><strong>Форма 2а</strong> (185&nbsp;×&nbsp;15&nbsp;мм) стоит на всех следующих
      листах: графы изменений (Изм., Лист, № докум., Подп., Дата), обозначение документа и номер
      листа.</li>
          <li>Номер листа в обеих формах — это номер страницы записки с учётом титула и задания.
      Поэтому, если содержание идёт третьим листом, в его штампе стоит «3».</li>
      </ul>
  - id: 'fields-filling'
    title: 'Что писать в графах основной надписи'
    html: |-
      <p>Номера граф даны по ГОСТ 2.104 (ГОСТ Р 2.104-2023). Пример — для записки по направлению
      13.03.02 «Электроэнергетика и электротехника».</p>
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead>
                  <tr><th>Графа</th><th>Что писать</th><th>Пример</th></tr>
              </thead>
              <tbody>
                  <tr><td>1</td><td>Наименование документа (тема)</td><td>Электроснабжение
      цеха. Пояснительная записка</td></tr>
                  <tr><td>2</td><td>Обозначение документа (шифр)</td><td>ВКР 13.03.02.015 ПЗ</td></tr>
                  <tr><td>4 «Лит.»</td><td>Литера документа</td><td>У (учебный документ)</td></tr>
                  <tr><td>7 «Лист»</td><td>Порядковый номер листа</td><td>3</td></tr>
                  <tr><td>8 «Листов»</td><td>Общее число листов ПЗ (только в форме 2)</td><td>86</td></tr>
                  <tr><td>9</td><td>Вуз, кафедра, группа</td><td>Университет, каф. ЭС, гр.
      ЭЭ-41</td></tr>
                  <tr><td>10</td><td>Характер работы</td><td>Разраб., Пров., Н.&nbsp;контр.,
      Утв.</td></tr>
                  <tr><td>11–13</td><td>Фамилии, подписи, даты</td><td>Иванов; подпись и дата —
      от руки</td></tr>
              </tbody>
          </table>
      </div>
      <p>Обозначение документа (графа 2) обычно складывают из вида работы, кода направления,
      номера по списку или зачётке и кода документа «ПЗ». Точную схему шифра задаёт кафедра.
      Массивные расчёты и спецификации выносят в <a
      href="/blog/diploma-appendices-listings-diagrams-gost">приложения диплома со схемами
      и чертежами</a>.</p>
  - id: 'online'
    title: 'Как получить рамку онлайн за 2 минуты'
    html: |-
      <ol>
          <li>Нажмите «Открыть пример в редакторе»: откроется пояснительная записка с рамкой,
      формой 2 на листе содержания и формой 2а на остальных листах. Титул и задание в ней идут без
      рамки.</li>
          <li>В начале кода поменяйте макросы штампа: <code>\docnum</code> (шифр),
      <code>\doctitle</code> (тема), <code>\docorg</code> (вуз и кафедра), <code>\docauthor</code>,
      <code>\docchecker</code>, <code>\docnorm</code> и <code>\docapprover</code> (фамилии).</li>
          <li>Вставьте текст записки после содержания и скачайте PDF. Число листов в графе
      «Листов» подставится автоматически со второй сборки.</li>
      </ol>
      <p>Для сборки ничего устанавливать не нужно: Labkeeper собирает PDF на сервере прямо из
      браузера.</p>
  - id: 'tikz-frame'
    title: 'Как нарисовать рамку А4 и штамп в LaTeX'
    html: |-
      <p>В LaTeX рамку накладывает на каждый лист хук <code>shipout/background</code>, а рисует
      пакет TikZ. Главное в схеме — флаги: рамка выключена на титуле и задании и включается
      с листа содержания, который получает форму 2. Фрагмент ниже показывает только эту логику;
      команды <code>\eskdframe</code>, <code>\eskdbig</code> и <code>\eskdsmall</code> с полной
      сеткой граф — в <a href="/blog/latex-eskd#template">готовом шаблоне из статьи о рамках ЕСКД
      в LaTeX</a>.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\newif\ifeskdframe \eskdframefalse % титул и задание — без рамки
      \newif\ifeskdbig   \eskdbigfalse
      \AddToHook{shipout/background}{%
        \ifeskdframe
          \put(0,0){\begin{tikzpicture}[overlay,x=1mm,y=1mm,line width=0.25mm]
            \begin{scope}[shift={(0,-297)}] % (0,0) — левый нижний угол листа
              \eskdframe
              \ifeskdbig \eskdbig \global\eskdbigfalse \else \eskdsmall \fi
            \end{scope}
          \end{tikzpicture}}%
        \fi}

      \begin{document}
      \input{titlepage}\clearpage % лист 1 — без рамки
      \input{zadanie}\clearpage   % лист 2 — без рамки
      \eskdframetrue\eskdbigtrue  % лист 3 — рамка и форма 2
      \enlargethispage{-25mm}
      \tableofcontents
      \clearpage                  % дальше — форма 2а</code></pre>
      </div>
      <p>Привязка через <code>\put(0,0)</code> рисует рамку уже после первой сборки, в отличие от
      варианта с <code>remember picture</code>. Устаревший класс <code>eskdx</code> в TeX Live 2025
      без правок не собирается, подробности — в <a href="/blog/latex-eskd#eskdx">той же
      статье</a>.</p>
  - id: 'tips'
    title: 'Практические советы'
    html: |-
      <div class="article-tips">
          <div class="article-tip">
              <div class="article-tip__number">1</div>
              <div class="article-tip__content">
                  <h3>Листы без рамки посреди записки</h3>
                  <p>Если рамка не нужна на отдельном листе (например, на вклеенном чертеже),
      поставьте перед ним <code>\clearpage\eskdframefalse</code>, а после —
      <code>\clearpage\eskdframetrue</code>.</p>
              </div>
          </div>
          <div class="article-tip">
              <div class="article-tip__number">2</div>
              <div class="article-tip__content">
                  <h3>Толщина основных и тонких линий</h3>
                  <p>По ГОСТ 2.303-68 толщина основной сплошной линии S — от 0,5 до 1,4&nbsp;мм,
      тонкой — от S/3 до S/2. Для рамки и штампа обычно берут S&nbsp;=&nbsp;0,5&nbsp;мм
      и тонкие линии 0,25&nbsp;мм: в TikZ это <code>line width=0.5mm</code>
      и <code>line width=0.25mm</code>.</p>
              </div>
          </div>
          <div class="article-tip">
              <div class="article-tip__number">3</div>
              <div class="article-tip__content">
                  <h3>Содержание и нумерация</h3>
                  <p>Номер листа печатается в штампе, поэтому номер в подвале страницы отключают.
      Как собрать содержание автоматически, читайте в статье об <a
      href="/blog/automatic-table-of-contents-diploma-gost">оглавлении диплома по ГОСТ</a>.</p>
              </div>
          </div>
      </div>
  - id: 'faq'
    title: 'Частые вопросы'
    html: |-
      <h3>Нужна ли рамка на титульном листе?</h3>
      <p>Нет. Титульный лист и задание на ВКР оформляют по образцу вуза без рамки и основной
      надписи.</p>
      <h3>На каком листе ставят большой штамп (форму 2)?</h3>
      <p>На первом листе пояснительной записки после титула и задания — обычно это содержание.
      На всех следующих листах — форма 2а.</p>
      <h3>Что писать в графе «Лит.»?</h3>
      <p>Для учебных работ — букву «У» (учебный документ).</p>
      <h3>Ставится ли такая рамка на чертежи формата А1 в приложениях?</h3>
      <p>Нет. Чертежи — отдельные графические документы своих форматов, у них рамка по формату листа
      и основная надпись по форме 1.</p>
      <h3>Можно ли сделать рамку только на части листов?</h3>
      <p>Да. В LaTeX-шаблоне рамку включает и выключает флаг <code>\ifeskdframe</code>: перед нужным
      листом поставьте <code>\clearpage\eskdframefalse</code> или
      <code>\clearpage\eskdframetrue</code>.</p>
editorExample:
