    \usepackage{amsmath}
    \usepackage[left=25mm,right=10mm,top=15mm,bottom=25mm]{geometry}
    \usepackage{tikz}
    \usepackage{lastpage}
    \pagestyle{empty} % номер листа печатается в штампе

    % ---------- Данные штампа: поменяйте на свои ----------
    \newcommand{\docnum}{ВКР 13.03.02.015 ПЗ}
    \newcommand{\doctitle}{Электроснабжение цеха\\Пояснительная записка}
    \newcommand{\docorg}{Университет\\каф. ЭС, гр. ЭЭ-41}
    \newcommand{\docauthor}{Иванов}
    \newcommand{\docchecker}{Петров}
    \newcommand{\docnorm}{Сидоров}
    \newcommand{\docapprover}{Кузнецов}
