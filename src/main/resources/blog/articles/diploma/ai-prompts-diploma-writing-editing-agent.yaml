sections:
  - id: 'task'
    title: 'Ставьте задачу по материалам своей работы'
    html:
      '<p>Запрос «напиши научное заключение» не сообщает, что исследовано, какие данные получены и что осталось непроверенным. В ответе могут появиться убедительные формулировки, которые не следуют из работы. Начните с конкретных материалов и небольшого действия: объяснить, проверить план или отредактировать один фрагмент.</p>

      <p>Рассмотрим вымышленный проект поиска в каталоге. У нас есть набор из 20 запросов, результаты 14 и 18 верных ответов и порог 19. Агенту нужно помочь сформулировать вывод по этим сведениям, сохранив недостигнутый критерий и ограничения. Пример связан с <a href="/blog/diploma-research-section-hypothesis-method-example">исследовательским разделом ВКР</a>.</p>

      <p>Правила использования ИИ и раскрытия его участия уточните в своей образовательной программе. Автору работы нужно самостоятельно проверить факты, источники и итоговые выводы.</p>'
  - id: 'request'
    title: 'Из чего состоит полезный промпт'
    html:
      '<p>Укажите действие, материал, границы изменения и способ проверки результата. Объёмный запрос не обязательно точнее: сначала добейтесь корректного изменения одного абзаца, затем переходите к следующему.</p><div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Часть запроса</th><th>Пример</th></tr></thead><tbody><tr><td>Действие</td><td>Отредактировать вывод, а не написать новую главу</td></tr>

      <tr><td>Материал</td><td>Фиксированный набор и результаты обеих версий</td></tr>

      <tr><td>Ограничение</td><td>Не менять числа, не добавлять испытания и внедрение</td></tr>

      <tr><td>Место правки</td><td>Только раздел «Черновик»</td></tr>

      <tr><td>Проверка</td><td>Каждое утверждение связано с исходными сведениями</td></tr></tbody></table></div><p>Для обзора литературы передавайте проверенные библиографические записи и нужные фрагменты. Предложенное моделью название статьи или DOI сначала найдите и сверьте по первоисточнику; правдоподобный реквизит ещё не подтверждает существование публикации. Принципы сравнения источников разобраны в статье об <a href="/blog/literature-review-structure-diploma-citation">обзоре литературы</a>.</p>'
  - id: 'material'
    title: 'Подготовьте исходные сведения и черновик'
    html:
      '<p>Следующие блоки составляют рабочий Markdown-документ по кнопке. Он нужен для упражнения по редактированию, а не для включения в окончательную ВКР.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">Markdown</span></div>

      <pre><code>## Исходные сведения


      Учебный пример: данные и результаты вымышлены.


      - Объект: поиск записей в учебном каталоге.

      - Изменение: запрос и названия приводятся к нижнему регистру.

      - Набор: 20 заранее заданных запросов с ожидаемыми ответами.

      - Исходная версия: 14 верных ответов из 20.

      - Изменённая версия: 18 верных ответов из 20.

      - Критерий: не менее 19 верных ответов из 20.

      - Два запроса с опечатками остались неверными.

      - На других каталогах проверка не проводилась.</code></pre>

      </div><p>В черновике намеренно оставлены чрезмерные утверждения: универсальное решение и внедрение не подтверждаются этим набором.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">Markdown</span></div>

      <pre><code>## Черновик


      Разработанная система полностью решает проблему поиска, обеспечивает

      высокую точность и может быть внедрена в любой организации.</code></pre>

      </div><p>«Просмотреть пример» открывает исходные сведения и черновик, не отправляя запрос агенту автоматически. Сначала замените их своими проверенными материалами и выберите нужное действие.</p>'
  - id: 'prompts'
    title: 'Три запроса: план, редактура и сверка'
    html:
      '<p>Для обсуждения структуры выберите режим «Вопрос»: ответ нужен в чате, без изменения документа.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">Промпт — план</span></div>

      <pre><code>Предложи план исследовательского раздела по «Исходным сведениям».

      Свяжи вопрос, гипотезу, метод проверки, результат и ограничения.

      Не пиши, что гипотеза подтверждена: порог 19 из 20 не достигнут.

      Отдельно перечисли сведения, которых не хватает для воспроизводимости.

      Ответ дай в чате, документ не изменяй.</code></pre>

      </div><p>Для изменения абзаца переключитесь в режим «Агент». Ограничьте правку конкретным разделом и явно сохраните факты.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">Промпт — редактура</span></div>

      <pre><code>Отредактируй только раздел «Черновик» по «Исходным сведениям».

      Сохрани числа 20, 14, 18 и порог 19.

      Убери утверждения, которые не подтверждаются этими сведениями.

      Укажи недостигнутый критерий и границы проверки.

      Не добавляй источники, результаты испытаний и сведения о внедрении.

      Остальные разделы не меняй.</code></pre>

      </div><p>После правки можно отдельно запросить сопоставление утверждений с исходными сведениями. Это дополнительная помощь при проверке, а не независимое подтверждение достоверности.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">Промпт — сверка</span></div>

      <pre><code>Сопоставь «Черновик» с «Исходными сведениями».

      Для каждого существенного утверждения укажи подтверждающий факт

      или пометку «в исходных сведениях нет подтверждения».

      Проверь числа, ограничения и формулировку о достижении критерия.

      Не выдумывай публикации, DOI, цитаты и результаты.

      Ответ дай в чате, документ не изменяй.</code></pre>

      </div><p>Один допустимый вывод по учебным сведениям: <em>«На наборе из 20 запросов число верных ответов выросло с 14 до 18. Порог 19 не достигнут; два запроса с опечатками остались неверными. Результат относится только к проверенному набору».</em> Сведения о внедрении или подтверждённой универсальной точности из этих данных не следуют.</p>'
  - id: 'workflow'
    title: 'Как работать с правками агента в Labkeeper'
    html:
      '<ol><li>Откройте рабочий документ и панель «Агент».</li><li>Выберите «Вопрос» для объяснения или «Агент» для изменения проекта и отправьте один из запросов.</li><li>После завершения просмотрите выделенные правки: агентский режим уже мог изменить текст документа.</li><li>Сопоставьте изменение с исходными сведениями. Используйте «Принять» для проверенной правки или «Отклонить» для её отмены.</li><li>Перечитайте связанный текст и проверьте результат в превью или итоговом PDF своего проекта.</li></ol>

      <p>«Принять» фиксирует просмотренную правку; это не предварительное разрешение на каждое действие агента. Если меняется расчёт, отдельно проверьте исходные данные, формулы и числа. Для окончательного вывода см. <a href="/blog/diploma-conclusion-structure-example">заключение ВКР</a>.</p>'
  - id: 'check'
    title: 'Что должно остаться после редактирования'
    html:
      '<ul><li>Числа и смысл критерия совпадают с проверенными материалами.</li><li>Достигнутый результат отделён от планов, гипотез и предположений.</li><li>Ограничения не исчезли при сокращении или улучшении стиля.</li><li>Все ссылки и цитаты проверены по реальным источникам.</li><li>Собственный вклад автора описан конкретно, без добавленных испытаний или внедрения.</li></ul>

      <p>Если результат промпта не соответствует этим условиям, уточните задачу или отклоните правку. Связный научный стиль помогает читать работу, но сам по себе не заменяет исследование и проверку фактов.</p>'
