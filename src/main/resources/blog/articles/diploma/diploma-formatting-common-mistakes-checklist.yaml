sections:
  - id: 'requirements'
    title: 'Сначала определите требования к работе'
    html:
      '<p>После правки диплома номер таблицы в тексте может остаться прежним, содержание — вести на другую страницу, а заголовок — оторваться от первого абзаца. Такие ошибки ищут в собранном документе: правильные настройки исходного файла сами по себе ещё не гарантируют правильный PDF.</p>

      <p>Начните с методички кафедры и утверждённого образца. <a href="https://mpei.ru/Science/ScienceDocuments/Documents/0_GOST_7.32-2017.pdf" target="_blank" rel="noopener noreferrer">ГОСТ 7.32-2017</a> задаёт правила отчёта о научно-исследовательской работе; применять его к ВКР нужно с учётом задания. Статус и поправки можно проверить в <a href="https://protect.gost.ru/gost/details/7d280e43-7036-4a69-8e6e-d15867028343" target="_blank" rel="noopener noreferrer">карточке Росстандарта</a>. Не смешивайте требования к обычной пояснительной записке и документам с рамками ЕСКД.</p>

      <p>Ниже разберём порядок проверки и небольшой раздел LaTeX с автоматическими заголовками. Полный диплом он не заменяет; основные настройки собраны в статье об <a href="/blog/latex-diploma-gost">оформлении ВКР в LaTeX</a>.</p>'
  - id: 'page'
    title: 'Поля, абзацы и заголовки'
    html:
      '<p>Проверяйте параметры документа, а не только похожий внешний вид. Для отчётного примера используем A4, поля слева 30 мм, справа 15 мм, сверху и снизу 20 мм, полуторный интервал и абзацный отступ 1,25 см. Кегль примера — 14 пт; конкретный шрифт и размер сверяйте с методичкой.</p><div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Ошибка</th><th>Как исправить и проверить</th></tr></thead><tbody><tr><td>Красная строка набрана пробелами</td><td>Задайте абзацный отступ в настройках. Уберите пробелы в начале абзацев; проверьте и абзац сразу после заголовка.</td></tr>

      <tr><td>Заголовок выделен вручную</td><td>Используйте команды разделов. Номер, размер и отступы задавайте общими настройками.</td></tr>

      <tr><td>Пустые строки используются для новой страницы</td><td>Начинайте раздел командой разрыва страницы или общим правилом для разделов.</td></tr>

      <tr><td>Текст растянут пробелами или ручными переносами</td><td>Удалите ручное выравнивание и проверьте ширину строк в PDF после повторной сборки.</td></tr></tbody></table></div><p>Отдельно просмотрите страницы с короткими абзацами и длинными заголовками. Для проблемы с красной строкой см. <a href="/blog/paragraph-indent-1-25-gost">настройку абзацного отступа</a>; для разрывов слов — <a href="/blog/justified-text-spacing-hyphenation-latex-vs-word">выравнивание и переносы</a>.</p>'
  - id: 'references'
    title: 'Номера, подписи и ссылки должны обновляться вместе'
    html:
      '<p>Ссылка «в таблице 3» устареет, если перед ней вставить ещё одну таблицу. Назначайте объекту метку <code>\label{...}</code>, а номер подставляйте через <code>\ref{...}</code>. Для источников используйте <code>\cite{...}</code>. После изменений соберите документ повторно и убедитесь, что в нём нет <code>??</code>.</p>

      <ul><li><strong>Содержание:</strong> названия совпадают с заголовками, номера страниц актуальны, приложения включены, если это требуется заданием.</li><li><strong>Таблицы:</strong> есть первое упоминание, подпись расположена сверху, единицы указаны, длинная таблица не обрезана.</li><li><strong>Рисунки:</strong> подпись стоит снизу, текст схемы читается при печати, ссылка ведёт к нужному рисунку.</li><li><strong>Формулы:</strong> обозначения пояснены, номера и ссылки согласованы, формула не разорвана с пояснениями.</li><li><strong>Страницы:</strong> титул учитывается в счёте без печатного номера, далее сохраняется единая последовательность.</li></ul>

      <p>Подробности см. в материалах об <a href="/blog/automatic-table-of-contents-diploma-gost">автоматическом содержании</a> и <a href="/blog/diploma-page-numbering-second-page">нумерации страниц</a>. В маленьком примере ниже титула и содержания нет.</p>'
  - id: 'example'
    title: 'Короткий пример: заголовки и ссылка на подраздел'
    html:
      '<p>В преамбуле задайте одинаковый размер основного текста и заголовков, полужирное начертание и отступ 1,25 см. Правило <code>\clearpage</code> начинает каждый раздел с новой страницы; подразделы продолжают текущую. Для длинных названий дополнительно проверьте переносы слов в PDF.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>

      <pre><code>\usepackage{titlesec}

      \titleformat{\section}{\normalfont\normalsize\bfseries}{\thesection}{1em}{}

      \titleformat{\subsection}{\normalfont\normalsize\bfseries}{\thesubsection}{1em}{}

      \titlespacing{\section}{1.25cm}{0pt}{\baselineskip}

      \titlespacing{\subsection}{1.25cm}{\baselineskip}{\baselineskip}

      \AddToHook{cmd/section/before}{\clearpage}</code></pre>

      </div><p>В тело документа вставьте фрагмент. Числа в названиях не набраны вручную: их создают <code>\section</code> и <code>\subsection</code>.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>

      <pre><code>\section{Проверка оформления}\label{sec:check}

      Это учебный фрагмент раздела, а не полный диплом.

      В подразделе~\ref{subsec:source} указано, что нужно сверить перед сдачей.

      \subsection{Исходные требования}\label{subsec:source}

      Сопоставьте поля, интервал и заголовки с методичкой кафедры.

      Не создавайте абзацный отступ пробелами и не набирайте номера разделов вручную.

      Нумерация заголовков и ссылка на подраздел обновляются при сборке.

      \subsection{Проверка результата}

      Откройте PDF и проверьте красную строку после заголовка,

      переносы и положение номера страницы.

      После перестановки подразделов повторите сборку для обновления ссылок.</code></pre>

      </div><p>«Просмотреть пример» открывает этот раздел с настройками страницы и текста. Поменяйте порядок двух подразделов и повторите сборку: ссылка должна указывать на «Исходные требования» с новым номером. Команда <code>\titlespacing</code> без звёздочки сохраняет красную строку следующего абзаца.</p>'
  - id: 'final-check'
    title: 'Как проверить окончательный PDF'
    html:
      '<ol><li>Соберите документ после последнего изменения и дождитесь обновления ссылок и содержания.</li><li>Просмотрите все страницы в обычном масштабе: заголовки, подписи и последние строки разделов не должны теряться при переносе.</li><li>Проверьте самые широкие таблицы и схемы, многострочные подписи и страницы с формулами.</li><li>Сопоставьте титул, состав разделов, список источников и приложения с методичкой.</li><li>Откройте именно файл для отправки и убедитесь, что в нём нет комментариев, незаполненных полей и старой редакции текста.</li></ol>

      <div class="article-note"><strong>Проверка оформления не проверяет содержание.</strong> Корректные поля и номера не подтверждают достоверность данных, самостоятельность работы или правильность выводов. Эти вопросы разбирают отдельно с руководителем.</div>'
