sections:
  - id: 'requirements'
    title: 'Уточните регламент и соберите итоговые материалы'
    html:
      '<p>На защите диплома нужно объяснить задачу, собственное решение и результат, а затем обосновать их в ответах на вопросы. Если доклад пересказывает главы по порядку, слушатели могут так и не понять, что именно сделано и чем подтверждён вывод.</p>

      <p>Начните с требований вашей образовательной программы: длительность выступления, формат презентации, порядок демонстрации и состав материалов уточняют на кафедре. Например, <a href="https://books.ifmo.ru/book/2373/metodicheskie_rekomendacii_po_podgotovke_vkr_i_ee_zaschite:_uchebno-metodicheskoe_posobie..htm" target="_blank" rel="noopener noreferrer">методические рекомендации ИТМО по подготовке ВКР и её защите</a> описывают организацию защиты в конкретном вузе; они не задают единый регламент для всех ВКР. Сверьте актуальные указания с руководителем или секретарём комиссии.</p>

      <p>Подготовьте окончательный текст ВКР, презентацию, короткий опорный доклад и перечень ожидаемых вопросов. Для разбора используем вымышленный проект поиска записей в каталоге. В редакторе откроется Markdown-текст доклада; слайды вынесены в <a href="/blog/diploma-defense-presentation-beamer-template">отдельный пример Beamer</a>.</p>'
  - id: 'structure'
    title: 'Постройте доклад вокруг результата'
    html:
      '<p>Сначала сформулируйте итог одной фразой: «Нормализация регистра повысила число верных ответов с 14 до 18 на наборе из 20 запросов, но порог 19 не достигнут». Затем объясните, какая задача привела к этому результату, что вы изменили и как проверяли.</p><div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Блок</th><th>Что нужно объяснить</th></tr></thead><tbody><tr><td>Задача и цель</td><td>В чём трудность поиска и какой результат требовалось получить</td></tr>

      <tr><td>Собственное решение</td><td>Какое правило изменено и что именно вы сделали</td></tr>

      <tr><td>Метод проверки</td><td>Какие данные, ожидаемые ответы и критерий использованы</td></tr>

      <tr><td>Результат</td><td>Что изменилось по сравнению с исходной версией</td></tr>

      <tr><td>Вывод и ограничения</td><td>Достигнут ли критерий и на какие условия распространяется вывод</td></tr></tbody></table></div><p>В нашем примере меняется только обработка регистра. Если заявить, что улучшен поиск вообще, это будет шире выполненной проверки: опечатки и другие каталоги отдельно не исследованы. Как связать гипотезу, критерий и протокол, показано в статье об <a href="/blog/diploma-research-section-hypothesis-method-example">исследовательском разделе ВКР</a>.</p>'
  - id: 'notes'
    title: 'Подготовьте короткий опорный текст'
    html:
      '<p>Запишите основные переходы между задачей, методом и результатом. Опорный текст нужен для репетиции: не переносите его целиком на слайды и не заменяйте им объяснение схем или таблиц. Следующий Markdown-фрагмент содержит весь учебный доклад по кнопке.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">Markdown</span></div>

      <pre><code># Опорный текст доклада


      Учебный пример: тема и результаты вымышлены.


      ## Задача и цель


      Рассматривается поиск записей в учебном каталоге.

      Цель — оценить, как нормализация регистра влияет на верность ответов.

      Мой вклад — изменение правила сравнения строк и проверка на фиксированном наборе.


      ## Решение и метод проверки


      Запрос и названия записей приводятся к нижнему регистру.

      Для 20 запросов до проверки заданы ожидаемые списки записей.

      Обе версии поиска работают с одним каталогом и одним набором запросов.

      Критерий — не менее 19 верных ответов из 20.


      ## Результат и ограничение


      В учебном протоколе получено 14 верных ответов до изменения и 18 после.

      Четыре запроса стали обрабатываться верно, остальные ответы не изменились.

      Порог 19 из 20 не достигнут: два запроса с опечатками остались неверными.

      По этому набору нельзя судить о качестве поиска на произвольных данных.


      ## Следующий шаг


      Обработку опечаток нужно проверять отдельно на новом наборе запросов.</code></pre>

      </div><p>«Просмотреть пример» открывает этот текст в Markdown-сегменте. Замените тему, вклад, методику и числа на свои, сохраняя связь между ними. Для выступления подготовьте вариант нужной длительности: объём нашего фрагмента не означает соответствия регламенту вашей защиты.</p>'
  - id: 'rehearsal'
    title: 'Проведите репетицию с презентацией и секундомером'
    html:
      '<ol><li>Откройте финальный PDF презентации и проговорите доклад вслух, переключая слайды в нужных местах.</li><li>Измерьте длительность обычным секундомером. Отметьте, где заканчивается каждый смысловой блок.</li><li>Если время превышено, сократите второстепенные детали и повторите репетицию. Не пытайтесь решить проблему ускорением речи.</li><li>Попросите слушателя пересказать вашу задачу, вклад и результат. Непонятный блок перепишите и проверьте снова.</li><li>Отдельно отрепетируйте объяснение таблицы или схемы без чтения текста со слайда.</li></ol>

      <p>В Labkeeper можно редактировать опорный текст и <a href="/blog/diploma-defense-presentation-beamer-template">слайды Beamer</a>. В этом примере нет встроенного таймера выступления: время нужно измерить на репетиции. Номер слайда также не показывает длительность речи.</p>'
  - id: 'questions'
    title: 'Подготовьте ответы с опорой на материалы'
    html:
      '<p>Для каждого существенного утверждения найдите место в ВКР или протоколе, где оно обосновано. Сначала отвечайте на заданный вопрос, затем приводите данные. Если нужно уточнить формулировку вопроса, сделайте это до длинного объяснения.</p><div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Вопрос</th><th>Содержательный ответ в учебном примере</th></tr></thead><tbody><tr><td>В чём ваш вклад?</td><td>Изменено правило сравнения строк и проведено сопоставление ответов на фиксированном наборе.</td></tr>

      <tr><td>Почему именно эти 20 запросов?</td><td>Нужно показать принцип отбора и состав набора в протоколе; сам размер 20 не доказывает представительность.</td></tr>

      <tr><td>Достигнута ли цель?</td><td>По набору есть улучшение с 14 до 18 ответов, но заранее выбранный порог 19 не достигнут.</td></tr>

      <tr><td>Почему остались ошибки?</td><td>Два запроса содержали опечатки, а изменение касается только регистра.</td></tr>

      <tr><td>Что делать дальше?</td><td>Отдельно разработать и проверить обработку опечаток на новом наборе, сохранив контроль прежних случаев.</td></tr></tbody></table></div><div class="article-note"><strong>Не подменяйте факт предположением.</strong> Если вопрос выходит за границы проверки, прямо назовите это ограничение. Не заявляйте о внедрении, экономии или качестве на других данных без соответствующих результатов.</div>'
  - id: 'final'
    title: 'Сверьте доклад, слайды и окончательную ВКР'
    html:
      '<p>Числа, обозначения и итоговая формулировка должны совпадать во всех материалах. Если после репетиции изменились расчёт или вывод, обновите ВКР и презентацию, затем соберите файлы заново. Для итоговых формулировок используйте разбор <a href="/blog/diploma-conclusion-structure-example">заключения ВКР</a>.</p>

      <ul><li>Проверьте длительность доклада по актуальному регламенту.</li><li>Откройте презентацию на устройстве для показа или в сопоставимом масштабе.</li><li>Убедитесь, что таблицы и подписи читаются, а схемы не требуют постоянного увеличения.</li><li>Сохраните разрешённую резервную копию окончательных файлов.</li><li>Проверьте, что можете объяснить результат и его ограничения без заученного текста.</li></ul>'
