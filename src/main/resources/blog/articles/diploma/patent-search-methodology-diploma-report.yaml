sections:
  - id: purpose
    title: Что именно должен установить патентный поиск
    html: |-
      <p>Патентный поиск в дипломе помогает выяснить, какие технические решения уже описаны и чем проект отличается от них. Начинайте с вопроса исследования: устройство, способ, существенные признаки и ожидаемый результат. Перечень документов без анализа не объясняет выбор проектного решения.</p>
      <p>В статье рассматривается учебная задача: изучить управление узлом дозирования жидкости по сигналу датчика расхода. Приведенные карточки вымышлены; это образец организации работы, а не результаты выполненного поиска.</p>
      <p>Содержание патентных исследований сверяйте с <a href="https://protect.gost.ru/gost/details/f7e13a23-6fe3-4c1f-81be-35bec8838bcd">ГОСТ Р 15.011-2024 в официальном каталоге Росстандарта</a> и заданием. Стандарт действует с 1 марта 2024 года и заменяет ГОСТ Р 15.011-2022. Учебный раздел ВКР не следует называть полным отчетом о патентных исследованиях без проверки его состава.</p>
  - id: scope
    title: Как задать объект, страны и глубину поиска
    html: |-
      <p>Опишите объект через функцию и признаки: «подача заданной порции жидкости с обратной связью по расходу». Название изделия производителя может не совпадать с терминологией патентных документов.</p>
      <div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Параметр</th><th>Пример записи в задании</th></tr>
      </thead>
      <tbody><tr><td>Цель</td><td>Изучение известных способов управления подачей; поиск отличительных признаков проекта.</td></tr>
      <tr><td>География и массив</td><td>Публикации РФ и международные публикации PCT; другие массивы добавляются по заданию.</td></tr>
      <tr><td>Глубина</td><td>2016–2026 годы по фактическую дату поиска; более ранние документы проверяются по ссылкам.</td></tr>
      <tr><td>Источники</td><td>Поисковая платформа Роспатента, PATENTSCOPE; дата обращения и ограничения доступа.</td></tr>
      <tr><td>Критерий отбора</td><td>Описаны дозирование и обратная связь по расходу, а не только датчик как отдельный компонент.</td></tr>
      </tbody>
      </table>
      </div>
      <p>Такой охват выбран для упражнения: десять лет и два массива не являются универсально достаточными. Международная публикация PCT не равнозначна выданному патенту во всех странах. Если важны конкретные рынки, определите национальные коллекции и нужные даты отдельно.</p>
  - id: queries
    title: Термины, МПК и журнал запросов
    html: |-
      <p>Составьте группы синонимов на русском и английском: «дозирование / подача», «жидкость», «датчик расхода / обратная связь»; liquid dosing, dispensing, flow sensor, feedback. Начните широко, посмотрите релевантные документы и уточните терминологию. Индексы Международной патентной классификации (МПК) берите из подходящих документов и проверяйте описание рубрики.</p>
      <p>Пример логики: <code>(дозирование ИЛИ подача) И (расход ИЛИ датчик)</code>. Это пояснение комбинации понятий, а не готовый синтаксис для любой базы. Возможности ключевых слов, МПК и других полей описаны на <a href="https://www.wipo.int/en/web/patentscope">официальной странице PATENTSCOPE</a>; доступные российские и зарубежные ресурсы перечисляет <a href="https://rospatent.gov.ru/ru/faq/gde-samostoyatelno-provesti-patentnyy-poisk-v-internete">Роспатент</a>.</p>
      <ol><li>Сохраните первый запрос с выбранными полями и фильтрами.</li>
      <li>Проверьте несколько релевантных документов, их терминологию и МПК.</li>
      <li>Выполните уточняющие запросы и поиск по ссылкам.</li>
      <li>Для каждого шага запишите дату, базу, строку запроса и число результатов.</li>
      <li>У отобранных и отклоненных документов отметьте причину решения.</li>
      </ol>
      <p>Не задавайте требование «найти ровно пять патентов»: количество не заменяет полноту и релевантность. Сохраняйте экспорт выдачи или карточки вместе с журналом.</p>
  - id: results
    title: Таблица найденных документов и сравнение признаков
    html: |-
      <p>В реальной таблице указывайте номер публикации с кодом вида документа, страну или ведомство, название, даты приоритета и публикации, заявителя, ссылку на полный текст, относящиеся к задаче признаки и вывод об отборе. При необходимости добавьте семейство и проверенный правовой статус с источником и датой.</p>
      <div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Учебная карточка</th><th>Наблюдаемый признак</th><th>Следующее действие</th></tr>
      </thead>
      <tbody><tr><td>Условная А, без номера</td><td>Подача жидкости по сигналу расходомера.</td><td>Сопоставить независимый пункт формулы и описание с признаками проекта.</td></tr>
      <tr><td>Условная Б, без номера</td><td>Прекращение подачи после достижения объема порции.</td><td>Уточнить механизм измерения, семейство и отличия.</td></tr>
      </tbody>
      </table>
      </div>
      <p>Здесь намеренно нет вымышленных номеров патентов. До сдачи замените карточки реальными публикациями и проверьте каждый реквизит. Реферат помогает отбирать документы, но для анализа технического решения нужны описание, чертежи и формула. Публикации одного семейства не следует автоматически считать независимыми разработками; работу с семействами рассматривает <a href="https://dacatalogue.wipo.int/projectfiles/DA_16_20_03/IdentifyingInventionsInThePublicDomain/EN/wipo_pub_1062_EN.pdf">руководство ВОИС</a>.</p>
  - id: conclusions
    title: Как сформулировать вывод и ограничения
    html: |-
      <p>Вывод должен отвечать поставленной задаче: какие подходы найдены, какие признаки совпадают, чем отличается проект и какие источники остались вне охвата. Например: «В отобранных документах описаны способы A и B; для проекта выбран подход A по таким-то причинам». Такая фраза допустима только после фактического анализа документов.</p>
      <p>Отсутствие совпадений в выдаче не доказывает новизну. Обзор уровня техники, оценка патентоспособности и исследование патентной чистоты имеют разные цели; выводы о правах требуют анализа формул, территорий, сроков и правового статуса. Не переносите вывод одного вида исследования на другой.</p>
      <p>В приложение вынесите журнал и развернутые карточки, а в основной части оставьте методику, существенные сравнения и ограничения. Общие критерии сопоставления решений рассмотрены в статье о <a href="/blog/domestic-foreign-analogues-comparison-diploma">сравнении отечественных и зарубежных аналогов</a>.</p>
  - id: editor
    title: Редактируемый пример и проверка PDF
    html: |-
      <p>В примере уже настроены поля, интервалы и заголовки с учётом <a href="https://mpei.ru/Science/ScienceDocuments/Documents/0_GOST_7.32-2017.pdf">ГОСТ 7.32-2017</a>. Для ВКР сверьте оформление с методичкой вашей кафедры.</p>
       <p>При вставке в основной документ используйте его преамбулу, счетчики разделов и сквозную нумерацию страниц. Титульный лист, содержание, введение и приложения в этот фрагмент не входят. Каждый раздел начинается с новой страницы; подписи таблиц находятся сверху слева, ссылки на таблицы даны в тексте.</p>
      <p>Кнопка примера открывает весь приведенный LaTeX-код. Замените учебные данные своими и сохраните ссылки на использованные документы.</p>
      <div class="article-code"><div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
      <pre><code>\documentclass[a4paper,14pt]{extarticle}
      \usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[russian]{babel}
      \usepackage{tempora,amsmath,setspace,indentfirst,tabularx,array,titlesec,caption,needspace}
      \usepackage[left=30mm,right=15mm,top=20mm,bottom=20mm]{geometry}
