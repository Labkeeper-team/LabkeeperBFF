      Перед сдачей условные карточки заменяют проверенными документами.
      Отдельно фиксируют страну, дату публикации, источник и дату проверки
      правового статуса, если это необходимо для поставленной задачи.

      \reportsection{Границы вывода и состав материалов}
      По учебному макету вывод об уровне техники не делается.
      В реальном разделе перечисляют найденные решения, общие признаки,
      различия и ограничения поиска. Отсутствие результатов в одной базе
      не доказывает новизну решения.

      К разделу прикладывают согласованное задание, регламент поиска,
      журнал запросов, отобранные документы и аналитические таблицы.
      Состав отчета о патентных исследованиях сверяют с применимой
      редакцией ГОСТ Р 15.011 и заданием. Этот фрагмент не заменяет такой отчет.
      \end{document}
