      \reportsection{Методика патентного поиска}
      Учебный макет: реальный поиск не проводился. Объект --- узел
      дозирования жидкости. Цель --- изучить известные способы управления
      подачей по сигналу датчика расхода. Патентоспособность и патентная
      чистота этим примером не устанавливаются.

      Планируемый охват: публикации РФ и международные публикации PCT
      за 2016--2026 годы по дату фактического поиска. Источники ---
      поисковая платформа Роспатента и PATENTSCOPE. Ограничения охвата
      указываются в выводах; ранние документы дополнительно ищутся по ссылкам.

      Исходные группы терминов: &lt;&lt;дозирование жидкости&gt;&gt;, &lt;&lt;датчик расхода&gt;&gt;,
      &lt;&lt;liquid dosing&gt;&gt;, &lt;&lt;flow sensor&gt;&gt;. Индексы МПК подбираются по
      релевантным документам и проверяются по рубрикатору.
      Пример логики запроса: (дозирование ИЛИ подача) И (расход ИЛИ датчик).
      Синтаксис адаптируется к выбранной базе.

      Для каждой выдачи сохраняются база, дата, точная строка запроса,
      поля поиска, фильтры, число результатов и причины отбора.
      В таблице~\ref{tab:patents} показана структура записи результата.

      \begin{table}[htbp]
      \caption{Макет карточек отбора, не реальные патенты}
      \label{tab:patents}
      \begin{tabularx}{\textwidth}{|p{2.4cm}|Y|Y|}
      \hline
      \multicolumn{1}{|c|}{\shortstack[c]{Карточка}} &amp; \multicolumn{1}{c|}{\shortstack[c]{Сопоставляемый\\признак}} &amp; \multicolumn{1}{c|}{\shortstack[c]{Что проверить\\в первоисточнике}} \\
      \hline
      Макет А &amp; Подача по сигналу датчика &amp; Номер публикации и код вида,
      приоритет, независимый пункт формулы \\
      \hline
      Макет Б &amp; Ограничение объема порции &amp; Семейство, заявитель,
      ссылка на полный текст и отличие от объекта \\
      \hline
      \end{tabularx}
      \end{table}

      Перед сдачей условные карточки заменяют проверенными документами.
      Отдельно фиксируют страну, дату публикации, источник и дату проверки
      правового статуса, если это необходимо для поставленной задачи.

      \reportsection{Границы вывода и состав материалов}
      По учебному макету вывод об уровне техники не делается.
      В реальном разделе перечисляют найденные решения, общие признаки,
      различия и ограничения поиска. Отсутствие результатов в одной базе
      не доказывает новизну решения.

      К разделу прикладывают согласованное задание, регламент поиска,
      журнал запросов, отобранные документы и аналитические таблицы.
      Состав отчета о патентных исследованиях сверяют с применимой
      редакцией ГОСТ Р 15.011 и заданием. Этот фрагмент не заменяет такой отчет.
      \end{document}</code></pre></div>
      <p>После сборки проверьте номера, ссылки, единицы измерения, переносы в таблицах и читаемость формул. При переносе в полный отчет обновите содержание повторной компиляцией. Числа в статье округлены для чтения; стандартные настройки редактора выводят три значащие цифры.</p>
tips:
  - title: Сохраняйте воспроизводимый журнал
    html: <p>Ссылка на главную страницу базы не восстанавливает поиск. Нужны дата, точный запрос, поля, фильтры и сохраненная выдача.</p>
  - title: Различайте документы и решения
    html: '<p>Публикации одного семейства учитывайте осмысленно: несколько номеров не обязательно означают несколько независимых технических решений.</p>'
