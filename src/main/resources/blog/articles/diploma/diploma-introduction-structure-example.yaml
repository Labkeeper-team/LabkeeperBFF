sections:
  - id: 'problem'
    title: 'Проблема и актуальность: зачем нужна работа'
    html: |2-
      <p>Введение к выпускной квалификационной работе объясняет, какую проблему
      рассматривает автор, почему ее стоит решать и какой результат предполагается
      получить. Начните с конкретного затруднения, а затем покажите его связь с темой.
      Общей фразы «цифровизация актуальна» для этого недостаточно.</p>
      <p>Например, в
      <a href="https://www.muctr.ru/upload/sveden/files/003437.pdf">методических рекомендациях РХТУ им. Д. И. Менделеева</a>
      введение включает обоснование актуальности, цель, задачи, объект, предмет и методы.
      Это пример требований конкретного вуза: окончательный состав, объем и оформление
      определяются заданием и методичкой вашей кафедры.</p>
      <p>В реальной работе подтвердите проблему источниками: результатами обследования,
      публикациями, описанием действующего процесса или анализом доступных решений.
      Ссылки должны вести к материалам, из которых следует ваше утверждение.
      Не приписывайте организации потери времени или ошибки без соответствующих данных.</p>
      <div class="article-note"><strong>💡 Совет:</strong> Учебный пример ниже построен
      на вымышленных условиях. Он показывает логику введения, а не доказывает проблему
      конкретной организации. Замените его условия и аргументы материалами своей ВКР.</div>
  - id: 'scope'
    title: 'Объект, предмет и границы работы'
    html: |2-
      <p>Если методичка требует выделить объект и предмет, используйте их для уточнения
      масштаба работы. Объект задает рассматриваемый процесс или систему, предмет —
      ту сторону объекта, которую вы непосредственно изучаете или разрабатываете.</p>
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead><tr><th>Элемент</th><th>В учебном примере</th><th>Что уточняет</th></tr></thead>
              <tbody>
                  <tr><td>Объект</td><td>Процесс учета заявок в условном подразделении.</td><td>Область, в которой поставлена задача.</td></tr>
                  <tr><td>Предмет</td><td>Модель данных и средства регистрации, изменения статуса и поиска.</td><td>Конкретную часть процесса, охваченную прототипом.</td></tr>
                  <tr><td>Границы</td><td>Один пользователь, учебные данные, функциональная проверка.</td><td>Условия, за пределами которых выводы не проверяются.</td></tr>
              </tbody>
          </table>
      </div>
      <p>Для проектной ВКР кафедра может использовать другую терминологию постановки
      задачи. Не добавляйте формальный «предмет исследования» только ради чужого
      шаблона, если принят иной состав введения. Согласуйте формулировки с руководителем.</p>
      <p>Отдельно обозначьте исключения: например, в прототип не входят разграничение
      прав доступа и нагрузочные испытания. Это помогает избежать цели, обещающей
      полноценную промышленную систему при существенно меньшем объеме разработки.</p>
  - id: 'goal'
    title: 'Цель и задачи: какой результат получить'
    html: |2-
      <p>Цель описывает общий результат, задачи — этапы, без которых он не получится.
      Для условного примера цель звучит так: <strong>разработать и функционально
      проверить прототип учета заявок</strong>. Формулировка «изучить тему» не показывает,
      что именно должно быть получено в проектной работе.</p>
      <ol>
          <li>Определить требования к регистрации, изменению статуса и поиску заявок.</li>
          <li>Спроектировать модель заявки с тремя статусами и допустимыми переходами.</li>
          <li>Разработать прототип с указанными группами функций.</li>
          <li>Проверить функции на учебном стенде по десяти сценариям.</li>
      </ol>
      <p>Число задач здесь выбрано для примера. Для каждой своей задачи укажите,
      где будет представлен результат: требования, модель, программная реализация,
      протокол проверки. Задачи должны соответствовать содержанию глав.</p>
      <p>Эта же постановка продолжается в
      <a href="/blog/diploma-conclusion-structure-example">примере заключения к ВКР</a>:
      введение задает цель и проверку, а заключение отвечает, что фактически получено.
      Не подменяйте проверку функций обещанием ускорить работу без измерения времени.</p>
  - id: 'methods'
    title: 'Методы и данные: как решать задачи'
    html: |2-
      <p>Свяжите каждый метод с задачей и исходными материалами. Для прототипа учета
      заявок анализ сценариев помогает определить требования, моделирование — задать
      данные и переходы, прототипирование — получить программное решение,
      функциональное тестирование — сопоставить поведение с ожидаемым результатом.</p>
      <p>В учебном примере запланированы десять сценариев: четыре для регистрации,
      три для изменения статуса и три для поиска. Это объем конкретной проверки,
      а не универсальная норма тестирования. До выполнения сценариев нельзя утверждать,
      что все они прошли успешно.</p>
      <p>Укажите происхождение данных, способ отбора и ограничения. Если материалы
      получены на практике, объясните, какие из них использованы и разрешено ли их
      включать в ВКР. Оформление таких материалов разобрано в статье про
      <a href="/blog/industrial-practice-report-format-template">отчет по производственной практике</a>.</p>
      <p>Научную новизну, гипотезу и другие специальные элементы включайте в том виде,
      который требуется для вашего вида ВКР, и только при наличии оснований.
      Перечень методов не должен содержать опрос или эксперимент, которых в работе нет.</p>
  - id: 'example'
    title: 'Связный пример введения и шаблон LaTeX'
    html: |2-
      <p>Ниже — полное введение для условной постановки о прототипе учета заявок.
      Исходные условия и данные вымышлены. Текст описывает планируемую работу,
      не заявляет о реальном внедрении и не обещает подтвержденного роста производительности.</p>
      <p>Самостоятельный документ включает оглавление и введение с новой страницы.
      Класс <code>extarticle</code> задает 14 пт, <code>tempora</code> — шрифт семейства Times,
      <code>indentfirst</code> — красную строку после заголовка. Поля 30/15/20/20 мм,
      полуторный интервал и абзац 1,25 см служат настройками примера: сверьте их с методичкой.
      Заголовок содержания задан прописными буквами по центру, а введение записано в оглавлении
      так же, как названо в документе.</p>
      <p>Для перечисления задач <code>enumitem</code> задает отступ маркеров на уровне
      красной строки и нумерацию со скобкой. Этот вариант соответствует правилам
      перечислений в <a href="https://library.istu.edu/content/gost-7-32-2017.pdf">ГОСТ 7.32-2017</a>
      для отчета о НИР; требования к ВКР сверьте с методичкой кафедры.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\documentclass[a4paper,14pt]{extarticle}
      \usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[russian]{babel}
      \usepackage{tempora,setspace,indentfirst,enumitem,tocloft}
      \usepackage[left=30mm,right=15mm,top=20mm,bottom=20mm]{geometry}
      \onehalfspacing
      \setlength{\parindent}{1.25cm}
      \renewcommand{\cftsecleader}{\cftdotfill{\cftdotsep}}
      \renewcommand{\cfttoctitlefont}{\hfill\normalfont\normalsize\bfseries}
      \renewcommand{\cftaftertoctitle}{\hfill\null}
      \begin{document}
      \noindent\textit{Учебный пример. Условия задачи и данные вымышлены.}
      \renewcommand{\contentsname}{СОДЕРЖАНИЕ}
      \tableofcontents
      \clearpage
      \section*{\centering\normalsize ВВЕДЕНИЕ}
      \addcontentsline{toc}{section}{ВВЕДЕНИЕ}
      В учебной модели подразделения сведения о заявках распределены между отдельными
      записями. Это затрудняет поиск обращения и определение его текущего состояния.
      Актуальность темы в заданных условиях связана с потребностью представить
      регистрацию, изменение статуса и поиск заявок в едином программном интерфейсе.
      Данное описание является вымышленным условием задачи, а не результатом
      обследования реальной организации.

      Объект работы --- процесс учета заявок в условном подразделении. Предмет работы
      --- модель данных и программные средства регистрации, изменения статуса
      и поиска заявок в пределах учебного прототипа.

      Цель работы --- разработать и функционально проверить прототип учета заявок.
      Для достижения цели поставлены следующие задачи:
      \begin{enumerate}[label=\arabic*),labelindent=\parindent,leftmargin=*,labelsep=0.5em,nosep]
          \item определить требования к регистрации, изменению статуса и поиску заявок;
          \item спроектировать модель заявки с тремя статусами и допустимыми переходами;
          \item разработать прототип, реализующий указанные группы функций;
          \item проверить функции на учебном стенде по десяти сценариям.
      \end{enumerate}

      В работе предполагается использовать анализ сценариев, моделирование данных,
      прототипирование и функциональное тестирование. Исходными материалами служат
      условное описание процесса и искусственно созданные записи заявок, не содержащие
      данных реальной организации. Для проверки предусмотрены четыре сценария
      регистрации, три сценария изменения статуса и три сценария поиска.
      Для каждого сценария задаются входные данные и ожидаемый результат.

      Проверка ограничена одним пользователем и учебными данными. Нагрузочные испытания,
      разграничение прав, внедрение и оценка сокращения времени обработки заявок
      не входят в работу. Прототип может стать основой для опытной эксплуатации,
      но ее результативность здесь не проверяется.

      Основная часть состоит из трех глав: анализа требований, проектирования
      и разработки прототипа, функциональной проверки. В заключении планируется
      сопоставить результаты с задачами, указать ограничения и дальнейшие направления.
      \end{document}</code></pre>
      </div>
      <p>Кнопка «Просмотреть пример» открывает полный самостоятельный документ,
      приведенный выше, с абзацами, ненумерованным заголовком и записью в оглавлении.</p>
      <p>Для включения в готовую ВКР перенесите заголовок, <code>\addcontentsline</code>
      и свой текст после содержания, начав раздел с <code>\clearpage</code>.
      Вторую преамбулу и второе оглавление не добавляйте. Соберите документ повторно,
      чтобы обновить номера страниц в содержании; подробнее — в статье про
      <a href="/blog/automatic-table-of-contents-diploma-gost">автоматическое оглавление ВКР</a>.</p>
  - id: 'checklist'
    title: 'Что проверить перед сдачей введения'
    html: |2-
      <ul>
          <li>Проблема сформулирована конкретно и подтверждена доступными источниками.</li>
          <li>Цель соответствует теме, а задачи ведут к проверяемым результатам.</li>
          <li>Объект, предмет и специальные элементы включены по требованиям кафедры.</li>
          <li>Методы связаны с задачами; происхождение данных и границы работы понятны.</li>
          <li>Планы не выданы за полученные результаты, прототип — за внедренную систему.</li>
          <li>Задачи согласованы с главами и ответами в заключении.</li>
          <li>Заголовок, объем, поля и запись в содержании проверены по методичке и итоговому PDF.</li>
      </ul>
      <p>Вернитесь к введению после завершения основной части. Если состав задач или
      данных изменился, согласуйте уточнения с руководителем и обновите текст.
      Не добавляйте выдуманную проверку ради совпадения с первоначальным планом.
      Общие настройки документа рассмотрены в
      <a href="/blog/latex-diploma-gost">руководстве по оформлению диплома в LaTeX</a>.</p>
tips:
  - title: 'Проверяйте введение вместе с заключением'
    html: |2-
      <p>Выпишите задачи и найдите ответы на них в заключении. Если ответа нет,
      проверьте выполнение задачи и честно обозначьте оставшееся ограничение.</p>
  - title: 'Уточняйте масштаб обещания'
    html: |2-
      <p>«Проверить функции прототипа» и «доказать экономическую эффективность внедрения»
      требуют разных данных и методов. Оставьте в цели то, что действительно охватывает работа.</p>
