sections:
  - id: 'scope'
    title: 'Как определить назначение и границы АРМ'
    html: |-
      <p>В теме «Разработка АРМ специалиста» АРМ означает автоматизированное рабочее
      место: программные и технические средства для конкретных задач сотрудника.
      Начинайте описание с процесса, исполнителя и ожидаемого результата.</p>
      <p>Рассмотрим вымышленное бюро обработки внутренних заявок. Сейчас оператор
      ведет общий список вручную; цель учебного проекта — создать и функционально
      проверить прототип регистрации, назначения исполнителя, изменения состояния
      и поиска заявок. Предлагаемая ниже модель — авторский пример для ВКР.</p>
      <ul>
          <li><strong>Вход:</strong> тема и описание обращения, сведения об операторе.</li>
          <li><strong>Рабочий сценарий:</strong> регистрация → назначение исполнителя
          и начало работы → закрытие с описанием результата.</li>
          <li><strong>Выход:</strong> карточка заявки, очередь и история изменения состояний.</li>
          <li><strong>Границы прототипа:</strong> один отдел и учебные данные;
          интеграция с почтой, миграция архива и промышленное внедрение в цель не включены.</li>
      </ul>
      <p>Эти границы перенесите в цель и задачи во
      <a href="/blog/diploma-introduction-structure-example">введении ВКР</a>.
      Если задание предполагает внедрение, отдельно определите необходимые этапы
      и подтверждения: демонстрация прототипа сама по себе внедрением не является.</p>
  - id: 'requirements'
    title: 'Требования: функция и критерий приемки'
    html: |-
      <p>Перед составлением требований выполните
      <a href="/blog/domestic-foreign-analogues-comparison-diploma">сравнение отечественных и зарубежных аналогов</a>:
      отделите обязательные условия от предпочтений и проверьте устойчивость выбора.</p>
      <p>Для каждого требования укажите исполнителя, действие, ограничения и способ
      проверки. Формулировка «удобная работа с заявками» не определяет ожидаемое поведение.
      Ниже — фрагмент технического задания для нашего учебного АРМ.</p>
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead><tr><th>ID</th><th>Требование</th><th>Критерий приемки</th></tr></thead>
              <tbody>
                  <tr><td>F1</td><td>Оператор регистрирует заявку с непустой темой.</td><td>Создается
                  одна запись с номером, автором, временем и состоянием «Новая».
                  При пустой теме запись не создается.</td></tr>
                  <tr><td>F2</td><td>Оператор переводит заявку в работу и закрывает ее.</td><td>Для начала
                  работы нужен активный исполнитель с ролью оператора; для закрытия — результат.
                  Прямой переход «Новая → Закрыта» отклоняется.</td></tr>
                  <tr><td>F3</td><td>Пользователь ищет заявку по номеру и фильтрует очередь по состоянию.</td><td>По
                  существующему номеру находится нужная карточка; фильтр показывает только
                  выбранное состояние, а отсутствие совпадений дает пустую выдачу.</td></tr>
                  <tr><td>F4</td><td>Наблюдатель читает заявки, но не изменяет их.</td><td>Просмотр разрешен;
                  запрос создания или изменения от наблюдателя отклоняется сервером,
                  данные и история остаются прежними.</td></tr>
                  <tr><td>F5</td><td>Изменение состояния и запись истории сохраняются согласованно.</td><td>Успешное
                  изменение добавляет одну запись истории. Сбой сохранения истории отменяет
                  изменение заявки; запрос с устаревшей версией отклоняется.</td></tr>
              </tbody>
          </table>
      </div>
      <p>Производительность и восстановление после сбоя задавайте отдельными измеримыми
      требованиями: профиль нагрузки, объем данных, измеряемое время ответа и допустимый
      результат восстановления. Числовые пороги согласуйте с задачей и возможностями стенда.</p>
  - id: 'data'
    title: 'Модель данных, роли и состояния заявки'
    html: |-
      <p>В этой модели роли <strong>оператор</strong> и <strong>наблюдатель</strong> задают
      разрешенные действия пользователя. Состояния <strong>Новая</strong>,
      <strong>В работе</strong>, <strong>Закрыта</strong> описывают этап обработки заявки.
      Роль и состояние хранятся раздельно: право оператора не делает любой переход допустимым.</p>
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead><tr><th>Сущность</th><th>Основные поля</th><th>Связи и ограничения</th></tr></thead>
              <tbody>
                  <tr><td>Пользователь</td><td>id, login, role, active</td><td>Уникальный login;
                  роль выбирается из двух разрешенных значений.</td></tr>
                  <tr><td>Заявка</td><td>id, subject, description, state, created_at,
                  created_by, assignee_id, result, version</td><td>Автор и исполнитель ссылаются
                  на пользователей. Исполнитель и результат могут отсутствовать у новой заявки.</td></tr>
                  <tr><td>История</td><td>id, request_id, old_state, new_state,
                  changed_by, changed_at</td><td>Ссылка на заявку и автора изменения.
                  При регистрации old_state пуст, new_state — «Новая».</td></tr>
              </tbody>
          </table>
      </div>
      <p>Допустимые переходы в прототипе: «Новая → В работе → Закрыта».
      При первом переходе сохраняется исполнитель, при втором — непустой результат.
      Изменение состояния и история выполняются в одной транзакции. Поле
      <code>version</code> позволяет отклонить обновление по устаревшей карточке:
      в условие изменения входят номер заявки и текущая версия, при успехе версия увеличивается.</p>
      <p>Отдельно опишите, как загружаются учебные учетные записи и назначаются роли.
      В нашем прототипе это выполняется при подготовке стенда; интерфейс администрирования
      учетных записей не включен в перечисленные функции.</p>
  - id: 'architecture'
    title: 'Как обосновать архитектуру прототипа'
    html: |-
      <p>Для учебного АРМ выберем веб-интерфейс, сервер приложения и реляционную базу.
      Такое разбиение связывается с требованиями: интерфейс показывает карточку и очередь,
      сервер проверяет действия, база хранит связанные записи.</p>
      <ol>
          <li><strong>Интерфейс оператора:</strong> форма регистрации, карточка, фильтр
          и сообщения о недопустимых действиях. После конфликта версии предлагает обновить карточку.</li>
          <li><strong>Сервер приложения:</strong> устанавливает пользователя по сессии,
          проверяет роль и переход состояния, валидирует поля и управляет транзакцией.</li>
          <li><strong>База данных:</strong> хранит пользователей, заявки и историю;
          ограничения ссылок и уникальности поддерживают согласованность модели.</li>
      </ol>
      <p>Пример запроса: оператор открывает новую заявку, выбирает исполнителя и отправляет
      команду начала работы вместе с версией карточки. Сервер проверяет роль пользователя,
      активность исполнителя и текущее состояние; затем сохраняет изменение и историю.
      Браузер получает обновленную карточку. Прямого доступа браузера к базе нет.</p>
      <p>Скрытая кнопка в интерфейсе не заменяет проверку прав на сервере. Для наблюдателя
      тот же запрос изменения должен завершаться отказом даже при ручной отправке.
      Стек выбирайте по требованиям и ограничениям проекта; отдельный сервис на каждую
      сущность для этого примера не требуется.</p>
  - id: 'validation'
    title: 'Проверка функций и оценка полезности'
    html: |-
      <p>Составьте протокол по ID требований: подготовка данных, действия, ожидаемый
      результат, фактический результат и ссылка на подтверждение. Таблица выше задает
      проверки, но не сообщает, что они уже выполнены.</p>
      <ul>
          <li><strong>F1:</strong> корректная регистрация и отказ при пустой теме;
          проверяются карточка, автор и начальная запись истории.</li>
          <li><strong>F2:</strong> оба разрешенных перехода, отказ без исполнителя,
          отказ без результата и отказ при попытке сразу закрыть новую заявку.</li>
          <li><strong>F3–F4:</strong> найденный и отсутствующий номер, фильтр,
          просмотр наблюдателем и запрет записи через серверный запрос.</li>
          <li><strong>F5:</strong> две карточки одной версии — первое изменение успешно,
          второе получает конфликт; отдельно проверяется откат при сбое записи истории.</li>
      </ul>
      <p>Функциональная проверка подтверждает конкретные сценарии на стенде.
      Работа с реальными данными, нагрузка, резервное копирование и восстановление требуют
      собственных проверок перед эксплуатацией. Протоколы удобно вынести в
      <a href="/blog/diploma-appendices-listings-diagrams-gost">приложения к ВКР</a>,
      а в <a href="/blog/diploma-conclusion-structure-example">заключении</a> перечислить
      подтвержденные результаты и ограничения.</p>
      <p>Полезность АРМ можно оценивать по времени выполнения одинакового сценария
      до и после автоматизации, числу ошибок и полноте истории. Укажите условия замеров
      и объем выборки. Высвобожденное время не равно сокращению денежных выплат;
      перевод эффекта в деньги требует отдельного обоснования. Для этого используйте
      <a href="/blog/diploma-economic-efficiency-calculation-example">пример расчета экономической эффективности</a>.</p>
  - id: 'latex'
    title: 'Таблица требований и модель данных в LaTeX'
    html: |-
      <p>Самостоятельно компилируемый пример показывает фрагмент основной части работы:
      таблицу требований и описание данных. Заголовки условны; при переносе в ВКР
      согласуйте их с нумерацией разделов и структурой документа. Класс <code>extarticle</code> дает размер 14 pt,
      <code>tempora</code> — шрифт семейства Times, <code>indentfirst</code> — отступ
      первого абзаца после заголовка. Номер и название таблицы приведены по
      <a href="https://library.istu.edu/content/gost-7-32-2017.pdf">ГОСТ 7.32-2017</a>
      для отчета о НИР; нумерацию, поля и межстрочный интервал ВКР сверьте с методичкой кафедры.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\documentclass[a4paper,14pt]{extarticle}
      \usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[russian]{babel}
      \usepackage{tempora,amsmath,setspace,indentfirst,tabularx,array,titlesec,caption,needspace}
      \usepackage[left=30mm,right=15mm,top=20mm,bottom=20mm]{geometry}
      \onehalfspacing
      \setlength{\parindent}{1.25cm}
      \titleformat{\section}{\normalfont\bfseries\hyphenpenalty=10000\relax\exhyphenpenalty=10000\relax}{\thesection}{1em}{}
