      \captionsetup[figure]{justification=centering,singlelinecheck=false}
      \DeclareCaptionTextFormat{gosttitle}{\hyphenpenalty=10000\relax\exhyphenpenalty=10000\relax#1}
      \captionsetup{textformat=gosttitle}
      \AtBeginDocument{%
          \setlength{\abovedisplayskip}{\baselineskip}%
          \setlength{\belowdisplayskip}{\baselineskip}%
          \setlength{\abovedisplayshortskip}{\baselineskip}%
          \setlength{\belowdisplayshortskip}{\baselineskip}}
      \addto\captionsrussian{\renewcommand{\figurename}{Рисунок}}
      \pagestyle{plain}
      \newcolumntype{Y}{&gt;{\raggedright\arraybackslash}X}
      \setlength{\emergencystretch}{2em}
      \titleformat{\subsection}{\normalfont\bfseries\hyphenpenalty=10000\relax\exhyphenpenalty=10000\relax}{\thesubsection}{1em}{}
      \titlespacing{\subsection}{\parindent}{12pt}{6pt}
      \begin{document}
      \reportsection{Проект АРМ обработки заявок}
      Учебный пример. Проектируется прототип для одного отдела.
      Оператор регистрирует и обрабатывает заявки; наблюдатель только читает их.
      Требования и способы их проверки приведены в таблице~\ref{tab:requirements}.
      \par\vspace{6pt}

      \begingroup
      \captionof{table}{Требования к прототипу}\label{tab:requirements}
      \noindent
      \begin{tabularx}{\linewidth}{|l|&gt;{\raggedright\arraybackslash}X|&gt;{\raggedright\arraybackslash}X|}
      \hline
      \multicolumn{1}{|c|}{ID} &amp; \multicolumn{1}{c|}{Требование} &amp; \multicolumn{1}{c|}{Проверка} \\
      \hline
      F1 &amp; Регистрация заявки &amp; Пустая тема отклоняется; корректная заявка получает номер и автора. \\
      \hline
      F2 &amp; Новая $\to$ В работе $\to$ Закрыта &amp; Для начала нужен исполнитель, для закрытия --- результат. \\
      \hline
      F3 &amp; Поиск и фильтр &amp; Карточка найдена по номеру; фильтр оставляет нужное состояние. \\
      \hline
      F4 &amp; Наблюдатель только читает &amp; Сервер отклоняет изменение; данные не меняются. \\
      \hline
      F5 &amp; Согласованное сохранение &amp; История сохраняется с заявкой; устаревшая версия отклоняется. \\
      \hline
      \end{tabularx}\par
      \endgroup

      \subsection{Модель данных}
      Пользователь: номер, логин, роль, признак активности.
      Заявка: номер, тема, описание, состояние, время создания, автор,
      исполнитель, результат и версия. История: ссылка на заявку,
      старое и новое состояния, автор и время изменения.

      При регистрации состояние --- «Новая», старое состояние в истории пусто.
      Изменение состояния и история сохраняются в одной транзакции.
      Устаревшая версия карточки требует обновления данных перед повторной попыткой.

      \par\Needspace{4\baselineskip}
      \subsection{Границы проверки}
      Для каждого требования оформляется протокол с ожидаемым и фактическим результатом.
      Нагрузку и восстановление после сбоя проверяют отдельно.
      \end{document}</code></pre>
      </div>
      <p>Кнопка «Просмотреть пример» открывает приведенный выше самостоятельный документ
      с требованиями F1–F5, моделью данных и границами проверки. В существующий диплом переносите
      содержимое после <code>\begin{document}</code>, согласовав пакеты и оформление
      с преамбулой проекта; основные настройки описаны в
      <a href="/blog/latex-diploma-gost">руководстве по верстке диплома</a>.</p>
tips:
