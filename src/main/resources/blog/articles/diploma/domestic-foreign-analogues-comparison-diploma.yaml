sections:
  - id: scope
    title: Как выбрать сопоставимые отечественные и зарубежные аналоги
    html: |-
      <p>Сравнительный анализ аналогов в дипломе должен объяснить выбор решения или требования к разработке. Сопоставляйте продукты одного назначения для одинакового сценария, масштаба и условий работы. Страна происхождения помогает описать выборку, но сама по себе не показывает качество, безопасность или удобство.</p>
      <p>Для учебного примера возьмем систему учета заявок одного отдела. А и В условно обозначают отечественные решения, Б — зарубежное. Все продукты, их происхождение, цены и оценки вымышлены. Пример не сообщает о реальных поставщиках или испытаниях.</p>
      <p>Укажите способ отбора: назначение, поддерживаемый сценарий, тип развертывания, доступная документация и дата сравнения. Объясните исключение известных альтернатив. Если проект посвящен <a href="/blog/specialist-workstation-diploma-design">разработке АРМ специалиста</a>, начните с его рабочих сценариев, а не с перечня популярных программ.</p>
  - id: evidence
    title: 'Критерии и источники: что именно сравнивается'
    html: |-
      <div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Критерий</th><th>Проверяемая запись</th><th>Подтверждение в реальной работе</th></tr>
      </thead>
      <tbody><tr><td>Автономная работа</td><td>Нужна ли внешняя сеть для согласованных сценариев.</td><td>Документация версии и проверка в заданной конфигурации.</td></tr>
      <tr><td>Экспорт</td><td>Состав полей, формат, полнота выгрузки и возможность повторного чтения.</td><td>Спецификация и протокол экспорта контрольного набора.</td></tr>
      <tr><td>Функциональность</td><td>Число пройденных сценариев из одинакового набора 10.</td><td>Действия, ожидаемые результаты и фактический протокол.</td></tr>
      <tr><td>Поддержка</td><td>Баллы по заранее определенной рубрике.</td><td>Условия договора, часы и каналы обслуживания, подтверждения.</td></tr>
      <tr><td>Затраты за год</td><td>Одинаковые пользователи, лицензии, внедрение и услуги.</td><td>Предложение с датой, валютой, налоговой базой и составом.</td></tr>
      </tbody>
      </table>
      </div>
      <p>Обязательные требования работают как фильтр. В нашем примере нужны автономная работа и экспорт. Их отсутствие нельзя компенсировать низкой ценой. Для <a href="/blog/technological-equipment-selection-justification">оборудования</a> аналогичными фильтрами могут быть точность и производительность.</p>
      <p>Для оценки поддержки зададим учебную рубрику: до 4 баллов за документированные сроки реакции, до 3 за покрытие нужных часов, до 3 за каналы и эскалацию. Границы внутри каждой шкалы определите до реального оценивания. Здесь баллы заданы условно, договоры не анализировались.</p>
      <p>Неподтвержденные характеристики помечайте «нет данных». Их нельзя выдавать за отсутствие функции. Сведения о регистрации, производителе и происхождении проверяют отдельно по подходящим официальным источникам, если это требуется заданием.</p>
  - id: matrix
    title: Матрица исходных данных и обязательный отсев
    html: |-
      <div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Показатель</th><th>А, отечественный</th><th>Б, зарубежный</th><th>В, отечественный</th></tr>
      </thead>
      <tbody><tr><td>Затраты, тыс. руб./год</td><td>120</td><td>180</td><td>90</td></tr>
      <tr><td>Пройденные сценарии из 10</td><td>8</td><td>9</td><td>6</td></tr>
      <tr><td>Поддержка, баллы из 10</td><td>6</td><td>9</td><td>5</td></tr>
      <tr><td>Автономная работа</td><td>Да</td><td>Да</td><td>Да</td></tr>
      <tr><td>Требуемый экспорт</td><td>Да</td><td>Да</td><td>Нет</td></tr>
      </tbody>
      </table>
      </div>
      <p>В исключается из ранжирования из-за экспорта. Дальше сравниваем А и Б. Эти числа являются исходными допущениями учебного расчета. Для реальных продуктов поставьте рядом с каждой строкой ссылку на документ или протокол; один общий URL производителя для всех свойств недостаточен.</p>
      <p>Стоимость сравнивается за один год в одинаковом составе. Для разных валют укажите курс и дату пересчета, для разных моделей лицензирования приведите их к одному числу пользователей и периоду. Не сравнивайте месячную подписку с бессрочной лицензией без обоснования горизонта.</p>
  - id: score
    title: Нормирование и взвешенная оценка
    html: |-
      <p>Меньшая цена предпочтительнее, большее число сценариев и баллов поддержки — предпочтительнее. Нормируем по А и Б: цену как $c_{\min}/c_i$, остальные показатели как отношение к своему максимуму. Вариант В в опорные значения не входит.</p>
      <p>$$S_i=0{,}40\frac{c_{\min}}{c_i}+0{,}35\frac{f_i}{f_{\max}}+0{,}25\frac{s_i}{s_{\max}}.$$</p>
      <p>Веса 0,40; 0,35; 0,25 выбраны автором для упражнения и дают в сумме 1. В реальной работе объясните их через приоритеты заказчика и согласуйте до просмотра итогового рейтинга.</p>
      <p>Для А: $0{,}4+0{,}35\cdot8/9+0{,}25\cdot6/9\approx0{,}878$. Для Б: $0{,}4\cdot120/180+0{,}35+0{,}25\approx0{,}867$. При этих весах А имеет небольшое преимущество.</p>
      <p>Взвешенная сумма предполагает возможность взаимной компенсации предпочтений. Она не заменяет обязательные фильтры. Баллы поддержки условны; деление их на максимум не делает шкалу объективной физической величиной. Добавление нового аналога может изменить опорные максимумы, поэтому набор вариантов нужно фиксировать.</p>
  - id: sensitivity
    title: Устойчивость вывода и требования к собственной разработке
    html: |-
      <p>Уменьшим вес цены до 0,30, увеличим вес сценариев до 0,40, поддержки — до 0,30. Получим А ≈ 0,856, Б = 0,900. Выбор меняется. Следовательно, преимущество А в исходном расчете неустойчиво к приоритетам; объявлять его безусловно лучшим нельзя.</p>
      <p>Корректный вывод: «Оба варианта проходят обязательные условия. При исходных весах предпочтителен А, но усиление требований к функциональности и поддержке дает преимущество Б. Перед выбором необходимо согласовать приоритеты и подтвердить исходные оценки».</p>
      <p>Для собственной системы сформулируйте проверяемые требования по результатам сравнения: работа в локальной сети, полнота экспорта, перечень поддерживаемых сценариев. Затем подготовьте отдельный протокол проверки прототипа. Сравнение чужих решений еще не доказывает превосходство разработки.</p>
      <p>Если анализируются технические решения из патентных документов, дополните обзор <a href="/blog/patent-search-methodology-diploma-report">методикой патентного поиска</a>. Сходство функций и происхождение продукта сами по себе не устанавливают правовой статус или патентную чистоту.</p>
  - id: editor
    title: Редактируемый пример и проверка PDF
    html: |-
      <p>В примере уже настроены поля, интервалы и заголовки с учётом <a href="https://mpei.ru/Science/ScienceDocuments/Documents/0_GOST_7.32-2017.pdf">ГОСТ 7.32-2017</a>. Для ВКР сверьте оформление с методичкой вашей кафедры.</p>
       <p>При вставке в основной документ используйте его преамбулу, счетчики разделов и сквозную нумерацию страниц. Титульный лист, содержание, введение и приложения в этот фрагмент не входят. Каждый раздел начинается с новой страницы; подписи таблиц находятся сверху слева, ссылки на таблицы даны в тексте.</p>
      <p>Сначала добавьте вычислительный сегмент, затем LaTeX-сегмент. Расчет можно скрыть: исходные данные, формулы и результаты остаются в печатном документе. Кнопка примера открывает оба сегмента в нужном порядке.</p>
      <div class="article-code"><div class="article-code__header"><span class="article-code__lang">Вычислительный сегмент</span></div>
      <pre><code>cost_A = 120
      cost_B = 180
      features_A = 8
      features_B = 9
      support_A = 6
      support_B = 9
      w_cost = 0.4
      w_features = 0.35
      w_support = 0.25
      best_cost = min([cost_A, cost_B])
      best_features = max([features_A, features_B])
      best_support = max([support_A, support_B])
      score_A = w_cost * best_cost / cost_A + w_features * features_A / best_features + w_support * support_A / best_support
      score_B = w_cost * best_cost / cost_B + w_features * features_B / best_features + w_support * support_B / best_support
      alt_A = 0.3 * best_cost / cost_A + 0.4 * features_A / best_features + 0.3 * support_A / best_support
      alt_B = 0.3 * best_cost / cost_B + 0.4 * features_B / best_features + 0.3 * support_B / best_support</code></pre></div>
      <div class="article-code"><div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
      <pre><code>\documentclass[a4paper,14pt]{extarticle}
      \usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[russian]{babel}
      \usepackage{tempora,amsmath,setspace,indentfirst,tabularx,array,titlesec,caption,needspace}
      \usepackage[left=30mm,right=15mm,top=20mm,bottom=20mm]{geometry}
      \onehalfspacing
      \setlength{\parindent}{1.25cm}
      \titleformat{\section}{\normalfont\bfseries\hyphenpenalty=10000\relax\exhyphenpenalty=10000\relax}{\thesection}{1em}{}
      \titlespacing{\section}{\parindent}{0pt}{12pt}
      \newcommand{\reportsection}[1]{\clearpage\section{#1}}
      \DeclareCaptionLabelSeparator{gostdash}{\space---\space}
      \captionsetup{labelsep=gostdash,font={normalsize,singlespacing}}
      \captionsetup[table]{justification=raggedright,singlelinecheck=false}
      \captionsetup[figure]{justification=centering,singlelinecheck=false}
      \DeclareCaptionTextFormat{gosttitle}{\hyphenpenalty=10000\relax\exhyphenpenalty=10000\relax#1}
      \captionsetup{textformat=gosttitle}
      \AtBeginDocument{%
          \setlength{\abovedisplayskip}{\baselineskip}%
          \setlength{\belowdisplayskip}{\baselineskip}%
          \setlength{\abovedisplayshortskip}{\baselineskip}%
          \setlength{\belowdisplayshortskip}{\baselineskip}}
      \addto\captionsrussian{\renewcommand{\figurename}{Рисунок}}
      \pagestyle{plain}
      \newcolumntype{Y}{&gt;{\raggedright\arraybackslash}X}
      \setlength{\emergencystretch}{2em}
      % десятичная запятая в подставленных числах
      \mathcode`.="8000
      {\catcode`.=\active\gdef.{{,}}}
      \begin{document}
      \reportsection{Сопоставление аналогов проектируемой системы}
      Учебный пример: А и В --- условные отечественные решения,
      Б --- условное зарубежное. Наименования, происхождение и оценки
      вымышлены. Реальные продукты и испытания не представлены.
      Задача --- выбрать систему локального учета заявок для одного отдела.

      Обязательны автономная работа в локальной сети и экспорт данных.
      Вариант В не поддерживает требуемый экспорт и исключается.
      Сопоставляются одинаковые число пользователей, период и комплект услуг.
      Исходные оценки приведены в таблице~\ref{tab:analogues}.

      \begin{table}[htbp]
      \caption{Учебные данные сравнения аналогов}
      \label{tab:analogues}
      \begin{tabularx}{\textwidth}{|Y|r|r|r|}
      \hline
      \multicolumn{1}{|c|}{\shortstack[c]{Критерий}} &amp; \multicolumn{1}{c|}{\shortstack[c]{А}} &amp; \multicolumn{1}{c|}{\shortstack[c]{Б}} &amp; \multicolumn{1}{c|}{\shortstack[c]{В}} \\
      \hline
      Затраты за год, тыс. руб. &amp; 120 &amp; 180 &amp; 90 \\
      Пройденные сценарии из 10 &amp; 8 &amp; 9 &amp; 6 \\
      Баллы поддержки из 10 &amp; 6 &amp; 9 &amp; 5 \\
      Автономная работа &amp; Да &amp; Да &amp; Да \\
      Экспорт по требованию &amp; Да &amp; Да &amp; Нет \\
      \hline
      \end{tabularx}
      \end{table}

      Все значения заданы для упражнения. В реальной работе сценарии
      и рубрику поддержки проверяют по протоколам; стоимость подтверждают
      расчетом состава услуг и предложением на определенную дату.

      \reportsection{Взвешенная оценка и ограничения выбора}
      Для прошедших отбор А и Б цена нормируется как отношение
      минимальной цены к цене варианта. Сценарии и поддержка нормируются
      на максимум соответствующего показателя среди А и Б.
      Взвешенная оценка определяется по формуле~\eqref{eq:score}.
      \par\noindent
      \begin{minipage}[b]{\textwidth}
      \setlength{\parindent}{1.25cm}
      \setlength{\abovedisplayskip}{0pt}
      \setlength{\abovedisplayshortskip}{0pt}
      \vspace*{\baselineskip}
      \begin{equation}
      \label{eq:score}
      S_i=\alpha\frac{c_{\min}}{c_i}+\beta\frac{f_i}{f_{\max}}+\gamma\frac{s_i}{s_{\max}},
      \end{equation}

      где $S_i$ --- итоговая безразмерная оценка варианта $i$;\par
      $\alpha=0{,}40$ --- вес стоимости, безразмерный;\par
      $c_{\min}$ --- минимальные затраты среди А и Б, тыс. руб./год;\par
      $c_i$ --- затраты варианта $i$, тыс. руб./год;\par
      $\beta=0{,}35$ --- вес функциональности, безразмерный;\par
      $f_i$ --- число сценариев, пройденных вариантом $i$;\par
      $f_{\max}$ --- максимальное число пройденных сценариев среди А и Б;\par
      $\gamma=0{,}25$ --- вес поддержки, безразмерный;\par
      $s_i$ --- оценка поддержки варианта $i$, баллы;\par
      $s_{\max}$ --- максимальная оценка поддержки среди А и Б, баллы.
      \end{minipage}\par

      Исходные значения: $c_A=120$, $c_{\text{Б}}=180$ тыс. руб./год;
      $f_A=8$, $f_{\text{Б}}=9$; $s_A=6$, $s_{\text{Б}}=9$.
      Веса суммируются в единицу и выбраны автором для упражнения.
      Получаем $S_A=${score_A}$, $S_{\text{Б}}=${score_B}$.
      По этой модели вариант А имеет более высокую оценку.

      При весах 0,30 для цены, 0,40 для сценариев и 0,30 для поддержки
      получаем $S_A=${alt_A}$, $S_{\text{Б}}=${alt_B}$: предпочтение переходит к Б.
      Следовательно, исходное преимущество А неустойчиво к приоритетам.

      Вывод ограничен заданными критериями и вариантами.
      Страна происхождения сама по себе не является баллом качества.
      Для проектируемого АРМ нужно отдельно подтвердить требуемый экспорт,
      автономность и поддержку рабочих сценариев; сравнение аналогов
      не доказывает, что разрабатываемая система уже лучше них.
      \end{document}</code></pre></div>
      <p>После сборки проверьте номера, ссылки, единицы измерения, переносы в таблицах и читаемость формул. При переносе в полный отчет обновите содержание повторной компиляцией. Числа в статье округлены для чтения; стандартные настройки редактора выводят три значащие цифры.</p>
tips:
  - title: Не превращайте неизвестное в ноль
    html: <p>Если характеристика не опубликована, пометьте ее как неподтвержденную и запросите данные. Ноль означает установленное отсутствие свойства.</p>
  - title: Сохраняйте версии и условия
    html: <p>Цена, функциональность и доступность относятся к версии, комплектации, территории и дате. Без этих реквизитов сравнение трудно повторить.</p>
