sections:
  - id: 'vak-rules'
    title: 'Технические требования журналов ВАК и РИНЦ'
    html: |2-
      <p>ВАК и РИНЦ сами не задают поля, шрифт и интервал: эти параметры устанавливают правила для
      авторов конкретного журнала. Состав элементов статьи (сведения об авторах, аннотация,
      ключевые слова) описывает ГОСТ Р 7.0.7-2021. Типичные требования журналов из перечня Высшей
      аттестационной комиссии (ВАК) и изданий, индексируемых в Российском индексе научного
      цитирования (РИНЦ), выглядят так:</p>
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead>
                  <tr>
                      <th>Параметр</th>
                      <th>Типичное требование</th>
                      <th>Где уточнить</th>
                  </tr>
              </thead>
              <tbody>
                  <tr>
                      <td>Формат и поля</td>
                      <td>А4, книжная ориентация; по 20 мм со всех сторон (бывает левое 25 мм,
                      правое 15 мм). Как задать в LaTeX — в статье про <a
                      href="/blog/latex-geometry-margins-gost">поля через geometry</a></td>
                      <td>правила для авторов</td>
                  </tr>
                  <tr>
                      <td>Шрифт и кегль</td>
                      <td>Times New Roman 14 pt (часто 12 pt); в таблицах и сносках 10–12 pt</td>
                      <td>правила для авторов</td>
                  </tr>
                  <tr>
                      <td>Межстрочный интервал</td>
                      <td>полуторный или одинарный — см. <a
                      href="/blog/latex-line-spacing-1-5-setspace-gost">интервал 1,5 в LaTeX</a></td>
                      <td>правила, образец статьи</td>
                  </tr>
                  <tr>
                      <td>Абзацный отступ</td>
                      <td>1,25 см, параметром абзаца, а не пробелами — см. <a
                      href="/blog/paragraph-indent-1-25-gost">отступ 1,25 см</a></td>
                      <td>правила для авторов</td>
                  </tr>
                  <tr>
                      <td>Выравнивание и переносы</td>
                      <td>по ширине; переносы — как в правилах журнала (часто требуют
                      отключить)</td>
                      <td>правила, шаблон .docx</td>
                  </tr>
                  <tr>
                      <td>Объём статьи</td>
                      <td>обычно 6–20 страниц или 20–40 тыс. знаков с пробелами</td>
                      <td>правила для авторов</td>
                  </tr>
                  <tr>
                      <td>Формат файла</td>
                      <td>.docx; у физико-математических журналов часто .tex + PDF</td>
                      <td>страница подачи рукописи</td>
                  </tr>
                  <tr>
                      <td>Число источников</td>
                      <td>обычно не менее 10–15, доля самоцитирования ограничена</td>
                      <td>правила, требования рецензентов</td>
                  </tr>
              </tbody>
          </table>
      </div>
      <p>Числа в таблице — ориентир: всегда сверяйтесь с правилами своего журнала. Как отключить
      переносы в LaTeX, разобрано в статье о <a
      href="/blog/latex-prevent-hyphenation-linebreaks">запрете переносов</a>, а чем выравнивание по
      ширине в LaTeX отличается от Word — в сравнении <a
      href="/blog/justified-text-spacing-hyphenation-latex-vs-word">переносов и пробелов</a>.</p>
      <p>По смысловой структуре многие отечественные журналы ориентируются на <a
      href="/blog/imrad-structure-scientific-article-scopus-template">структуру IMRAD</a>: введение,
      методы, результаты, обсуждение.</p>
  - id: 'vak-lists'
    title: 'Перечень ВАК, категории К1–К3 и «Белый список»'
    html: |2-
      <p>Для защиты диссертации важны публикации в журналах из перечня ВАК, а для отчётов по
      грантам и эффективному контракту — ещё и уровень журнала. Сейчас действуют несколько
      списков:</p>
      <ul>
          <li><strong>Перечень ВАК</strong> — рецензируемые издания, где публикуют основные
          результаты диссертаций. С 2023 года журналы перечня распределены по категориям К1
          (высшая), К2 и К3; категория влияет на то, как публикация засчитывается
          диссертационными советами.</li>
          <li><strong>«Белый список»</strong> (Единый государственный перечень научных изданий) —
          список, который ведёт Российский центр научной информации; журналы в нём распределены по
          уровням 1–4.</li>
          <li><strong>РИНЦ</strong> — библиографическая база на платформе eLIBRARY.RU, куда входят
          тысячи журналов. <strong>Ядро РИНЦ (RSCI)</strong> — отобранная экспертами часть РИНЦ с
          самыми цитируемыми и авторитетными журналами.</li>
      </ul>
      <p><strong>Как проверить журнал:</strong> найдите его в актуальном перечне на сайте ВАК
      (vak.minobrnauki.gov.ru), уровень в «Белом списке» — на сайте РЦНИ, а индексацию в РИНЦ и
      RSCI — в карточке журнала на eLIBRARY.RU. Списки и правила засчитывания публикаций
      регулярно меняются, поэтому перед подачей сверяйтесь с официальными источниками и
      требованиями своего диссертационного совета.</p>
  - id: 'article-anatomy'
    title: 'Метаданные статьи по ГОСТ Р 7.0.7-2021'
    html: |2-
      <p>ГОСТ Р 7.0.7-2021 «Статьи в журналах и сборниках. Издательское оформление» задаёт состав
      и порядок элементов статьи. Обычно статья открывается так:</p>
      <ol>
          <li><strong>Тип статьи</strong> над заглавием: «Научная статья», «Обзорная статья» и
          т.&nbsp;п.;</li>
          <li><strong>УДК</strong> — индекс Универсальной десятичной классификации, например
          <code>УДК 004.421</code>; многие журналы печатают рядом <strong>DOI</strong> и
          <strong>EDN</strong> (идентификатор, который присваивает eLIBRARY);</li>
          <li><strong>Заглавие статьи.</strong> Регистр и начертание (прописные или строчные,
          полужирный) задаёт журнал;</li>
          <li><strong>Сведения об авторах:</strong> имя, отчество и фамилия полностью («Иван
          Иванович Иванов»), аффилиация (полное название организации), город, страна, e-mail и
          ORCID в виде ссылки <code>https://orcid.org/…</code>. Если аффилиаций несколько, их
          связывают с авторами надстрочными цифрами;</li>
          <li><strong>Аннотация</strong> со словом «Аннотация» перед текстом. Рекомендуемый объём —
          около 250 слов, но многие журналы задают свои пределы. Правила составления разобраны в
          статье об <a href="/blog/scientific-article-annotation-abstract-keywords-vak">аннотации и
          ключевых словах для ВАК</a>;</li>
          <li><strong>Ключевые слова:</strong> через запятую, без точки в конце; стандарт допускает
          от 3 до 15 слов и словосочетаний, на практике журналы просят 5–10;</li>
          <li><strong>Благодарности и финансирование</strong> (номер гранта, проекта);</li>
          <li><strong>Блок «Для цитирования»</strong> — готовая ссылка на саму статью;</li>
          <li><strong>Англоязычный блок:</strong> тип статьи, Title, имена авторов в
          транслитерации, аффилиации, Abstract, Keywords, For citation.</li>
      </ol>
      <p>Конкретный журнал может переставлять элементы (например, выносить сведения об авторах в
      конец статьи), поэтому за образец берите свежий выпуск журнала. Главное отличие от старого ГОСТ
      Р 7.0.7-2009 — полные имена авторов вместо инициалов, ORCID и тип статьи.</p>
  - id: 'download-template'
    title: 'Шаблон статьи ВАК и РИНЦ: готовый код на LaTeX'
    html: |2-
      <p>Ниже — <strong>шаблон статьи ринц онлайн</strong> в формате LaTeX со всеми элементами из
      списка выше: две аффилиации, e-mail и ORCID каждого автора, англоязычный блок и список
      литературы. Скопируйте код в LaTeX-сегмент и подставьте поля, кегль и интервал из правил
      вашего журнала.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX Шаблон РИНЦ / ВАК</span></div>
          <pre><code>\documentclass[a4paper,14pt]{extarticle} % класс article не знает кегль 14pt
      \usepackage{cmap}                        % копируемая кириллица в PDF
      \usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[english,russian]{babel}      % последний язык — основной
      \usepackage[left=20mm,right=20mm,top=20mm,bottom=20mm]{geometry}
      \usepackage{setspace}
      \onehalfspacing
      \usepackage{indentfirst}
      \setlength{\parindent}{1.25cm}
      \usepackage{amsmath,amssymb}
      \usepackage{graphicx}
      \usepackage{url}

      \begin{document}

      \noindent Научная статья\\
      УДК 004.891.2\\
      EDN: XXXXXX % при наличии: EDN присваивает eLIBRARY

      \begin{center}
      {\bfseries Метод оптимизации нейросетевых архитектур для систем реального времени}\\[0.5cm]
      {\bfseries Алексей Андреевич Иванов$^{1}$, Сергей Сергеевич Петров$^{2}$}\\[0.2cm]
      {\small
      $^{1}$Московский государственный технический университет имени Н.~Э.~Баумана, Москва, Россия\\
      $^{2}$Институт системного программирования им.~В.~П.~Иванникова РАН, Москва, Россия\\
      $^{1}$ivanov@bmstu.ru, \url{https://orcid.org/0000-0000-0000-0001}\\
      $^{2}$petrov@ispras.ru, \url{https://orcid.org/0000-0000-0000-0002}}
      \end{center}

      \noindent{\bfseries Аннотация.} В работе предложен алгоритм прунинга весов...

      \noindent{\bfseries Ключевые слова:} нейронные сети, оптимизация, прунинг, параллельные вычисления

      \noindent{\bfseries Благодарности:} работа выполнена при поддержке РНФ, проект № 00-00-00000.

      \noindent{\bfseries Для цитирования:} Иванов А.~А., Петров С.~С. Метод оптимизации нейросетевых
      архитектур для систем реального времени // Название журнала. 2026. Т.~12, №~3. С.~45--58.

      \begin{otherlanguage}{english}
      \noindent Original article

      \begin{center}
      {\bfseries Neural network architecture optimization method for real-time systems}\\[0.5cm]
      {\bfseries Aleksei A. Ivanov$^{1}$, Sergei S. Petrov$^{2}$}\\[0.2cm]
      {\small
      $^{1}$Bauman Moscow State Technical University, Moscow, Russia\\
      $^{2}$Ivannikov Institute for System Programming of the RAS, Moscow, Russia}
      \end{center}

      \noindent{\bfseries Abstract.} The paper proposes a weight pruning algorithm...

      \noindent{\bfseries Keywords:} neural networks, optimization, pruning, parallel computing

      \noindent{\bfseries For citation:} Ivanov A.~A., Petrov S.~S. Neural network architecture
      optimization method for real-time systems. \emph{Journal Name}. 2026;12(3):45--58. (In Russ.)
      \end{otherlanguage}

      \section*{Введение}
      Актуальность темы обусловлена необходимостью...~\cite{ivanov2024}.

      \section*{Методика исследования}
      Математическая модель описывается выражением:
      \begin{equation}
          f(x) = \sum_{i=1}^{n} w_i x_i + b
      \end{equation}

      \section*{Результаты и обсуждение}
      Экспериментальные исследования показали...~\cite{sidorov2023}.

      \section*{Заключение}
      Предложенный метод позволяет...

      \begin{thebibliography}{9}
      \bibitem{ivanov2024} Иванов,~И.~И. Алгоритмы балансировки / И.~И.~Иванов.~--- Текст :
        непосредственный // Программные продукты и системы.~--- 2024.~--- Т.~37, №~2.~--- С.~45--52.
      \bibitem{sidorov2023} Сидоров,~А.~В. Математические методы анализа данных : учебник /
        А.~В.~Сидоров.~--- Москва : Наука, 2023.~--- 312~с.~--- Текст : непосредственный.
      \end{thebibliography}
      \end{document}</code></pre>
      </div>
      <p>Номер EDN, ORCID и номер гранта в шаблоне — заглушки: подставьте свои или удалите строки,
      если журнал их не требует. Ключевые слова разделяют запятыми и не ставят точку после
      последнего. Если журнал издаётся в две колонки, для тела статьи используют пакет для <a
      href="/blog/latex-multicol-multi-column-layout-journal">многоколоночной вёрстки в
      multicol</a>.</p>
  - id: 'online-editing'
    title: 'Оформление научной статьи по ГОСТу онлайн в Labkeeper'
    html: |2-
      <p><strong>Оформление научной статьи по госту онлайн</strong> в Labkeeper — это LaTeX-проект:
      стили заголовков, нумерацию формул и списков рассчитывает LaTeX, поэтому их не нужно
      поправлять вручную. Поля, кегль и интервал из правил журнала задаются один раз в преамбуле, как
      в шаблоне выше.</p>
      <p>Если писать без своей преамбулы, учтите, что стандартная преамбула Labkeeper ставит поля
      всего 3–5 мм и нумерует формулу, только когда на неё есть ссылка через <code>\eqref</code>. Для
      статьи по правилам журнала начинайте проект с полной преамбулы.</p>
      <h3>Готовые шаблоны журналов ВАК в Labkeeper</h3>
      <p>Для нескольких журналов в каталоге уже есть шаблоны с разметкой по правилам редакции —
      откройте нужный и сразу пишите текст:</p>
      <ul>
          <li><a href="/templates/vestnik-mgu-fizika">«Вестник Московского университета. Серия 3.
          Физика. Астрономия»</a>;</li>
          <li><a href="/templates/zhurnal-svmo">«Журнал Средневолжского математического
          общества»</a>;</li>
          <li><a href="/templates/izvestiya-saratov-mmi">«Известия Саратовского университета. Серия:
          Математика. Механика. Информатика»</a>;</li>
          <li><a href="/templates/avtomatika-i-telemekhanika">«Автоматика и телемеханика»</a> (и <a
          href="/templates/automation-and-remote-control">англоязычная версия Automation and Remote
          Control</a>).</li>
      </ul>
  - id: 'gost-citations'
    title: 'Список литературы: ГОСТ Р 7.0.100, 7.0.5 и References'
    html: |2-
      <p>В РИНЦ цитирования разбираются автоматически. Если ссылка оформлена с ошибкой (пропущены
      год, том или страницы), она может не привязаться к статье и профилю цитируемого автора.</p>
      <p>Журналы требуют один из двух форматов — выбирайте по правилам журнала:</p>
      <ul>
          <li><strong>Библиографическая ссылка по ГОСТ Р 7.0.5-2008</strong> — элементы разделяют
          точкой: <em>Иванов И. И. Алгоритмы балансировки // Программные продукты и системы. 2024.
          Т. 37, № 2. С. 45–52.</em></li>
          <li><strong>Библиографическое описание по ГОСТ Р 7.0.100-2018</strong> — с разделителем
          «. — » и областью вида содержания: <em>Иванов, И. И. Алгоритмы балансировки / И. И.
          Иванов. — Текст : непосредственный // Программные продукты и системы. — 2024. — Т. 37, №
          2. — С. 45–52.</em></li>
      </ul>
      <p>Журналам с англоязычной версией часто нужен ещё блок <strong>References</strong>: русские
      источники транслитерируют, а заглавие переводят в квадратных скобках:</p>
      <blockquote>
          Ivanov I. I. Algoritmy balansirovki [Load balancing algorithms]. Programmnye produkty i
          sistemy [Software &amp; Systems], 2024, vol. 37, no. 2, pp. 45–52. (In Russ.)
      </blockquote>
      <p>Стиль транслитерации (BSI, BGN, ГОСТ 7.79) тоже задаёт журнал. Как оформить сайты и
      электронные источники, разобрано в статье о <a
      href="/blog/electronic-resources-bibliography-gost-7-0-100">ссылках на сайты по ГОСТ Р
      7.0.100</a>, а вёрстка списка в LaTeX — в руководстве по <a
      href="/blog/latex-gost-bibliography">списку литературы по ГОСТ в LaTeX</a>.</p>
  - id: 'faq'
    title: 'Частые вопросы'
    html: |2-
      <h3>Какой шрифт и интервал нужен для статьи ВАК?</h3>
      <p>Единого требования нет: чаще всего Times New Roman 14 pt с полуторным интервалом или 12 pt
      с одинарным. Точные значения указаны в правилах для авторов конкретного журнала.</p>
      <h3>Нужен ли УДК для статьи в РИНЦ?</h3>
      <p>Да, почти все российские журналы требуют УДК, и ГОСТ Р 7.0.7-2021 включает его в состав
      метаданных. Индекс лучше подобрать вместе с библиографом вуза.</p>
      <h3>Как проверить, входит ли журнал в перечень ВАК?</h3>
      <p>Найдите журнал в актуальном перечне на сайте ВАК и посмотрите его категорию (К1–К3).
      Индексацию в РИНЦ и RSCI видно в карточке журнала на eLIBRARY.RU.</p>
      <h3>Сколько слов должно быть в аннотации?</h3>
      <p>ГОСТ Р 7.0.7-2021 ориентирует примерно на 250 слов, журналы обычно просят 150–250. Подробнее
      — в статье об <a href="/blog/scientific-article-annotation-abstract-keywords-vak">аннотации и
      ключевых словах</a>.</p>
tips:
  - title: 'Как подобрать УДК'
    html: |2-
      <p>УДК должен точно отражать предметную область статьи. Проверьте шифр по официальному
      сокращённому изданию UDC Summary (udcsummary.info) или попросите библиографа вуза. Если
      статья на стыке тем, используют составной индекс через двоеточие:
      <code>УДК 004.89:004.421</code>.</p>
  - title: 'Графики для журнала'
    html: |2-
      <p>Формулы и графики, построенные в LaTeX (TikZ, pgfplots), попадают в PDF в векторном виде.
      Растровые иллюстрации готовьте с разрешением, которое указано в правилах журнала.</p>
editorExample:
