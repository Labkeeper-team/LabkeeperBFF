sections:
  - id: 'requirements'
    title: 'Сначала найдите требования конкретного издания'
    html: '<p>PDF может правильно открываться, но не соответствовать инструкции журнала: другой размер страниц, невстроенные шрифты или слишком большой файл. Проверять нужно окончательную рукопись по актуальной инструкции и шаблону выбранного издания.</p><p>Единого набора «A4, 14 пт и поля по ГОСТ» для всех журналов нет. Например, <a href="https://www.cambridge.org/core/journals/journal-of-pension-economics-and-finance/information/author-instructions/preparing-your-materials" target="_blank" rel="noopener noreferrer">инструкция Journal of Pension Economics and Finance</a> допускает A4 или US Letter и задаёт поля в один дюйм. Это требование конкретного журнала, а не настройка для любой статьи.</p><p>Зафиксируйте адрес инструкции, дату проверки, версию шаблона и стадию подачи: требования к первичной рукописи и окончательным материалам могут различаться. Ниже — ручная проверка; автоматического валидатора требований журнала в этом примере нет.</p>'
  - id: 'page'
    title: 'Размер страниц и поля проверяйте раздельно'
    html: '<p>Размер листа и ширина полей — разные параметры. Сверьте формат страницы со свойствами PDF, затем проверьте настройки исходного документа и расположение текста, колонтитулов и широких объектов. Просмотрите не только первую, но и остальные страницы, включая приложения.</p><p>В LaTeX размер страницы и поля можно задавать пакетом <code>geometry</code>, однако журнал может уже настроить их в своём классе. Не переопределяйте шаблон без необходимости. Общие приёмы описаны в статье о <a href="/blog/latex-geometry-margins-gost">полях страницы</a>; численные значения для отчёта нельзя автоматически переносить в журнальную рукопись.</p>'
  - id: 'fonts'
    title: 'Проверьте шрифты и читаемость'
    html: '<p>Посмотрите сведения о шрифтах в PDF-просмотрщике или через <code>pdffonts</code>. Проверяйте и основной текст, и подписи графиков: встроенность текстового шрифта не гарантирует, что все шрифты иллюстрации также встроены.</p><p>Например, <a href="https://conferences.ieeeauthorcenter.ieee.org/write-your-paper/meet-ieee-xplore-requirements/" target="_blank" rel="noopener noreferrer">требования IEEE Xplore</a> предусматривают встроенные шрифты или встроенные подмножества. Эта страница относится к конференционным материалам IEEE; для своего журнала используйте его собственную инструкцию.</p><p>Отдельно выделите и скопируйте фрагмент текста, проверьте русские буквы, индексы и символы. Наличие встроенного шрифта само по себе не проверяет правильность формул или качество текстового слоя.</p>'
  - id: 'tools'
    title: 'Что показывают pdfinfo и pdffonts'
    html:
      '<p>Если на компьютере установлен Poppler, выполните в терминале следующие команды. Они не относятся к вычислительному языку Labkeeper.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">Терминал</span></div>

      <pre><code>pdfinfo article.pdf

      pdffonts article.pdf</code></pre>

      </div><div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Инструмент</th><th>Что можно проверить</th><th>Чего он не подтверждает</th></tr></thead><tbody><tr><td><code>pdfinfo</code></td><td>Число страниц, размер страницы, размер файла, версию PDF</td><td>Фактические поля текста и соответствие всем правилам журнала</td></tr>

      <tr><td><code>pdffonts</code></td><td>Шрифты; emb — встроенность, sub — подмножество</td><td>Правильность содержания и читаемость каждого объекта</td></tr></tbody></table></div><p>По <a href="https://manpages.debian.org/testing/poppler-utils/pdfinfo.1.en.html" target="_blank" rel="noopener noreferrer">документации pdfinfo</a>, параметр <code>-box</code> выводит рамки страницы, а не измеряет поля вокруг набранного текста. Для проверки всех страниц задайте диапазон <code>-f</code> и <code>-l</code> по фактическому числу страниц. Значения <code>emb=yes</code> и <code>sub=yes</code> пояснены в <a href="https://manpages.debian.org/testing/poppler-utils/pdffonts.1.en.html" target="_blank" rel="noopener noreferrer">документации pdffonts</a>.</p>'
  - id: 'size'
    title: 'Сверьте размер и окончательную версию файла'
    html: '<p>Сравните размер PDF с лимитом системы подачи. Не используйте произвольный предел вроде «не более 10 Мбайт», если издание его не задаёт. При большом файле сначала выясните причину: крупные растровые изображения, дублирование страниц или избыточное разрешение.</p><p>После оптимизации снова просмотрите формулы, мелкие подписи и рисунки. Сжатие не должно делать их нечитаемыми. Если исправляли исходник, пересоберите PDF; при ошибке используйте <a href="/blog/latex-compilation-errors-undefined-missing-overfull">разбор сообщений компиляции</a>.</p>'
  - id: 'checklist'
    title: 'Рабочий чек-лист для подачи'
    html:
      '<p>«Просмотреть пример» открывает следующий Markdown-список. Впишите сведения об издании и отмечайте проверки вручную заменой <code>[ ]</code> на <code>[x]</code>. Сам PDF этот список не анализирует.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">Markdown</span></div>

      <pre><code># Проверка PDF перед подачей в журнал


      Рабочий список: отметки ставит автор после проверки.


      ## Требования


      Журнал: [название]

      Инструкция для авторов: [адрес]

      Дата проверки инструкции: [дата]

      Шаблон и версия: [сведения]


      - [ ] Размер страниц и поля сверены с инструкцией.

      - [ ] Проверены предел числа страниц и состав файлов.

      - [ ] Шрифты проверены по требованиям издания.

      - [ ] Размер PDF укладывается в лимит системы подачи.

      - [ ] Формулы, рисунки и таблицы просмотрены в готовом файле.

      - [ ] Текст выделяется и копируется без потерь.

      - [ ] Анонимизация выполнена, если она требуется.

      - [ ] Открыт именно окончательный файл для подачи.


      ## Локальные команды для установленного Poppler


      Выполняются в терминале компьютера, а не в сегменте Labkeeper.


      ```sh

      pdfinfo article.pdf

      pdffonts article.pdf

      ```</code></pre>

      </div><p>Для двойного слепого рецензирования проверьте необходимые изданию места анонимизации, включая свойства файла, только если это предусмотрено процедурой подачи. Сохраняйте окончательный PDF вместе с исходником и сведениями о версии шаблона.</p>'
