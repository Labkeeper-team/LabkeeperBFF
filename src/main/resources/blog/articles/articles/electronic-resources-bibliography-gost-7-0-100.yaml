sections:
  - id: 'sample'
    title: 'Образец: статья на сайте'
    html: |2-
      <p>Шаблон записи по ГОСТ Р 7.0.100-2018:</p>
      <blockquote>
          Фамилия, И. О. Заглавие статьи / И. О. Фамилия. — Текст : электронный // Название сайта :
          [сайт]. — Год. — URL: https://… (дата обращения: ДД.ММ.ГГГГ).
      </blockquote>
      <p>Готовый пример, который можно скопировать и заменить своими данными:</p>
      <blockquote>
          Иванов, А. В. Архитектура микросервисов на Python / А. В. Иванов. — Текст : электронный //
          Хабр : [сайт]. — 2025. — URL: https://habr.com/ru/articles/891234/ (дата обращения:
          12.04.2026).
      </blockquote>
      <p>Ниже — что означает каждый элемент и как оформить другие источники: сайт целиком, книгу из
      ЭБС, PDF, статью с DOI, закон, стандарт и видео.</p>
  - id: 'standard-update'
    title: 'Что изменилось в ГОСТ Р 7.0.100-2018'
    html: |2-
      <p>С введением <strong>ГОСТ Р 7.0.100-2018</strong> («Библиографическая запись.
      Библиографическое описание. Общие требования и правила составления», действует с 1 июля 2019
      года) правила описания сайтов и электронных документов изменились:</p>
      <ul>
          <li>Обозначение <code>[Электронный ресурс]</code> после заглавия больше не пишут. Вместо
          него появилась область вида содержания и средства доступа: <code>Текст :
          электронный</code>. У статьи на сайте её ставят перед двумя косыми чертами, а у сайта
          целиком обычно в конце записи.</li>
          <li>Вместо <code>Режим доступа: свободный</code> пишут <code>URL: https://...</code>.
          Примечание о доступе оставляют, только если он ограничен, например <code>Режим доступа:
          для авториз. пользователей</code> у ЭБС.</li>
          <li>Дату обращения пишут в круглых скобках со строчной буквы: <code>(дата обращения:
          ДД.ММ.ГГГГ)</code>.</li>
          <li>Предписанные элементы (<code>[сайт]</code>, <code>дата обращения</code>, <code>Текст :
          электронный</code>) пишут по-русски и у иностранных источников.</li>
      </ul>
      <p>ГОСТ Р 7.0.100-2018 описывает записи в <strong>списке литературы</strong>. Для
      библиографических <strong>ссылок</strong> (подстрочных, внутритекстовых) на сетевые электронные
      документы с 1 июня 2022 года действует отдельный ГОСТ Р 7.0.108-2022. В нём элементы
      разделяют точкой, без «. — » и без «Текст : электронный»:</p>
      <blockquote>
          Иванов А. В. Архитектура микросервисов на Python // Хабр : [сайт]. 2025. URL:
          https://habr.com/ru/articles/891234/ (дата обращения: 12.04.2026).
      </blockquote>
      <p>Какой формат применять в работе, указывает методичка кафедры или правила журнала.</p>
  - id: 'structure'
    title: 'Схема записи: обязательные элементы'
    html: |2-
      <p>Общая схема того, <strong>как оформить ссылку на сайт в списке литературы по ГОСТ</strong>,
      для статьи или страницы сайта:</p>
      <blockquote>
          Фамилия, И. О. Заглавие статьи (страницы) / И. О. Фамилия. — Текст : электронный //
          Название сайта : [сайт]. — Год публикации. — Дата публикации (если указана). — URL:
          https://… (дата обращения: ДД.ММ.ГГГГ).
      </blockquote>
      <ul>
          <li><strong>Заголовок записи</strong> — фамилия и инициалы через запятую: «Иванов, А. В.».
          Если автора нет, запись начинают с заглавия.</li>
          <li><strong>Косая черта</strong> — предписанный знак перед сведениями об ответственности
          (авторах, организации), а не разделитель вариантов. После неё автора повторяют в прямом
          порядке: «/ А. В. Иванов».</li>
          <li><strong>Две косые черты</strong> отделяют описание статьи от описания сайта, на котором
          она размещена.</li>
          <li><strong>Пробелы вокруг двоеточия</strong> в «Текст : электронный» и «Хабр : [сайт]»
          обязательны: это предписанный знак, а не пунктуация.</li>
      </ul>
      <p>Для сайта целиком схема короче:</p>
      <blockquote>
          Название сайта : [сайт]. — Место, год создания. — URL: https://… (дата обращения:
          ДД.ММ.ГГГГ). — Текст : электронный.
      </blockquote>
  - id: 'diploma-examples'
    title: 'Примеры: сайты, ЭБС, PDF, статьи с DOI, законы и видео'
    html: |2-
      <p>Ниже — готовые записи для самых частых интернет-источников в курсовой и дипломе. Номера
      страниц, ISBN и адреса в примерах условные: подставьте данные своего источника. Нормативные
      акты подробнее разобраны в статье о <a
      href="/blog/legal-regulatory-acts-bibliography-diploma-gost">библиографии нормативно-правовых
      актов по ГОСТ</a>.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Примеры описания электронных ресурсов</span></div>
          <pre><code>% 1. Статья на сайте:
      Иванов, А. В. Архитектура микросервисов на Python / А. В. Иванов. — Текст : электронный // Хабр : [сайт]. — 2025. — URL: https://habr.com/ru/articles/891234/ (дата обращения: 12.04.2026).

      % 2. Сайт целиком:
      Российская государственная библиотека : [сайт]. — Москва, 1999– . — URL: https://www.rsl.ru (дата обращения: 12.04.2026). — Текст : электронный.

      % 3. Официальная техническая документация:
      Docker Engine documentation. — Текст : электронный // Docker Docs : [сайт]. — 2026. — URL: https://docs.docker.com/engine/ (дата обращения: 18.05.2026).

      % 4. Книга из ЭБС «Юрайт»:
      Иванов, И. И. Базы данных : учебник для вузов / И. И. Иванов. — 3-е изд., перераб. и доп. — Москва : Юрайт, 2025. — 312 с. — (Высшее образование). — ISBN 978-5-534-XXXXX-X. — Текст : электронный // Образовательная платформа Юрайт [сайт]. — URL: https://urait.ru/bcode/XXXXXX (дата обращения: 10.03.2026).

      % 5. Книга из ЭБС «Лань» (доступ по подписке):
      Петров, П. П. Общая физика : учебное пособие / П. П. Петров. — Санкт-Петербург : Лань, 2024. — 256 с. — ISBN 978-5-507-XXXXX-X. — Текст : электронный // Лань : электронно-библиотечная система. — URL: https://e.lanbook.com/book/XXXXXX (дата обращения: 10.03.2026). — Режим доступа: для авториз. пользователей.

      % 6. Статья из электронного журнала с DOI (например, найденная в КиберЛенинке):
      Смирнова, Н. В. Методы машинного обучения в диагностике оборудования / Н. В. Смирнова, С. А. Петров. — DOI 10.XXXX/XXXXX. — Текст : электронный // Вестник технического университета. — 2024. — № 3. — С. 15–24. — URL: https://cyberleninka.ru/article/n/… (дата обращения: 20.03.2026).

      % 7. PDF-документ на сайте организации (отчёт, методичка):
      Методические указания к лабораторным работам по физике / Министерство науки и высшего образования Российской Федерации, Университет «Пример» ; составитель И. И. Иванов. — Москва, 2023. — 48 с. — Текст : электронный // Университет «Пример» : [сайт]. — URL: https://example.edu/upload/…/metod-fizika.pdf (дата обращения: 15.02.2026).

      % 8. Стандарт из электронного фонда:
      ГОСТ Р 7.0.100-2018. Библиографическая запись. Библиографическое описание. Общие требования и правила составления : национальный стандарт Российской Федерации : дата введения 2019-07-01. — Текст : электронный // Электронный фонд правовых и нормативно-технических документов : [сайт]. — URL: https://docs.cntd.ru/document/… (дата обращения: 01.03.2026).

      % 9. Закон из справочно-правовой системы:
      Об образовании в Российской Федерации : Федеральный закон от 29 декабря 2012 г. № 273-ФЗ (ред. от …). — Текст : электронный // КонсультантПлюс : [сайт]. — URL: https://www.consultant.ru/document/cons_doc_LAW_140174/ (дата обращения: 05.09.2026).

      % 10. Статистика Росстата:
      Численность населения Российской Федерации по муниципальным образованиям на 1 января 2025 года : статистический бюллетень. — Текст : электронный // Федеральная служба государственной статистики : [сайт]. — URL: https://rosstat.gov.ru/… (дата обращения: 01.04.2026).

      % 11. Видео на YouTube или RUTUBE:
      Как оформить список литературы по ГОСТ : видеолекция / И. И. Иванов. — Изображение (движущееся ; двухмерное) : электронное // RUTUBE : [сайт]. — 2025. — URL: https://rutube.ru/video/… (дата обращения: 01.04.2026).

      % 12. Репозиторий на GitHub:
      Labkeeper-team/Docs : документация Labkeeper / Labkeeper. — 2026. — Текст : электронный // GitHub : [сайт]. — URL: https://github.com/Labkeeper-team/Docs (дата обращения: 01.09.2026).</code></pre>
      </div>
      <p>Пояснения к примерам:</p>
      <ul>
          <li><strong>ЭБС.</strong> Юрайт, Лань и другие ЭБС сами показывают готовую запись на
          странице книги (кнопка «Для цитирования» или «Библиографическая запись»). Её можно брать за
          основу, но сверьте дату обращения и пунктуацию с методичкой.</li>
          <li><strong>DOI.</strong> По ГОСТ Р 7.0.100-2018 DOI пишут отдельным элементом:
          <code>— DOI 10.1016/j.jneumeth.2025.109876.</code>, а не адресом
          <code>https://doi.org/…</code>. Место DOI в записи в методичках встречается разное: после
          сведений об ответственности или в конце; держите один вариант во всём списке.</li>
          <li><strong>Видео.</strong> Вместо «Текст» указывают вид содержания «Изображение
          (движущееся ; двухмерное)». Формулировку и нужно ли добавлять «Устная речь», уточните по
          методичке.</li>
          <li><strong>Программы и код.</strong> Для репозитория некоторые методички требуют вид
          содержания «Программа (компьютерная) : электронная» вместо «Текст : электронный».
          Указывайте автора или организацию и год последнего релиза.</li>
          <li><strong>Законы.</strong> Дату пишут словами («от 29 декабря 2012 г.»), а редакцию —
          той, по которой вы работали.</li>
      </ul>
  - id: 'latex-urldate'
    title: 'Оформление в LaTeX: thebibliography онлайн и @online в biblatex локально'
    html: |2-
      <p>В Labkeeper список литературы собирается окружением <code>thebibliography</code>: запись
      набирается вручную, а адрес оборачивается в <code>\url{...}</code>, чтобы LaTeX корректно
      перенёс его и не споткнулся о символы подчёркивания. Перед тире ставьте неразрывный пробел
      <code>.~---</code>, чтобы тире не уехало в начало строки:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\begin{thebibliography}{9}
      \bibitem{docker} Docker Engine documentation.~--- Текст : электронный // Docker Docs : [сайт].~---
        2026.~--- URL: \url{https://docs.docker.com/engine/} (дата обращения: 18.05.2026).
      \bibitem{urait} Иванов,~И.~И. Базы данных : учебник для вузов / И.~И.~Иванов.~--- 3-е~изд.~---
        Москва : Юрайт, 2025.~--- 312~с.~--- (Высшее образование).~--- Текст : электронный //
        Образовательная платформа Юрайт [сайт].~--- URL: \url{https://urait.ru/bcode/000000}
        (дата обращения: 10.03.2026).
      \end{thebibliography}</code></pre>
      </div>
      <p>Если адрес с символами <code>%</code> или <code>#</code> стоит внутри аргумента другой
      команды (например, <code>\footnote</code>), <code>\url</code> может сломаться. Тогда задайте
      адрес заранее командой <code>\urldef{\myurl}\url{https://example.com/a%20b#part}</code> и
      вставляйте <code>\myurl</code>. Чтобы адрес не был ссылкой, используйте
      <code>\nolinkurl{...}</code>.</p>
      <p>При локальной сборке можно использовать пакет <code>biblatex</code> (подробно разобранный в
      <a href="/blog/biblatex-biber-advanced-bibliography-management">руководстве по BibLaTeX и
      Biber</a>) со стилем <code>biblatex-gost</code>: там электронные ресурсы описываются типом
      <code>@online</code>. В Labkeeper этот путь не работает, потому что сервер не запускает
      программу Biber:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">BibTeX (.bib)</span></div>
          <pre><code>@online{fastapi_docs,
          title = {FastAPI Documentation: High performance, easy to learn},
          author = {Ram{\'\i}rez, Sebasti{\'a}n},
          year = {2026},
          url = {https://fastapi.tiangolo.com/},
          urldate = {2026-09-05}
      }</code></pre>
      </div>
      <p>Пакет <code>biblatex-gost</code> сам переведёт поле <code>urldate</code> в русскую фразу
      «(дата обращения: 05.09.2026)». Полный список литературы с книгами и статьями в LaTeX разобран в
      руководстве по <a href="/blog/latex-gost-bibliography">списку литературы по ГОСТ в LaTeX</a>.
      Пример из этой статьи можно сразу <a
      href="/project/default?example=electronic-resources-bibliography-gost-7-0-100">открыть в
      редакторе Labkeeper</a>.</p>
  - id: 'common-errors'
    title: 'Типичные ошибки, которые находит нормоконтроль'
    html: |2-
      <ul>
          <li><strong>«[Электронный ресурс]» и «Режим доступа: свободный»</strong> — это формат
          старого ГОСТ 7.1-2003. По ГОСТ Р 7.0.100-2018 пишут «Текст : электронный» и «URL:».</li>
          <li><strong>«Дата обращения» с прописной буквы</strong> или без скобок. Правильно:
          <code>(дата обращения: 12.04.2026)</code>.</li>
          <li><strong>Дата обращения позже даты сдачи работы</strong> или разные даты без причины.
          Указывайте реальный день, когда открывали страницу.</li>
          <li><strong>Ссылка на главную страницу</strong> вместо конкретной статьи или документа.</li>
          <li><strong>Ссылки на поисковую выдачу, Википедию</strong> или облачные папки: их
          содержимое меняется, и многие руководители такие источники не принимают.</li>
          <li><strong>Нет пробелов вокруг двоеточия</strong> в «Текст : электронный» и «Хабр :
          [сайт]».</li>
          <li><strong>Сокращённые ссылки</strong> (bit.ly, clck.ru) вместо прямого адреса, адрес без
          <code>https://</code>.</li>
          <li><strong>Интернет-источники вынесены в отдельный блок</strong>, хотя методичка требует
          общий алфавитный список.</li>
      </ul>
  - id: 'faq'
    title: 'Частые вопросы'
    html: |2-
      <h3>Обязательна ли дата обращения?</h3>
      <p>Да, если в записи есть URL: дата обращения стоит сразу после адреса. Её не ставят только
      тогда, когда указан один DOI без URL.</p>
      <h3>Как оформить сайт без автора и даты?</h3>
      <p>Начните запись с заглавия страницы, а год опустите: <em>Заглавие страницы. — Текст :
      электронный // Название сайта : [сайт]. — URL: https://… (дата обращения: …).</em></p>
      <h3>Можно ли ссылаться на Википедию в дипломе?</h3>
      <p>Формально запись составить можно, но большинство руководителей и нормоконтролёров не
      считают Википедию научным источником. Лучше найти первоисточник из списка литературы
      статьи.</p>
      <h3>Сколько интернет-источников допустимо в ВКР?</h3>
      <p>Единой нормы нет, это решает методичка кафедры; часто ограничивают долю сайтов в списке.
      Книги из ЭБС и статьи электронных журналов при этом обычно считаются полноценными
      источниками.</p>
      <h3>Где ставить «Текст : электронный» — в начале или в конце?</h3>
      <p>У статьи на сайте — перед двумя косыми чертами, после сведений об авторе. У сайта целиком и
      у книги из ЭБС эту область часто ставят ближе к концу записи, перед описанием платформы или
      после URL. Главное — один порядок во всём списке.</p>
tips:
  - title: 'DOI для статей'
    html: |2-
      <p>Если у статьи есть цифровой идентификатор DOI, указывайте его отдельным элементом: <code>—
      DOI 10.1016/j.jneumeth.2025.109876.</code> — без <code>https://doi.org/</code>. DOI не
      отменяет дату обращения, если в записи есть URL: дата нужна рядом с адресом.</p>
  - title: 'Экранирование подчёркиваний в TeX'
    html: |2-
      <p>При ручной вёрстке списка через <code>thebibliography</code> экранируйте знаки подчёркивания
      в URL: <code>https://example.com/api\_v1</code> или оборачивайте адрес в команду
      <code>\url{...}</code>.</p>
  - title: 'Настройки hyperref без Option clash'
    html: |2-
      <p>В стандартной преамбуле Labkeeper пакет <code>hyperref</code> уже подключён. Его настройки
      меняйте через <code>\hypersetup{...}</code>, а не повторным <code>\usepackage</code> с другими
      опциями — иначе сборка остановится с ошибкой Option clash.</p>
editorExample:
  latex: |2-
    Документация описана в~\cite{docker}, пример статьи~--- в~\cite{habr}.
    \begin{thebibliography}{9}
    \bibitem{docker} Docker Engine documentation.~--- Текст : электронный // Docker Docs : [сайт].~---
    2026.~--- URL: \url{https://docs.docker.com/engine/} (дата обращения: 18.05.2026).
    \bibitem{habr} Иванов,~А.~В. Архитектура микросервисов на Python / А.~В.~Иванов.~--- Текст :
    электронный // Хабр : [сайт].~--- 2025.~--- URL: \url{https://habr.com/ru/articles/891234/}
    (дата обращения: 12.04.2026).
    \end{thebibliography}
