sections:
  - id: 'intro'
    title: 'Зачем переходить из Word в LaTeX'
    html: |-
      <p>Дипломы, диссертации и статьи с большим числом формул в Word страдают от сбоев нумерации
      и разъезжающейся вёрстки — подробно об этом в статье о <a
      href="/blog/word-formatting-issues-diploma-lightweight-markup-alternative">проблемах
      оформления диплома в Word</a>. Ниже — как перенести уже написанный текст и формулы в LaTeX и не
      перенабирать их вручную.</p>
  - id: 'choose'
    title: 'Какой способ переноса выбрать'
    html: |-
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead>
                  <tr><th>Способ</th><th>Формулы Word (OMML)</th><th>MathType</th><th>Таблицы</th>
                  <th>Картинки</th><th>Что нужно</th></tr>
              </thead>
              <tbody>
                  <tr><td>Режим LaTeX в редакторе уравнений Word</td><td>Да, по одной</td><td>Нет</td>
                  <td>Нет</td><td>Нет</td><td>Microsoft 365</td></tr>
                  <tr><td>Pandoc</td><td>Да, все сразу</td><td>Нет (картинки или пропуск)</td>
                  <td>Да, в longtable</td><td>Да, в папку media</td><td>Установка Pandoc</td></tr>
                  <tr><td>MathType → Convert Equations</td><td>—</td><td>Да, в TeX-код</td>
                  <td>Нет</td><td>Нет</td><td>Установленный MathType</td></tr>
                  <tr><td>Writer2LaTeX (LibreOffice)</td><td>Частично</td><td>Нет</td>
                  <td>Да</td><td>Да</td><td>LibreOffice с расширением</td></tr>
                  <tr><td>ИИ-агент Labkeeper</td><td>Простые формулы</td><td>Нет</td>
                  <td>Да</td><td>Нет</td><td>Только браузер</td></tr>
              </tbody>
          </table>
      </div>
      <p>Если формул немного — копируйте их из Word по одной. Если это целая глава или диплом —
      конвертируйте файл через Pandoc и вставьте результат в готовый шаблон. Формулы MathType
      сначала переведите в TeX самим MathType.</p>
  - id: 'word-builtin'
    title: 'Копирование формул из Word в режиме LaTeX'
    html: |-
      <p>Режим LaTeX в редакторе уравнений есть только в Word из подписки Microsoft 365. В Word 2016
      и 2019 доступен лишь линейный формат UnicodeMath, который похож на TeX, но им не является.
      Порядок действий в Microsoft 365:</p>
      <ol>
          <li>Щёлкните по формуле — появится вкладка «Уравнение».</li>
          <li>В группе «Преобразования» выберите формат <strong>LaTeX</strong>.</li>
          <li>Нажмите «Преобразовать» → «Текущее — линейный формат». Без этого шага копируется
      профессиональный вид, а не TeX-код.</li>
          <li>Скопируйте текст формулы (<code>Ctrl + C</code>), например <code>\frac{-b\pm\sqrt{b^2-4ac}}{2a}</code>,
      и верните «Профессиональный» формат, чтобы не портить документ.</li>
      </ol>
      <p>Word иногда выдаёт команды, которых нет в обычном LaTeX, например <code>\eqarray</code> или
      <code>\dsmash</code>. Замените их окружениями amsmath: системы — на <code>cases</code>,
      многострочные выкладки — на <code>align</code> (подробнее в <a
      href="/blog/latex-systems-equations">статье о системах уравнений</a>). Проверить формулу перед
      вставкой можно в превью Markdown с MathJax — см. статью о <a
      href="/blog/markdown-mathjax-katex-latex-math">формулах в Markdown</a>.</p>
  - id: 'mathtype'
    title: 'Если формулы сделаны в MathType или Equation 3.0'
    html: |-
      <p>Pandoc и режим LaTeX в Word понимают только формулы встроенного редактора Word 2007 и новее
      (формат OMML). Формулы MathType и старого редактора Equation 3.0 — это внедрённые объекты:
      при конвертации они превращаются в картинки WMF/EMF или пропадают. В старых методичках
      и дипломах таких формул большинство, поэтому переведите их до конвертации:</p>
      <ul>
          <li><strong>MathType</strong> (продаётся и сейчас) умеет переводить формулы в TeX-код
      сразу во всём документе: меню MathType → <em>Convert Equations</em> → <em>Text using MathType
      translator</em> → <em>LaTeX 2.09 and later</em>. После этого формулы становятся текстом
      вида <code>$...$</code>, и Pandoc перенесёт их как есть.</li>
          <li><strong>Equation 3.0</strong> удалён из современных версий Word, такие формулы
      открываются только как картинки. Их можно сконвертировать тем же MathType или набрать заново
      в редакторе уравнений Word.</li>
      </ul>
  - id: 'pandoc'
    title: 'Конвертация всего файла через Pandoc'
    html: |-
      <p>Утилита Pandoc переводит DOCX в <code>.tex</code> вместе с заголовками, списками, таблицами
      и формулами OMML. Команда «по умолчанию» для русского текста не годится: Pandoc ставит
      в преамбулу <code>\usepackage[T1]{fontenc}</code> без русской кодировки, и pdfLaTeX падает
      с ошибкой <code>! LaTeX Error: Unicode character В (U+0412)</code>. Рабочий вариант:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Bash</span></div>
          <pre><code># Полный документ с преамбулой для pdfLaTeX и кириллицы,
      # картинки — в папку ./media
      pandoc document.docx -s -V lang=ru -V fontenc=T2A \
             --extract-media=. -o document.tex

      # Только тело документа, заголовки первого уровня — \chapter
      # (для вставки в готовый шаблон ВКР)
      pandoc document.docx --top-level-division=chapter \
             --extract-media=. -o body.tex</code></pre>
      </div>
      <p>Что поправить в результате:</p>
      <ul>
          <li>Pandoc отключает нумерацию разделов строкой
      <code>\setcounter{secnumdepth}{-\maxdimen}</code> — удалите её.</li>
          <li>Метки получаются вида <code>\label{ux432ux432...}</code> (закодированный русский
      заголовок). Переименуйте нужные в понятные: <code>\label{sec:intro}</code>.</li>
          <li>Таблицы Pandoc уже выдаёт в <code>longtable</code> с линиями <code>booktabs</code>;
      для них нужны пакеты <code>longtable,booktabs,array,calc</code>.</li>
      </ul>
      <p>Чтобы открыть результат в Labkeeper, переименуйте <code>document.tex</code>
      в <code>main.tex</code>, упакуйте его вместе с папкой <code>media</code> в zip и при создании
      проекта выберите «Проект из архива». Можно и загрузить файлы в существующий проект через
      файловый менеджер.</p>
  - id: 'tables-images'
    title: 'Таблицы и картинки: EMF, WMF и longtable'
    html: |-
      <p>Ключ <code>--extract-media</code> сохраняет картинки из документа в папку
      <code>media</code> и вставляет команды <code>\includegraphics</code>. PNG и JPG pdfLaTeX
      вставит без проблем, а схемы из Word часто сохранены в форматах EMF или WMF — их pdfLaTeX не
      понимает, и сборка падает. Сконвертируйте их в PDF (вектор сохранится) или PNG:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Bash</span></div>
          <pre><code># Inkscape
      inkscape media/image1.emf -o media/image1.pdf

      # LibreOffice: все EMF в папке разом
      soffice --headless --convert-to pdf --outdir media media/*.emf</code></pre>
      </div>
      <p>Затем замените расширения в коде: <code>media/image1.emf</code> →
      <code>media/image1.pdf</code>.</p>
      <p>Таблицы из Pandoc приходят в <code>longtable</code> с шириной колонок из Word. Если таблица
      короткая и должна быть с подписью «Таблица 1 — …» над ней, проще переписать её
      в <code>tabular</code>:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\begin{table}[ht]
      \caption{Параметры опыта}
      \centering
      \begin{tabular}{lcr}
      \toprule
      Параметр &amp; Значение &amp; Ед. изм. \\
      \midrule
      Температура &amp; 298,15 &amp; К \\
      Давление &amp; 101,3 &amp; кПа \\
      \bottomrule
      \end{tabular}
      \end{table}</code></pre>
      </div>
      <p>Длинные таблицы оставьте в <code>longtable</code> — как оформить их перенос на следующую
      страницу, читайте в статье о <a href="/blog/latex-longtable-multipage">многостраничных
      таблицах</a>.</p>
  - id: 'agent'
    title: 'Перенос без установки Pandoc: ИИ-агент Labkeeper'
    html: |-
      <p>Если ставить Pandoc некуда, загрузите <code>.docx</code> прямо в проект Labkeeper
      и попросите ИИ-агента перенести текст. Агент читает загруженные файлы Word и PDF.
      Пример запроса:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Запрос агенту</span></div>
          <pre><code>Перенеси главы из diplom.docx в main.tex: заголовки — в \chapter и \section,
      формулы — в equation, таблицы — в tabular с подписью по ГОСТ над таблицей.</code></pre>
      </div>
      <p>Ограничения честно: агент видит текст абзацев и таблицы, но формулы Word может получить
      упрощённым текстом без структуры дробей и индексов, а картинки и сканы не читает. Сложные
      формулы надёжнее перенести через режим LaTeX в Word или Pandoc, а результат агента проверить
      глазами.</p>
  - id: 'cleanup'
    title: 'Постобработка полученного TeX-кода'
    html: |-
      <p>После автоматической конвертации проверьте:</p>
      <ul>
          <li><strong>Неразрывные пробелы:</strong> поставьте тильду <code>~</code> перед
      единицами величин и между инициалами и фамилией.</li>
          <li><strong>Кавычки:</strong> «ёлочки» можно вставлять прямо в UTF-8 — с
      <code>\usepackage[T2A]{fontenc}</code> и <code>[utf8]{inputenc}</code> они печатаются как
      есть. Лигатуры <code>&lt;&lt;...&gt;&gt;</code> тоже дают «ёлочки», но только в кодировке T2A.
      Прямые кавычки <code>"..."</code> из Word замените.</li>
          <li><strong>Окружения формул:</strong> замените <code>$$...$$</code> и
      <code>\[...\]</code> для нумеруемых формул на <code>equation</code> или <code>align</code>
      (синтаксис — в <a href="/blog/latex-formulas">гайде по amsmath</a>).</li>
          <li><strong>Текст в PDF:</strong> добавьте <code>\usepackage{cmap}</code> перед
      <code>fontenc</code>, иначе текст из готового PDF копируется кракозябрами и плохо проходит
      «Антиплагиат».</li>
      </ul>
  - id: 'gost'
    title: 'Как привести результат к ГОСТ 7.32'
    html: |-
      <p>Не правьте преамбулу Pandoc до состояния ГОСТ — это долго. Быстрее взять готовый шаблон
      и вставить в него только тело документа:</p>
      <ol>
          <li>Откройте <a href="/blog/latex-diploma-gost#template">шаблон курсовой и ВКР по ГОСТ
      7.32</a> и скопируйте его в проект.</li>
          <li>Добавьте в преамбулу шаблона строку для таблиц Pandoc:
      <code>\usepackage{longtable,booktabs,array,calc}</code>.</li>
          <li>Сконвертируйте документ второй командой из раздела о Pandoc (без <code>-s</code>,
      с <code>--top-level-division=chapter</code>) и подключите файл в шаблоне через
      <code>\input{body}</code>.</li>
          <li>Введение и заключение переделайте в <code>\chapter*</code>
      с <code>\addcontentsline</code>, список источников — в <code>thebibliography</code>.</li>
      </ol>
      <p>Поля, шрифт, заголовки, подписи и содержание после этого уже будут по ГОСТ.</p>
  - id: 'tips'
    title: 'Лайфхаки'
    html: |-
      <div class="article-tips">
          <div class="article-tip">
              <div class="article-tip__number">1</div>
              <div class="article-tip__content">
                  <h3>Список литературы из Zotero или Mendeley</h3>
                  <p>Zotero и Mendeley умеют выдавать список в стиле ГОСТ Р 7.0.100-2018 (стиль
      CSL) готовым текстом. Скопируйте его и вставьте записи в окружение
      <code>thebibliography</code>: BibTeX и Biber в Labkeeper пока не запускаются, поэтому
      <code>.bib</code>-файл сам в список не превратится. Как оформить записи, смотрите в <a
      href="/blog/latex-gost-bibliography">статье о списке литературы по ГОСТ</a>.</p>
              </div>
          </div>
          <div class="article-tip">
              <div class="article-tip__number">2</div>
              <div class="article-tip__content">
                  <h3>Переносите по главам</h3>
                  <p>Большой диплом удобнее конвертировать по главам: каждый файл Pandoc —
      в отдельный .tex и <code>\input</code> в главном файле. Так проще найти ошибку сборки (см.
      статью о <a href="/blog/latex-multi-file-document-input-include">многофайловых
      документах</a>).</p>
              </div>
          </div>
      </div>
  - id: 'faq'
    title: 'Частые вопросы'
    html: |-
      <h3>Почему после Pandoc pdfLaTeX пишет «Unicode character … not set up for use with
      LaTeX»?</h3>
      <p>Pandoc по умолчанию ставит кодировку T1 без кириллицы. Добавьте к команде
      <code>-V lang=ru -V fontenc=T2A</code>.</p>
      <h3>Можно ли скопировать формулу из Word 2016 или 2019 сразу в LaTeX?</h3>
      <p>Нет, режим LaTeX в редакторе уравнений есть только в Microsoft 365. В старых версиях
      сконвертируйте файл через Pandoc.</p>
      <h3>Куда пропали формулы MathType после конвертации?</h3>
      <p>Pandoc не понимает объекты MathType — они становятся картинками или исчезают. Сначала
      переведите их в TeX через MathType → Convert Equations.</p>
      <h3>Можно ли перенести Word в LaTeX онлайн без установки программ?</h3>
      <p>Да: загрузите .docx в проект Labkeeper и попросите ИИ-агента перенести текст. Сложные
      формулы после этого проверьте вручную.</p>
      <h3>Почему после конвертации пропала нумерация разделов?</h3>
      <p>Pandoc добавляет строку <code>\setcounter{secnumdepth}{-\maxdimen}</code>. Удалите её или
      вставьте тело документа в свой шаблон.</p>
editorExample:
  latex: |-
    % Фрагмент после Pandoc, приведённый к ГОСТ
    \documentclass[a4paper,14pt]{extreport}
    \usepackage{cmap}
    \usepackage[T2A]{fontenc}
    \usepackage[utf8]{inputenc}
    \usepackage[russian]{babel}
    \usepackage{amsmath,graphicx}
    \usepackage{longtable,booktabs,array,calc} % таблицы из Pandoc
    \usepackage[left=30mm,right=15mm,top=20mm,bottom=20mm]{geometry}
    \usepackage{setspace}\onehalfspacing
    \setlength{\parindent}{1.25cm}
    \usepackage[labelsep=endash]{caption}
    \captionsetup[figure]{name=Рисунок}
    \captionsetup[table]{justification=raggedright,singlelinecheck=false}
    \setlength{\LTcapwidth}{\textwidth} % подпись таблицы слева
    \usepackage{titlesec} % «1 Расчётная часть» вместо «Глава 1»
    \titleformat{\chapter}[hang]{\normalfont\large\bfseries}{\thechapter}{0.5em}{}
    \titlespacing*{\chapter}{1.25cm}{0pt}{12pt}

    \begin{document}
    \chapter{Расчётная часть}\label{ch:calc}
    Корни уравнения находят по формуле
    \begin{equation}
      x_{1,2} = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}.
      \label{eq:roots}
    \end{equation}

    \begin{longtable}{@{}lcr@{}}
    \caption{Исходные данные}\\
    \toprule
    Параметр & Значение & Ед. изм. \\
    \midrule
