sections:
  - id: 'cycle'
    title: 'Как исходный текст становится PDF'
    html:
      '<p>В LaTeX вы записываете содержание и команды оформления, а затем запускаете компиляцию. Результат — PDF. Изменение исходника ещё не меняет уже собранный файл: после правки нужно снова выполнить сборку и посмотреть результат.</p>

      <p>Начнём с короткого документа на русском языке: два способа выделения, абзацы и несколько специальных символов. Он не содержит титула, оглавления или полного отчёта. Общая структура документа разобрана в <a href="https://www.learnlatex.org/en/lesson-03" target="_blank" rel="noopener noreferrer">учебном курсе проекта LaTeX</a>.</p>'
  - id: 'structure'
    title: 'Преамбула и тело документа'
    html:
      '<p>В <strong>преамбуле</strong> задаются класс документа, пакеты и общие настройки. Она находится перед <code>\begin{document}</code>. Сам текст расположен между <code>\begin{document}</code> и <code>\end{document}</code>.</p>

      <p>В примере используем <code>extarticle</code> с A4 и кеглем 14 пт, кодировку T2A и пакет <code>babel</code> для русского языка. Поля 30/15/20/20 мм, полуторный интервал и отступ 1,25 см выбраны как основа учебного отчётного примера по <a href="https://mpei.ru/Science/ScienceDocuments/Documents/0_GOST_7.32-2017.pdf" target="_blank" rel="noopener noreferrer">ГОСТ 7.32-2017</a>; требования своей работы сверяйте с методичкой. Полное соответствие отчёта не следует из одного абзаца с этими настройками.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>

      <pre><code>\documentclass[a4paper,14pt]{extarticle}

      \usepackage[T2A]{fontenc}

      \usepackage[utf8]{inputenc}

      \usepackage[russian]{babel}

      \usepackage{tempora,geometry,setspace,indentfirst}

      \geometry{left=30mm,right=15mm,top=20mm,bottom=20mm}

      \onehalfspacing

      \setlength{\parindent}{1.25cm}</code></pre>

      </div><p>Это общие настройки, их не повторяют перед каждым абзацем. Для документа с собственным началом и завершением не добавляйте вторую преамбулу внутрь тела. Новые пакеты подключайте по мере появления нужной задачи.</p>'
  - id: 'example'
    title: 'Минимальный учебный документ для первой сборки'
    html:
      '<p>Ниже показано тело примера вместе с его границами. Скопируйте его после преамбулы выше либо используйте кнопку: она откроет обе части вместе в одном завершённом LaTeX-сегменте.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>

      <pre><code>\begin{document}

      Это мой первый документ LaTeX.


      Пустая строка начинает новый абзац.

      Можно выделить \textbf{слово} или добавить \emph{акцент}.


      Специальные символы записаны явно: 20\%, \&amp; и \texttt{sample\_1}.

      Этот текст --- учебный пример набора, а не полный отчёт.

      \end{document}</code></pre>

      </div><p>В Labkeeper откройте пример в LaTeX-проекте и нажмите «Выполнить». Проверьте появившийся PDF: весь текст должен быть виден, русские буквы — читаться, специальные символы — отображаться как в исходнике. Кнопка открывает короткий пример, а не полный шаблон отчёта.</p>'
  - id: 'paragraphs'
    title: 'Абзацы, выделение и специальные символы'
    html:
      '<p>Пустая строка отделяет абзацы. Обычный перенос строки в исходнике внутри одного абзаца чаще всего превращается в пробел. Не выравнивайте строки несколькими пробелами и не создавайте красную строку вручную: её задаёт <code>\parindent</code>.</p><div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Запись</th><th>Назначение в примере</th></tr></thead><tbody><tr><td><code>\textbf{...}</code></td><td>Полужирное выделение</td></tr>

      <tr><td><code>\emph{...}</code></td><td>Смысловое выделение</td></tr>

      <tr><td><code>\%</code></td><td>Знак процента</td></tr>

      <tr><td><code>\&amp;</code></td><td>Амперсанд в обычном тексте</td></tr>

      <tr><td><code>\_</code></td><td>Подчёркивание в текстовом имени</td></tr></tbody></table></div><p>Фигурные скобки ограничивают аргумент команды. Символ <code>%</code> без обратной косой черты начинает комментарий до конца строки. Поэтому строка с процентом может неожиданно потерять остаток текста. Математические индексы и формулы вводят в математическом режиме; следующий шаг разобран в статье о <a href="/blog/latex-formulas">формулах LaTeX</a>.</p>'
  - id: 'edit'
    title: 'Сделайте одну правку и проверьте результат'
    html:
      '<ol><li>Замените первое предложение своим текстом.</li><li>Добавьте новый абзац через пустую строку и выделите в нём одну фразу.</li><li>Нажмите «Выполнить» и откройте обновлённый PDF.</li><li>Сопоставьте исходник и результат: абзацы, красные строки, выделение и символы должны совпадать с замыслом.</li><li>При ошибке прочитайте первое сообщение и проверьте изменённый фрагмент, затем соберите снова.</li></ol>

      <p>Для упражнений меняйте по одному элементу. Так легче понять, какая команда повлияла на результат. Типовые сообщения и порядок исправления описаны в статье об <a href="/blog/latex-compilation-errors-undefined-missing-overfull">ошибках компиляции LaTeX</a>.</p>'
  - id: 'next'
    title: 'Что добавить после первого документа'
    html:
      '<p>Когда короткий пример собирается и вы понимаете границы документа, переходите к нужному объекту: заголовку, формуле, таблице или рисунку. Для таблиц используйте <a href="/blog/latex-tables-tabular-longtable-booktabs-guide">выбор tabular и longtable</a>, для учебной работы — <a href="/blog/ideal-lab-report-template-gost-online">структуру лабораторного отчёта</a>.</p>

      <p>Не начинайте с большого набора незнакомых пакетов. Добавляйте объект вместе с необходимыми зависимостями, собирайте документ и проверяйте PDF. Перед сдачей полной работы отдельно сверяйте её состав и оформление с заданием.</p>'
