sections:
  - id: 'context'
    title: 'Почему ищут замену Overleaf: оплата, лимит 10 секунд, доступ'
    html: |-
      <p><em>Актуально на ноябрь 2026 года.</em></p>
      <p>Британский сервис Overleaf много лет был стандартом совместной вёрстки в LaTeX. У него
      полный TeX Live, в том числе biblatex-gost, и технически он по-прежнему силён. Но для
      пользователей из России есть три практические проблемы:</p>
      <ul>
          <li><strong>Лимит компиляции 10 секунд.</strong> Overleaf объявил о сокращении бесплатного
      времени сборки 16 июня 2025 года, а с 8 сентября 2025 года лимит 10 секунд действует для всех
      бесплатных пользователей. У платных тарифов — до 4 минут. Диплом с рисунками и десятками
      страниц в 10 секунд часто не укладывается. В Labkeeper одна сборка длится до 60 секунд после
      входа.</li>
          <li><strong>Оплата.</strong> С 2022 года карты российских банков (Visa, Mastercard) за
      рубежом не проходят, а карты «Мир» Overleaf не принимает. Купить подписку, чтобы снять лимит,
      из России сложно.</li>
          <li><strong>Один соавтор.</strong> В бесплатном плане Overleaf к проекту можно пригласить
      только одного соавтора.</li>
      </ul>
      <p>Ниже — варианты, которые решают эти проблемы по-разному, с честными плюсами
      и ограничениями.</p>
  - id: 'alternatives'
    title: 'Чем заменить Overleaf: 8 вариантов'
    html: |-
      <h3>1. Labkeeper — онлайн-редактор LaTeX и Markdown из России</h3>
      <p>Российский сервис: оплата в рублях, русский интерфейс и ИИ-агент, которому можно писать
      по-русски. Сборка PDF через pdfLaTeX до 60 секунд, кириллица работает без настройки, есть
      примеры и статьи об оформлении по ГОСТ. Ограничения: только pdfLaTeX, без BibTeX и Biber, без
      shell-escape и истории версий (подробно — <a href="#labkeeper-features">ниже</a>). Кому
      подходит: студентам и аспирантам с дипломами, курсовыми, лабораторными и статьями.</p>
      <h3>2. Overleaf Community Edition — свой Overleaf на сервере</h3>
      <p>Бесплатная версия Overleaf с открытым кодом, которая ставится в Docker на собственный
      сервер. Лимиты компиляции задаёт администратор, доступ не зависит от зарубежного сервиса.
      Нужен сервер и человек, который его поддерживает, а части функций платной версии в ней нет.
      Кому подходит: кафедрам, лабораториям и научным группам.</p>
      <h3>3. Typst и typst.app</h3>
      <p>Новая система вёрстки со своим языком разметки: компилирует почти мгновенно, а в каталоге
      Typst Universe есть шаблоны в том числе по ГОСТ 7.32. Это не LaTeX: готовые .tex-проекты
      и пакеты не перенести, коллеги и журналы чаще ждут LaTeX. Онлайн-редактор typst.app —
      зарубежный сервис, сам компилятор работает офлайн. Кому подходит: тем, кто начинает с нуля
      и не связан требованиями журнала.</p>
      <h3>4. CoCalc</h3>
      <p>Облачная платформа для научных вычислений с LaTeX-редактором, Jupyter и терминалом.
      Зарубежный сервис, платные тарифы оплачиваются зарубежной картой. Кому подходит: тем, кому
      нужны вычисления и LaTeX в одном месте.</p>
      <h3>5. TeXPage</h3>
      <p>Зарубежный онлайн-редактор LaTeX с интерфейсом, похожим на Overleaf. Перед тем как
      переносить в него диплом, проверьте доступность и условия оплаты из России.</p>
      <h3>6. TeXstudio с MiKTeX или TeX Live</h3>
      <p>Классический локальный редактор. Работает офлайн, без лимитов, с любыми движками
      и biber. MiKTeX ставится примерно за 1&nbsp;ГБ и докачивает пакеты по требованию; полный TeX
      Live занимает больше 8&nbsp;ГБ. Минус — нет синхронизации между компьютерами без Git или
      облачного диска.</p>
      <h3>7. VS Code + LaTeX Workshop</h3>
      <p>Тот же локальный дистрибутив, но в редакторе кода: удобно, если вы уже работаете в VS Code
      и храните проекты в Git. Для пакета minted понадобится Python и Pygments.</p>
      <h3>8. LyX</h3>
      <p>Локальный редактор «почти WYSIWYG» поверх LaTeX: удобен тем, кто привык к Word, но хочет
      качество вёрстки LaTeX. Тонкая настройка под ГОСТ в нём сложнее, чем в чистом .tex.</p>
