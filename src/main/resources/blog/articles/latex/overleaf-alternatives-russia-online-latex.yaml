  - id: 'labkeeper-features'
    title: 'Labkeeper: онлайн-редактор LaTeX из России'
    html: |-
      <p>Labkeeper делали под студентов, аспирантов и учёных из России. Что в нём есть:</p>
      <ul>
          <li><strong>TeX Live 2025 и кириллица без настройки:</strong> T2A и babel работают сразу,
      PDF собирается через pdfLaTeX, одна сборка — до 60 секунд после входа.</li>
          <li><strong>Примеры и шаблоны:</strong> гайды по оформлению <a
      href="/blog/latex-diploma-gost">курсовой и диплома по ГОСТ</a> и <a
      href="/blog/latex-dissertation">диссертации</a> с готовым кодом, шаблоны журналов —
      например, <a href="/templates/springer-nature">Springer Nature</a>, <a
      href="/templates/mdpi">MDPI</a> и <a href="/templates/vestnik-mgu-fizika">«Вестник МГУ.
      Физика»</a>.</li>
          <li><strong>Markdown и LaTeX:</strong> заметки и отчёты можно вести в Markdown с формулами
      MathJax, а большие документы — в LaTeX (<a href="/blog/markdown-to-pdf-export">экспорт
      Markdown в PDF</a>).</li>
          <li><strong>ИИ-агент:</strong> исправляет ошибки сборки, правит код и читает загруженные
      файлы Word и PDF — так можно перенести текст <a href="/blog/latex-word-to-latex">из Word
      в LaTeX</a>.</li>
          <li><strong>Импорт проекта из zip</strong> — в том числе архива, скачанного из Overleaf
      (см. <a href="#migration">инструкцию</a>).</li>
          <li><strong>Оплата в рублях</strong> через ЮKassa: российские карты и СБП, пакеты токенов
      без подписки.</li>
      </ul>
      <p>Ограничения, о которых лучше знать заранее:</p>
      <ul>
          <li>Только pdfLaTeX: XeLaTeX и LuaLaTeX не запускаются, системные шрифты через
      <code>fontspec</code> не подключить.</li>
          <li>BibTeX и Biber не запускаются: список литературы набирается в
      <code>thebibliography</code> (<a href="/blog/latex-gost-bibliography">как оформить по
      ГОСТ</a>).</li>
          <li>Нет shell-escape, поэтому пакет <code>minted</code> не работает — вместо него
      <code>listings</code> (<a href="/blog/latex-russian-cyrillic-code-listings-minted">листинги
      кода с кириллицей</a>).</li>
          <li>Нет истории версий: правки сохраняются автоматически, но откатить можно только правки
      текущей сессии.</li>
          <li>Устаревший класс <code>eskdx</code> в TeX Live 2025 не собирается — рамки ЕСКД
      рисуются на TikZ (<a href="/blog/latex-eskd">готовый код</a>).</li>
      </ul>
  - id: 'overleaf-better'
    title: 'Когда Overleaf всё же лучше'
    html: |-
      <ul>
          <li>Список литературы на <code>biblatex-gost</code> через Biber — в Labkeeper так не
      получится (подробнее о biblatex — в <a
      href="/blog/biblatex-biber-advanced-bibliography-management">статье о biblatex и
      Biber</a>).</li>
          <li>Нужен XeLaTeX или LuaLaTeX с системными шрифтами, например Times New Roman через
      <code>fontspec</code>.</li>
          <li>Нужна история версий и рецензирование правок с соавторами.</li>
          <li>Журнал или конференция предлагает отправить рукопись прямо из Overleaf, и вам удобнее
      этот путь.</li>
      </ul>
      <p>Если ни один пункт к вам не относится, а проект большой и не укладывается в 10 секунд,
      Labkeeper или локальная установка будут удобнее.</p>
  - id: 'migration'
    title: 'Как перенести проект из Overleaf'
    html: |-
      <ol>
          <li>В Overleaf откройте проект и скачайте исходники: «Menu» → «Download» → «Source» (в новом интерфейсе — «File» → «Download as source (.zip)»).
      Получится zip-архив с файлами проекта.</li>
          <li>Проверьте, что главный файл называется <code>main.tex</code> и лежит в корне архива.
      Если он называется иначе, переименуйте его и упакуйте архив заново.</li>
          <li>В Labkeeper создайте новый проект, выберите «Проект из архива» и загрузите zip. Тип
      проекта (LaTeX) определится по архиву.</li>
      </ol>
      <p>После импорта соберите PDF и проверьте лог. Если проект использовал Biber, BibTeX или
      XeLaTeX, замените список литературы на <code>thebibliography</code> и шрифты — на пакеты для
      pdfLaTeX (например, <code>tempora</code> вместо Times New Roman). Очень большие архивы
      импорт не примет — удалите из них лишние PDF и исходники картинок. Большой документ удобно
      разбить на файлы (<a href="/blog/latex-multi-file-document-input-include">как это
      сделать</a>).</p>
  - id: 'tips'
    title: 'Практические советы'
    html: |-
      <div class="article-tips">
          <div class="article-tip">
              <div class="article-tip__number">1</div>
              <div class="article-tip__content">
                  <h3>Облачное автосохранение</h3>
                  <p>У вошедшего пользователя правки в Labkeeper сохраняются автоматически примерно
      через секунду, поэтому случайное закрытие вкладки или обновление страницы их не сотрёт.
      Истории версий, как в Overleaf, нет: для важных этапов скачивайте проект архивом.</p>
              </div>
          </div>
          <div class="article-tip">
              <div class="article-tip__number">2</div>
              <div class="article-tip__content">
                  <h3>Ускорьте сборку большого документа</h3>
                  <p>Рисунки сохраняйте в PDF или JPG, а не в тяжёлых PNG, а для черновых сборок
      добавляйте опцию <code>draft</code> в <code>\documentclass</code>. Так сборка укладывается
      в лимит и в Labkeeper, и в Overleaf.</p>
              </div>
          </div>
      </div>
  - id: 'faq'
    title: 'Частые вопросы'
    html: |-
      <h3>Работает ли Overleaf в России в 2026 году?</h3>
      <p>Сайт, как правило, открывается, но оплатить подписку российской картой нельзя, а бесплатный план ограничен
      10 секундами компиляции и одним соавтором на проект.</p>
      <h3>Можно ли оплатить Overleaf российской картой?</h3>
      <p>Нет. С 2022 года карты российских банков за рубежом не проходят, а карты «Мир» Overleaf не
      принимает.</p>
      <h3>Сколько длится бесплатная компиляция в Overleaf?</h3>
      <p>10 секунд на одну сборку для всех бесплатных пользователей с 8 сентября 2025 года.
      У платных тарифов — до 4 минут.</p>
      <h3>Как перенести проект из Overleaf?</h3>
      <p>Скачайте исходники архивом («Menu» → «Download» → «Source» или «File» → «Download as source (.zip)» в новом интерфейсе), проверьте, что главный файл
      называется <code>main.tex</code>, и загрузите zip в Labkeeper как «Проект из архива».</p>
      <h3>Есть ли бесплатная альтернатива Overleaf?</h3>
      <p>Да: локальные TeXstudio, VS Code с LaTeX Workshop или LyX, а для кафедры — Overleaf
      Community Edition на своём сервере. Все они бесплатны, но требуют установки.</p>
editorExample:
  latex: |-
    \documentclass[a4paper,12pt]{article}
    \usepackage{cmap}
    \usepackage[T2A]{fontenc}
    \usepackage[utf8]{inputenc}
    \usepackage[russian]{babel}
    \usepackage{amsmath}

    \begin{document}
    \section{Первый документ в Labkeeper}
    Кириллица работает без настройки: поменяйте этот текст и соберите PDF ещё раз.

    Интеграл по отрезку от 0 до 1:
    \begin{equation}
      \int_0^1 x^2\,dx = \frac{1}{3}.
    \end{equation}
    \end{document}
