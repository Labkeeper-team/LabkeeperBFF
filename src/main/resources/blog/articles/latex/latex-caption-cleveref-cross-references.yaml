      \onehalfspacing
      \setlength{\parindent}{1.25cm}
      \usepackage{caption,tikz}
      \DeclareCaptionLabelSeparator{gostdash}{\space---\space}
      \DeclareCaptionTextFormat{gosttitle}{%
        \hyphenpenalty=10000\relax\exhyphenpenalty=10000\relax#1}
      \DeclareCaptionTextFormat{gostfiguretitle}{%
        \hyphenpenalty=10000\relax\exhyphenpenalty=10000\relax#1\vphantom{у}}
      \captionsetup{labelsep=gostdash,font={normalsize,singlespacing},singlelinecheck=false}
      \captionsetup[figure]{name=Рисунок,position=bottom,justification=centering,strut=off,textformat=gostfiguretitle}
      \captionsetup[table]{name=Таблица,position=top,justification=raggedright,textformat=gosttitle}
      \newlength{\tablecaptionheight}
      \settoheight{\tablecaptionheight}{\setstretch{1}\strut}
      \AddToHook{env/table/before}{%
        \par\begingroup
        \ifdim\prevdepth>-1000pt
          \setlength{\intextsep}{\dimexpr\baselineskip-\prevdepth-\tablecaptionheight\relax}%
          \ifdim\intextsep<0pt\setlength{\intextsep}{0pt}\fi
        \fi}
      \AddToHook{env/table/begin}{\renewcommand{\arraystretch}{1.25}}
      \AddToHook{env/table/after}{\endgroup}
      \AddToHook{env/figure/before}{\par\begingroup\setlength{\intextsep}{0pt}}
      \AddToHook{env/figure/begin}{\vspace{\baselineskip}}
      \AddToHook{env/figure/after}{\endgroup}
      \usepackage[hidelinks]{hyperref}
      \usepackage[nameinlink,noabbrev]{cleveref}
      \crefname{figure}{рисунок}{рисунки}
      \Crefname{figure}{Рисунок}{Рисунки}
      \crefname{table}{таблица}{таблицы}
      \Crefname{table}{Таблица}{Таблицы}
      \begin{document}
      Учебная схема приведена на рисунке~\ref{fig:flow}.
      Результаты обработки заданы в таблице~\ref{tab:counts}.
      Все числа вымышлены.
      \par
      \begin{figure}[!ht]
      \centering
      \begin{tikzpicture}[every node/.style={draw,minimum height=9mm}]
      \node (a) at (0,0) {Ввод};
      \node (b) at (4,0) {Проверка};
      \draw[->] (a) -- (b);
      \end{tikzpicture}
      \caption{Учебная схема проверки данных}\label{fig:flow}
      \end{figure}
      \par
      \Cref{fig:flow} показывает два этапа обработки.

      \begin{table}[!ht]
