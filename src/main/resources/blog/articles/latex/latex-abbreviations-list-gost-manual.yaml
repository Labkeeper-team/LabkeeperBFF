sections:
  - id: 'scope'
    title: 'Уточните вид документа и необходимость перечня'
    html: '<p>Перечень помогает читателю найти расшифровку используемых сокращений. Но его состав и оформление зависят от документа: требования отчёта о НИР нельзя без проверки объявлять правилами любого журнала.</p><p>Для отчётов <a href="https://mpei.ru/Science/ScienceDocuments/Documents/0_GOST_7.32-2017.pdf" target="_blank" rel="noopener noreferrer">ГОСТ 7.32-2017</a> рассматривает перечень в пунктах 5.6 и 6.15. Для ВКР применимость уточняйте по методичке, для научной статьи — по инструкции издания. В примере четыре сокращения; это учебный фрагмент перечня, а не полный отчёт.</p><p>Стандарт предусматривает перечень при более чем трёх требующих пояснения сокращениях и обозначениях; для менее трёх описывает пояснение при первом упоминании. Если пограничный случай или состав работы неясен, согласуйте его с требованиями организации.</p>'
  - id: 'content'
    title: 'Соберите сокращения и проверьте порядок'
    html:
      '<p>Включайте используемые в работе сокращения и проверяйте одинаковое написание в тексте. По пункту 6.15 обозначения располагают по алфавиту: слева сокращение без абзацного отступа, справа через тире расшифровка, без завершающей пунктуации.</p><div class="article-table-wrapper"><table class="article-table"><thead><tr><th>Сокращение</th><th>Расшифровка примера</th></tr></thead><tbody><tr><td>АЦП</td><td>аналого-цифровой преобразователь</td></tr>

      <tr><td>БД</td><td>база данных</td></tr>

      <tr><td>ПК</td><td>персональный компьютер</td></tr>

      <tr><td>СИ</td><td>средство измерений</td></tr></tbody></table></div><p>Не смешивайте в одной позиции разные значения одного сокращения. Первое употребление полезно сделать понятным и в основном тексте: «аналого-цифровой преобразователь (АЦП)». Это редакторский приём для читателя, а не утверждение об одинаковом требовании для всех размеров перечня.</p>'
  - id: 'layout'
    title: 'Заголовок и ручное выравнивание'
    html:
      '<p>Структурный элемент начинается с новой страницы; заголовок размещён по центру прописными буквами без точки. В полном документе согласуйте его запись с <a href="/blog/automatic-table-of-contents-diploma-gost">содержанием</a>. Если объединяете определения и обозначения, используйте название и состав, предусмотренные стандартом и заданием.</p><p>Для нашего фрагмента достаточно <code>tabularx</code>: левая колонка подстраивается под сокращение, правая переносит длинную расшифровку. Это способ набора перечня, а не нумеруемая таблица данных; рамки и подпись «Таблица» здесь не нужны. Параметр <code>[t]</code> выравнивает окружение по первой строке: после вводного абзаца сохраняется обычный межстрочный шаг.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>

      <pre><code>\usepackage{tabularx}</code></pre>

      </div>'
  - id: 'example'
    title: 'Короткий перечень без внешнего индексатора'
    html:
      '<p>Следующий код вставляется в тело документа. Страница, основной текст и абзацный отступ настроены в примере редактора.</p><div class="article-code">

      <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>

      <pre><code>\clearpage

      \begin{center}

      ПЕРЕЧЕНЬ СОКРАЩЕНИЙ И ОБОЗНАЧЕНИЙ

      \end{center}

      \noindent\hspace*{\parindent}В настоящем отчете о НИР применяют следующие сокращения и обозначения:

      \par\noindent

      \begin{tabularx}{\textwidth}[t]{@{}l@{\quad---\quad}&gt;{\raggedright\arraybackslash}X@{}}

      АЦП &amp; аналого-цифровой преобразователь \\

      БД &amp; база данных \\

      ПК &amp; персональный компьютер \\

      СИ &amp; средство измерений

      \end{tabularx}</code></pre>

      </div><p>«Просмотреть пример» открывает ровно этот перечень в одном завершённом LaTeX-сегменте. Замените строки, отсортируйте их и проверьте переносы в PDF. При добавлении новых сокращений обновляйте перечень и соответствующие места текста вручную.</p>'
  - id: 'acro'
    title: 'Когда рассмотреть acro'
    html: '<p>Для большого документа пакет <a href="https://tug.ctan.org/macros/latex/contrib/acro/acro-manual.pdf" target="_blank" rel="noopener noreferrer">acro</a> позволяет объявлять сокращения и печатать список через <code>\printacronyms</code>. Обычный список не требует запуска <code>makeindex</code>; отдельное индексирование является другой настройкой. Обычно нужны повторные прогоны LaTeX.</p><p>В нашей серверной схеме <code>makeindex</code> отключён, поэтому основной пример намеренно ручной. Он не зависит от отдельного запуска индексатора и не обещает автоматической синхронизации с первым употреблением. Перед использованием <code>acro</code> проверьте наличие пакета, его настройки русского заголовка и результат повторной сборки.</p>'
  - id: 'check'
    title: 'Проверка перечня в готовом документе'
    html: '<ul><li>Все позиции относятся к реально используемым сокращениям.</li><li>Алфавитный порядок и написание согласованы с текстом.</li><li>Расшифровки не выходят за правое поле и не пересекают левую колонку.</li><li>Заголовок и запись в содержании совпадают.</li><li>Нет случайных номеров таблиц, конечных точек и лишних рамок.</li></ul><p>За общим порядком оформления ВКР переходите к <a href="/blog/vkr-formatting-gost-guide-hub">маршруту по требованиям</a>. Если одно обозначение повторяется в коде, полезны <a href="/blog/latex-newcommand-macros">собственные команды LaTeX</a>, но они сами не создают корректный перечень.</p>'
