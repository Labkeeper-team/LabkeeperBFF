<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, follow" />
        <title th:text="${i18n['page-title-not-found']}"></title>
        <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
        <link rel="stylesheet" href="/assets/css/style.css" />
        <style>
            .not-found {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 24px;
                padding: 32px 16px;
                text-align: center;
            }
            .not-found__links {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 12px;
            }
        </style>
    </head>
    <body class="page">
        <main class="not-found">
            <a href="/" class="header__logo">
                <img
                    src="/assets/img/logo.svg"
                    alt="Labkeeper Logo"
                    class="header__logo-icon"
                    width="36"
                    height="36"
                />
                <span class="header__logo-text">Labkeeper</span>
            </a>
            <h1 class="h1" th:utext="${i18n['not-found-title']}"></h1>
            <p th:utext="${i18n['not-found-text']}"></p>
            <nav class="not-found__links" th:aria-label="${i18n['aria-site-sections']}">
                <a href="/blog" class="button button--outline" th:utext="${i18n['nav-blog']}"></a>
                <a href="/templates" class="button button--outline" th:utext="${i18n['templates-title']}"></a>
                <a href="/project/default" class="button button--primary" th:utext="${i18n['btn-editor']}"></a>
            </nav>
        </main>
    </body>
</html>
