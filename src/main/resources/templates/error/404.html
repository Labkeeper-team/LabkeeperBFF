<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, follow" />
        <title>Страница не найдена — Labkeeper</title>
        <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
        <link rel="stylesheet" href="/assets/css/style.css" />
        <style>
            .not-found {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 24px;
                padding: 32px 16px;
                text-align: center;
            }
            .not-found__links {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 12px;
            }
        </style>
    </head>
    <body class="page">
        <main class="not-found">
            <a href="/" class="header__logo">
                <img
                    src="/assets/img/logo.svg"
                    alt="Labkeeper Logo"
                    class="header__logo-icon"
                    width="36"
                    height="36"
                />
                <span class="header__logo-text">Labkeeper</span>
            </a>
            <h1 class="h1">Страница не найдена</h1>
            <p>
                Такой страницы нет или она переехала. Загляните в базу знаний,
                каталог шаблонов или откройте редактор.
            </p>
            <nav class="not-found__links" aria-label="Разделы сайта">
                <a href="/blog" class="button button--outline">База знаний</a>
                <a href="/templates" class="button button--outline">Шаблоны</a>
                <a href="/project/default" class="button button--primary"
                    >Редактор <span class="button__arrow">→</span></a
                >
            </nav>
        </main>
    </body>
</html>
