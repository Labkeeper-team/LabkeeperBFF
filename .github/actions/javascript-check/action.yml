name: JavaScript check
description: Run JavaScript unit tests, compare the home page screenshots, and check blog articles

inputs:
  java-version:
    description: JDK version
    required: false
    default: "17"
  node-version:
    description: Node.js version
    required: false
    default: "22"
  port:
    description: Port the test server listens on
    required: false
    default: "8080"

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: gradle

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: src/test/javascript/package-lock.json

    - name: Run JavaScript unit tests
      shell: bash
      working-directory: src/test/javascript
      run: |
        npm ci
        npm test

    - name: Serve the app and run browser tests
      shell: bash
      run: |
        ./gradlew bootRun --no-daemon --args="--server.port=${{ inputs.port }}" > boot.log 2>&1 &
        echo $! > boot.pid
        for _ in $(seq 1 120); do
          if curl -fsS "http://localhost:${{ inputs.port }}/" >/dev/null; then
            echo "Labkeeper is up on port ${{ inputs.port }}"
            break
          fi
          if ! kill -0 "$(cat boot.pid)" 2>/dev/null; then
            echo "Labkeeper exited before it was ready"
            cat boot.log
            exit 1
          fi
          sleep 5
        done
        curl -fsS "http://localhost:${{ inputs.port }}/" >/dev/null
        cd src/test/javascript
        FRONTEND_URL="http://localhost:${{ inputs.port }}" npm run snapshots
