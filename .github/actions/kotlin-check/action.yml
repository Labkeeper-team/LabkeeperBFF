name: Kotlin check
description: Run Gradle check, including Kotlin tests and detekt

inputs:
  java-version:
    description: JDK version
    required: false
    default: "17"
  node-version:
    description: Node.js version used to build frontend assets
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: gradle

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: |
          src/main/libs/package-lock.json
          src/main/editor/package-lock.json
          src/main/wiki/package-lock.json

    - name: Run Gradle check
      shell: bash
      run: ./gradlew check --no-daemon
