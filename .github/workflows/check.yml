name: Labkeeper

run-name: Labkeeper · ${{ github.ref_name }}

on:
  push:
  pull_request:

concurrency:
  group: labkeeper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  formatting:
    name: Formatting · HTML and JS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check formatting
        uses: ./.github/actions/formatting

  kotlin:
    name: Check · Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gradle check
        uses: ./.github/actions/kotlin-check

  browser:
    name: Tests · Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare screenshots
        uses: ./.github/actions/playwright
